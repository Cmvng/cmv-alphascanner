<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- cmvng picks / results video template (1080×1920). Driven entirely by window.DATA (built by make-video.mjs).
     window.renderAt(t) draws the frame at time t (seconds); window.fxEvents() lists the sound effects in sync. -->
<style>
@font-face{font-family:Manrope;font-weight:400;src:url(assets/fonts/manrope-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:600;src:url(assets/fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:800;src:url(assets/fonts/manrope-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:JBM;font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:JBM;font-weight:700;src:url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Anton;font-weight:400;src:url(assets/fonts/anton-latin-400-normal.woff2) format('woff2')}
:root{--brand:#1F5FDB;--brand2:#3D7BFF;--brand3:#9DB8FF;--win:#22C55E;--win2:#4ADE80;--loss:#EF4444;--loss2:#F87171;--amb:#F5A524;
  --muted:rgba(255,255,255,.66);--glass:rgba(8,14,32,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#03060F}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif;color:#fff;background:#050A18}
.A{font-family:Anton,Manrope,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.5px}
.lbl{font:700 22px JBM;letter-spacing:5px;text-transform:uppercase;color:var(--brand3)}

/* background: the home team's stadium, graded dark with a slow push-in */
#bgs{position:absolute;inset:-2px;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:50% 50%;opacity:0;will-change:transform,opacity;
  filter:brightness(.8) saturate(1.2) contrast(1.06)}
.bg.none{background:radial-gradient(120% 70% at 50% 0%,#12307A 0%,#08142E 50%,#050A15 100%)}
#tint{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,8,24,.82) 0%,rgba(4,8,24,.22) 15%,rgba(6,14,40,.12) 38%,rgba(5,10,28,.42) 60%,rgba(3,6,16,.9) 79%,#03060F 100%)}
#tint2{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(90% 60% at 50% 30%,rgba(61,123,255,.35),rgba(31,95,219,0) 70%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 50% 42%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:60;mix-blend-mode:overlay}
#streak{position:absolute;top:-400px;width:260px;height:2800px;z-index:61;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(157,184,255,0),rgba(255,255,255,.9) 50%,rgba(157,184,255,0));transform-origin:50% 50%}
#credit{position:absolute;left:60px;right:60px;top:1838px;font:500 15px JBM;color:rgba(255,255,255,.42);letter-spacing:.5px;z-index:45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#foot{position:absolute;left:60px;right:60px;top:1866px;font:700 16px JBM;letter-spacing:3px;color:rgba(255,255,255,.55);z-index:45;text-transform:uppercase}

/* header (kept below the phone's top bar) */
#hdr{position:absolute;left:60px;right:60px;top:150px;height:64px;display:flex;align-items:center;justify-content:space-between;z-index:50}
.logo{display:flex;align-items:flex-end;gap:12px;font:800 42px/1 Manrope;letter-spacing:-1.5px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.bars{display:flex;align-items:flex-end;gap:6px;transform:skewX(-11deg);padding-bottom:4px}
.bars i{display:block;width:10px;border-radius:3px;background:linear-gradient(180deg,#6E9BFF,#1F5FDB)}
#hright{text-align:right}
#hlabel{font:700 21px JBM;letter-spacing:5px;color:#fff;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#pips{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}
#pips i{display:block;width:38px;height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
#pips i.on{background:var(--brand2);box-shadow:0 0 14px rgba(61,123,255,.9)}
#pips i.done{background:rgba(255,255,255,.7)}

#scenes{position:absolute;inset:0;z-index:20;transform-origin:50% 45%}
.scene{position:absolute;inset:0;display:none;z-index:20}
.badge{position:relative;display:flex;align-items:center;justify-content:center}
.badge img,.badge svg{width:100%;height:100%;display:block}
.badge.flag img{border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px rgba(255,255,255,.9),0 22px 60px rgba(0,0,0,.6)}
.badge.shield img,.badge.crest img,.badge.shield svg{object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.chip{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:rgba(8,14,32,.7);box-shadow:inset 0 0 0 1.5px var(--line);font:700 22px JBM;letter-spacing:4px;text-transform:uppercase}
.card{position:absolute;border-radius:36px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(14px)}

/* hook */
.hook .meta,.rhook .meta{position:absolute;left:60px;top:300px}
.hook .n{position:absolute;left:44px;top:330px;font-size:560px;line-height:1;color:#fff;text-shadow:0 30px 90px rgba(31,95,219,.55)}
.hook .w1,.hook .w2{position:absolute;left:400px;font-size:196px;line-height:1}
.hook .w1{top:400px}
.hook .w2{top:610px;color:transparent;-webkit-text-stroke:4px #fff}
.hook .date{position:absolute;left:66px;top:930px;font:800 40px Manrope;color:var(--muted)}
.hook .pairs{position:absolute;left:60px;right:60px;top:1010px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.hook .pair{display:flex;justify-content:center;padding:16px 0;border-radius:24px;background:rgba(8,14,32,.6);box-shadow:inset 0 0 0 1.5px var(--line)}
.hook .pair .badge{width:66px;height:66px;margin:0 -6px}
.hook .tease{position:absolute;left:60px;top:1180px}
.tease .chip{font-size:26px;padding:16px 26px;background:linear-gradient(90deg,rgba(31,95,219,.85),rgba(61,123,255,.6))}

/* pick */
.pick .meta{position:absolute;left:0;right:0;top:300px;text-align:center}
.pick .mu{position:absolute;left:0;right:0;top:360px;height:460px;transform-origin:50% 0}
.pick .side{position:absolute;top:0;width:420px;display:flex;flex-direction:column;align-items:center}
.pick .side.h{left:60px}.pick .side.a{right:60px}
.pick .side .badge{width:230px;height:230px}
.pick .side .badge.shield,.pick .side .badge.crest{width:214px;height:246px}
.pick .side .nm{margin-top:26px;font-size:68px;line-height:1.02;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.6);max-width:420px}
.pick .vs{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:96px;color:var(--brand3);text-shadow:0 0 40px rgba(61,123,255,.8)}
.pick .glowH,.pick .glowA{position:absolute;top:-80px;width:520px;height:520px;border-radius:50%;opacity:.55;filter:blur(30px)}
.pick .glowH{left:-90px}.pick .glowA{right:-90px}
.pick .stat{position:absolute;left:0;right:0;top:770px;display:flex;justify-content:center;gap:14px}
.pick .stat .chip{font-size:24px;letter-spacing:3px}
.pick .stat b{color:#fff}
.pick .pc{left:60px;right:60px;top:600px;height:470px;padding:44px 52px;transform-origin:50% 50%}
.pick .pc .lbl{color:var(--brand3)}
.pick .pc .pk{margin-top:16px;font-size:94px;line-height:1;max-width:960px;text-shadow:0 6px 30px rgba(0,0,0,.4)}
.pick .pc .odds{position:absolute;left:52px;bottom:34px;display:flex;align-items:baseline;gap:18px}
.pick .pc .odds .at{font-size:70px;color:var(--brand3)}
.pick .pc .odds .o{font-size:210px;line-height:.9;background:linear-gradient(180deg,#fff 30%,#9DB8FF);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 40px rgba(61,123,255,.6))}
.pick .pc .ko{position:absolute;right:52px;bottom:52px;text-align:right}
.pick .pc .ko .lbl{color:var(--muted);letter-spacing:4px}
.pick .pc .ko b{display:block;margin-top:8px;font:800 52px Manrope}
.pick .probs{left:60px;right:60px;top:1100px;height:156px;padding:28px 40px}
.pick .row{display:flex;align-items:center;gap:22px;height:50px}
.pick .row .k{width:230px;font:700 20px JBM;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.pick .row .tr{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.pick .row .tr b{display:block;height:100%;border-radius:9px;transform-origin:0 50%}
.pick .row .v{width:120px;text-align:right;font-size:54px}
.pick .sig{left:60px;right:60px;top:1278px;height:150px;padding:26px 40px;display:flex;align-items:center;gap:34px}
.sigbars{display:flex;align-items:flex-end;gap:14px;transform:skewX(-11deg)}
.sigbars i{display:block;width:30px;border-radius:8px;background:rgba(255,255,255,.14)}
.pick .sig .t .lbl{color:var(--muted)}
.pick .sig .t b{display:block;margin-top:6px;font-size:66px;line-height:1}

/* slate */
.slate .t1{position:absolute;left:60px;top:290px;font-size:170px;line-height:1}
.slate .t2{position:absolute;left:66px;top:480px;font:800 36px Manrope;color:var(--muted)}
.slate .tk{left:60px;right:60px;top:560px;padding:20px 30px}
.slate .r{display:flex;align-items:center;gap:20px;height:146px;border-bottom:1.5px dashed rgba(255,255,255,.14)}
.slate .r:last-child{border-bottom:0}
.slate .r .pair{display:flex;width:104px;flex-shrink:0}
.slate .r .pair .badge{width:58px;height:58px;margin-right:-12px}
.slate .r .mid{flex:1;min-width:0}
.slate .r .mid .pk{font:800 34px/1.1 Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slate .r .mid .sub{margin-top:6px;font:600 23px Manrope;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slate .r .od{font-size:50px;width:120px;text-align:right}
.slate .r .sb{width:76px;display:flex;justify-content:center}
.slate .r .sb .sigbars{gap:6px}.slate .r .sb .sigbars i{width:12px;border-radius:4px}
.slate .r .stk{width:170px;text-align:right;font:800 36px Manrope}
.slate .tot{position:absolute;left:60px;right:60px;top:1330px;display:flex;justify-content:space-between;align-items:baseline}
.slate .tot .k{font:700 22px JBM;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.slate .tot b{font-size:70px}

/* call to action */
.cta .wrap{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cta .logo{font-size:170px;letter-spacing:-7px;gap:30px}
.cta .logo .bars{gap:16px;padding-bottom:22px}
.cta .logo .bars i{width:34px;border-radius:9px}
.cta .big{margin-top:70px;font-size:128px;line-height:1.02}
.cta .url{margin-top:40px;font:800 46px Manrope;color:var(--brand3)}
.cta .dis{margin-top:56px;font:700 22px JBM;letter-spacing:4px;color:var(--muted);text-transform:uppercase}

/* results */
.rhook .score{position:absolute;left:44px;top:330px;font-size:520px;line-height:1;text-shadow:0 30px 90px rgba(0,0,0,.6)}
.rhook .score span{color:rgba(255,255,255,.4)}
.rhook .wonw{position:absolute;left:66px;top:870px;font-size:120px;color:var(--win2)}
.rhook .money{position:absolute;left:60px;right:60px;top:1030px;display:flex;align-items:baseline;gap:22px;font-size:110px}
.rhook .money .arr{font-size:70px;color:var(--muted)}
.rhook .dots{position:absolute;left:60px;right:60px;top:1200px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.rhook .dot{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0;border-radius:24px;background:rgba(8,14,32,.6);box-shadow:inset 0 0 0 2px var(--line)}
.rhook .dot.won{box-shadow:inset 0 0 0 3px var(--win)}.rhook .dot.lost{box-shadow:inset 0 0 0 3px var(--loss)}
.rhook .dot .pair{display:flex}.rhook .dot .pair .badge{width:52px;height:52px;margin:0 -5px}
.rhook .dot b{font:800 24px Manrope}
.rhook .dot.won b{color:var(--win2)}.rhook .dot.lost b{color:var(--loss2)}
.result .meta{position:absolute;left:0;right:0;top:300px;text-align:center}
.result .sb{position:absolute;left:0;right:0;top:370px;height:420px}
.result .side{position:absolute;top:0;width:330px;display:flex;flex-direction:column;align-items:center}
.result .side.h{left:40px}.result .side.a{right:40px}
.result .side .badge{width:200px;height:200px}
.result .side .badge.shield,.result .side .badge.crest{width:186px;height:214px}
.result .side .nm{margin-top:22px;font-size:54px;line-height:1.02;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.result .sc{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:230px;line-height:1;white-space:nowrap;text-shadow:0 20px 70px rgba(0,0,0,.6)}
.result .sc span{color:rgba(255,255,255,.35)}
.result .ft{position:absolute;left:50%;top:260px;transform:translateX(-50%)}
.result .pc{left:60px;right:60px;top:860px;height:330px;padding:40px 48px}
.result .pc .pk{margin-top:14px;font-size:76px;line-height:1;max-width:620px}
.result .pc .od{margin-top:14px;font:800 34px Manrope;color:var(--muted)}
.stamp{position:absolute;font-size:96px;line-height:1;padding:18px 30px 14px;border-radius:24px;transform-origin:50% 50%}
.stamp.won{color:var(--win2);box-shadow:inset 0 0 0 7px var(--win);background:rgba(34,197,94,.14)}
.stamp.lost{color:var(--loss2);box-shadow:inset 0 0 0 7px var(--loss);background:rgba(239,68,68,.14)}
.stamp.void{color:#CBD5E1;box-shadow:inset 0 0 0 7px #94A3B8;background:rgba(148,163,184,.14)}
.result .pc .stamp{right:40px;top:44px}
.result .mny{position:absolute;left:60px;right:60px;top:1220px;display:flex;justify-content:space-between;align-items:center;padding:28px 44px}
.result .mny .k{font:700 20px JBM;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.result .mny b{font-size:84px;line-height:1}
.rtotal .t1{position:absolute;left:60px;top:290px;font-size:170px;line-height:1}
.rtotal .t2{position:absolute;left:66px;top:480px;font:800 36px Manrope;color:var(--muted)}
.rtotal .card{left:60px;right:60px;top:570px;padding:20px 48px 40px}
.rtotal .ln{display:flex;justify-content:space-between;align-items:baseline;padding:26px 0;border-bottom:1.5px solid rgba(255,255,255,.1)}
.rtotal .ln .k{font:800 36px Manrope;color:var(--muted)}
.rtotal .ln b{font-size:96px;line-height:1}
.rtotal .ln.big b{font-size:150px}
.rtotal .strip{display:flex;gap:10px;margin-top:34px}
.rtotal .strip i{flex:1;height:18px;border-radius:9px}

/* captions (inside the safe zone: clear of the phone's bottom bar and side buttons) */
#cap{position:absolute;left:70px;right:150px;top:1474px;height:200px;z-index:55;display:flex;align-items:flex-start;justify-content:center;text-align:center}
#cap .c{font:800 50px/1.22 Manrope;letter-spacing:-1px;text-shadow:0 4px 24px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
#cap .w{display:inline-block;margin:0 .13em}
#cap .w.now{color:#fff;background:var(--brand2);border-radius:12px;padding:0 .14em;margin:0 -.01em;box-shadow:0 8px 30px rgba(61,123,255,.6)}
#cap .w.next{opacity:.6}
#grain{position:absolute;inset:0;opacity:.05;pointer-events:none;background-size:256px 256px;z-index:70}
</style>
</head>
<body>
<div id="stage">
  <div id="bgs"></div><div id="tint"></div><div id="tint2"></div><div id="vig"></div>
  <div id="hdr">
    <div class="logo"><span class="bars"><i style="height:20px"></i><i style="height:30px"></i><i style="height:40px"></i></span>cmvng</div>
    <div id="hright"><div id="hlabel"></div><div id="pips"></div></div>
  </div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="credit"></div>
  <div id="foot">18+ · Predictions, not guarantees · Bet responsibly</div>
  <div id="flash"></div><div id="streak"></div><div id="grain"></div>
</div>
<script>
const D = window.DATA
const $ = (s, el = document) => el.querySelector(s)
const $$ = (s, el = document) => [...el.querySelectorAll(s)]
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), outCubic: x => 1 - Math.pow(1 - x, 3), inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, outBack: x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const P = (t, a, b, e = E.outExpo) => e(clamp((t - a) / (b - a)))
const DEC = D.cfg.stake_example < 1000 ? 2 : 0
const money = (v, sign) => (v < -1e-9 ? '−' : sign && v > 1e-9 ? '+' : '') + D.cfg.currency + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: DEC, maximumFractionDigits: DEC })
const html = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const N = D.picks.length
const RES = D.cfg.mode === 'results'
const SIGWORD = { 3: 'Strong', 2: 'Good', 1: 'Light stake' }
const SIGCOL = { 3: '#3D7BFF', 2: '#6E9BFF', 1: '#F5A524' }

let uid = 0
function badge(b) {
  if (b.svg) { const u = `b${uid++}`; return `<div class="badge shield">${b.svg.replace(/id="(\w+)"/g, `id="$1${u}"`).replace(/url\(#(\w+)\)/g, `url(#$1${u})`)}</div>` }
  return `<div class="badge ${b.kind}"><img src="${b.src}"></div>`
}
// "Double Chance: Draw or Norway" → { main: "Norway or Draw", tag: "Double chance" }
function label(p) {
  const s = p.pick.trim()
  let m = s.match(/^double chance:?\s*draw or (.+)$/i) || s.match(/^double chance:?\s*(.+) or draw$/i)
  if (m) return { main: `${m[1]} or Draw`, tag: 'Double chance' }
  m = s.match(/^double chance:?\s*(.+) or (.+)$/i)
  if (m) return { main: `${m[1]} or ${m[2]}`, tag: 'Double chance' }
  m = s.match(/^draw no bet:?\s*(.+)$/i) || s.match(/^(.+?)\s*\(?draw no bet\)?$/i)
  if (m) return { main: m[1].replace(/[\s,-]+$/, ''), tag: 'Draw no bet' }
  return { main: s, tag: '' }
}
const fit = (txt, sizes = [[14, 94], [19, 80], [24, 68], [99, 58]]) => sizes.find(([n]) => txt.length <= n)[1]
const sigbars = (n, h = [46, 72, 98]) => `<span class="sigbars">${[1, 2, 3].map(j => `<i data-j="${j}" style="height:${h[j - 1]}px${j <= n ? `;background:${SIGCOL[n]}` : ''}"></i>`).join('')}</span>`
const kickoff = p => p.kickoff || ''
// scene-relative start/duration of each spoken line
const S = (sc, j) => sc.lines[j] || sc.lines.at(-1) || [0.4, 2]

// ---------------------------------------------------------------- backgrounds
// each scene gets its stadium; the opening scene cycles through all of them on the beat
const bgEls = []
function bgFor(src) {
  const d = document.createElement('div'); d.className = 'bg' + (src ? '' : ' none')
  if (src) d.style.backgroundImage = `url("${src}")`
  $('#bgs').appendChild(d); return d
}
const stad = p => p && p.stadium ? p.stadium : null
const allStadia = D.picks.map(stad).filter(Boolean)
D.scenes.forEach((sc, k) => {
  if (sc.type === 'hook' || sc.type === 'rhook') sc.bgs = (allStadia.length ? allStadia : [null]).map(s => bgFor(s && s.src))
  else if (sc.type === 'pick' || sc.type === 'result') sc.bgs = [bgFor(stad(D.picks[sc.i])?.src)]
  else sc.bgs = [bgFor((allStadia[0] || {}).src)]
  sc.credits = sc.type === 'pick' || sc.type === 'result' ? [stad(D.picks[sc.i])?.credit] : (allStadia.length ? allStadia.map(s => s.credit) : [''])
})
const BEAT = D.beat || 0.62

// ---------------------------------------------------------------- build
const built = D.scenes.map((sc, k) => {
  const el = document.createElement('div'); el.className = `scene ${sc.type}`
  const p = D.picks[sc.i]
  if (sc.type === 'hook') {
    const best = [...D.picks].sort((a, b) => (b.signal - a.signal) || (b.model - a.model))[0]

  } else if (sc.type === 'slate') {

function dayLong(d) { return d ? new Date(`${d}T12:00:00Z`).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) : '' }
$('#pips').innerHTML = D.picks.map(() => '<i></i>').join('')

// ---------------------------------------------------------------- draw helpers
function rise(nodes, lt, start, step = 0.07, dist = 50, dur = 0.6) {
  nodes.forEach((n, j) => { if (!n) return; const q = P(lt, start + j * step, start + j * step + dur); n.style.opacity = q; n.style.transform = `translate3d(0,${(1 - q) * dist}px,0)` })
}
// slam: big → normal with a little blur, used for numbers and stamps
function slam(n, lt, at, from = 1.7, dur = 0.32, extra = '') {
  if (!n) return; const q = P(lt, at, at + dur, E.outCubic)
  n.style.opacity = P(lt, at, at + 0.08); n.style.transform = `${extra} scale(${from - (from - 1) * q})`; n.style.filter = `blur(${(1 - q) * 10}px)`
}
const shake = (lt, at, amp = 14) => { const d = lt - at; if (d < 0 || d > 0.28) return ''; const a = amp * (1 - d / 0.28); return `translate3d(${a * Math.sin(d * 95)}px,${a * Math.cos(d * 77)}px,0)` }
function count(n, lt, a, b, fmt) { if (!n) return; const v = +n.dataset.n * P(lt, a, b, E.outCubic); n.textContent = fmt(v) }

// ---------------------------------------------------------------- draw each scene
function draw(k, lt, sc) {
  const el = built[k], p = D.picks[sc.i]
  if (sc.type === 'hook') {
    rise([$('.meta', el)], lt, 0.05)
    slam($('.n', el), lt, 0.05, 2.2, 0.36)
    const w1 = $('.w1', el), w2 = $('.w2', el), q1 = P(lt, 0.25, 0.7), q2 = P(lt, 0.4, 0.85)
    w1.style.opacity = q1; w1.style.transform = `translate3d(${(1 - q1) * 300}px,0,0)`
    w2.style.opacity = q2; w2.style.transform = `translate3d(${(1 - q2) * 300}px,0,0)`
    rise([$('.date', el)], lt, 0.6)
    $$('.pair', el).forEach((n, j) => { const at = 0.8 + j * BEAT / 2, q = P(lt, at, at + 0.35, E.outBack); n.style.opacity = P(lt, at, at + 0.12); n.style.transform = `scale(${0.4 + 0.6 * q})` })
    const tz = $('.tease', el), q = P(lt, S(sc, 0)[0] + S(sc, 0)[1] * 0.75, S(sc, 0)[0] + S(sc, 0)[1] * 0.75 + 0.4, E.outBack)
    tz.style.opacity = clamp(q * 3); tz.style.transform = `scale(${0.6 + 0.4 * q})`
    el.style.transform = shake(lt, 0.36, 16)
  } else if (sc.type === 'pick') {
    const [b1] = S(sc, 1), [b2, d2] = S(sc, 2)
    rise([$('.meta', el)], lt, 0.02)
    const mu = $('.mu', el), h = $('.side.h', mu), a = $('.side.a', mu), vs = $('.vs', mu)
    const qi = P(lt, 0.0, 0.55, E.outBack)
    h.style.transform = `translate3d(${(1 - qi) * -520}px,0,0)`; a.style.transform = `translate3d(${(1 - qi) * 520}px,0,0)`
    h.style.opacity = a.style.opacity = P(lt, 0, 0.2)
    slam(vs, lt, 0.32, 2.4, 0.3, 'translateX(-50%)')
    $$('.glowH,.glowA', mu).forEach(g => { g.style.opacity = 0.55 * P(lt, 0.1, 0.8) })
    // the matchup moves up and shrinks when the pick lands
    const up = P(lt, b1 - 0.25, b1 + 0.2, E.inOutCubic)
    mu.style.transform = `translate3d(0,${-70 * up}px,0) scale(${1 - 0.42 * up})`
    $('.meta', el).style.opacity = P(lt, 0.02, 0.6) * (1 - up)
    rise([$('.stat', el)], lt, 0.55)
    $('.stat', el).style.opacity = P(lt, 0.55, 1.0) * (1 - up)
    const pc = $('.pc', el); slam(pc, lt, b1 - 0.1, 1.35, 0.28)
    pc.style.transform += ' ' + shake(lt, b1 + 0.18, 12)
    slam($('.o', pc), lt, b1 + 0.18, 1.8, 0.26)
    rise([$('.probs', el)], lt, b2 - 0.2, 0, 60, 0.45)
    const rows = $$('.row', el)
    rows.forEach((r, j) => {
      const q = P(lt, b2 + 0.1 + j * 0.45, b2 + 0.9 + j * 0.45, E.outCubic)
      $('.tr b', r).style.transform = `scaleX(${q * +$('.v', r).dataset.n / 100})`
      $('.v', r).textContent = Math.round(q * +$('.v', r).dataset.n) + '%'
    })
    const sg = $('.sig', el), lightAt = b2 + Math.max(1.2, d2 * 0.62)
    rise([sg], lt, b2 + 0.5, 0, 60, 0.45)
    $$('.sigbars i', sg).forEach(i => {
      const j = +i.dataset.j, on = j <= p.signal, at = lightAt + (j - 1) * 0.16
      const q = P(lt, at, at + 0.2)
      i.style.background = on && q > 0.5 ? SIGCOL[p.signal] : 'rgba(255,255,255,.14)'
      i.style.boxShadow = on ? `0 0 ${34 * q}px ${SIGCOL[p.signal]}` : 'none'
      i.style.transform = on ? `scaleY(${0.85 + 0.15 * P(lt, at, at + 0.25, E.outBack)})` : ''
    })
    const tb = $('.sig .t b', el); tb.style.opacity = P(lt, lightAt + 0.35, lightAt + 0.6)
  } else if (sc.type === 'slate') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.12, 60)
    rise([$('.tk', el)], lt, 0.2, 0, 80, 0.5)
    $$('.r', el).forEach((r, j) => { const q = P(lt, 0.35 + j * 0.12, 0.85 + j * 0.12); r.style.opacity = q; r.style.transform = `translate3d(${(1 - q) * -140}px,0,0)` })
    $$('.stk', el).forEach((n, j) => count(n, lt, 0.7 + j * 0.12, 1.5 + j * 0.12, v => money(v)))
    rise([$('.tot', el)], lt, 0.9 + N * 0.12)
  } else if (sc.type === 'cta') {
    const lg = $('.logo', el); slam(lg, lt, 0.05, 1.6, 0.4)
    $$('.logo .bars i', el).forEach((b, j) => { b.style.transform = `scaleY(${P(lt, 0.1 + j * 0.08, 0.5 + j * 0.08, E.outBack)})`; b.style.transformOrigin = '50% 100%' })
    slam($('.big', el), lt, 0.35, 1.5, 0.3); el.style.transform = shake(lt, 0.65, 10)
    rise([$('.url', el), $('.dis', el)], lt, 0.7, 0.15)
  } else if (sc.type === 'rhook') {
    rise([$('.meta', el)], lt, 0.05)
    slam($('.score', el), lt, 0.05, 2.2, 0.36); el.style.transform = shake(lt, 0.36, 16)
    slam($('.wonw', el), lt, 0.45, 1.6, 0.3)
    const [m0] = S(sc, 1)
    rise([$('.money', el)], lt, Math.min(1.0, m0 - 0.3), 0, 60)
    const b = $('.money .b', el), v = D.recap.returned * P(lt, m0 + 0.2, m0 + 1.6, E.outCubic); b.textContent = money(v)
    $$('.dot', el).forEach((n, j) => { const at = 0.8 + j * BEAT / 2, q = P(lt, at, at + 0.35, E.outBack); n.style.opacity = P(lt, at, at + 0.12); n.style.transform = `scale(${0.4 + 0.6 * q})` })
  } else if (sc.type === 'result') {
    const [b1] = S(sc, 1)
    rise([$('.meta', el)], lt, 0.02)
    const h = $('.side.h', el), a = $('.side.a', el), qi = P(lt, 0, 0.5, E.outBack)
    h.style.transform = `translate3d(${(1 - qi) * -420}px,0,0)`; a.style.transform = `translate3d(${(1 - qi) * 420}px,0,0)`
    h.style.opacity = a.style.opacity = P(lt, 0, 0.2)
    slam($('.sc', el), lt, 0.3, 2.0, 0.3, 'translateX(-50%)')
    $('.sb', el).style.transform = shake(lt, 0.6, 12)
    rise([$('.pc', el)], lt, 0.55, 0, 80, 0.5)
    const st = $('.stamp', el), q = P(lt, b1 + 0.05, b1 + 0.35, E.outCubic)
    st.style.opacity = P(lt, b1 + 0.05, b1 + 0.12); st.style.transform = `rotate(${-6 - 4 * (1 - q)}deg) scale(${2.2 - 1.2 * q})`
    $('.pc', el).style.transform += ' ' + shake(lt, b1 + 0.35, 10)
    rise([$('.mny', el)], lt, b1 + 0.3, 0, 60, 0.45)
    count($('.mny b', el), lt, b1 + 0.45, b1 + 1.3, v => money(v, true))
  } else if (sc.type === 'rtotal') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.12, 60)
    rise([$('.card', el)], lt, 0.25, 0, 80, 0.5)
    rise($$('.ln', el), lt, 0.35, 0.12, 30)
    $$('.ln b', el).forEach((n, j) => count(n, lt, 0.5 + j * 0.25, 1.5 + j * 0.25, v => money(v, j === 2)))
    $$('.strip i', el).forEach((n, j) => { n.style.opacity = P(lt, 1.6 + j * 0.08, 1.9 + j * 0.08) })
  }
}

// ---------------------------------------------------------------- sound effects in sync with the drawing above
window.fxEvents = function () {
  const ev = [], add = (t, type, gain) => ev.push({ t: +t.toFixed(3), type, ...(gain ? { gain } : {}) })
  D.scenes.forEach((sc, k) => {
    const T = sc.start, p = D.picks[sc.i]
    if (k > 0) add(T, 'whoosh')
    if (sc.type === 'hook' || sc.type === 'rhook') { add(T + 0.25, 'impact'); if (sc.type === 'rhook') add(T + 0.6, 'impact', 0.6) }
    if (sc.type === 'pick') {
      const [b1] = S(sc, 1), [b2, d2] = S(sc, 2)
      add(T + 0.42, 'impact', 0.5)                         // "vs"
      add(T + b1 + 0.2, 'impact')                          // the pick card slams
      const lightAt = b2 + Math.max(1.2, d2 * 0.62)
      for (let j = 1; j <= p.signal; j++) add(T + lightAt + (j - 1) * 0.16, ['tick', 'tick2', 'tick3'][j - 1])
    }
    if (sc.type === 'result') {
      const [b1] = S(sc, 1)
      add(T + 0.5, 'impact', 0.55)                         // the score
      add(T + b1 + 0.22, p.result === 'won' ? 'ding' : p.result === 'lost' ? 'thud' : 'tick')
      if (p.result === 'won') add(T + b1 + 1.2, 'cash', 0.7)
    }
    if (sc.type === 'rtotal') add(T + 2.0 + 0.25, D.recap.profit >= 0 ? 'cash' : 'thud')
    if (sc.type === 'cta') add(T + 0.6, 'impact', 0.7)
    if (sc.type === 'slate') add(T + 0.25, 'impact', 0.45)
    const nx = D.scenes[k + 1]
    if (nx && (nx.type === 'slate' || nx.type === 'rtotal')) add(nx.start, 'riser', 0.8)
  })
  return ev
}

// ---------------------------------------------------------------- frame
let capShown = -1
const capEl = $('#cap')
let seed = 99; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648
const gc = document.createElement('canvas'); gc.width = gc.height = 256
{ const x = gc.getContext('2d'), d = x.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255 } x.putImageData(d, 0, 0) }
$('#grain').style.backgroundImage = `url(${gc.toDataURL()})`

window.renderAt = function (t) {
  let k = D.scenes.findIndex(s => t >= s.start && t < s.start + s.dur); if (k < 0) k = D.scenes.length - 1
  const sc = D.scenes[k], lt = t - sc.start
  built.forEach((el, j) => { el.style.display = j === k ? 'block' : 'none' })

  // background: current scene's stadium (hook: one stadium per beat), slow push-in, punch-in at the cut
  D.scenes.forEach((s2, j) => s2.bgs.forEach(b => { if (j !== k) b.style.opacity = 0 }))
  const nb = sc.bgs.length, cyc = (sc.type === 'hook' || sc.type === 'rhook') && nb > 1
  const bi = cyc ? Math.min(nb - 1, Math.floor(lt / BEAT)) % nb : 0
  sc.bgs.forEach((b, j) => {
    if (j !== bi) { b.style.opacity = 0; return }
    const st = cyc ? bi * BEAT : 0, l2 = lt - st, punch = 1 - P(l2, 0, 0.45, E.outCubic)
    const s = 1.1 + 0.08 * clamp(lt / Math.max(4, sc.dur)) + 0.12 * punch
    b.style.opacity = 1
    b.style.transform = `scale(${s}) translate3d(${(k % 2 ? -1 : 1) * 14 * clamp(lt / sc.dur)}px,${-10 * clamp(lt / sc.dur)}px,0)`
  })
  $('#credit').textContent = sc.credits[cyc ? bi : 0] || ''

  draw(k, lt, sc)
  // keep things alive between reveals: slow drift of the whole layout, and the logo bars pulse on the beat
  $('#scenes').style.transform = `scale(${1 + 0.018 * clamp(lt / sc.dur)})`
  const bp = Math.exp(-((t % BEAT) / BEAT) * 5)
  $$('#hdr .bars i').forEach((b, j) => { b.style.transform = `scaleY(${1 + 0.22 * bp * (j + 1) / 3})`; b.style.transformOrigin = '50% 100%' })

  // header
  $('#hlabel').textContent = sc.type === 'pick' ? `Pick ${sc.i + 1} / ${N}` : sc.type === 'result' ? `Result ${sc.i + 1} / ${N}` : sc.type === 'slate' ? 'The slate' : sc.type === 'rtotal' ? 'The day' : ''
  $$('#pips i').forEach((b, j) => { b.className = sc.i === undefined ? (['slate', 'rtotal', 'cta'].includes(sc.type) ? 'done' : '') : j < sc.i ? 'done' : j === sc.i ? 'on' : '' })
  $('#pips').style.opacity = (sc.type === 'hook' || sc.type === 'rhook' || sc.type === 'cta') ? 0 : 1
  $('#hdr').style.opacity = sc.type === 'cta' ? 1 - P(lt, 0, 0.3) : 1

  // cut: flash + light streak across, in time with the whoosh
  let fl = 0, sx = -2000
  for (let j = 1; j < D.scenes.length; j++) {
    const d = t - D.scenes[j].start
    if (d > -0.22 && d < 0.3) { fl = Math.max(fl, d < 0 ? 0 : 0.5 * (1 - d / 0.3)); sx = -400 + (d + 0.22) / 0.52 * 1900 }
  }
  $('#flash').style.opacity = fl
  const sk = $('#streak'); sk.style.opacity = sx > -1000 ? 0.55 : 0; sk.style.transform = `translate3d(${sx}px,0,0) rotate(18deg)`

  // captions
  const ci = D.captions.findIndex(c => t >= c.start && t < c.end)
  if (ci !== capShown) {
    capShown = ci
    capEl.innerHTML = ci < 0 ? '' : `<div class="c">${D.captions[ci].words.map(w => `<span class="w">${html(w.w)}</span>`).join(' ')}</div>`
  }
  if (ci >= 0) {
    const c = D.captions[ci], q = P(t, c.start, c.start + 0.16, E.outBack)
    const box = $('.c', capEl); box.style.opacity = clamp(q * 2); box.style.transform = `scale(${0.85 + 0.15 * q})`
    $$('.w', capEl).forEach((s, j) => { const w = c.words[j]; s.className = 'w' + (t >= w.t0 && t < w.t1 ? ' now' : t < w.t0 ? ' next' : '') })
  }
  $('#foot').style.opacity = sc.type === 'cta' ? 0 : 1
}

window.ready = (async () => {
  // load every font up front, or text in a font not yet used stays invisible on the first frames
  await Promise.all([...document.fonts].map(f => f.load()))
  await document.fonts.ready
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})))
  // decode the stadium photos too (CSS backgrounds), so no frame shows a half-loaded picture
  const urls = [...new Set(D.picks.map(p => p.stadium && p.stadium.src).filter(Boolean))]
  await Promise.all(urls.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = () => im.decode ? im.decode().then(r, r) : r(); im.src = u })))
  return true
})()
</script>
