<style>
@font-face{font-family:Manrope;font-weight:400;src:url(assets/fonts/manrope-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:600;src:url(assets/fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:800;src:url(assets/fonts/manrope-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:JBM;font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:JBM;font-weight:700;src:url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Anton;font-weight:400;src:url(assets/fonts/anton-latin-400-normal.woff2) format('woff2')}
:root{--brand:#1F5FDB;--brand2:#3D7BFF;--brand3:#9DB8FF;--win:#22C55E;--win2:#4ADE80;--loss:#EF4444;--loss2:#F87171;--amb:#F5A524;
  --muted:rgba(255,255,255,.66);--glass:rgba(8,14,32,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#03060F}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif;color:#fff;background:#050A18}
.A{font-family:Anton,Manrope,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.5px}
.lbl{font:700 22px JBM;letter-spacing:5px;text-transform:uppercase;color:var(--brand3)}

/* background: the home team's stadium, graded dark with a slow push-in */
#bgs{position:absolute;inset:-2px;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:50% 50%;opacity:0;will-change:transform,opacity;
  filter:brightness(.8) saturate(1.2) contrast(1.06)}
.bg.none{background:radial-gradient(120% 70% at 50% 0%,#12307A 0%,#08142E 50%,#050A15 100%)}
.bg.bc{filter:none;background:#050A18}
.bc .ph,.bc .pa{position:absolute;inset:-4%}
.bc .ph{clip-path:polygon(0 0,64% 0,36% 100%,0 100%)}
.bc .pa{clip-path:polygon(64% 0,100% 0,100% 100%,36% 100%)}
.bc .seam{position:absolute;left:50%;top:-10%;width:14px;height:120%;margin-left:-7px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(16.3deg);filter:blur(1px);opacity:.55}
.bc svg.pitch{position:absolute;left:40px;top:120px;width:1000px;height:1680px;opacity:.13}
.bc .wm{position:absolute;width:760px;height:760px;opacity:.16;filter:saturate(.8)}
.bc .wm .badge{width:100%;height:100%}
.bc .wm.h{left:-230px;top:120px;transform:rotate(-10deg)}
.bc .wm.a{right:-230px;top:980px;transform:rotate(10deg)}
.bc .sweep{position:absolute;top:-20%;width:420px;height:140%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.10),rgba(255,255,255,0));transform:rotate(16deg)}
#tint{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,8,24,.82) 0%,rgba(4,8,24,.22) 15%,rgba(6,14,40,.12) 38%,rgba(5,10,28,.42) 60%,rgba(3,6,16,.9) 79%,#03060F 100%)}
#tint2{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(90% 60% at 50% 30%,rgba(61,123,255,.35),rgba(31,95,219,0) 70%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 50% 42%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:60;mix-blend-mode:overlay}
#streak{position:absolute;top:-400px;width:260px;height:2800px;z-index:61;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(157,184,255,0),rgba(255,255,255,.9) 50%,rgba(157,184,255,0));transform-origin:50% 50%}
#credit{position:absolute;left:60px;right:60px;top:1838px;font:500 15px JBM;color:rgba(255,255,255,.42);letter-spacing:.5px;z-index:45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#foot{position:absolute;left:60px;right:60px;top:1866px;font:700 16px JBM;letter-spacing:3px;color:rgba(255,255,255,.55);z-index:45;text-transform:uppercase}

/* header (kept below the phone's top bar) */
#hdr{position:absolute;left:60px;right:60px;top:150px;height:64px;display:flex;align-items:center;justify-content:space-between;z-index:50}
.logo{display:flex;align-items:flex-end;gap:12px;font:800 42px/1 Manrope;letter-spacing:-1.5px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.bars{display:flex;align-items:flex-end;gap:6px;transform:skewX(-11deg);padding-bottom:4px}
.bars i{display:block;width:10px;border-radius:3px;background:linear-gradient(180deg,#6E9BFF,#1F5FDB)}
#hright{text-align:right}
#hlabel{font:700 21px JBM;letter-spacing:5px;color:#fff;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#pips{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}
#pips i{display:block;width:38px;height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
#pips i.on{background:var(--brand2);box-shadow:0 0 14px rgba(61,123,255,.9)}
#pips i.done{background:rgba(255,255,255,.7)}

#scenes{position:absolute;inset:0;z-index:20;transform-origin:50% 45%}
.scene{position:absolute;inset:0;display:none;z-index:20}
.badge{position:relative;display:flex;align-items:center;justify-content:center}
.badge img,.badge svg{width:100%;height:100%;display:block}
.badge.flag img{border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px rgba(255,255,255,.9),0 22px 60px rgba(0,0,0,.6)}

.chip{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:rgba(8,14,32,.7);box-shadow:inset 0 0 0 1.5px var(--line);font:700 22px JBM;letter-spacing:4px;text-transform:uppercase}
.card{position:absolute;border-radius:36px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(14px)}

/* hook */
.hook .meta,.rhook .meta{position:absolute;left:60px;top:300px}
.hook .n{position:absolute;left:44px;top:330px;font-size:560px;line-height:1;color:#fff;text-shadow:0 30px 90px rgba(31,95,219,.55)}
.hook .w1,.hook .w2{position:absolute;left:400px;font-size:196px;line-height:1}
.hook .w1{top:400px}

/* pick */
.pick .meta{position:absolute;left:0;right:0;top:300px;text-align:center}

.pick .stat{position:absolute;left:0;right:0;top:770px;display:flex;justify-content:center;gap:14px}

.pick .pc .ko{position:absolute;right:52px;bottom:52px;text-align:right}

.pick .row .tr{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}

.pick .row .v{width:120px;text-align:right;font-size:54px}
.pick .sig{left:60px;right:60px;top:1278px;height:150px;padding:26px 40px;display:flex;align-items:center;gap:34px}
.sigbars{display:flex;align-items:flex-end;gap:14px;transform:skewX(-11deg)}
.sigbars i{display:block;width:30px;border-radius:8px;background:rgba(255,255,255,.14)}
.pick .sig .t .lbl{color:var(--muted)}
.pick .sig .t b{display:block;margin-top:6px;font-size:66px;line-height:1}

/* slate */
.slate .t1{position:absolute;left:60px;top:290px;font-size:170px;line-height:1}
.slate .t2{position:absolute;left:66px;top:480px;font:800 36px Manrope;color:var(--muted)}
.slate .tk{left:60px;right:60px;top:560px;padding:20px 30px}
.slate .r{display:flex;align-items:center;gap:20px;height:146px;border-bottom:1.5px dashed rgba(255,255,255,.14)}
.slate .r:last-child{border-bottom:0}
.slate .r .pair{display:flex;width:104px;flex-shrink:0}
.slate .r .pair .badge{width:58px;height:58px;margin-right:-12px}
.slate .r .mid{flex:1;min-width:0}
.slate .r .mid .pk{font:800 34px/1.1 Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slate .r .mid .sub{margin-top:6px;font:600 23px Manrope;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slate .r .od{font-size:50px;width:120px;text-align:right}
.slate .r .sb{width:76px;display:flex;justify-content:center}
.slate .r .sb .sigbars{gap:6px}.slate .r .sb .sigbars i{width:12px;border-radius:4px}
.slate .r .stk{width:170px;text-align:right;font:800 36px Manrope}
.slate .tot{position:absolute;left:60px;right:60px;top:1330px;display:flex;justify-content:space-between;align-items:baseline}
.slate .tot .k{font:700 22px JBM;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.slate .tot b{font-size:70px}

/* call to action */
.cta .wrap{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cta .logo{font-size:170px;letter-spacing:-7px;gap:30px}
.cta .logo .bars{gap:16px;padding-bottom:22px}
.cta .logo .bars i{width:34px;border-radius:9px}
.cta .big{margin-top:70px;font-size:128px;line-height:1.02}
.cta .url{margin-top:40px;font:800 46px Manrope;color:var(--brand3)}
.cta .dis{margin-top:56px;font:700 22px JBM;letter-spacing:4px;color:var(--muted);text-transform:uppercase}

/* results */
.rhook .score{position:absolute;left:44px;top:330px;font-size:520px;line-height:1;text-shadow:0 30px 90px rgba(0,0,0,.6)}
.rhook .score span{color:rgba(255,255,255,.4)}
.rhook .wonw{position:absolute;left:66px;top:870px;font-size:120px;color:var(--win2)}
.rhook .money{position:absolute;left:60px;right:60px;top:1030px;display:flex;align-items:baseline;gap:22px;font-size:110px}
.rhook .money .arr{font-size:70px;color:var(--muted)}
.rhook .dots{position:absolute;left:60px;right:60px;top:1200px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.rhook .dot{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0;border-radius:24px;background:rgba(8,14,32,.6);box-shadow:inset 0 0 0 2px var(--line)}
.rhook .dot.won{box-shadow:inset 0 0 0 3px var(--win)}.rhook .dot.lost{box-shadow:inset 0 0 0 3px var(--loss)}
.rhook .dot .pair{display:flex}.rhook .dot .pair .badge{width:52px;height:52px;margin:0 -5px}
.rhook .dot b{font:800 24px Manrope}
.rhook .dot.won b{color:var(--win2)}.rhook .dot.lost b{color:var(--loss2)}
.result .meta{position:absolute;left:0;right:0;top:300px;text-align:center}
.result .sb{position:absolute;left:0;right:0;top:370px;height:420px}
.result .side{position:absolute;top:0;width:330px;display:flex;flex-direction:column;align-items:center}
.result .side.h{left:40px}.result .side.a{right:40px}
.result .side .badge{width:200px;height:200px}
.result .side .badge.shield,.result .side .badge.crest{width:186px;height:214px}
.result .side .nm{margin-top:22px;font-size:54px;line-height:1.02;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.result .sc{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:230px;line-height:1;white-space:nowrap;text-shadow:0 20px 70px rgba(0,0,0,.6)}
.result .sc span{color:rgba(255,255,255,.35)}
.result .ft{position:absolute;left:50%;top:260px;transform:translateX(-50%)}
.result .pc{left:60px;right:60px;top:860px;height:330px;padding:40px 48px}
.result .pc .pk{margin-top:14px;font-size:76px;line-height:1;max-width:620px}
.result .pc .od{margin-top:14px;font:800 34px Manrope;color:var(--muted)}
.stamp{position:absolute;font-size:96px;line-height:1;padding:18px 30px 14px;border-radius:24px;transform-origin:50% 50%}
.stamp.won{color:var(--win2);box-shadow:inset 0 0 0 7px var(--win);background:rgba(34,197,94,.14)}
.stamp.lost{color:var(--loss2);box-shadow:inset 0 0 0 7px var(--loss);background:rgba(239,68,68,.14)}
.stamp.void{color:#CBD5E1;box-shadow:inset 0 0 0 7px #94A3B8;background:rgba(148,163,184,.14)}
.result .pc .stamp{right:34px;top:-58px;box-shadow:inset 0 0 0 7px currentColor,0 20px 50px rgba(0,0,0,.5);background:rgba(6,12,28,.92)}
.result .mny{position:absolute;left:60px;right:60px;top:1220px;display:flex;justify-content:space-between;align-items:center;padding:28px 44px}
.result .mny .k{font:700 20px JBM;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.result .mny b{font-size:84px;line-height:1}
.rtotal .t1{position:absolute;left:60px;top:290px;font-size:170px;line-height:1}
.rtotal .t2{position:absolute;left:66px;top:480px;font:800 36px Manrope;color:var(--muted)}
.rtotal .card{left:60px;right:60px;top:570px;padding:20px 48px 40px}
.rtotal .ln{display:flex;justify-content:space-between;align-items:baseline;padding:26px 0;border-bottom:1.5px solid rgba(255,255,255,.1)}
.rtotal .ln .k{font:800 36px Manrope;color:var(--muted)}
.rtotal .ln b{font-size:96px;line-height:1}
.rtotal .ln.big b{font-size:150px}
.rtotal .strip{display:flex;gap:10px;margin-top:34px}
.rtotal .strip i{flex:1;height:18px;border-radius:9px}

/* match preview (no odds, no picks) */
.pv_hook .meta,.pv_form .meta{position:absolute;left:0;right:0;top:300px;text-align:center}
.pv_hook .mu{position:absolute;left:0;right:0;top:380px;height:420px}
.pv_hook .side{position:absolute;top:0;width:420px;display:flex;flex-direction:column;align-items:center}

.pv_hook .sub{position:absolute;left:0;right:0;top:1250px;text-align:center}
.pv .t1{position:absolute;left:60px;top:290px;font-size:150px;line-height:1;white-space:nowrap}
.pv .t1.long{font-size:124px;top:308px}
.pv .t2{position:absolute;left:66px;top:460px;font:800 34px Manrope;color:var(--muted)}

.pv_model .lab div:first-child{text-align:left}.pv_model .lab div:last-child{text-align:right}
.pv_model .lab b{display:block;font-size:84px;line-height:1}
.pv_model .lab span{display:block;margin-top:6px;font:700 22px JBM;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.pv_score .tiles{position:absolute;left:60px;right:60px;top:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pv_score .tile{position:relative;padding:40px 10px 34px;border-radius:32px;text-align:center;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 30px 80px rgba(0,0,0,.45)}

.pv_score .tile .sc{font-size:150px;line-height:1}

.pv_score .tile .pc{margin-top:16px;font:800 40px Manrope;color:var(--brand3)}
.pv_score .tile .pair{display:flex;justify-content:center;gap:6px;margin-top:22px}
.pv_score .tile .pair .badge{width:54px;height:54px}
.pv_score .note{position:absolute;left:60px;right:60px;top:1010px;text-align:center;font:800 34px Manrope;color:var(--muted)}
.pv_cta .wrap{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pv_cta .logo{font-size:170px;letter-spacing:-7px;gap:30px}
.pv_cta .logo .bars{gap:16px;padding-bottom:22px}
.pv_cta .logo .bars i{width:34px;border-radius:9px}
.pv_cta .big{margin-top:70px;font-size:112px;line-height:1.02}
.pv_cta .url{margin-top:40px;font:800 44px Manrope;color:var(--brand3)}

/* AI analyst screens */
.pv_stake .tbl{width:100%;border-collapse:collapse}
.pv_stake .tbl td{padding:16px 6px;border-bottom:1.5px solid rgba(255,255,255,.1);font:800 34px Manrope}
.pv_stake .tbl tr.me td{color:#fff}.pv_stake .tbl tr:not(.me) td{color:rgba(255,255,255,.55)}
.pv_stake .tbl td.n{width:70px;font:400 40px Anton;color:var(--brand3)}
.pv_stake .tbl td.r{text-align:right;width:120px;font:400 40px Anton}
.pv_stake .tbl th{padding:0 6px 10px;text-align:right;font:700 18px JBM;letter-spacing:3px;color:var(--muted)}
.pt{display:flex;gap:18px;align-items:flex-start;margin-top:22px;font:800 36px/1.25 Manrope}

.pcard{position:relative;border-radius:30px;overflow:hidden;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 30px 80px rgba(0,0,0,.45)}
.pcard .ph{height:250px;background-size:cover;background-position:50% 18%;position:relative}
.pcard .ph.none{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(31,95,219,.35),rgba(5,10,24,.6))}
.pcard .ph.none .badge{width:150px;height:150px}
.pcard .ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(5,10,24,.85))}
.pcard .tm{position:absolute;left:16px;top:16px;width:58px;height:58px;z-index:2}
.pcard .tm .badge{width:100%;height:100%}
.pcard .inf{padding:16px 22px 22px}
.pcard .inf b{display:block;font-size:46px;line-height:1}
.pcard .inf span{display:block;margin-top:6px;font:700 19px JBM;letter-spacing:2px;text-transform:uppercase;color:var(--brand3)}
.pcard .inf p{margin-top:10px;font:800 25px/1.25 Manrope;color:rgba(255,255,255,.88)}
.pv_tactics .cols{position:absolute;left:60px;right:60px;top:540px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tcol{border-radius:30px;padding:24px 24px 26px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 30px 80px rgba(0,0,0,.45)}
.tcol .hd{display:flex;align-items:center;gap:14px}
.tcol .hd .badge{width:64px;height:64px}
.tcol .hd b{font-size:40px;line-height:1}
.tcol .fm{margin-top:8px;font-size:76px;line-height:1;color:var(--brand3)}
.tcol svg{display:block;width:100%;height:330px;margin-top:10px}
.tcol .pt{margin-top:14px;font-size:25px;gap:12px}
.tcol .pt i{width:10px;height:10px;margin-top:11px}
.pv_expect .box .pt{font-size:44px;margin-top:30px}
.pv_expect .verdict{position:absolute;left:60px;right:60px;top:1150px;text-align:center}
.pv_expect .verdict .chip{font-size:26px;background:linear-gradient(90deg,rgba(31,95,219,.85),rgba(61,123,255,.6))}

/* captions (inside the safe zone: clear of the phone's bottom bar and side buttons) */
#cap{position:absolute;left:70px;right:150px;top:1474px;height:200px;z-index:55;display:flex;align-items:flex-start;justify-content:center;text-align:center}
#cap .c{font:800 50px/1.22 Manrope;letter-spacing:-1px;text-shadow:0 4px 24px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
#cap .w{display:inline-block;margin:0 .13em}
#cap .w.now{color:#fff;background:var(--brand2);border-radius:12px;padding:0 .14em;margin:0 -.01em;box-shadow:0 8px 30px rgba(61,123,255,.6)}
#cap .w.next{opacity:.6}
#grain{position:absolute;inset:0;opacity:.05;pointer-events:none;background-size:256px 256px;z-index:70}
</style>
</head>
<body>
<div id="stage">
  <div id="bgs"></div><div id="tint"></div><div id="tint2"></div><div id="vig"></div>
  <div id="hdr">
    <div class="logo"><span class="bars"><i style="height:20px"></i><i style="height:30px"></i><i style="height:40px"></i></span>cmvng</div>
    <div id="hright"><div id="hlabel"></div><div id="pips"></div></div>
  </div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="credit"></div>
  <div id="foot">18+ · Predictions, not guarantees · Bet responsibly</div>
  <div id="flash"></div><div id="streak"></div><div id="grain"></div>
</div>
<script>
const D = window.DATA
const $ = (s, el = document) => el.querySelector(s)
const $$ = (s, el = document) => [...el.querySelectorAll(s)]
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), outCubic: x => 1 - Math.pow(1 - x, 3), inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, outBack: x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const P = (t, a, b, e = E.outExpo) => e(clamp((t - a) / (b - a)))
const DEC = D.cfg.stake_example < 1000 ? 2 : 0
const money = (v, sign) => (v < -1e-9 ? '−' : sign && v > 1e-9 ? '+' : '') + D.cfg.currency + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: DEC, maximumFractionDigits: DEC })
const html = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const N = D.picks.length
const RES = D.cfg.mode === 'results'
const SIGWORD = { 3: 'Strong', 2: 'Good', 1: 'Light stake' }
const SIGCOL = { 3: '#3D7BFF', 2: '#6E9BFF', 1: '#F5A524' }

let uid = 0
function badge(b) {
  if (b.svg) { const u = `b${uid++}`; return `<div class="badge shield">${b.svg.replace(/id="(\w+)"/g, `id="$1${u}"`).replace(/url\(#(\w+)\)/g, `url(#$1${u})`)}</div>` }
  return `<div class="badge ${b.kind}"><img src="${b.src}"></div>`
}
// "Double Chance: Draw or Norway" → { main: "Norway or Draw", tag: "Double chance" }
function label(p) {
  const s = p.pick.trim()
  let m = s.match(/^double chance:?\s*draw or (.+)$/i) || s.match(/^double chance:?\s*(.+) or draw$/i)
  if (m) return { main: `${m[1]} or Draw`, tag: 'Double chance' }
  m = s.match(/^double chance:?\s*(.+) or (.+)$/i)
  if (m) return { main: `${m[1]} or ${m[2]}`, tag: 'Double chance' }
  m = s.match(/^draw no bet:?\s*(.+)$/i) || s.match(/^(.+?)\s*\(?draw no bet\)?$/i)
  if (m) return { main: m[1].replace(/[\s,-]+$/, ''), tag: 'Draw no bet' }
  return { main: s, tag: '' }
}
const nmFit = (name, big) => { const n = name.length, s = big ? [68, 58, 48, 40] : [54, 46, 38, 32]; return s[n <= 9 ? 0 : n <= 13 ? 1 : n <= 18 ? 2 : 3] }
const fit = (txt, sizes = [[14, 94], [19, 80], [24, 68], [99, 58]]) => sizes.find(([n]) => txt.length <= n)[1]
const sigbars = (n, h = [46, 72, 98]) => `<span class="sigbars">${[1, 2, 3].map(j => `<i data-j="${j}" style="height:${h[j - 1]}px${j <= n ? `;background:${SIGCOL[n]}` : ''}"></i>`).join('')}</span>`
const kickoff = p => p.kickoff || ''
// scene-relative start/duration of each spoken line
const S = (sc, j) => sc.lines[j] || sc.lines.at(-1) || [0.4, 2]

// ---------------------------------------------------------------- backgrounds
// each scene gets its stadium; the opening scene cycles through all of them on the beat
const bgEls = []
function bgFor(src) {
  const d = document.createElement('div'); d.className = 'bg' + (src ? '' : ' none')
  if (src) d.style.backgroundImage = `url("${src}")`
  $('#bgs').appendChild(d); return d
}
const STYLE = D.cfg.style || 'stadium'          // stadium · players · broadcast
const stad = p => p && p.stadium ? p.stadium : null
const allStadia = D.picks.map(stad).filter(Boolean)
const PITCH = `<svg class="pitch" viewBox="0 0 100 168" fill="none" stroke="#fff" stroke-width=".5"><rect x="1" y="1" width="98" height="166"/><line x1="1" y1="84" x2="99" y2="84"/><circle cx="50" cy="84" r="13"/><circle cx="50" cy="84" r=".8" fill="#fff"/><rect x="21" y="1" width="58" height="26"/><rect x="36" y="1" width="28" height="9"/><rect x="21" y="141" width="58" height="26"/><rect x="36" y="158" width="28" height="9"/><path d="M38 27 A13 13 0 0 0 62 27"/><path d="M38 141 A13 13 0 0 1 62 141"/></svg>`
// broadcast style: the two teams' colours split on a diagonal, giant crest watermarks, pitch markings
function bcFor(p) {
  const d = document.createElement('div'); d.className = 'bg bc'
  const h = p ? (p.bh.colour || '#1F5FDB') : '#12307A', a = p ? (p.ba.colour || '#3D7BFF') : '#0B1C4A'
  d.innerHTML = `<div class="ph" style="background:linear-gradient(165deg,${h},#050A18 120%)"></div><div class="pa" style="background:linear-gradient(195deg,${a},#050A18 120%)"></div>
    <div class="seam"></div>${PITCH}${p ? `<div class="wm h">${badge(p.bh)}</div><div class="wm a">${badge(p.ba)}</div>` : ''}<div class="sweep"></div>`
  $('#bgs').appendChild(d); return d
}
D.scenes.forEach((sc, k) => {
  const p = D.picks[sc.i], one = sc.type === 'pick' || sc.type === 'result' || sc.type.startsWith('pv_')
  if (STYLE === 'broadcast') { sc.bgs = [bcFor(one ? p : null)]; sc.credits = [''] }
  else if (one && STYLE === 'players' && p.players?.length) { sc.bgs = p.players.map(x => bgFor(x.src)); sc.credits = p.players.map(x => x.credit) }
  else if (sc.type === 'hook' || sc.type === 'rhook') { sc.bgs = (allStadia.length ? allStadia : [null]).map(s => bgFor(s && s.src)); sc.credits = allStadia.length ? allStadia.map(s => s.credit) : [''] }
  else if (one) { sc.bgs = [bgFor(stad(p)?.src)]; sc.credits = [stad(p)?.credit] }
  else { sc.bgs = [bgFor((allStadia[0] || {}).src)]; sc.credits = [(allStadia[0] || {}).credit || ''] }
})
const BEAT = D.beat || 0.62

// ---------------------------------------------------------------- build
const built = D.scenes.map((sc, k) => {
  const el = document.createElement('div'); el.className = `scene ${sc.type}`
  const p = D.picks[sc.i]
  if (sc.type === 'hook') {
    const best = [...D.picks].sort((a, b) => (b.signal - a.signal) || (b.model - a.model))[0]
    el.innerHTML = `<div class="meta"><span class="chip">${html(D.cfg.competition || 'Today')}</span></div>
      <div class="n A">${N}</div><div class="w1 A">Picks</div><div class="w2 A">${html(D.cfg.when_word || 'Today')}</div>
      <div class="date">${html(D.cfg.date_label || dayLong(D.cfg.date))}</div>
      <div class="pairs">${D.picks.map(q => `<div class="pair">${badge(q.bh)}${badge(q.ba)}</div>`).join('')}</div>
      <div class="tease"><span class="chip">Top signal ${sigbars(best.signal, [18, 26, 34])} ${Math.round(best.model)}%</span></div>`
  } else if (sc.type === 'pick') {
    const xg = p.xg_home !== undefined ? `<span class="chip">xG <b>${p.xg_home.toFixed(1)}</b> – <b>${p.xg_away.toFixed(1)}</b></span>` : ''
    const fm = p.form_home ? `<span class="chip">Form <b>${p.form_home}</b> · <b>${p.form_away || '—'}</b></span>` : ''
    const gl = (b) => `radial-gradient(closest-side,${b.colour || '#1F5FDB'},rgba(0,0,0,0))`
    el.innerHTML = `<div class="meta"><span class="chip">${html([p.competition, kickoff(p)].filter(Boolean).join(' · '))}</span></div>
      <div class="mu"><div class="glowH" style="background:${gl(p.bh)}"></div><div class="glowA" style="background:${gl(p.ba)}"></div>
        <div class="side h">${badge(p.bh)}<div class="nm A" style="font-size:${nmFit(p.home, true)}px">${html(p.home)}</div></div>
        <div class="vs A">vs</div>
        <div class="side a">${badge(p.ba)}<div class="nm A" style="font-size:${nmFit(p.away, true)}px">${html(p.away)}</div></div></div>
      <div class="stat">${xg}${fm}</div>
      <div class="card pc"><div class="lbl">The pick${label(p).tag ? ' · ' + html(label(p).tag) : ''}</div><div class="pk A" style="font-size:${fit(label(p).main)}px">${html(label(p).main)}</div>
        <div class="odds A"><span class="at">@</span><span class="o">${p.odds.toFixed(2)}</span></div>
        ${kickoff(p) ? `<div class="ko"><div class="lbl">Kick-off</div><b>${html(kickoff(p))}</b></div>` : ''}</div>
      <div class="card probs">
        <div class="row"><div class="k">Bookies</div><div class="tr"><b style="background:rgba(255,255,255,.55)"></b></div><div class="v A" data-n="${p.market}">0%</div></div>
        <div class="row"><div class="k">Our model</div><div class="tr"><b style="background:linear-gradient(90deg,#1F5FDB,#6E9BFF)"></b></div><div class="v A" data-n="${p.model}">0%</div></div></div>
      <div class="card sig">${sigbars(p.signal)}<div class="t"><div class="lbl">cmvng signal</div><b class="A" style="color:${SIGCOL[p.signal]}">${p.signal} bar${p.signal > 1 ? 's' : ''} · ${SIGWORD[p.signal]}</b></div></div>`
  } else if (sc.type === 'slate') {
    el.innerHTML = `<div class="t1 A">The slate</div><div class="t2">${money(D.cfg.stake_example)} split by signal bars</div>
      <div class="card tk">${D.picks.map(q => `<div class="r"><div class="pair">${badge(q.bh)}${badge(q.ba)}</div>
        <div class="mid"><div class="pk">${html(label(q).main)}</div><div class="sub">${label(q).tag ? html(label(q).tag) + ' · ' : ''}${html(q.home)} v ${html(q.away)}</div></div>
        <div class="od A">${q.odds.toFixed(2)}</div><div class="sb">${sigbars(q.signal, [20, 30, 40])}</div><div class="stk" data-n="${q.stake}">0</div></div>`).join('')}</div>
      <div class="tot" style="top:${560 + N * 148 + 70}px"><span class="k">${D.recap.totalBars} bars · 1 bar ≈ ${money(D.recap.perBar)}</span><b class="A">${money(D.recap.total)}</b></div>`
  } else if (sc.type === 'cta') {
    el.innerHTML = `<div class="wrap"><div class="logo"><span class="bars"><i style="height:64px"></i><i style="height:98px"></i><i style="height:132px"></i></span>cmvng</div>
      <div class="big A" style="font-size:${Math.max(...(RES ? ['Next picks', D.cfg.next_when] : ['Results', D.cfg.results_when]).map(x => x.length)) > 12 ? 100 : 128}px">${RES ? 'Next picks<br>' + html(D.cfg.next_when) : 'Results<br>' + html(D.cfg.results_when)}</div>
      <div class="url">${html(D.cfg.cta.url)}</div><div class="dis">18+ · Predictions, not guarantees</div></div>`
  } else if (sc.type === 'rhook') {
    const r = D.recap
    el.innerHTML = `<div class="meta"><span class="chip">${html([D.cfg.competition, D.cfg.date_label || dayLong(D.cfg.date)].filter(Boolean).join(' · '))}</span></div>
      <div class="score A">${r.won}<span>/${N}</span></div><div class="wonw A">Won</div>
      <div class="money A"><span class="a">${money(D.cfg.stake_example)}</span><span class="arr">→</span><span class="b" style="color:${r.profit >= 0 ? 'var(--win2)' : 'var(--loss2)'}">${money(0)}</span></div>
      <div class="dots">${D.picks.map(q => `<div class="dot ${q.result}"><div class="pair">${badge(q.bh)}${badge(q.ba)}</div><b>${q.result === 'won' ? '✓ Won' : q.result === 'lost' ? '✗ Lost' : 'Void'}</b></div>`).join('')}</div>`
  } else if (sc.type === 'result') {
    const m = String(p.score || '').match(/(\d+)\s*[-–:]\s*(\d+)/)
    const net = p.ret - p.stake
    el.innerHTML = `<div class="meta"><span class="chip">${html([p.competition, 'Full time'].filter(Boolean).join(' · '))}</span></div>
      <div class="sb"><div class="side h">${badge(p.bh)}<div class="nm A" style="font-size:${nmFit(p.home, false)}px">${html(p.home)}</div></div>
        <div class="side a">${badge(p.ba)}<div class="nm A" style="font-size:${nmFit(p.away, false)}px">${html(p.away)}</div></div>
        <div class="sc A">${m ? `${m[1]}<span>–</span>${m[2]}` : '<span>v</span>'}</div></div>
      <div class="card pc"><div class="lbl">The pick${label(p).tag ? ' · ' + html(label(p).tag) : ''}</div><div class="pk A" style="font-size:${Math.round(fit(label(p).main) * 0.8)}px">${html(label(p).main)}</div><div class="od">at ${p.odds.toFixed(2)} · ${p.signal} bar${p.signal > 1 ? 's' : ''} · stake ${money(p.stake)}</div>
        <div class="stamp ${p.result} A">${p.result === 'won' ? 'Won ✓' : p.result === 'lost' ? 'Lost ✗' : 'Void'}</div></div>
      <div class="card mny"><span class="k">${p.result === 'won' ? 'Profit' : p.result === 'lost' ? 'Lost' : 'Stake back'}</span><b class="A" style="color:${net > 0 ? 'var(--win2)' : net < 0 ? 'var(--loss2)' : '#fff'}" data-n="${net}">${money(0)}</b></div>`
  } else if (sc.type === 'rtotal') {
    const r = D.recap, pos = r.profit >= 0
    el.innerHTML = `<div class="t1 A">The day</div><div class="t2">${money(D.cfg.stake_example)} split by signal bars · ${r.won} won · ${r.lost} lost${r.void ? ` · ${r.void} void` : ''}</div>
      <div class="card"><div class="ln"><span class="k">Staked</span><b class="A" data-n="${r.total}">0</b></div>
        <div class="ln"><span class="k">Returned</span><b class="A" data-n="${r.returned}">0</b></div>
        <div class="ln big"><span class="k">${pos ? 'Profit' : 'Loss'}</span><b class="A" data-n="${r.profit}" style="color:${pos ? 'var(--win2)' : 'var(--loss2)'}">0</b></div>
        <div class="strip">${D.picks.map(q => `<i style="background:${q.result === 'won' ? 'var(--win)' : q.result === 'lost' ? 'var(--loss)' : '#94A3B8'}"></i>`).join('')}</div></div>`
  }
  if (sc.type.startsWith('pv_')) el.innerHTML = buildPreview(sc.type, p)
  if (sc.type.startsWith('pv_') && sc.type !== 'pv_hook' && sc.type !== 'pv_cta') el.classList.add('pv')
  $('#scenes').appendChild(el); return el
})
function buildPreview(type, p) {
  const f1 = v => (v + 1e-9).toFixed(1), H = html(p.home), A = html(p.away)
  if (type === 'pv_hook') return `<div class="meta"><span class="chip">${html([p.competition, p.kickoff ? (isToday(D.cfg.date) ? 'Tonight ' : '') + p.kickoff : dayLong(D.cfg.date)].filter(Boolean).join(' · '))}</span></div>
    <div class="mu"><div class="side h">${badge(p.bh)}<div class="nm A" style="font-size:${nmFit(p.home, true)}px">${H}</div></div><div class="vs A">vs</div>
      <div class="side a">${badge(p.ba)}<div class="nm A" style="font-size:${nmFit(p.away, true)}px">${A}</div></div></div>
    <div class="ttl A">${D.cfg.analysis ? 'The AI<br><span>Analyst</span>' : 'What the<br><span>numbers</span> say'}</div><div class="sub"><span class="chip">${D.cfg.analysis ? 'Preview · context · players · tactics' : 'Match preview'}</span></div>`
  if (type === 'pv_form') {
    const row = (b, name, rec, form, ppg) => `<div class="tr">${badge(b)}<div class="who"><b class="A">${html(name)}</b><span>W${rec[0]} D${rec[1]} L${rec[2]}${ppg ? ` · ${ppg.toFixed(1)} pts a game` : ''}</span></div>
      <div class="chips5">${[...(form || '')].map(c => `<i class="${c}">${c}</i>`).join('')}</div></div>`
    const unb = [[p.home, p.record_home, p.games_home], [p.away, p.record_away, p.games_away]].find(([, r]) => r && r[2] === 0)
    return `<div class="t1 A">Form</div><div class="t2">Last ${p.games_home || 10} games · last five, oldest → newest</div>
      <div class="card box">${row(p.bh, p.home, p.record_home, p.form_home, p.ppg_home)}${row(p.ba, p.away, p.record_away, p.form_away, p.ppg_away)}</div>
      ${unb ? `<div class="hl"><span class="chip">${html(unb[0])} unbeaten in ${unb[2] || 10}</span></div>` : ''}`
  }
  if (type === 'pv_stats') {
    const rows = [['Goals scored', p.scored_home, p.scored_away, 1], ['Goals conceded', p.conceded_home, p.conceded_away, -1],
      ['Shots on target', p.sot_home, p.sot_away, 1], ['Clean sheets (last 10)', p.clean_home, p.clean_away, 1]].filter(r => r[1] !== undefined && r[2] !== undefined)
    return `<div class="t1 A">The numbers</div><div class="t2">Per game, last 10</div>
      <div class="card box"><div class="heads">${badge(p.bh)}${badge(p.ba)}</div>${rows.map(([k, h, a, dir]) => {
        const m = Math.max(h, a) || 1, hb = (h - a) * dir > 0, ab = (a - h) * dir > 0
        return `<div class="row"><div class="k">${k}</div><div class="vals"><div class="v A" style="color:${hb ? '#fff' : 'rgba(255,255,255,.6)'}">${Number.isInteger(h) ? h : f1(h)}</div>
          <div class="cmp"><span><b data-w="${h / m}" style="background:${hb ? (p.bh.colour || '#3D7BFF') : 'rgba(255,255,255,.35)'}"></b></span><span><b data-w="${a / m}" style="background:${ab ? (p.ba.colour || '#3D7BFF') : 'rgba(255,255,255,.35)'}"></b></span></div>
          <div class="v r A" style="color:${ab ? '#fff' : 'rgba(255,255,255,.6)'}">${Number.isInteger(a) ? a : f1(a)}</div></div></div>`
      }).join('')}</div>`
  }
  if (type === 'pv_model') {
    const segs = [[p.home_win, p.bh.colour || '#3D7BFF', p.home], [p.draw, '#64748B', 'Draw'], [p.away_win, p.ba.colour || '#6E9BFF', p.away]]
    return `<div class="t1 A">Our model</div><div class="t2">Expected goals and win chances</div>
      <div class="card box"><div class="xg"><div class="side">${badge(p.bh)}<b class="A" data-n="${p.xg_home}">0.0</b></div><div class="mid">xG</div><div class="side"><b class="A" data-n="${p.xg_away}">0.0</b>${badge(p.ba)}</div></div>
        <div class="tri">${segs.map(([v, c]) => `<i style="width:${v}%;background:${c}"></i>`).join('')}</div>
        <div class="lab">${segs.map(([v, , n]) => `<div><b class="A" data-n="${v}">0%</b><span>${html(n)}</span></div>`).join('')}</div></div>`
  }
  if (type === 'pv_score') {
    const t = p.top_scores || []
    return `<div class="t1 A">Likely scores</div><div class="t2">From our model's scoreline grid</div>
      <div class="tiles">${t.map((x, j) => `<div class="tile${j === 0 ? ' top' : ''}"><div class="sc A">${x[0]}<span>–</span>${x[1]}</div><div class="pc">${Math.round(x[2])}%</div><div class="pair">${badge(p.bh)}${badge(p.ba)}</div></div>`).join('')}</div>
      <div class="note">No single score is likely on its own: football is a low-scoring game.</div>`
  }
  const an = D.cfg.analysis || {}
  if (type === 'pv_stake') {
    const t = an.table || []
    return `<div class="t1 A long">What's on the line</div><div class="t2">${html(an.stage || p.competition || '')}</div>
      <div class="card box">${t.length ? `<table class="tbl"><tr><th></th><th style="text-align:left">Team</th><th>P</th><th>Pts</th></tr>${t.map((r, j) => `<tr class="${[p.home, p.away].includes(r[0]) ? 'me' : ''}"><td class="n">${j + 1}</td><td>${html(r[0])}</td><td class="r">${r[1]}</td><td class="r">${r[2]}</td></tr>`).join('')}</table>` : ''}
        ${(an.stakes || []).map(x => `<div class="pt"><i></i><div>${html(x)}</div></div>`).join('')}</div>`
  }
  if (type === 'pv_players') {
    const pl = (an.players || []).slice(0, 4)
    return `<div class="t1 A long">Players to watch</div><div class="t2">Two from each side</div>
      <div class="grid">${pl.map(x => { const tb = x.team === 'away' ? p.ba : p.bh
        return `<div class="pcard"><div class="ph${x.photo ? '' : ' none'}" ${x.photo ? `style="background-image:url('${x.photo.src}')"` : ''}>${x.photo ? '' : badge(tb)}</div>
          ${x.photo ? `<div class="tm">${badge(tb)}</div>` : ''}<div class="inf"><b class="A" style="font-size:${x.name.length > 16 ? 36 : 46}px">${html(x.name)}</b><span>${html([x.role, x.club].filter(Boolean).join(' · '))}</span><p>${html(x.fact || '')}</p></div></div>` }).join('')}</div>`
  }
  if (type === 'pv_tactics') {
    const tc = an.tactics || {}
    const col = (side, b, name) => { const t = tc[side] || {}
      return `<div class="tcol"><div class="hd">${badge(b)}<b class="A">${html(name)}</b></div><div class="fm A">${html(t.formation || '')}</div>${formationSvg(t.formation, b.colour)}
        ${(t.points || []).slice(0, 3).map(x => `<div class="pt"><i></i><div>${html(x)}</div></div>`).join('')}</div>` }
    return `<div class="t1 A">How they play</div><div class="t2">Shape and style</div><div class="cols">${col('home', p.bh, p.home)}${col('away', p.ba, p.away)}</div>`
  }
  if (type === 'pv_expect') return `<div class="t1 A">What to expect</div><div class="t2">The AI Analyst's read</div>
    <div class="card box">${(an.expect || []).map(x => `<div class="pt"><i></i><div>${html(x)}</div></div>`).join('')}</div>
    ${an.verdict ? `<div class="verdict"><span class="chip">${html(an.verdict)}</span></div>` : ''}`
  if (type === 'pv_cta') return `<div class="wrap"><div class="logo"><span class="bars"><i style="height:64px"></i><i style="height:98px"></i><i style="height:132px"></i></span>cmvng</div>
    <div class="big A">${D.cfg.analysis ? 'Follow the<br>AI Analyst' : 'Follow for more<br>match previews'}</div><div class="url">Football, by the numbers</div></div>`
  return ''
}
// a formation as dots on a half pitch: "4-2-3-1" → goalkeeper + rows from defence to attack
function formationSvg(f, colour) {
  const rows = String(f || '').split('-').map(Number).filter(n => n > 0 && n < 7)
  if (!rows.length) return ''
  const W = 400, Hh = 330, all = [1, ...rows], dots = []
  all.forEach((n, r) => { const y = Hh - 28 - r * ((Hh - 56) / (all.length - 1)); for (let i = 0; i < n; i++) dots.push([W * (i + 1) / (n + 1), y]) })
  return `<svg viewBox="0 0 ${W} ${Hh}"><rect x="2" y="2" width="${W - 4}" height="${Hh - 4}" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
    <line x1="2" y1="2" x2="${W - 2}" y2="2" stroke="rgba(255,255,255,.25)" stroke-width="2"/><path d="M${W / 2 - 60} 2 A60 60 0 0 0 ${W / 2 + 60} 2" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
    <rect x="${W / 2 - 90}" y="${Hh - 62}" width="180" height="60" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
    ${dots.map(([x, y]) => `<circle class="dot" cx="${x}" cy="${y}" r="17" fill="${colour || '#3D7BFF'}" stroke="#fff" stroke-width="3"/>`).join('')}</svg>`
}
function isToday(d) { return d === new Date(Date.now() + 3600e3).toISOString().slice(0, 10) }
function dayLong(d) { return d ? new Date(`${d}T12:00:00Z`).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) : '' }
$('#pips').innerHTML = D.picks.map(() => '<i></i>').join('')
if (D.cfg.mode === 'preview') $('#foot').textContent = 'Model estimates, not certainties · cmvng'

// ---------------------------------------------------------------- draw helpers
function rise(nodes, lt, start, step = 0.07, dist = 50, dur = 0.6) {
  nodes.forEach((n, j) => { if (!n) return; const q = P(lt, start + j * step, start + j * step + dur); n.style.opacity = q; n.style.transform = `translate3d(0,${(1 - q) * dist}px,0)` })
}
// slam: big → normal with a little blur, used for numbers and stamps
function slam(n, lt, at, from = 1.7, dur = 0.32, extra = '') {
  if (!n) return; const q = P(lt, at, at + dur, E.outCubic)
  n.style.opacity = P(lt, at, at + 0.08); n.style.transform = `${extra} scale(${from - (from - 1) * q})`; n.style.filter = `blur(${(1 - q) * 10}px)`
}
const shake = (lt, at, amp = 14) => { const d = lt - at; if (d < 0 || d > 0.28) return ''; const a = amp * (1 - d / 0.28); return `translate3d(${a * Math.sin(d * 95)}px,${a * Math.cos(d * 77)}px,0)` }
function count(n, lt, a, b, fmt) { if (!n) return; const v = +n.dataset.n * P(lt, a, b, E.outCubic); n.textContent = fmt(v) }

// ---------------------------------------------------------------- draw each scene
function draw(k, lt, sc) {
  const el = built[k], p = D.picks[sc.i]
  if (sc.type === 'hook') {
    rise([$('.meta', el)], lt, 0.05)
    slam($('.n', el), lt, 0.05, 2.2, 0.36)
    const w1 = $('.w1', el), w2 = $('.w2', el), q1 = P(lt, 0.25, 0.7), q2 = P(lt, 0.4, 0.85)
    w1.style.opacity = q1; w1.style.transform = `translate3d(${(1 - q1) * 300}px,0,0)`
    w2.style.opacity = q2; w2.style.transform = `translate3d(${(1 - q2) * 300}px,0,0)`
    rise([$('.date', el)], lt, 0.6)
    $$('.pair', el).forEach((n, j) => { const at = 0.8 + j * BEAT / 2, q = P(lt, at, at + 0.35, E.outBack); n.style.opacity = P(lt, at, at + 0.12); n.style.transform = `scale(${0.4 + 0.6 * q})` })
    const tz = $('.tease', el), q = P(lt, S(sc, 0)[0] + S(sc, 0)[1] * 0.75, S(sc, 0)[0] + S(sc, 0)[1] * 0.75 + 0.4, E.outBack)
    tz.style.opacity = clamp(q * 3); tz.style.transform = `scale(${0.6 + 0.4 * q})`
    el.style.transform = shake(lt, 0.36, 16)
  } else if (sc.type === 'pick') {
    const [b1] = S(sc, 1), [b2, d2] = S(sc, 2)
    rise([$('.meta', el)], lt, 0.02)
    const mu = $('.mu', el), h = $('.side.h', mu), a = $('.side.a', mu), vs = $('.vs', mu)
    const qi = P(lt, 0.0, 0.55, E.outBack)
    h.style.transform = `translate3d(${(1 - qi) * -520}px,0,0)`; a.style.transform = `translate3d(${(1 - qi) * 520}px,0,0)`
    h.style.opacity = a.style.opacity = P(lt, 0, 0.2)
    slam(vs, lt, 0.32, 2.4, 0.3, 'translateX(-50%)')
    $$('.glowH,.glowA', mu).forEach(g => { g.style.opacity = 0.55 * P(lt, 0.1, 0.8) })
    // the matchup moves up and shrinks when the pick lands
    const up = P(lt, b1 - 0.25, b1 + 0.2, E.inOutCubic)
    mu.style.transform = `translate3d(0,${-70 * up}px,0) scale(${1 - 0.42 * up})`
    $('.meta', el).style.opacity = P(lt, 0.02, 0.6) * (1 - up)
    rise([$('.stat', el)], lt, 0.55)
    $('.stat', el).style.opacity = P(lt, 0.55, 1.0) * (1 - up)
    const pc = $('.pc', el); slam(pc, lt, b1 - 0.1, 1.35, 0.28)
    pc.style.transform += ' ' + shake(lt, b1 + 0.18, 12)
    slam($('.o', pc), lt, b1 + 0.18, 1.8, 0.26)
    rise([$('.probs', el)], lt, b2 - 0.2, 0, 60, 0.45)
    const rows = $$('.row', el)
    rows.forEach((r, j) => {
      const q = P(lt, b2 + 0.1 + j * 0.45, b2 + 0.9 + j * 0.45, E.outCubic)
      $('.tr b', r).style.transform = `scaleX(${q * +$('.v', r).dataset.n / 100})`
      $('.v', r).textContent = Math.round(q * +$('.v', r).dataset.n) + '%'
    })
    const sg = $('.sig', el), lightAt = b2 + Math.max(1.2, d2 * 0.62)
    rise([sg], lt, b2 + 0.5, 0, 60, 0.45)
    $$('.sigbars i', sg).forEach(i => {
      const j = +i.dataset.j, on = j <= p.signal, at = lightAt + (j - 1) * 0.16
      const q = P(lt, at, at + 0.2)
      i.style.background = on && q > 0.5 ? SIGCOL[p.signal] : 'rgba(255,255,255,.14)'
      i.style.boxShadow = on ? `0 0 ${34 * q}px ${SIGCOL[p.signal]}` : 'none'
      i.style.transform = on ? `scaleY(${0.85 + 0.15 * P(lt, at, at + 0.25, E.outBack)})` : ''
    })
    const tb = $('.sig .t b', el); tb.style.opacity = P(lt, lightAt + 0.35, lightAt + 0.6)
  } else if (sc.type === 'slate') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.12, 60)
    rise([$('.tk', el)], lt, 0.2, 0, 80, 0.5)
    $$('.r', el).forEach((r, j) => { const q = P(lt, 0.35 + j * 0.12, 0.85 + j * 0.12); r.style.opacity = q; r.style.transform = `translate3d(${(1 - q) * -140}px,0,0)` })
    $$('.stk', el).forEach((n, j) => count(n, lt, 0.7 + j * 0.12, 1.5 + j * 0.12, v => money(v)))
    rise([$('.tot', el)], lt, 0.9 + N * 0.12)
  } else if (sc.type === 'cta') {
    const lg = $('.logo', el); slam(lg, lt, 0.05, 1.6, 0.4)
    $$('.logo .bars i', el).forEach((b, j) => { b.style.transform = `scaleY(${P(lt, 0.1 + j * 0.08, 0.5 + j * 0.08, E.outBack)})`; b.style.transformOrigin = '50% 100%' })
    slam($('.big', el), lt, 0.35, 1.5, 0.3); el.style.transform = shake(lt, 0.65, 10)
    rise([$('.url', el), $('.dis', el)], lt, 0.7, 0.15)
  } else if (sc.type === 'rhook') {
    rise([$('.meta', el)], lt, 0.05)
    slam($('.score', el), lt, 0.05, 2.2, 0.36); el.style.transform = shake(lt, 0.36, 16)
    slam($('.wonw', el), lt, 0.45, 1.6, 0.3)
    const [m0] = S(sc, 1)
    rise([$('.money', el)], lt, Math.min(1.0, m0 - 0.3), 0, 60)
    const b = $('.money .b', el), v = D.recap.returned * P(lt, m0 + 0.2, m0 + 1.6, E.outCubic); b.textContent = money(v)
    $$('.dot', el).forEach((n, j) => { const at = 0.8 + j * BEAT / 2, q = P(lt, at, at + 0.35, E.outBack); n.style.opacity = P(lt, at, at + 0.12); n.style.transform = `scale(${0.4 + 0.6 * q})` })
  } else if (sc.type === 'result') {
    const [b1] = S(sc, 1)
    rise([$('.meta', el)], lt, 0.02)
    const h = $('.side.h', el), a = $('.side.a', el), qi = P(lt, 0, 0.5, E.outBack)
    h.style.transform = `translate3d(${(1 - qi) * -420}px,0,0)`; a.style.transform = `translate3d(${(1 - qi) * 420}px,0,0)`
    h.style.opacity = a.style.opacity = P(lt, 0, 0.2)
    slam($('.sc', el), lt, 0.3, 2.0, 0.3, 'translateX(-50%)')
    $('.sb', el).style.transform = shake(lt, 0.6, 12)
    rise([$('.pc', el)], lt, 0.55, 0, 80, 0.5)
    const st = $('.stamp', el), q = P(lt, b1 + 0.05, b1 + 0.35, E.outCubic)
    st.style.opacity = P(lt, b1 + 0.05, b1 + 0.12); st.style.transform = `rotate(${-6 - 4 * (1 - q)}deg) scale(${2.2 - 1.2 * q})`
    $('.pc', el).style.transform += ' ' + shake(lt, b1 + 0.35, 10)
    rise([$('.mny', el)], lt, b1 + 0.3, 0, 60, 0.45)
    count($('.mny b', el), lt, b1 + 0.45, b1 + 1.3, v => money(v, true))
  } else if (sc.type.startsWith('pv_')) {
    drawPreview(sc, el, lt)
  } else if (sc.type === 'rtotal') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.12, 60)
    rise([$('.card', el)], lt, 0.25, 0, 80, 0.5)
    rise($$('.ln', el), lt, 0.35, 0.12, 30)
    $$('.ln b', el).forEach((n, j) => count(n, lt, 0.5 + j * 0.25, 1.5 + j * 0.25, v => money(v, j === 2)))
    $$('.strip i', el).forEach((n, j) => { n.style.opacity = P(lt, 1.6 + j * 0.08, 1.9 + j * 0.08) })
  }
}

function drawPreview(sc, el, lt) {
  const [b1] = S(sc, 1)
  if (sc.type === 'pv_hook') {
    rise([$('.meta', el)], lt, 0.02)
    const h = $('.side.h', el), a = $('.side.a', el), qi = P(lt, 0, 0.55, E.outBack)
    h.style.transform = `translate3d(${(1 - qi) * -520}px,0,0)`; a.style.transform = `translate3d(${(1 - qi) * 520}px,0,0)`; h.style.opacity = a.style.opacity = P(lt, 0, 0.2)
    slam($('.vs', el), lt, 0.3, 2.4, 0.3, 'translateX(-50%)')
    const at = Math.min(1.1, b1 - 0.1); slam($('.ttl', el), lt, at, 1.6, 0.34); el.style.transform = shake(lt, at + 0.3, 14)
    rise([$('.sub', el)], lt, at + 0.4)
  } else if (sc.type === 'pv_cta') {
    const lg = $('.logo', el); slam(lg, lt, 0.05, 1.6, 0.4)
    $$('.logo .bars i', el).forEach((b, j) => { b.style.transform = `scaleY(${P(lt, 0.1 + j * 0.08, 0.5 + j * 0.08, E.outBack)})`; b.style.transformOrigin = '50% 100%' })
    slam($('.big', el), lt, 0.35, 1.5, 0.3); el.style.transform = shake(lt, 0.65, 10); rise([$('.url', el)], lt, 0.7)
  } else {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.12, 60)
    rise([$('.card', el)], lt, 0.25, 0, 80, 0.5)
    if (sc.type === 'pv_form') {
      rise($$('.tr', el), lt, 0.4, Math.max(0.3, b1 - 0.6), 30)
      $$('.tr', el).forEach((r, k) => $$('.chips5 i', r).forEach((c, j) => { const at = 0.6 + (k ? Math.max(0.3, b1 - 0.6) : 0) + j * 0.09, q = P(lt, at, at + 0.3, E.outBack); c.style.opacity = P(lt, at, at + 0.08); c.style.transform = `scale(${0.3 + 0.7 * q})` }))
      const hl = $('.hl', el); if (hl) { const q = P(lt, b1 + 0.6, b1 + 1.0, E.outBack); hl.style.opacity = clamp(q * 2); hl.style.transform = `scale(${0.6 + 0.4 * q})` }
    } else if (sc.type === 'pv_stats') {
      rise($$('.row', el), lt, 0.45, 0.25, 30)
      $$('.row', el).forEach((r, j) => $$('.cmp b', r).forEach(b => { b.style.width = `${100 * +b.dataset.w * P(lt, 0.6 + j * 0.25, 1.4 + j * 0.25, E.outCubic)}%` }))
    } else if (sc.type === 'pv_model') {
      $$('.xg b', el).forEach(n => { n.textContent = (+n.dataset.n * P(lt, 0.4, 1.4, E.outCubic) + 1e-9).toFixed(1) })
      $$('.tri i', el).forEach((n, j) => { n.style.transform = `scaleX(${P(lt, b1 + 0.1 + j * 0.25, b1 + 0.7 + j * 0.25, E.outCubic)})` })
      $$('.lab b', el).forEach((n, j) => { n.textContent = Math.round(+n.dataset.n * P(lt, b1 + 0.1 + j * 0.25, b1 + 0.9 + j * 0.25, E.outCubic)) + '%' })
    } else if (sc.type === 'pv_stake' || sc.type === 'pv_expect') {
      rise($$('.tbl tr', el), lt, 0.4, 0.08, 20)
      const pts = $$('.pt', el); pts.forEach((n, j) => rise([n], lt, (sc.lines[Math.min(j, sc.lines.length - 1)] || [0.5])[0] + (j >= sc.lines.length ? 0.6 * (j - sc.lines.length + 1) : 0), 0, 30))
      const v = $('.verdict', el); if (v) { const at = S(sc, sc.lines.length - 1)[0] + 0.4, q = P(lt, at, at + 0.35, E.outBack); v.style.opacity = clamp(q * 2); v.style.transform = `scale(${0.6 + 0.4 * q})` }
    } else if (sc.type === 'pv_players') {
      $$('.pcard', el).forEach((c, j) => { const at = 0.3 + j * Math.max(0.35, (S(sc, 1)[0] - 0.3) / 2) * (j >= 2 ? 1 : 0.5); slam(c, lt, j < 2 ? 0.3 + j * 0.35 : S(sc, 1)[0] - 0.1 + (j - 2) * 0.35, 1.25, 0.3) })
    } else if (sc.type === 'pv_tactics') {
      $$('.tcol', el).forEach((c, j) => { const at = j ? S(sc, 1)[0] - 0.2 : 0.3; rise([c], lt, at, 0, 60, 0.5)
        $$('.dot', c).forEach((d, k) => { d.style.opacity = P(lt, at + 0.3 + k * 0.05, at + 0.45 + k * 0.05) })
        $$('.pt', c).forEach((n, k) => rise([n], lt, at + 0.8 + k * 0.25, 0, 20)) })
    } else if (sc.type === 'pv_score') {
      $$('.tile', el).forEach((t, j) => slam(t, lt, 0.35 + j * 0.3, 1.4, 0.3))
      rise([$('.note', el)], lt, 1.4)
    }
  }
}

// ---------------------------------------------------------------- sound effects in sync with the drawing above
window.fxEvents = function () {
  const ev = [], add = (t, type, gain) => ev.push({ t: +t.toFixed(3), type, ...(gain ? { gain } : {}) })
  D.scenes.forEach((sc, k) => {
    const T = sc.start, p = D.picks[sc.i]
    if (k > 0) add(T, 'whoosh')
    if (sc.type === 'hook' || sc.type === 'rhook') { add(T + 0.25, 'impact'); if (sc.type === 'rhook') add(T + 0.6, 'impact', 0.6) }
    if (sc.type === 'pick') {
      const [b1] = S(sc, 1), [b2, d2] = S(sc, 2)
      add(T + 0.42, 'impact', 0.5)                         // "vs"
      add(T + b1 + 0.2, 'impact')                          // the pick card slams
      const lightAt = b2 + Math.max(1.2, d2 * 0.62)
      for (let j = 1; j <= p.signal; j++) add(T + lightAt + (j - 1) * 0.16, ['tick', 'tick2', 'tick3'][j - 1])
    }
    if (sc.type === 'result') {
      const [b1] = S(sc, 1)
      add(T + 0.5, 'impact', 0.55)                         // the score
      add(T + b1 + 0.22, p.result === 'won' ? 'ding' : p.result === 'lost' ? 'thud' : 'tick')
      if (p.result === 'won') add(T + b1 + 1.2, 'cash', 0.7)
    }
    if (sc.type === 'rtotal') add(T + 2.0 + 0.25, D.recap.profit >= 0 ? 'cash' : 'thud')
    if (sc.type === 'cta' || sc.type === 'pv_cta') add(T + 0.6, 'impact', 0.7)
    if (sc.type === 'pv_hook') { add(T + 0.42, 'impact', 0.5); add(T + Math.min(1.1, S(sc, 1)[0] - 0.1) + 0.3, 'impact') }
    if (sc.type === 'pv_form') for (let j = 0; j < 5; j++) add(T + 0.6 + j * 0.09, j % 2 ? 'tick2' : 'tick', 0.6)
    if (sc.type === 'pv_stats') add(T + 0.3, 'impact', 0.45)
    if (sc.type === 'pv_model') { add(T + 0.3, 'impact', 0.45); add(T + S(sc, 1)[0] + 0.1, 'riser', 0.5); add(T + S(sc, 1)[0] + 0.85, 'impact', 0.6) }
    if (sc.type === 'pv_score') for (let j = 0; j < 3; j++) add(T + 0.6 + j * 0.3, 'impact', 0.45)
    if (sc.type === 'pv_players') { add(T + 0.6, 'impact', 0.45); add(T + S(sc, 1)[0] + 0.2, 'impact', 0.45) }
    if (sc.type === 'pv_tactics') { add(T + 0.6, 'tick'); add(T + S(sc, 1)[0] + 0.1, 'tick2') }
    if (sc.type === 'pv_expect' && D.cfg.analysis?.verdict) add(T + S(sc, sc.lines.length - 1)[0] + 0.5, 'impact', 0.6)
    if (sc.type === 'pv_stake') add(T + 0.4, 'impact', 0.4)
    if (sc.type === 'slate') add(T + 0.25, 'impact', 0.45)
    const nx = D.scenes[k + 1]
    if (nx && (nx.type === 'slate' || nx.type === 'rtotal')) add(nx.start, 'riser', 0.8)
  })
  return ev
}

// ---------------------------------------------------------------- frame
let capShown = -1
const capEl = $('#cap')
let seed = 99; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648
const gc = document.createElement('canvas'); gc.width = gc.height = 256
{ const x = gc.getContext('2d'), d = x.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255 } x.putImageData(d, 0, 0) }
$('#grain').style.backgroundImage = `url(${gc.toDataURL()})`

window.renderAt = function (t) {
  let k = D.scenes.findIndex(s => t >= s.start && t < s.start + s.dur); if (k < 0) k = D.scenes.length - 1
  const sc = D.scenes[k], lt = t - sc.start
  built.forEach((el, j) => { el.style.display = j === k ? 'block' : 'none' })

  // background: current scene's stadium (hook: one stadium per beat), slow push-in, punch-in at the cut
  D.scenes.forEach((s2, j) => s2.bgs.forEach(b => { if (j !== k) b.style.opacity = 0 }))
  const nb = sc.bgs.length, cyc = (sc.type === 'hook' || sc.type === 'rhook') && nb > 1
  const perLine = (sc.type === 'pick' || sc.type === 'result') && nb > 1           // players style: a new photo on each line
  const bi = cyc ? Math.min(nb - 1, Math.floor(lt / BEAT)) % nb : perLine ? Math.min(nb - 1, Math.max(0, sc.lines.filter(l => lt >= l[0] - 0.15).length - 1)) : 0
  sc.bgs.forEach((b, j) => {
    if (j !== bi) { b.style.opacity = 0; return }
    const st = cyc ? bi * BEAT : perLine ? Math.max(0, sc.lines[bi][0] - 0.15) : 0, l2 = lt - st, punch = 1 - P(l2, 0, 0.45, E.outCubic)
    const s = 1.1 + 0.08 * clamp(lt / Math.max(4, sc.dur)) + 0.12 * punch
    b.style.opacity = 1
    b.style.transform = `scale(${s}) translate3d(${(k % 2 ? -1 : 1) * 14 * clamp(lt / sc.dur)}px,${-10 * clamp(lt / sc.dur)}px,0)`
  })
  $('#credit').textContent = sc.credits[cyc || perLine ? bi : 0] || ''
  if (STYLE === 'broadcast') {           // panels slide in at the cut, then the light sweeps across
    const b = sc.bgs[0], q = P(lt, 0, 0.6, E.outCubic)
    $('.ph', b).style.transform = `translate3d(${(1 - q) * -60}px,0,0)`; $('.pa', b).style.transform = `translate3d(${(1 - q) * 60}px,0,0)`
    $$('.wm', b).forEach((w, j) => { w.style.opacity = 0.16 * P(lt, 0.15, 0.8); w.style.marginTop = `${(j ? 1 : -1) * 30 * clamp(lt / sc.dur)}px` })
    $('.sweep', b).style.left = `${-500 + ((lt * 260) % 2200)}px`
  }

  draw(k, lt, sc)
  // keep things alive between reveals: slow drift of the whole layout, and the logo bars pulse on the beat
  $('#scenes').style.transform = `scale(${1 + 0.018 * clamp(lt / sc.dur)})`
  const bp = Math.exp(-((t % BEAT) / BEAT) * 5)
  $$('#hdr .bars i').forEach((b, j) => { b.style.transform = `scaleY(${1 + 0.22 * bp * (j + 1) / 3})`; b.style.transformOrigin = '50% 100%' })

  // header
  if (sc.type.startsWith('pv_')) $('#hlabel').textContent = ({ pv_hook: D.cfg.analysis ? 'AI Analyst' : 'Match preview', pv_stake: 'Context', pv_form: 'Form', pv_players: 'Key players', pv_tactics: 'Tactics', pv_stats: 'The numbers', pv_model: 'Our model', pv_score: 'Likely scores', pv_expect: 'Verdict' })[sc.type] || ''
  else $('#hlabel').textContent = sc.type === 'pick' ? `Pick ${sc.i + 1} / ${N}` : sc.type === 'result' ? `Result ${sc.i + 1} / ${N}` : sc.type === 'slate' ? 'The slate' : sc.type === 'rtotal' ? 'The day' : ''
  $$('#pips i').forEach((b, j) => { b.className = sc.i === undefined ? (['slate', 'rtotal', 'cta'].includes(sc.type) ? 'done' : '') : j < sc.i ? 'done' : j === sc.i ? 'on' : '' })
  $('#pips').style.opacity = (sc.type === 'hook' || sc.type === 'rhook' || sc.type === 'cta' || D.cfg.mode === 'preview') ? 0 : 1
  $('#hdr').style.opacity = sc.type === 'cta' ? 1 - P(lt, 0, 0.3) : 1

  // cut: flash + light streak across, in time with the whoosh
  let fl = 0, sx = -2000
  for (let j = 1; j < D.scenes.length; j++) {
    const d = t - D.scenes[j].start
    if (d > -0.22 && d < 0.3) { fl = Math.max(fl, d < 0 ? 0 : 0.5 * (1 - d / 0.3)); sx = -400 + (d + 0.22) / 0.52 * 1900 }
  }
  $('#flash').style.opacity = fl
  const sk = $('#streak'); sk.style.opacity = sx > -1000 ? 0.55 : 0; sk.style.transform = `translate3d(${sx}px,0,0) rotate(18deg)`

  // captions
  const ci = D.captions.findIndex(c => t >= c.start && t < c.end)
  if (ci !== capShown) {
    capShown = ci
    capEl.innerHTML = ci < 0 ? '' : `<div class="c">${D.captions[ci].words.map(w => `<span class="w">${html(w.w)}</span>`).join(' ')}</div>`
  }
  if (ci >= 0) {
    const c = D.captions[ci], q = P(t, c.start, c.start + 0.16, E.outBack)
    const box = $('.c', capEl); box.style.opacity = clamp(q * 2); box.style.transform = `scale(${0.85 + 0.15 * q})`
    $$('.w', capEl).forEach((s, j) => { const w = c.words[j]; s.className = 'w' + (t >= w.t0 && t < w.t1 ? ' now' : t < w.t0 ? ' next' : '') })
  }
  $('#foot').style.opacity = sc.type === 'cta' || sc.type === 'pv_cta' ? 0 : 1
}

window.ready = (async () => {
  // load every font up front, or text in a font not yet used stays invisible on the first frames
  await Promise.all([...document.fonts].map(f => f.load()))
  await document.fonts.ready
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})))
  // decode the stadium photos too (CSS backgrounds), so no frame shows a half-loaded picture
  const urls = [...new Set(D.picks.map(p => p.stadium && p.stadium.src).filter(Boolean))]
  await Promise.all(urls.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = () => im.decode ? im.decode().then(r, r) : r(); im.src = u })))
  return true
})()
</script>
