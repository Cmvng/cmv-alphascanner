<!doctype html>
<html>
<!-- THE 3D STAGE (explainers on the tactical-board engine, 9 Nov 2026). A round stage with a wall and a door, lacquer
     chess pieces as the characters, and flat props drawn on canvas (cards, pages, a browser window, a proof ticket).
     Everything timed comes from plan.js (window.PLAN) in take seconds; T() maps take time to video time (the pause after
     the cold open included). On top, in HTML: name tags and chips pinned to the 3D scene, panels (panels.js: real
     screens, quotes, stats, big words, the end card), reaction stickers and the caption pill. -->
<head>

</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="wash"></div><div class="flash" id="flash"></div><div id="tags"></div><div id="pins"></div><div id="panels"></div><div id="bug"></div>
  <img class="stk" id="stk"><img class="stk" id="stk2"><div id="cap"><span></span></div></div>
<script src="file:///home/user/cmv-alphascanner/video/assets/three/three.min.js"></script>
<script src="board3d.js"></script>
<script src="stage3d.js"></script>

<script src="draw.js"></script>

<script>

const $ = id => document.getElementById(id)

      m.position.set(P.box.at[0] + ((i * 37) % 7 - 3) * .05, (P.box.h || 3.2) + .06 + i * .075, P.box.at[2] + ((i * 53) % 5 - 2) * .05); m.rotation.y = (P.box.ry || 0) + ((i * 29) % 9 - 4) * .07; m.visible = false; scene.add(m); PILE.push({ m, t: T(t0) }) }) }

    const tag = document.createElement('div'); tag.className = 'tag'; tag.style.background = d.tagc || d.c1; tag.style.borderTopColor = d.tagc || d.c1; tag.textContent = d.name || ''; $('tags').appendChild(tag)

    return { d, c, keys: KT(d.keys), st: KT(d.states || [[0, 0]]), op: KT(d.op || [[0, 1]]), bill: d.bill ? KT(d.bill) : null } })

function placeTags() {

  on.forEach(o => { o.w = o.tag.offsetWidth; o.x = o.sx; o.y = o.sy })
  for (let it = 0; it < 6; it++) for (let i = 0; i < on.length; i++) for (let j = i + 1; j < on.length; j++) {
    const a = on[i], b = on[j], dx = b.x - a.x, need = (a.w + b.w) / 2 + 8
    if (Math.abs(a.y - b.y) < 46 && Math.abs(dx) < need) { const p = (need - Math.abs(dx)) / 2 * (dx >= 0 ? 1 : -1); a.x -= p; b.x += p } }
  for (const o of PCS) {
    if (o.q <= .005) { if (o.tag.style.opacity !== '0') o.tag.style.opacity = '0'; continue }
    o.x = Math.max(o.w / 2 + 12, Math.min(1920 - o.w / 2 - 12, o.x)); const f = B3.cl((o.y - 62) / 30), px = Math.max(-o.w / 2 + 16, Math.min(o.w / 2 - 16, o.sx - o.x))
    o.tag.style.opacity = (o.q * f).toFixed(3); o.tag.style.left = o.x.toFixed(1) + 'px'; o.tag.style.top = o.y.toFixed(1) + 'px'; o.tag.style.setProperty('--px', px.toFixed(1) + 'px') }
}

  cam.position.set(c[1][0] + sh * Math.sin(t * 60), c[1][1] + sh * Math.cos(t * 47), c[1][2]); cam.lookAt(...c[2]); if (cam.fov !== c[3]) { cam.fov = c[3]; cam.updateProjectionMatrix() }
  cam.updateMatrixWorld()
  const POS = {}

    { const K = o.keys; let i = 1; while (i < K.length && t >= K[i][0]) i++
      if (i < K.length && t > K[i - 1][0]) { const a = K[i - 1], b = K[i], dist = Math.hypot(b[1] - a[1], b[2] - a[2]); if (dist > .2) { const u = (t - a[0]) / (b[0] - a[0]), n = Math.max(1, Math.round(dist / 4)); hop = Math.abs(Math.sin(u * Math.PI * n)) * Math.min(.9, .25 + dist * .05) * (o.d.hop != null ? o.d.hop : 1) } } }
    let vq = 1; if (o.d.vis) vq = inWin(o.d.vis, t, .4, .35)
    const pop = o.d.vis ? (vq >= 1 ? 1 : 1 + .12 * Math.sin(Math.PI * B3.cl(vq))) : 1
    o.p.visible = vq > .001; o.p.scale.setScalar(o.sc * B3.eo(vq) * pop)
    const hq = inWin(o.d.hi, t, .25, .3); o.p.userData.ring.material.opacity = .9 * hq; o.p.userData.ring.material.color.set(o.d.ringc || '#7cc8ff')
    o.p.position.set(v[0], .02 + hop, v[1]); o.p.rotation.set(0, o.rot ? S.keys(o.rot, t)[0] : (o.d.ry || 0), 0)

    if (o.names.length) { let nm = o.d.name; o.names.forEach(n => { if (t >= n[0]) nm = n[1] }); if (o.tag.textContent !== nm) o.tag.textContent = nm }
    const top = (o.d.th || 3.3) * o.sc + .9; tmp.set(v[0], top + hop, v[1]); const s = B3.toScreen(tmp); POS['piece:' + o.d.id] = [v[0], top + hop, v[1]]
    o.q = inWin(o.d.lab, t, .25, .25) * vq * (s.vis ? 1 : 0); o.sx = s.x; o.sy = s.y
  }

    let st = o.st[0][1]; for (const s of o.st) if (t >= s[0]) st = s[1]; o.c.userData.setState(st)
    if (o.bill) { const q = S.keys(o.bill, t)[0]; if (q > 0) { q0.copy(o.c.quaternion); mm.lookAt(cam.position, o.c.position, cam.up); q1.setFromRotationMatrix(mm); o.c.quaternion.copy(q0).slerp(q1, q) } }

    const b = o.on ? POS[o.on] : o.at; tmp.set(b[0] + (o.dx || 0), b[1] + (o.dy || 0), b[2] + (o.dz || 0)); const s = B3.toScreen(tmp), k = B3.eo((t - T(o.from) + .22) / .3)
    d.style.cssText = `opacity:${(q * (s.vis ? 1 : 0)).toFixed(3)};left:${(s.x + (o.px || 0)).toFixed(1)}px;top:${(s.y + (o.py || 0)).toFixed(1)}px;transform:translate(-50%,-50%) scale(${(.86 + .14 * k).toFixed(4)})${o.css ? ';' + o.css : ''}` }

const load = src => new Promise(r => { const sc = document.createElement('script'); sc.src = src; sc.onload = sc.onerror = r; document.head.appendChild(sc) })

</script>
