<!doctype html>
<html><head><meta charset="utf-8"><title>Video reactions: covers and thumbnails</title>
<style>
@font-face{font-family:Anton;src:url(../../assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(../../assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(../../assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* the reaction window is the same white frame and blue ring as in the videos, so the cover shows the format */
:root{--sky:#4FB3FF;--blue:#1F5FDB;--navy:#0B1F4D}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:Manrope,sans-serif}
.pg{position:relative;overflow:hidden;display:none}
.royal{background:linear-gradient(180deg,#1A3DB4 0%,#0B2A8C 55%,#081F6E 100%)}
.royal:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(143,208,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(143,208,255,.08) 1px,transparent 1px);background-size:60px 60px}
.sky{background:linear-gradient(180deg,#F4F8FF 0%,#E6F0FF 60%,#DCE9FF 100%)}
.sky:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,95,219,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,95,219,.07) 1px,transparent 1px);background-size:60px 60px}
.abs{position:absolute}
.k{font-family:Mono,monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.t{font-family:Anton,sans-serif;line-height:.92;text-transform:uppercase}
.win{position:absolute;border-radius:46px;background:#fff;padding:12px;box-shadow:0 0 0 7px var(--sky),0 40px 90px rgba(5,20,70,.45)}
.win div{width:100%;height:100%;border-radius:36px;background-size:cover}
.card{position:absolute;border-radius:28px;overflow:hidden;box-shadow:0 34px 80px rgba(5,20,70,.42),0 0 0 2px rgba(255,255,255,.5)}
.card div{position:absolute;inset:0;background-repeat:no-repeat}
</style></head>
<body>
<!-- Held Too Long, cover -->
<div class="pg royal" id="held-v" style="width:1080px;height:1920px">
  <div class="abs k" style="left:84px;top:118px;font-size:32px;color:var(--sky)">Bitcoin · my trade</div>
  <div class="abs t" style="left:78px;top:176px;font-size:236px;color:#fff">Held<br><span style="color:var(--sky)">too long</span></div>
  <div class="card" style="left:70px;top:690px;width:940px;height:520px;transform:rotate(-3deg)"><div style="background-image:url(../../out/vreact-demo/cover/held-candle.jpg);background-size:1180px auto;background-position:-100px -770px"></div></div>
  <div class="win" style="left:150px;top:1010px;width:780px;height:820px;transform:rotate(2.5deg)"><div style="background-image:url(../../out/vreact-demo/cover/itsover.jpg);background-size:864px auto;background-position:-54px -448px"></div></div>
</div>
<!-- Held Too Long, thumbnail -->
<div class="pg royal" id="held-h" style="width:1280px;height:720px">
  <div class="win" style="left:48px;top:44px;width:540px;height:632px;transform:rotate(-2deg)"><div style="background-image:url(../../out/vreact-demo/cover/itsover.jpg);background-size:657px auto;background-position:-70px -340px"></div></div>
  <div class="abs k" style="left:660px;top:70px;font-size:26px;color:var(--sky)">Bitcoin · my trade</div>
  <div class="abs t" style="left:654px;top:116px;font-size:150px;color:#fff">Held<br><span style="color:var(--sky)">too long</span></div>
  <div class="card" style="left:660px;top:432px;width:560px;height:240px;transform:rotate(-2deg)"><div style="background-image:url(../../out/vreact-demo/cover/held-candle.jpg);background-size:740px auto;background-position:-60px -500px"></div></div>
</div>
<!-- Primus, cover -->
<div class="pg sky" id="primus-v" style="width:1080px;height:1920px">
  <div class="card" style="left:60px;top:90px;width:960px;height:900px;transform:perspective(1800px) rotateX(5deg) rotateY(-4deg)"><div style="background-image:url(../../out/vreact-demo/cover/primus-nomad.png);background-size:1040px auto;background-position:-20px -87px"></div></div>
  <div class="win" style="left:150px;top:1010px;width:780px;height:820px;transform:rotate(-2.5deg)"><div style="background-image:url(../../out/vreact-demo/cover/jawdrop.jpg);background-size:796px auto;background-position:-20px -501px"></div></div>
</div>
<!-- Primus, thumbnail -->
<div class="pg sky" id="primus-h" style="width:1280px;height:720px">
  <div class="card" style="left:560px;top:60px;width:680px;height:600px;transform:perspective(1600px) rotateX(4deg) rotateY(-5deg)"><div style="background-image:url(../../out/vreact-demo/cover/primus-nomad.png);background-size:760px auto;background-position:-10px -40px"></div></div>
  <div class="win" style="left:48px;top:44px;width:540px;height:632px;transform:rotate(-2deg)"><div style="background-image:url(../../out/vreact-demo/cover/jawdrop.jpg);background-size:608px auto;background-position:-23px -383px"></div></div>
</div>
<script>
const id = location.hash.slice(1)
document.getElementById(id).style.display = 'block'
window.READY = document.fonts.ready.then(() => new Promise(r => setTimeout(r, 300)))
</script>
</body></html>
