<!doctype html>
<html>
<!-- Bagel, "my top picks for today" (7 Nov 2026), the owner's 4-pick combo and how anyone can build one. Format: THE CHAIN.
     A combo is a chain: every link has to hold. Four team links slam in on the beat and the payout climbs to $31.23; then the
     owner's real Bagel screen (shown whole, a camera moving to what is said) with the chain beside it, each link lighting
     as its pick is explained; the how-to runs on the same real screen. The owner's reaction stickers flow with it
     (video/lib/react_flow.js, PLAYBOOK.md): he peeks from behind his slip, grins at the payout, goes nervous at "all four
     have to win", ducks out for the steps, and comes back on the end card. House voice (Kokoro af_heart + the delivery). -->
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Man;font-weight:600;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-600-normal.woff2)}
@font-face{font-family:Man;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
:root{--navy:#0B1F44;--blue:#1F5FDB;--sky:#4FB3FF;--ink:#0B1F44}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#EAF1FB}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1400px 900px at 50% 38%,#F7FAFE 0%,#E8F0FB 55%,#D6E3F5 100%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(31,95,219,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(31,95,219,.05) 1px,transparent 1px);background-size:60px 60px}
/* the chain: one link per pick */
.link{position:absolute;display:flex;align-items:center;gap:22px;border-radius:24px;background:#fff;padding:0 26px 0 0;overflow:hidden;
  box-shadow:0 0 0 2px rgba(11,31,68,.08),0 18px 40px rgba(11,31,68,.14);opacity:0}
.link .bar{align-self:stretch;width:22px;flex:none}
.link .nm{font:400 54px/1 Anton,sans-serif;color:var(--navy);letter-spacing:.01em;white-space:nowrap}
.link .sub{font:800 26px/1.15 Man,sans-serif;color:rgba(11,31,68,.62);white-space:nowrap}
.link .yes{margin-left:auto;font:800 30px/1 Man,sans-serif;color:#15803D;background:#DCFCE7;padding:10px 16px;border-radius:14px;flex:none}
.link.on{box-shadow:0 0 0 4px var(--blue),0 0 0 10px rgba(31,95,219,.15),0 18px 40px rgba(11,31,68,.18)}
.dot{position:absolute;width:6px;border-left:4px dashed rgba(31,95,219,.45);opacity:0}
/* the combo counter */
#meter{position:absolute;display:flex;align-items:center;justify-content:center;gap:34px;opacity:0}
#meter .x{font:400 92px/1 Anton,sans-serif;color:var(--blue)}
#meter .pay{font:800 52px/1 Man,sans-serif;color:var(--navy);white-space:nowrap}
#meter .pay b{color:var(--blue);font-weight:800}
#meter .lbl{font:800 24px/1 Man,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(11,31,68,.55)}
/* the owner's real screen, under a moving camera */
#card{position:absolute;left:400px;top:52px;width:780px;height:888px;border-radius:30px;background:#fff;overflow:hidden;opacity:0;
  box-shadow:0 0 0 1px rgba(11,31,68,.10),0 30px 70px rgba(11,31,68,.22),0 6px 16px rgba(11,31,68,.10)}
#view{position:absolute;left:14px;top:14px;width:752px;height:860px;border-radius:20px;overflow:hidden;background:#F3F4F6}
#pic{position:absolute;left:0;top:0;transform-origin:0 0}
#pic img{display:block}
.ring{position:absolute;border:5px solid var(--blue);border-radius:18px;box-shadow:0 0 0 6px rgba(31,95,219,.16),0 0 26px rgba(31,95,219,.45);opacity:0}
/* hook: the money */
#hook{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:56px;opacity:0}
#hook .hk{font:400 200px/1 Anton,sans-serif;color:var(--navy);letter-spacing:.01em}
#hook .hk.b{color:var(--blue)}
#hook .arr{font:400 150px/1 Anton,sans-serif;color:rgba(11,31,68,.35)}
/* intro */
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;opacity:0}
#intro img{height:150px}
#intro .chips{display:flex;gap:20px}
#intro .chip{font:800 36px/1 Man,sans-serif;color:var(--navy);background:#fff;padding:18px 28px;border-radius:40px;box-shadow:0 0 0 2px rgba(31,95,219,.35),0 14px 30px rgba(11,31,68,.12)}
/* steps */
.step{position:absolute;left:1230px;width:640px;display:flex;align-items:center;gap:22px;opacity:0}
.step .n{flex:none;width:76px;height:76px;border-radius:50%;background:var(--blue);color:#fff;font:400 46px/76px Anton,sans-serif;text-align:center}
.step .t{font:800 38px/1.18 Man,sans-serif;color:var(--navy)}
.step .t b{color:var(--blue)}
/* the warning + the end */
#warn{position:absolute;left:1230px;top:700px;width:640px;font:800 34px/1.25 Man,sans-serif;color:var(--navy);opacity:0}
#warn b{color:#B91C1C}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;opacity:0}
#end img{height:120px}
#end .h{font:800 64px/1 Man,sans-serif;color:var(--navy)}
#end .l{font:800 44px/1 Man,sans-serif;color:var(--blue);padding:16px 30px;border-radius:40px;box-shadow:0 0 0 3px var(--blue)}
#end .f{font:600 28px/1 Man,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(11,31,68,.62)}
/* stickers */
.stk{position:absolute;left:0;top:0;width:360px;opacity:0;filter:drop-shadow(0 14px 22px rgba(11,31,68,.30))}
/* captions */
#cap{position:absolute;left:110px;width:1700px;top:960px;text-align:center;font:800 46px/1.18 Man,sans-serif;color:var(--navy);z-index:30}
#cap b{color:var(--blue);font-weight:800}
</style>
</head>
<body>
<div id="stage"><div id="grid"></div>
  <div id="hook"><div class="hk" id="ha">$2.84</div><div class="arr" id="harr">→</div><div class="hk b" id="hb">$31.23</div></div>
  <div id="intro"><img src="img/logo-horizontal.svg"><div class="chips"><div class="chip">Runs on Polymarket's markets</div><div class="chip">iOS · Android</div></div></div>
  <img class="stk" id="stk"><div id="card"><div id="view"><div id="pic"><img src="img/slip.jpg" width="968" height="2174"></div></div></div>
  <div id="links"></div><div id="meter"><div><div class="lbl" id="ml">Combo</div><div class="x" id="mx">1 pick</div></div><div class="pay" id="mpay"></div></div>
  <div id="steps"></div><div id="warn"></div>
  <div id="end"><img src="img/logo-horizontal.svg"><div class="h">@bagel_win</div><div class="l">My link is in the post</div><div class="f">18+ · Real money · Not financial advice</div></div>
  <img class="stk" id="stk2">
  <div id="cap"></div></div>
<script src="plan.js"></script>
<script>
// ---- everything timed lives in plan.js (PLAN): take-seconds -> video via T(), words, teams, scenes, camera keys, captions
const P = window.PLAN, T = s => s + P.vo + (s >= P.cut ? P.gap : 0), FPS = 30
const $ = id => document.getElementById(id)
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = x => 1 - Math.pow(1 - cl(x), 3), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const eback = x => { x = cl(x); const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
const lerp = (a, b, u) => a + (b - a) * u
let SIG = []
const css = (el, k, v) => { if (el.style[k] !== v) el.style[k] = v; SIG.push(v) }
// ---- build the links (hook row -> side panel column)
P.teams.forEach((tm, i) => {
  const d = document.createElement('div'); d.className = 'link'; d.innerHTML = `<div class="bar" style="background:${tm.color}"></div><div><div class="nm">${tm.name}</div><div class="sub">${tm.sub}</div></div><div class="yes">Yes</div>`
  $('links').appendChild(d); tm.el = d
})
const ROW = i => ({ x: 140 + (i % 2) * 840, y: 170 + Math.floor(i / 2) * 190, w: 800, h: 160 }), COL = i => ({ x: 1230, y: 92 + i * 132, w: 640, h: 112 })
P.steps.forEach((st, i) => { const d = document.createElement('div'); d.className = 'step'; d.style.top = (110 + i * 140) + 'px'; d.innerHTML = `<div class="n">${i + 1}</div><div class="t">${st[1]}</div>`; $('steps').appendChild(d); st.el = d })
$('warn').innerHTML = P.warnHtml
// rings on the screen, in screenshot pixels
P.rings.forEach(r => { const e = document.createElement('div'); e.className = 'ring'; const b = r.box, p = 8
  Object.assign(e.style, { left: (b[0] - p) + 'px', top: (b[1] - p) + 'px', width: (b[2] + 2 * p) + 'px', height: (b[3] + 2 * p) + 'px' }); $('pic').appendChild(e); r.el = e })
const VW = 752, VH = 860, IW = 968, IH = 2174
function cam(t) {
  const whole = [IW / 2, IH / 2, 1], K = P.cam.map(k => [T(k[0]), k[1] || whole])
  let v = K[0][1]
  for (let j = 1; j < K.length; j++) if (t >= K[j][0]) { const u = eio((t - K[j][0]) / .9); v = K[j - 1][1].map((x, q) => lerp(x, K[j][1][q], u)) }
  const fit = Math.min(VW / IW, VH / IH), sc = fit * v[2], w = IW * sc, h = IH * sc
  let x = VW / 2 - v[0] * sc, y = VH / 2 - v[1] * sc
  x = w <= VW ? (VW - w) / 2 : cl(x, VW - w, 0); y = h <= VH ? (VH - h) / 2 : cl(y, VH - h, 0)
  return `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(5)})`
}
const money = v => '$' + v.toFixed(2)
// ---- the owner as a character (react_flow.js): peeks from behind the left edge of his slip
let RF = null, RF2 = null
function flowInit() {
  const base = { lib: window.RLIB, root: P.sroot, fps: FPS, T, words: (window.WORDS || []).map(w => ({ s: w[0], e: w[1], w: w[2] })) }
  RF = ReactFlow.create({ ...base, ...P.flow, img: $('stk') })
  RF2 = ReactFlow.create({ ...base, ...P.flowEnd, img: $('stk2') })
}
window.render = async t => {
  SIG = []
  const S = P.scenes, on = (a, b) => t >= T(a) - .3 && t < T(b) + .3, fade = (a, b) => on(a, b) ? Math.min(cl((t - T(a) + .3) / .35), cl((T(b) + .3 - t) / .35)) : 0
  // hook: $2.84 -> $31.23 (the payout counts up as it is said)
  css($('hook'), 'opacity', fade(S.hook[0], S.hook[1]).toFixed(3))
  { const a = T(P.hookA), b0 = T(P.hookB[0]), b1 = T(P.hookB[1]), pa = eo((t - a) / .3), pb = cl((t - b0) / (b1 - b0))
    css($('ha'), 'transform', `scale(${(.7 + .3 * eback(cl((t - a) / .35))).toFixed(4)})`); css($('ha'), 'opacity', (t >= a ? pa : 0).toFixed(3))
    css($('harr'), 'opacity', (t >= b0 - .25 ? eo((t - b0 + .25) / .3) : 0).toFixed(3)); css($('hb'), 'opacity', (t >= b0 ? eo((t - b0) / .2) : 0).toFixed(3))
    const v = money(P.cost + (P.pay - P.cost) * eio(pb)); if ($('hb').textContent !== v) $('hb').textContent = v; SIG.push(v)
    css($('hb'), 'transform', `scale(${(1 + .08 * Math.sin(Math.PI * cl((t - b1) / .3))).toFixed(4)})`) }
  // intro
  css($('intro'), 'opacity', fade(S.intro[0], S.intro[1]).toFixed(3))
  css($('intro'), 'transform', `scale(${(1 + .03 * cl((t - T(S.intro[0])) / (T(S.intro[1]) - T(S.intro[0])))).toFixed(4)})`)
  // the card (the owner's screen)
  const cardIn = cl((t - T(S.slip[0])) / .55), cardOut = S.slip[1] < 900 ? cl((t - T(S.slip[1])) / .45) : 0
  css($('card'), 'opacity', (t >= T(S.slip[0]) ? Math.min(1, cardIn * 2) * (1 - cardOut) : 0).toFixed(3))
  css($('card'), 'transform', `translateX(${(-260 * (1 - eo(cardIn)) - 200 * eio(cardOut)).toFixed(1)}px) rotate(${(-2 * (1 - eo(cardIn))).toFixed(2)}deg)`)
  css($('pic'), 'transform', cam(t))
  P.rings.forEach(r => { const a = T(r.t[0]), b = T(r.t[1]), q = t >= a && t < b ? Math.min(eo((t - a) / .25), cl((b - t) / .2)) : 0
    css(r.el, 'opacity', q.toFixed(3)); css(r.el, 'transform', `scale(${(1 + .15 * (1 - eo((t - a) / .3))).toFixed(3)})`) })
  // the links: slam in on the hook beats (row), then move to the side panel; the one being explained lights up
  const toCol = eio((t - T(S.slip[0])) / .8), linksOut = cl((t - T(S.steps[0])) / .4)
  P.teams.forEach((tm, i) => {
    const a = T(tm.slam), p = cl((t - a) / .35), r = ROW(i), c = COL(i)
    const x = lerp(r.x, c.x, toCol), y = lerp(r.y, c.y, toCol), w = lerp(r.w, c.w, toCol), h = lerp(r.h, c.h, toCol)
    const s = t >= a ? eback(p) : 0, op = (t >= a ? Math.min(1, p * 3) : 0) * (1 - linksOut)
    Object.assign(tm.el.style, { left: x.toFixed(1) + 'px', top: y.toFixed(1) + 'px', width: w.toFixed(1) + 'px', height: h.toFixed(1) + 'px' })
    css(tm.el, 'opacity', op.toFixed(3)); css(tm.el, 'transform', `translateY(${(-40 * (1 - eo(p))).toFixed(1)}px) scale(${(.6 + .4 * s).toFixed(4)})`)
    const lit = (tm.lit || []).some(w => t >= T(w[0]) && t < T(w[1])); tm.el.classList.toggle('on', !!lit); SIG.push(lit ? 1 : 0)
    tm.el.querySelector('.nm').style.fontSize = lerp(54, 46, toCol).toFixed(1) + 'px'
  })
  // the combo meter: climbs with each link; hook centre -> panel bottom
  const n = P.teams.reduce((k, tm) => t >= T(tm.slam) ? k + 1 : k, 0), rv = t >= T(P.revealT)
  const mIn = cl((t - T(P.teams[0].slam)) / .35), mOut = cl((t - T(S.steps[0])) / .4)
  css($('meter'), 'opacity', (mIn * (1 - mOut)).toFixed(3))
  const mxc = lerp(960, 1550, toCol), myc = lerp(610, 690, toCol), msc = lerp(1, .78, toCol)
  css($('meter'), 'left', (mxc - 700).toFixed(1) + 'px'); css($('meter'), 'top', myc.toFixed(1) + 'px'); css($('meter'), 'width', '1400px')
  css($('meter'), 'transform', `scale(${msc.toFixed(4)})`)
  const mt = rv ? P.x : `${Math.max(n, 1)} pick${n > 1 ? 's' : ''}`; if ($('mx').textContent !== mt) $('mx').textContent = mt; SIG.push(mt)
  const pt = rv ? `<span class="lbl">Max payout</span><br>${money(P.cost)} → <b>${money(P.pay)}</b>` : `<span class="lbl">Cost</span><br>${money(P.cost)}`
  if ($('mpay').innerHTML !== pt) $('mpay').innerHTML = pt; SIG.push(pt)
  css($('mx'), 'transform', `scale(${(1 + .12 * Math.sin(Math.PI * cl((t - T(P.revealT)) / .3)) * (rv ? 1 : 0)).toFixed(4)})`)
  // steps + warning (the how-to runs on the same real screen)
  P.steps.forEach(st => { const a = T(st[0]), p = eo((t - a) / .3), out = cl((t - T(S.steps[1])) / .4)
    css(st.el, 'opacity', (t >= a ? p * (1 - out) : 0).toFixed(3)); css(st.el, 'transform', `translateX(${(40 * (1 - p)).toFixed(1)}px)`) })
  { const a = T(P.warnT), p = eo((t - a) / .35), out = cl((t - T(S.end[0])) / .4); css($('warn'), 'opacity', (t >= a ? p * (1 - out) : 0).toFixed(3)) }
  // end card
  const ep = eo((t - T(S.end[0])) / .5); css($('end'), 'opacity', (t >= T(S.end[0]) ? ep : 0).toFixed(3)); css($('end'), 'transform', `translateY(${(24 * (1 - ep)).toFixed(1)}px)`)
  if (RF) { SIG.push(await RF.render(t)); SIG.push(await RF2.render(t)) }
  // captions
  const c = P.caps.find(x => t >= T(x[0]) - .05 && t < T(x[1]) + .1), html = c ? c[2] : ''
  if ($('cap').innerHTML !== html) $('cap').innerHTML = html
  SIG.push(html); css($('cap'), 'opacity', c && t < T(S.end[0]) + .4 ? Math.min(1, (t - T(c[0]) + .05) / .12).toFixed(3) : '0')
  return SIG.join('|')
}
const load = src => new Promise(r => { const sc = document.createElement('script'); sc.src = src; sc.onload = sc.onerror = r; document.head.appendChild(sc) })
window.READY = Promise.all([Promise.all([load(P.sroot + 'lib.js'), load('file:///home/user/cmv-alphascanner/video/lib/react_flow.js'), load('words.js')]).then(flowInit),
  document.fonts.load('80px Anton'), document.fonts.load('800 40px Man'), document.fonts.load('600 26px Man'),
  ...[...document.images].map(i => i.decode ? i.decode().catch(() => 0) : 1)])
</script>
</body>
</html>
