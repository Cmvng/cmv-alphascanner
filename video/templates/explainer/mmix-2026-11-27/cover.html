<!doctype html>
<html><head><meta charset="utf-8"><title>MMIX: cover (#v, 1080x1920; its middle square is the picture for X) and wide thumbnail (#t, 1280x720, YouTube)</title>
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Man;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* The video's own idea: the open chain (unknown tiles and a RUG) against the vetted one (every tile checked). MMIX set
   in type (its terms reserve the logo); light blue house look; MMIX keeps its burgundy, gold and cream. */
:root{--ink:#0B1F4D;--blue:#1F5FDB;--mute:#5A6B8C;--mx:#7A1220;--gold:#C9A05A;--cream:#F4EDE2;--red:#E5484D;--green:#12A150}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:Man,sans-serif;font-weight:800;color:var(--ink);background:#EEF4FF}
.abs{position:absolute}
.bg{position:absolute;inset:0;background:radial-gradient(1200px 1200px at 50% 40%,#FFFFFF 0%,#EEF4FF 45%,#CFE0FA 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(31,95,219,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(31,95,219,.06) 2px,transparent 2px);background-size:72px 72px}
.h{font-family:Anton,sans-serif;font-weight:400;line-height:1;white-space:nowrap}
.c{position:absolute;left:0;width:100%;text-align:center;white-space:nowrap}
.pill{display:inline-block;padding:12px 30px;border-radius:999px;background:var(--mx);color:#F3DDB0;font-family:Mono,monospace;font-weight:700;letter-spacing:.12em}
.tile{display:inline-flex;position:relative;vertical-align:top;flex-direction:column;align-items:center;justify-content:center;margin:0 9px;border-radius:24px;background:#E7EBF3;box-shadow:0 12px 26px rgba(11,31,77,.14)}
.tile b{font-family:Mono,monospace;font-weight:700;color:#59657E}
.tile.rug{background:#FBE9EA}.tile.rug b{font-family:Anton,sans-serif;font-weight:400;color:var(--red);letter-spacing:.06em}
.tile.v{background:var(--cream);border:4px solid var(--mx)}
.tile .ok{position:absolute;right:-12px;top:-14px;width:46px;height:46px;border-radius:23px;background:var(--green);color:#fff;font-size:28px;line-height:46px;text-align:center}
.tile .no{position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%)}
</style></head>
<body>
