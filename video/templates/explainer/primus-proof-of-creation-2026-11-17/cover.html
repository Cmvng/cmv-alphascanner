<!doctype html>
<html><head><meta charset="utf-8"><title>Primus Proof of Creation: cover (#v, 1080x1920; its middle square is the picture for X) and wide thumbnail (#t, 1280x720, YouTube)</title>
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Man;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* The owner's cartoon (their Key Point pose, as they made it) beside the title, the three task icons Primus itself uses
   above. Light blue house look; Primus keeps its orange. */
:root{--ink:#0B1F4D;--blue:#1F5FDB;--mute:#5A6B8C;--org:#FF5A0A}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:Man,sans-serif;font-weight:800;color:var(--ink);background:#EEF4FF}
.abs{position:absolute}
.bg{position:absolute;inset:0;background:radial-gradient(1200px 1200px at 35% 40%,#FFFFFF 0%,#EEF4FF 45%,#CFE0FA 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(31,95,219,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(31,95,219,.06) 2px,transparent 2px);background-size:72px 72px}
.mono{font-family:Mono,monospace;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.h{font-family:Anton,sans-serif;font-weight:400;line-height:.98;white-space:nowrap}
.ic{position:absolute;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 18px 44px rgba(11,31,77,.22),0 0 0 6px #fff}
.ic img{width:100%;height:100%;display:block}
.c{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
</style></head>
<body>

</div>
