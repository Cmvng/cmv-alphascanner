  // moves take 0.9 s from each key's time
  for (let j = 1; j < K.length; j++) { if (t >= K[j][0]) { const u = eio((t - K[j][0]) / .9); c = K[j - 1][1].map((v, q) => lerp(v, K[j][1][q], u)) } }

  return `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(4)})`
}
