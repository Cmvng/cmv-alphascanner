<!doctype html>
<html><head><meta charset="utf-8"><title>Bagel combo: cover and thumbnail</title>
<style>
@font-face{font-family:Anton;src:url(../../../assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(../../../assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(../../../assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* the owner's real Bagel slip (yesterday's 7-pick combo, one pick to win) and their Jaw Drop reaction as a sticker, as in the
   video. Pictures: video/out/bagel-2026-10-29/cover/ (frames of the recording and the clip) */
:root{--sky:#4FB3FF;--blue:#1F5FDB;--navy:#0B1F4D}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:Manrope,sans-serif}
.pg{position:relative;overflow:hidden;display:none;background:linear-gradient(180deg,#F4F8FF 0%,#E6F0FF 60%,#DCE9FF 100%)}
.pg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,95,219,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,95,219,.07) 1px,transparent 1px);background-size:60px 60px}
.abs{position:absolute}
.k{font-family:Mono,monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.t{font-family:Anton,sans-serif;line-height:.92;text-transform:uppercase;color:var(--navy)}
.t span{color:var(--blue)}
.card{position:absolute;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 34px 80px rgba(18,40,96,.34),0 0 0 1.5px rgba(0,0,0,.05)}
.card div{position:absolute;inset:0;background-repeat:no-repeat}
.ring{position:absolute;inset:auto;border:6px solid var(--blue);border-radius:16px;box-shadow:0 0 22px rgba(79,179,255,.9)}
.win{position:absolute;border-radius:46px;background:#fff;padding:12px;box-shadow:0 0 0 7px var(--sky),0 40px 90px rgba(5,20,70,.45)}
.win div{width:100%;height:100%;border-radius:36px;background-size:cover}
.stk{position:absolute;filter:drop-shadow(0 18px 30px rgba(10,30,80,.35)) drop-shadow(0 3px 6px rgba(10,30,80,.2))}
.chip{position:absolute;display:inline-flex;align-items:center;gap:16px;background:#fff;border-radius:40px;padding:12px 30px 12px 14px;font-weight:800;color:var(--navy);box-shadow:0 14px 36px rgba(10,30,80,.18)}
.chip img{border-radius:14px}
</style></head>
<body>
<!-- cover 1080x1920 -->
<div class="pg" id="v" style="width:1080px;height:1920px">
  <div class="chip" style="left:72px;top:96px;font-size:44px"><img src="../../../out/brand/bagel/favicon.svg" style="width:64px;height:64px">Bagel</div>
  <div class="abs t" style="left:70px;top:210px;font-size:168px">One pick<br><span>to win</span></div>
  <!-- the Bagel phone only (x 62-530 of the recording), rows Liverpool to Kalmar; the ring on Kalmar v GAIS, the pick still to win -->
  <div class="card" style="left:60px;top:562px;width:960px;height:560px;transform:rotate(-2deg)">
    <div style="background-image:url(../../../out/bagel-2026-10-29/cover/slip7.jpg);background-size:2215px auto;background-position:-127px -964px"></div>
    <div class="ring" style="left:6px;top:414px;width:830px;height:134px"></div>
  </div>
  <img class="stk" src="../../../out/reactions/jawdrop/f_0060.png" style="left:260px;top:1165px;width:560px;transform:rotate(3deg)">
</div>
<!-- thumbnail 1280x720 -->
<div class="pg" id="h" style="width:1280px;height:720px">
  <img class="stk" src="../../../out/reactions/jawdrop/f_0060.png" style="left:70px;top:50px;width:480px;transform:rotate(-3deg)">
  <div class="chip" style="left:620px;top:52px;font-size:34px"><img src="../../../out/brand/bagel/favicon.svg" style="width:52px;height:52px">Bagel</div>
  <div class="abs t" style="left:618px;top:150px;font-size:118px">One pick<br><span>to win</span></div>
  <div class="card" style="left:620px;top:432px;width:620px;height:240px;transform:rotate(-2deg)">
    <div style="background-image:url(../../../out/bagel-2026-10-29/cover/slip7.jpg);background-size:1431px auto;background-position:-82px -816px"></div>
    <div class="ring" style="left:4px;top:74px;width:538px;height:92px"></div>
  </div>
</div>
<script>
document.getElementById(location.hash.slice(1) || 'v').style.display = 'block'
window.READY = document.fonts.ready.then(() => Promise.all(['400 100px Anton', '800 40px Manrope', '700 20px Mono'].map(f => document.fonts.load(f)))).then(() => new Promise(r => setTimeout(r, 300)))
</script>
</body></html>
