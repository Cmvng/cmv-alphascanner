const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, ei = x => x * x * x

  if (b) { const bw = b.split(' '), n = bw.length, i0 = c.toks.findIndex((k, i) => bw.every((w, j) => c.toks[i + j] && clean(c.toks[i + j].w) === clean(w)))

  for (const g of groups) {
    const out = []; let cur = []
    const flush = () => { if (cur.length) out.push(cur); cur = [] }
    for (const k of g) {
      if (cur.length && (cur.length >= 3 || len(cur) + 1 + k.w.length > 17)) flush()
      cur.push(k); if (/[.,?!:…]$/.test(k.w) && cur.length >= 2) flush()
    }

    c.chunks.push(...out)
  }
}

}
