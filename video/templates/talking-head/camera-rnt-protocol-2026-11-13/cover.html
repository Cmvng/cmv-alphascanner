<!doctype html>
<html><head><meta charset="utf-8"><title>RNT Protocol explained: cover (#v, 1080x1920; its middle square is the picture for X) and wide thumbnail (#t, 1280x720, YouTube)</title>
<style>

/* img/still.png is one frame of the owner's recording, untouched (1080x1920). Nothing is on the face. The numbers come from data.js (fetch_data.py): the same ones the video shows. The logos are the tokens' own. */
:root{--ink:#0B1F4D;--blue:#1F5FDB;--red:#E5484D}

.abs{position:absolute}

.card{position:absolute;border-radius:40px;background:rgba(255,255,255,.96);box-shadow:0 34px 80px rgba(10,24,64,.34),0 0 0 1.5px rgba(11,31,77,.06)}
.h{font-family:Anton,sans-serif;font-weight:400;line-height:.98;text-transform:uppercase;white-space:nowrap}
.chips{display:flex;gap:12px}
.chips div{height:60px;padding:0 22px;border-radius:30px;font-size:29px;line-height:58px;background:#fff;border:2px solid #F3C9CB;color:var(--red);white-space:nowrap}
.logos{position:absolute;display:flex;gap:14px;height:108px;padding:12px 16px;border-radius:54px;background:#fff;box-shadow:0 16px 36px rgba(10,24,64,.28)}
.logos img{width:84px;height:84px;border-radius:42px;display:block}
.chipv{height:56px;padding:0 20px;border-radius:28px;font-size:27px;line-height:54px;background:#fff;border:2px solid #F3C9CB;color:var(--red);white-space:nowrap;align-self:flex-start}
</style></head>
<body>

       middle band (y 656 to 1263): the words on the left, the face on the right. This recording frames the owner low,
       so their untouched frame is drawn at 0.7 of its size and lifted until the face is in the band. -->
  <div class="abs" style="left:364px;top:0;width:716px;height:1920px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 190px);mask-image:linear-gradient(90deg,transparent 0,#000 190px)"><img src="img/still.png" style="position:absolute;left:-40px;top:96px;width:756px;height:1344px"></div>

</div>
<div id="t" style="display:none;position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:linear-gradient(100deg,#DDE7F5 0%,#C2D0E6 46%,#A3B5D3 100%)">
  <div class="abs" style="right:0;top:0;width:640px;height:720px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 20%);mask-image:linear-gradient(90deg,transparent 5%,#000 20%)"><img src="img/still.png" style="position:absolute;left:0;top:-470px;width:640px"></div>

</div>
<script src="data.js"></script>
<script>
const D = window.DATA, m = location.hash.includes('t') ? 't' : 'v', $ = id => document.getElementById(id)
const c0 = 'Borrow up to 75% against a property token', c1 = 'Lenders earn ' + D.supply_apy + '% today (USDT)'
$('c0').textContent = $('d0').textContent = c0; $('c1').textContent = $('d1').textContent = c1
for (const id of ['c0', 'd0']) $(id).style.cssText += ';border-color:#BFD2FF;color:#004dff'
for (const id of ['c1', 'd1']) $(id).style.cssText += ';border-color:#BDEBC9;color:#12A150'
$(m).style.display = 'block'
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => 0))]).then(() => document.fonts.load('116px Anton')).then(() => document.fonts.load('800 30px Manrope')).then(() => document.fonts.load('700 24px Mono'))
</script>
</body></html>
