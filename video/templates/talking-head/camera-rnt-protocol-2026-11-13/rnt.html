/* The owner explains RNT Protocol ("the DeFi of rentals") with Mr A and Mr B, on their untouched picture and sound.
   The owner: "I want to create a video explaining that project Rnt protocol... Do an extensive research and make sure
   the video is 10/10". Their example is illustrated step by step, in the order they tell it.
   Moves, and the sample each comes from (video/templates/STYLE-LIBRARY.md):
     - the name as giant type BEHIND the head with the logo and a date pill (S1, S3 brand cold open);
     - the cast as chips that arrive on "a practical use case" (S1 glass chips that build with the voice);
     - the project's own pages, whole, each with its source and date; boxes ringed on the words (S3 a real page);
     - the loan as a meter that fills to 75%, creeps with interest, turns red at 80% and the token slides off to the
       open market with a 10% bite (S1 objects acting the words, S4 a giant number);
     - the money as a flow: Mr B to the pool, the pool to Mr A, dots running on the words (S1);
     - a count-up of what $10,000 earns in a year at today's rate (S4 a giant number);
     - word-by-word captions with big key phrases, the follow click (S2).
   This recording frames the owner low: the top of the head sits about y 880, so every card lives in the ceiling
   above it (y 40 to 840) and the captions sit on the chest (y 1700). Two layers: #bk is drawn behind the owner (the
   renderer hides it wherever the owner's outline is); everything else is in front, clear of the head.
   Numbers: data.js (the RNT Lend API, fetched on the day) or the real screens (capture.mjs). Logos: RNT's own.
   Icons: Microsoft's Fluent Emoji 3D (MIT licence). */

<script>
const P = window.PLAN, D = window.DATA, $ = id => document.getElementById(id)
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, d) => cl((t - a) / d)
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
let SIG = []
const st = (el, o) => { for (const k in o) { const v = typeof o[k] === 'number' ? +o[k].toFixed(3) : o[k]; el.style[k] = v; SIG.push(v) } }

const LAYER = ['behind', 'front'].find(h => location.hash.includes(h)) || 'all'      // the renderer draws each layer on its own
document.body.classList.add('L-' + LAYER)
const I = n => `img/e/${n}.png`
const wt = i => P.wt[i], we = i => P.we[i]                                             // a spoken word's start and end in the finished video
// ---- every caption word's time in the finished video comes from tokens.py (tok.js)
const CAPS = P.caps.map((c, ci) => {
  const toks = []; let em = false
  for (const raw of c.t.split(' ')) {
    let w = raw; const open = w.startsWith('*'); if (open) { em = true; w = w.slice(1) }
    const close = w.replace(/[.,?!:]+$/, '').endsWith('*'); const k = em; if (close) { em = false; w = w.replace('*', '') }
    toks.push({ w, k })
  }
  toks.forEach((k, i) => k.t = window.TOK[ci][i])
  return { ...c, ci, toks }
})
// key phrases that go big: caption index -> the phrase (the owner's words)
const BIG = { 9: 'DeFi of rentals.', 18: '75%.', 23: '80%,', 27: '10% fine', 37: 'supplier', 42: '10.5% APY.', 48: 'DeFi of rental properties.' }
const len = a => a.reduce((n, x) => n + x.w.length + 1, -1)
for (const c of CAPS) {
  const b = BIG[c.ci]; c.small = c.toks; c.chunks = []; let groups = [c.toks]
  if (b) { const bw = b.split(' '), n = bw.length, i0 = c.toks.findIndex((k, i) => bw.every((w, j) => c.toks[i + j] && c.toks[i + j].w.replace(/[.,?!:]+$/, '') === w.replace(/[.,?!:]+$/, '')))
    if (i0 >= 0) { c.big = { text: b, t: c.toks[i0].t }; groups = [c.toks.slice(0, i0), c.toks.slice(i0 + n)]; c.small = groups.flat() } else console.log('BIG PHRASE NOT FOUND', c.ci, b) }
  for (const g of groups) {
    const out = []; let cur = []
    const flush = () => { if (cur.length) out.push(cur); cur = [] }
    for (const k of g) {                                   // up to three words and about 17 letters a line; break after punctuation
      if (cur.length && (cur.length >= 3 || len(cur) + 1 + k.w.length > 17)) flush()
      cur.push(k); if (/[.,?!:]$/.test(k.w) && cur.length >= 2) flush()
    }
    flush()
    const n = out.length
    if (n > 1 && out[n - 1].length === 1 && len(out[n - 2]) + 1 + out[n - 1][0].w.length <= 19 && !/[.,?!:]$/.test(out[n - 2][out[n - 2].length - 1].w)) out.splice(n - 2, 2, [...out[n - 2], ...out[n - 1]])
    c.chunks.push(...out)
  }
}
let CHUNKS = []
CAPS.forEach(c => c.chunks.forEach((ch, i) => CHUNKS.push({ c, ch, t0: i === 0 ? Math.min(ch[0].t, c.o0) : ch[0].t - .04 })))
CHUNKS.forEach((x, i) => { const nx = CHUNKS[i + 1]; x.t1 = Math.min(nx ? nx.t0 : 1e9, (x.c.chunks[x.c.chunks.length - 1] === x.ch ? x.c.o1 + .3 : 1e9)) })
const capHtml = ch => ch.map(k => `<span${k.k ? ' class="k"' : ''}>${k.w}</span>`).join('')

// ---- things over and beside the head (in front), and behind it (bk)
const TOP = $('top'), ITEMS = []
function item(a, b, html, o = {}) {
  const el = document.createElement('div'); el.className = 'it'; el.style.top = (o.y ?? 150) + 'px'; el.innerHTML = html; (o.bk ? $('bk') : TOP).appendChild(el)
  if (o.x != null) { el.style.width = 'auto'; el.style.left = o.x + 'px' }
  if (o.r != null) { el.style.width = 'auto'; el.style.left = 'auto'; el.style.right = o.r + 'px' }
  const it = { a, b, el, bk: !!o.bk, rot: o.rot || 0 }; ITEMS.push(it); return it
}
const ic = (n, o = {}) => `<div class="ic${o.s ? ' s' : ''}"><img src="${I(n)}"></div>`
const lb = s => `<div class="lb">${s}</div>`
const one = (n, label, o) => `<div class="icw">${ic(n, o)}</div>${lb(label)}`
const pop = (el, t, at, d = .3) => st(el, { opacity: seg(t, at, .1), transform: `scale(${(.6 + .4 * back(seg(t, at, d))).toFixed(4)})` })
const rise = (el, t, at) => st(el, { opacity: seg(t, at, .18), transform: `translateY(${((1 - eo(seg(t, at, .3))) * 22).toFixed(1)}px)` })

// ---- this video's numbers: the RNT Lend app and its public API, 13 Nov 2026 (data.js; sources.md)
const R = D, SH = n => `img/shot/${n}.png`

item(0, S1, `<div class="bt" style="font-size:330px">RNT</div><div class="bt" style="font-size:150px;margin-top:2px"><b>PROTOCOL</b></div>`, { y: 470, bk: 1 })
item(0, S1, `<div class="pill" style="height:104px;padding:0 16px 0 30px;background:#0B1F4D"><img src="img/logo/rnt.svg" style="height:58px"><span style="background:#004dff">explained · 13 Nov 2026</span></div>`, { y: 70 })
item(wt(26) - .1, S1, `<div class="chips" style="gap:22px"><div class="chip who2" id="ca"><img src="${I('man_office_worker_3d_default')}">Mr A <i>borrows</i></div><div class="chip who2" id="cb"><img src="${I('man_technologist_3d_default')}">Mr B <i>lends</i></div></div>`, { y: 250 })

// 2. "the DeFi of rentals": RNT's own homepage, whole

item(wt(75) - .2, S2, SHOT(SH('site-home'), 960, 'rnt.finance · 13 Nov 2026'), { y: 60 })

item(wt(96) - .2, S3, `<div class="row2">${MR(0, 'Mr A', 'owns a rental property token', 'man_office_worker_3d_default')}<div class="tokw" id="tk3">${COIN('c3', '$10,000')}<div class="tl3" id="tl3">rental property token</div></div></div>`, { y: 70 })
item(wt(110) - .2, S3, SHOT(SH('lend-cme1-head'), 760, 'a real one: RNT Lend · 13 Nov 2026'), { y: 412 })
item(wt(127) - .1, S3, `<div class="chip" style="height:80px;line-height:78px;font-size:34px"><img src="${I('money_bag_3d')}" style="width:54px;height:54px;vertical-align:-14px;margin-right:12px">he needs cash: a <b style="color:var(--blue)">loan</b></div>`, { y: 760 })

// 4-6. the loan meter: up to 75%; interest every day; at 80% the token is sold, with a 10% penalty
const S6 = wt(229) - .5, LA = wt(144) - .33
item(LA, S6, `<div class="card" style="padding:24px 36px 26px"><div class="h" style="display:flex;justify-content:space-between"><span>Mr A's loan</span><span id="dd" style="color:var(--mute)">against his $10,000 token</span></div>
  <div class="mt"><div class="mtr"><i id="mf"></i></div><div class="end">$10,000<u>his token</u></div><div class="mk" id="m75" style="left:${.75 * 860}px"><b>75%</b><u>max loan</u></div><div class="mk red" id="m80" style="left:${.80 * 860}px"><b>80%</b><u>sold</u></div>
    <div class="ml" id="mv">$7,500</div></div>
  <div class="ir" id="ir"><img src="${I('hourglass_not_done_3d')}"><span>+ interest every day: <b>≈ $${R.per_day_7500.toFixed(2)} a day</b> at today's ${R.borrow_apy}%</span></div>
  <div class="sold" id="sd"><div class="tokw" id="tk6">${COIN('c6', '$10,000', .8)}</div><div class="ar2" id="a6">→</div><div class="mkt" id="mk6"><img src="${I('classical_building_3d')}"><b>open market</b></div><div class="pen" id="pn">−10% penalty</div></div>
  <div class="src">RNT Lend: max LTV 75% · liquidation 80% · penalty 10% · 13 Nov 2026</div></div>`, { y: 50 })
const SIREN = item(wt(204) - .1, wt(208) + .6, `<img src="${I('police_car_light_3d')}" style="width:130px;height:130px;filter:drop-shadow(0 10px 18px rgba(4,10,36,.4))">`, { x: 860, y: 600 })

// 7. the same three numbers on the real app
const S7 = wt(256) - .5, BX = [[211, 393], [405, 588], [600, 782]], K7 = 940 / 808
item(wt(229) - .33, S7, SHOT(SH('lend-cme1'), 940, 'RNT Lend · a property token\'s own page · 13 Nov 2026',
  BX.map(([a, b], i) => `<div class="hl" id="h7${i}" style="left:${(a * K7 - 6).toFixed(0)}px;top:${(239 * K7 - 6).toFixed(0)}px;width:${((b - a) * K7 + 12).toFixed(0)}px;height:${(57 * K7 + 12).toFixed(0)}px"></div>`).join('')), { y: 110 })

// 8. Mr B, the pool, and the loan back to Mr A
const S8 = wt(319) - .5
item(wt(256) - .33, S8, `<div class="flow"><div class="nd" id="nA"><img src="${I('man_office_worker_3d_default')}"><b>Mr A</b><u>borrows</u><div class="lk" id="lk"><img src="${I('locked_3d')}"></div></div>
  <div class="nd pool" id="nP"><img src="${I('water_wave_3d')}"><b>the pool</b><u>USDT</u></div>
  <div class="nd" id="nB"><img src="${I('man_technologist_3d_default')}"><b>Mr B</b><u id="ub">spare cash</u></div>
  <div class="pipe" id="p1"></div><div class="pipe" id="p2"></div>${Array.from({ length: 12 }, (_, i) => `<i class="dot" id="dt${i}"></i>`).join('')}</div>`, { y: 60 })
const CASH = [[269, '$10,000'], [274, '$15,000']].map(([w, s], i) => item(wt(w) - .1, wt(285) - .2, `<div class="chip" style="height:80px;line-height:78px;font-size:38px"><b style="color:var(--green)">${s}</b> spare</div>`, { x: 600 + i * 0, y: 520 + i * 100 }))

// 9. Mr B's side: what he earns; the real pool page
const S9a = wt(330) - .45, S9 = wt(357) - .5
item(wt(319) - .33, S9a, `<div class="card" style="width:auto;padding:26px 40px;display:flex;align-items:center;gap:26px"><img src="${I('man_technologist_3d_default')}" style="width:150px;height:150px"><div><div class="h" style="margin:0">Mr B's side</div><div style="font-family:Anton;font-weight:400;font-size:84px;line-height:92px">HE EARNS <span style="color:var(--blue)">APY</span></div><div style="font-size:30px;font-weight:600;color:var(--mute)">the interest Mr A pays, from the loans</div></div></div>`, { y: 160 })
item(S9a + .12, S9, SHOT(SH('lend-usdt'), 860, `RNT Lend · USDT pool · ${R.at}`, `<div class="hl" id="h9" style="left:${(458 * 860 / 808 - 10).toFixed(0)}px;top:${(96 * 860 / 808 - 8).toFixed(0)}px;width:${(70 * 860 / 808 + 20).toFixed(0)}px;height:${(56 * 860 / 808 + 16).toFixed(0)}px"></div>`), { y: 46 })

// 10. what that means for $10,000
const S10 = wt(372) - .5
item(wt(357) - .33, S10, `<div class="card" style="width:auto;padding:26px 44px 22px;text-align:center"><div class="h" style="text-align:center">Mr B supplies $10,000</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:24px"><img src="${I('coin_3d')}" style="width:120px;height:120px"><b id="yr" style="font-family:Anton;font-weight:400;font-size:150px;line-height:156px;color:var(--green)">$0</b></div>
  <div style="font-size:32px;font-weight:600">in a year, at today's ${R.supply_apy}%</div><div class="src" style="text-align:center">if the rate stayed where it is today · RNT Lend, ${R.at}</div></div>`, { y: 150 })

// 11. the real market
const S11 = wt(389) - .4
item(wt(372) - .33, S11, SHOT(SH('lend-home'), 640, 'RNT Lend, the real market · 13 Nov 2026', `<div class="hl" id="h11" style="left:${(66 * 640 / 760).toFixed(0)}px;top:${(62 * 640 / 760).toFixed(0)}px;width:${(420 * 640 / 760).toFixed(0)}px;height:${(176 * 640 / 760).toFixed(0)}px"></div>`), { y: 40 })

// 12. the close: the name behind the head again, and the follow
item(wt(389) - .1, P.end + .3, `<div class="bt" style="font-size:330px">RNT</div><div class="bt" style="font-size:150px;margin-top:2px"><b>PROTOCOL</b></div>`, { y: 470, bk: 1 })
item(wt(389) + .05, P.end + .3, `<div class="pill" style="height:96px;padding:0 30px;background:#0B1F4D;color:#fff;font-size:40px"><img src="img/logo/rnt.svg" style="height:52px;margin-right:22px">the DeFi of rentals</div>`, { y: 120 })
const fol = item(wt(405) - .5, P.end + .2, `<div id="fol">@i_am_vickyd<div id="fbt">Follow</div><svg id="cur" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L16 20l-3 1.4-3.4-7.3L5 18z" fill="#fff" stroke="#0A1A44" stroke-width="1.6" stroke-linejoin="round"/></svg></div>`, { y: 270 })
$('e0').textContent = 'Borrow up to 75% against a property token'; $('e1').textContent = 'At 80%: sold, with a 10% penalty'
$('e2').textContent = `Lenders earn ${R.supply_apy}% today (USDT)`; $('e3').textContent = '$31.24M market on RNT Lend'
$('eat').textContent = R.at

let lastCap = -1, lastBig = -1, lastRl = ''
window.render = t => {
  SIG = []
  const FRONT = LAYER !== 'behind', BACK = LAYER !== 'front'
  for (const it of ITEMS) {
    if (it.bk ? !BACK : !FRONT) continue
    const on = t >= it.a - .01 && t < it.b + .25, k0 = it.a <= 0 ? 1 : 0
    if (it.bk) { const k = Math.max(k0, eo(seg(t, it.a, .4))), o = eio(seg(t, it.b, .24))                 // behind the head: it rises from behind the shoulders
      st(it.el, { opacity: on ? cl(k * 2) * (1 - o) : 0, transform: `translateY(${((1 - k) * 120 + o * 110).toFixed(1)}px) scale(${(.9 + .1 * k).toFixed(4)}) rotate(${it.rot}deg)` })
    } else { const k = Math.max(k0, eo(seg(t, it.a, .26))), o = seg(t, it.b, .16), bk = Math.max(k0, back(seg(t, it.a, .34)))   // in front: it pops in on the word and lifts away
      st(it.el, { opacity: on ? cl(k * 1.7) * (1 - o) : 0, transform: `translateY(${((1 - k) * 26 - o * 20).toFixed(1)}px) scale(${((.62 + .38 * bk) * (1 - .1 * o)).toFixed(4)}) rotate(${it.rot}deg)` }) }
  }
  if (!FRONT) return SIG.join('|')
  // 1. the cast chips
  pop($('ca'), t, wt(26) + .05); pop($('cb'), t, wt(26) + .35)
  // 3. Mr A's token arrives on "$10,000", its label on "token", the house bounces on "house"
  pop($('tk3'), t, wt(103) - .1); st($('tl3'), { opacity: seg(t, wt(110) - .1, .25) })
  { const k = seg(t, wt(116) - .05, .5); st($('c3').firstChild, { transform: `translateY(${(-26 * Math.sin(Math.PI * k)).toFixed(1)}px)` }) }
  // 4-6. the meter
  if (t > LA - .3 && t < S6 + .4) {
    const f75 = .75 * eo(seg(t, wt(154) - .1, .8)), crawl = .03 * seg(t, wt(178), wt(204) - wt(178) - .4), f80 = .02 * eo(seg(t, wt(204) - .3, .4)), f = f75 + (f75 >= .749 ? crawl + f80 : 0)
    st($('mf'), { transform: `scaleX(${f.toFixed(4)})`, background: f >= .799 ? 'var(--red)' : 'var(--blue)' })
    st($('mv'), { opacity: seg(t, wt(154) - .1, .3), left: (Math.max(f, .08) * 860 - 300).toFixed(0) + 'px', color: f >= .799 ? 'var(--red)' : 'var(--ink)' })
    const dv = f >= .799 ? '$8,000' : '$' + (7500 + Math.round((f - .75) * 10000)).toLocaleString('en-US'); if (t >= wt(154) && $('mv').textContent !== dv) $('mv').textContent = dv
    st($('m75'), { opacity: seg(t, wt(160) - .1, .3) }); st($('m80'), { opacity: seg(t, wt(189) - .1, .3) })
    st($('ir'), { opacity: seg(t, wt(178) - .1, .3) * (1 - seg(t, wt(204) - .2, .3)) })
    st($('sd'), { opacity: seg(t, wt(204) + .3, .3) })
    const go = eio(seg(t, wt(208) - .05, .9)); st($('tk6'), { transform: `translateX(${(go * 36).toFixed(1)}px)`, opacity: 1 - .5 * go })
    st($('a6'), { opacity: seg(t, wt(208), .3) }); st($('mk6'), { opacity: seg(t, wt(213) - .2, .3) }); pop($('pn'), t, wt(223) - .1)
    SIG.push(f.toFixed(4), dv) }
  { const p = Math.sin(t * 14); if (t > wt(204) - .1 && t < wt(208) + .9) st(SIREN.el.firstChild, { transform: `rotate(${(p * 6).toFixed(1)}deg)` }) }
  // 7. the three boxes on the real page, on their words
  ;[[239, 244], [244, 249], [249, 256]].forEach(([a, b], i) => st($('h7' + i), { opacity: seg(t, wt(a) - .12, .2) * (1 - seg(t, wt(b) - .1, .2) * (i < 2 ? .7 : 0)) }))
  // 8. the flow: Mr B arrives on "Mr B", cash on its words; on "supplier" dots run from Mr B to the pool, on "for Mr A" from the pool to Mr A
  if (t > wt(256) - .5 && t < S8 + .4) {
    st($('nA'), { opacity: seg(t, wt(256) - .2, .3) }); st($('nP'), { opacity: seg(t, wt(285) - .2, .3) }); pop($('nB'), t, wt(262) - .1)
    st($('p1'), { opacity: seg(t, wt(290) - .2, .3) }); st($('p2'), { opacity: seg(t, wt(291) - .1, .3) }); pop($('lk'), t, wt(291) + .3)
    for (let i = 0; i < 12; i++) { const leg = i < 6 ? 1 : 2, a = (leg === 1 ? wt(290) - .1 : wt(291)) + (i % 6) * .22, u = ((t - a) / 1.1) % 1, on = t > a
      const x = leg === 1 ? 820 - u * 290 : 470 - u * 300; st($('dt' + i), { opacity: on ? Math.sin(Math.PI * cl(u)) : 0, transform: `translate(${x.toFixed(1)}px,${(150 + Math.sin(u * Math.PI) * -18).toFixed(1)}px)` }) }
    const ub = t >= wt(290) - .1 ? 'supplier' : 'spare cash'; if ($('ub').textContent !== ub) $('ub').textContent = ub; SIG.push(ub) }
  // 9. the APY ring on the real page
  st($('h9'), { opacity: seg(t, wt(344) - .15, .2) })
  // 10. the year's earnings count up
  { const k = eo(seg(t, wt(363) - .1, 1.4)); $('yr').textContent = '$' + Math.round(k * R.year_10000).toLocaleString('en-US'); SIG.push(Math.round(k * 200)) }
  // 11. the market's numbers ring
  st($('h11'), { opacity: seg(t, wt(384) - .1, .25) })
  { const p = wt(408) - .05, m = eio(seg(t, p - .5, .45)), d = seg(t, p, .08)                                        // the cursor comes in and clicks on "Peace"
    const bx = $('fbt').offsetLeft + 214                                                                             // the cursor lands on the button, wherever the handle's length puts it

  { const a = eo(seg(t, P.end - .05, .5)); st($('end'), { opacity: a > 0 ? 1 : 0, transform: `translateY(${((1 - a) * 1920).toFixed(1)}px)` })
    const e0 = P.end + .35
    st($('eh'), { opacity: seg(t, e0, .3), transform: `scale(${(.9 + .1 * back(seg(t, e0, .45))).toFixed(4)})` }); st($('etag'), { opacity: seg(t, e0 + .3, .3) })
    for (let i = 0; i < 4; i++) { const k = eo(seg(t, e0 + .6 + i * .12, .32)); st($('e' + i), { opacity: cl(k * 1.6), transform: `scale(${(.86 + .14 * back(seg(t, e0 + .6 + i * .12, .32))).toFixed(4)})` }) }

}
