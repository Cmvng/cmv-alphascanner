/* The owner talks about Probly, on their untouched picture and sound (their own car selfie, 60 fps, one encode). The
   owner: "create an illustration around what I am talking about". Concept: THE PLAY, ACTED OUT ON PROBLY'S OWN PAGES.
   Every line lands on the real Probly page it is about (the category bar, the Safety Net page, its steps, the deposit
   docs, the Bayern v Köln and Newcastle v Arsenal markets in Lagos time), ringed on the owner's words; one $50 coin
   travels their example in their order (into the deposit, onto Bayern), the $25 comes back the same way each time it
   is said (a green coin), it goes onto Arsenal, two ticks, WITHDRAW, then the weekend (burger, pizza, movies).
   Moves, and the sample each comes from (video/templates/STYLE-LIBRARY.md):
     - giant type BEHIND the head: A PREDICTION MARKET, WEEKEND (S1, S3, S4);
     - real pages in a card, the spoken words ringed, a source label under each (S3);
     - the product acted out: a coin that follows the money from page to page (S6);
     - the $25 shown the same way every time it is said (S4);
     - a row of days that lights to the end date (S1 timeline), ticks and a stamp (S1, S2);
     - three numbered steps (S5); icons on their words (S2); word-by-word captions with big key phrases (S2, S3, S4).
   The recording frames the owner low: the top of the head sits about y 960, so every card lives in the ceiling above
   it (y 40 to 890) and the captions sit on the shirt (y 1700). #bk is drawn behind the owner (the renderer hides it
   wherever the owner's outline is; the outline is made only for 0-8.6 s and 81.2-86.6 s). Probly keeps its own purple
   (#7132F5) and its own wordmark (the SVG from its site). Icons: Microsoft Fluent Emoji 3D (MIT), never over 256 px. */
:root{--ink:#0B1F4D;--deep:#0A1A44;--blue:#1F5FDB;--sky:#7CC4FF;--mute:#6B7A99;--line:#E3E9F4;--red:#E5484D;--green:#12A150;--pb:#7132F5}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:Manrope,sans-serif;font-weight:800;color:#fff}
.mono{font-family:Mono,monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.it{position:absolute;left:0;top:0;width:1080px;display:flex;flex-direction:column;align-items:center;opacity:0;transform-origin:50% 40%}
.ic{position:relative;width:200px;height:200px}
.ic img{width:200px;height:200px;display:block;filter:drop-shadow(0 16px 22px rgba(4,10,36,.45))}
.lb{margin-top:10px;font-size:44px;line-height:54px;letter-spacing:-.005em;white-space:nowrap;-webkit-text-stroke:8px var(--deep);paint-order:stroke fill;text-shadow:0 6px 16px rgba(4,10,36,.5)}
.lb b{color:var(--sky);font-weight:800}
.pill{display:flex;align-items:center;height:104px;padding:0 16px 0 34px;border-radius:52px;background:#0B1F4D;box-shadow:0 18px 40px rgba(4,10,36,.45);font-size:40px;white-space:nowrap}
.pill span{margin-left:22px;height:70px;padding:0 26px;border-radius:35px;background:var(--blue);color:#fff;font-size:34px;line-height:70px}
.chip{height:96px;padding:0 36px;border-radius:48px;font-size:42px;line-height:94px;white-space:nowrap;background:#fff;color:var(--ink);box-shadow:0 16px 34px rgba(4,10,36,.42);display:flex;align-items:center;gap:16px}
.chip b{font-weight:800;color:var(--blue)}
.chip img{width:66px;height:66px;display:block}
.stamp{font-family:Anton,sans-serif;font-weight:400;font-size:110px;line-height:1;letter-spacing:.03em;white-space:nowrap;padding:22px 44px 18px;border-radius:22px;border:10px solid currentColor;background:rgba(255,255,255,.96);box-shadow:0 18px 40px rgba(4,10,36,.45);color:var(--green)}
.bt{font-family:Anton,sans-serif;font-weight:400;line-height:.92;letter-spacing:.01em;white-space:nowrap;color:#fff;-webkit-text-stroke:12px var(--deep);paint-order:stroke fill;text-shadow:0 12px 26px rgba(4,10,36,.45)}
.bt b{font-weight:400;color:var(--sky)}
.plate{height:170px;padding:0 54px;border-radius:44px;background:#fff;box-shadow:0 18px 40px rgba(4,10,36,.45);display:flex;align-items:center}
.plate img{height:104px;display:block}
/* a real page: the capture shown at its own pixels or a little under, inside a window with rounded edges */
.win{position:relative;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 22px 50px rgba(4,10,36,.5)}
.win>img{position:absolute;left:0;display:block}
.ring{position:absolute;border:6px solid var(--blue);border-radius:14px;box-shadow:0 0 0 6px rgba(31,95,219,.18);opacity:0}
.lab{margin-top:14px;height:54px;padding:0 24px;border-radius:27px;background:#fff;color:var(--ink);font-family:Mono,monospace;font-weight:700;font-size:21px;line-height:54px;letter-spacing:.05em;white-space:nowrap;box-shadow:0 12px 26px rgba(4,10,36,.35)}
.lab b{color:var(--pb)}
/* the coins that follow the money */
.coin{position:absolute;left:0;top:0;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#8CCBFF 0%,#2F7BF0 52%,#1747B8 100%);
  box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),inset 0 8px 0 rgba(255,255,255,.35),0 18px 34px rgba(4,10,36,.42);color:#fff;font-family:Anton,sans-serif;font-size:70px;line-height:180px;text-align:center;opacity:0;
  border:6px solid rgba(255,255,255,.85)}
.coin.g{background:radial-gradient(circle at 34% 28%,#A6F0C2 0%,#1DB862 52%,#0E7A3D 100%)}
.coin small{position:absolute;left:50%;top:150px;transform:translateX(-50%);height:44px;padding:0 16px;border-radius:22px;background:#fff;color:var(--green);font-family:Mono,monospace;font-weight:700;font-size:20px;line-height:44px;letter-spacing:.06em;white-space:nowrap;box-shadow:0 8px 18px rgba(4,10,36,.3)}
/* ticks */
.ticks{display:flex;gap:22px}
.tk{display:flex;align-items:center;gap:16px;height:100px;padding:0 34px 0 16px;border-radius:50px;background:#fff;color:var(--ink);font-size:44px;white-space:nowrap;box-shadow:0 16px 34px rgba(4,10,36,.42);opacity:0}
.tk i{font-style:normal;display:block;width:70px;height:70px;border-radius:35px;background:var(--green);color:#fff;font-size:44px;line-height:70px;text-align:center}
/* the days */
.days{display:flex;gap:16px}
.day{width:156px;height:178px;border-radius:26px;background:#fff;overflow:hidden;box-shadow:0 14px 30px rgba(4,10,36,.4);color:var(--ink);opacity:0}
.day small{display:block;height:44px;background:#E3ECFB;color:var(--blue);font-family:Mono,monospace;font-weight:700;font-size:20px;letter-spacing:.08em;line-height:44px;text-align:center}
.day b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:96px;line-height:128px;text-align:center}
.day.today small{background:var(--blue);color:#fff}.day.end small{background:var(--pb);color:#fff}.day.end b{color:var(--pb)}
/* steps */
.steps{width:930px;border-radius:40px;background:rgba(255,255,255,.97);box-shadow:0 22px 50px rgba(4,10,36,.5);padding:26px 34px;color:var(--ink)}
.st{display:flex;align-items:center;gap:26px;height:138px;opacity:0}
.st i{flex:none;font-style:normal;width:86px;height:86px;border-radius:43px;background:var(--pb);color:#fff;font-family:Anton,sans-serif;font-size:54px;line-height:88px;text-align:center}
.st span{font-size:50px;white-space:nowrap}
.st img{height:58px;margin-left:4px}
/* the follow pill: ours, not a copy of any app's button */
#fol{display:flex;align-items:center;height:112px;padding:0 14px 0 40px;border-radius:56px;background:#fff;color:var(--ink);font-size:46px;box-shadow:0 18px 40px rgba(4,10,36,.5)}
#fbt{margin-left:26px;height:84px;width:290px;border-radius:42px;background:var(--ink);color:#fff;font-size:38px;line-height:82px;text-align:center}
/* ---- captions: word by word on the shirt; key phrases go big under them */
#cap{position:absolute;left:0;top:1700px;width:1080px;text-align:center;font-size:56px;line-height:72px;letter-spacing:-.005em;white-space:nowrap}
#cap span{display:inline-block;margin:0 .13em;-webkit-text-stroke:9px var(--deep);paint-order:stroke fill;text-shadow:0 6px 16px rgba(4,10,36,.5)}
#cap span.k{color:var(--sky)}
#big{position:absolute;left:0;top:1776px;width:1080px;text-align:center;font-size:108px;line-height:124px;letter-spacing:-.02em;white-space:nowrap;color:var(--sky);opacity:0;
  -webkit-text-stroke:13px var(--deep);paint-order:stroke fill;text-shadow:0 10px 26px rgba(4,10,36,.55);transform-origin:50% 50%}
/* ---- end card */
#end{position:absolute;left:0;top:0;width:1080px;height:1920px;background:linear-gradient(180deg,#F4F8FF,#DCE9FF);opacity:0;color:var(--ink)}
#end .c{position:absolute;left:0;width:1080px;text-align:center}
.ec{display:inline-block;height:76px;padding:0 32px;border-radius:38px;font-size:36px;line-height:74px;background:#fff;border:1.5px solid var(--line);margin:0 6px 16px;opacity:0;white-space:nowrap}
.ec b{color:var(--pb)}
/* ---- layers */
#bk{position:absolute;inset:0}
body.L-behind #top,body.L-behind #cap,body.L-behind #big,body.L-behind #end{display:none}
body.L-front #bk{display:none}
</style></head>
<body>
<div id="bk"></div>
<div id="top"></div>
<div id="cap"></div>
<div id="big"></div>

<div id="end">
  <div class="c" style="top:300px"><div class="win" id="eshield" style="display:inline-block;width:300px;height:390px;border-radius:40px;opacity:0"><img src="img/cap/sn.png" style="width:900px;left:-300px;top:-182px"></div></div>
  <div class="c" style="top:700px"><img id="elogo" src="img/probly_logo.svg" style="width:520px;opacity:0"></div>
  <div class="c" id="etag" style="top:860px;font-size:46px;letter-spacing:-.01em;opacity:0;white-space:nowrap">Safety Net: <span style="color:var(--pb)">your losses on us</span></div>
  <div class="c" style="top:970px;padding:0 50px"><span class="ec" id="e0"></span><span class="ec" id="e1"></span><span class="ec" id="e2"></span></div>
  <div class="c mono" id="eget" style="top:1250px;font-size:25px;color:var(--blue);opacity:0">probly.com · 18+ · terms apply · read 20 Nov 2026</div>
  <div class="c" id="eby" style="top:1360px;font-size:48px;opacity:0">Follow <span style="color:var(--blue)">@i_am_vickyd</span> on X</div>
</div>

<script src="plan.js"></script>
<script src="tok.js"></script>
<script src="boxes.js"></script>
<script>
const P = window.PLAN, $ = id => document.getElementById(id), BX = window.BOXES
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, d) => cl((t - a) / d)
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
let SIG = []
const st = (el, o) => { for (const k in o) { const v = typeof o[k] === 'number' ? +o[k].toFixed(3) : o[k]; el.style[k] = v; SIG.push(v) } }
const NOTEXT = location.hash.includes('notext')
const LAYER = ['behind', 'front'].find(h => location.hash.includes(h)) || 'all'      // the renderer draws each layer on its own
document.body.classList.add('L-' + LAYER)
const I = n => `img/e/${n}.png`
const wt = i => P.wt[i], we = i => P.we[i]
// ---- every caption word's time comes from tokens.py (tok.js)
const CAPS = P.caps.map((c, ci) => {
  const toks = []; let em = false
  for (const raw of c.t.split(' ')) {
    let w = raw; const open = w.startsWith('*'); if (open) { em = true; w = w.slice(1) }
    const close = w.replace(/[.,?!:]+$/, '').endsWith('*'); const k = em; if (close) { em = false; w = w.replace('*', '') }
    toks.push({ w, k })
  }
  toks.forEach((k, i) => k.t = window.TOK[ci][i])
  return { ...c, ci, toks }
})
// key phrases that go big: caption index -> the phrase (the owner's words)
const BIG = { 6: '$25.', 8: 'predict and trade $50', 12: '$50 on Bayern Munich', 17: '24th of November.', 20: '$25 in bonus.', 22: 'withdraw.', 25: 'link is on this post', 28: 'weekend' }
const len = a => a.reduce((n, x) => n + x.w.length + 1, -1)
for (const c of CAPS) {
  const b = BIG[c.ci]; c.small = c.toks; c.chunks = []; let groups = [c.toks]
  if (b) { const bw = b.split(' '), n = bw.length, i0 = c.toks.findIndex((k, i) => bw.every((w, j) => c.toks[i + j] && c.toks[i + j].w.replace(/[.,?!:]+$/, '') === w.replace(/[.,?!:]+$/, '')))
    if (i0 >= 0) { c.big = { text: b, t: c.toks[i0].t }; groups = [c.toks.slice(0, i0), c.toks.slice(i0 + n)]; c.small = groups.flat() } else console.log('BIG PHRASE NOT FOUND', c.ci, b) }
  for (const g of groups) {
    const out = []; let cur = []
    const flush = () => { if (cur.length) out.push(cur); cur = [] }
    for (const k of g) {
      if (cur.length && (cur.length >= 3 || len(cur) + 1 + k.w.length > 17)) flush()
      cur.push(k); if (/[.,?!:]$/.test(k.w) && cur.length >= 2) flush()
    }
    flush()
    const n = out.length
    if (n > 1 && out[n - 1].length === 1 && len(out[n - 2]) + 1 + out[n - 1][0].w.length <= 19 && !/[.,?!:]$/.test(out[n - 2][out[n - 2].length - 1].w)) out.splice(n - 2, 2, [...out[n - 2], ...out[n - 1]])
    c.chunks.push(...out)
  }
}
let CHUNKS = []
CAPS.forEach(c => c.chunks.forEach((ch, i) => CHUNKS.push({ c, ch, t0: i === 0 ? Math.min(ch[0].t, c.o0) : ch[0].t - .04 })))
CHUNKS.forEach((x, i) => { const nx = CHUNKS[i + 1]; x.t1 = Math.min(nx ? nx.t0 : 1e9, (x.c.chunks[x.c.chunks.length - 1] === x.ch ? x.c.o1 + .3 : 1e9)) })
const capHtml = ch => ch.map(k => `<span${k.k ? ' class="k"' : ''}>${k.w}</span>`).join('')

// ---- things above and beside the head (in front), and behind it (bk)
const TOP = $('top'), ITEMS = []
function item(a, b, html, o = {}) {
  const el = document.createElement('div'); el.className = 'it'; el.style.top = (o.y ?? 150) + 'px'; el.innerHTML = html; (o.bk ? $('bk') : TOP).appendChild(el)
  const it = { a, b, el, bk: !!o.bk, rot: o.rot || 0 }; ITEMS.push(it); return it
}
const ic = n => `<div class="ic"><img src="${I(n)}"></div>`
const lb = s => `<div class="lb">${s}</div>`
// a real page: capture <file> (960 px wide, 2x) from y0 to y1, at scale s; rings = {id: [[x0,y0,x1,y1], ...]} in capture px
const WIN = {}
function win(id, file, y0, y1, s, rings, label) {
  const w = 960 * s, h = (y1 - y0) * s
  WIN[id] = { y0, s, w, h }
  const rs = Object.entries(rings).map(([rid, bs]) => bs.map((b, j) => `<div class="ring" id="${rid}${j}" data-r="${rid}" style="left:${(b[0] * s - 9).toFixed(1)}px;top:${((b[1] - y0) * s - 6).toFixed(1)}px;width:${((b[2] - b[0]) * s + 18).toFixed(1)}px;height:${((b[3] - b[1]) * s + 12).toFixed(1)}px"></div>`).join('')).join('')
  return `<div class="win" id="${id}" style="width:${w.toFixed(1)}px;height:${h.toFixed(1)}px"><img src="img/cap/${file}" style="width:${w.toFixed(1)}px;top:${(-y0 * s).toFixed(1)}px">${rs}</div>` + (label ? `<div class="lab">${label}</div>` : '')
}
const U = (...bs) => [[Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3]))]]   // one ring round several boxes on one line
const B = (cap, k, i = 0) => BX[cap][k][i]
const RINGS = []                                                        // [ring id, on at, off at]
const ring = (rid, a, b) => RINGS.push([rid, a, b])
// where a point of a capture lands on the page (card centred by .it, at y)
const at = (id, y, x, cy) => { const W = WIN[id]; return [(1080 - W.w) / 2 + x * W.s, y + (cy - W.y0) * W.s] }

// scene starts, each just before its first word
const A = wt(18) - .3, Bs = wt(39) - .3, C = wt(61) - .3, D = wt(77) - .3, E = wt(97) - .3, F = wt(123) - .3, F2 = wt(146) - .3
const G = wt(154) - .3, H = wt(174) - .3, Ih = wt(193) - .3, J = wt(199) - .3, L = wt(216) - .3, M = wt(232) - .3
const BND = new Set([A, Bs, C, D, E, F, F2, G, H, Ih, J, L, M])

// 0. the hook: A PREDICTION MARKET behind the head from the first frame; Probly's own wordmark on "Probly"
item(0, A, `<div class="pill">@i_am_vickyd<span>20 Nov 2026</span></div>`, { y: 56 })
item(0, A, `<div class="bt" style="font-size:150px">A PREDICTION</div><div class="bt" style="font-size:250px;margin-top:4px"><b>MARKET</b></div>`, { y: 680, bk: 1 })
item(wt(14) - .1, A, `<div class="lb" style="font-size:48px">called</div>`, { y: 220 })
item(wt(15) - .12, A, `<div class="plate"><img src="img/probly_logo.svg"></div>`, { y: 300 })

// 1. "any regular prediction market... sports, politics, any other thing": Probly's own front page, the categories ringed
const YA = 70
item(A, Bs, win('wA', 'homeN.png', 0, 660, 1, { rSp: [B('homeN', 'Sports')], rPo: [B('homeN', 'Politics')], rAn: [B('homeN', 'Next CEO of NVIDIA?')] }, 'probly.com · <b>front page</b> · 20 Nov 2026'), { y: YA })
ring('rSp', wt(32) - .1, Bs); ring('rPo', wt(33) - .1, Bs); ring('rAn', wt(34) - .1, Bs)

// 2. "the good thing... a trading bonus up to $25": the Safety Net page itself
const YB = 46
item(Bs, C, win('wB', 'sn.png', 150, 1130, .84, { rSN: [B('sn', 'Safety Net')], rTB: [B('sn', 'of it as a trading bonus.')], r25: [B('sn', '$25')] }, 'probly.com/safety-net · read 20 Nov 2026'), { y: YB })
ring('rSN', wt(41) - .1, wt(56) - .2); ring('rTB', wt(56) - .1, C); ring('r25', wt(60) - .1, C)

// 3. "predict and trade $50 worth of any market": the page's own steps, the line ringed; the $50 coin
const YC = 40
item(C, D, win('wC', 'snH.png', 470, 1560, .78, { rT50: U(B('snH', 'Trade', 0), B('snH', 'different days')) }, 'probly.com/safety-net · <b>how it works</b>'), { y: YC })
ring('rT50', wt(71) - .1, D)

// 4. "deposit $50 in crypto... from Solana, from Base, from any chain": the deposit docs and the network list
const YD1 = 40, YD2 = 470
item(D, E, win('wD1', 'conv.png', 150, 600, .92, { rDep: [B('conv', 'Click on Deposit')], rCry: [B('conv', 'send any of the supported crypto')], rAny: BX.conv['Any required conversion is handled automatically.'] }), { y: YD1 })
item(wt(89) - .3, E, win('wD2', 'net.png', 220, 650, .92, { rSol: [B('net', 'Solana')], rBas: [B('net', 'Base')] }, 'docs.probly.com · <b>deposits &amp; withdrawals</b>'), { y: YD2 })
ring('rDep', wt(84) - .1, E); ring('rCry', wt(87) - .1, E); ring('rSol', wt(89) - .1, E); ring('rBas', wt(93) - .1, E); ring('rAny', wt(95) - .05, E)

// 5. "$50 on Bayern Munich to win today, this evening": the real market in Lagos time; the coin lands on Bayern
const YE = 50
item(E, F, win('wE', 'bayL.png', 360, 1230, .92, { rBay: [[164, 520, 290, 700]], rEve: U(B('bayL', 'November 20'), B('bayL', '8:30 PM')) }, 'probly.com · bayern vs köln · <b>lagos time</b>'), { y: YE })
ring('rBay', wt(110) - .05, F); ring('rEve', wt(117) - .1, F)

// 6. "$25 worth of trading bonus... in any 3 days": the page's steps 2 and 3
const YF = 46
item(F, F2, win('wF', 'snH.png', 1000, 2010, .82, { rG25: U(B('snH', 'Get up to'), B('snH', 'back on losses')), r3d: U(B('snH', 'Trade', 0), B('snH', 'different days')) }, 'probly.com/safety-net · <b>how it works</b>'), { y: YF })
ring('rG25', wt(128) - .1, F2); ring('r3d', wt(144) - .1, F2)

// 6b. "it ends on the 24th of November": the page's dates, and the days from today to the end
const YF2 = 40
