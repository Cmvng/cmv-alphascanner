<!doctype html>
<html><head><meta charset="utf-8"><title>Probly (20 Nov): cover (#v, 1080x1920; its middle square is the picture for X) and wide thumbnail (#t, 1280x720, YouTube)</title>
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Man;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* img/still.png is one frame of the owner's recording (91.3 s, the grin on "and smile"), untouched, shown smaller, never
   cropped into the face. Light blue house look; Probly keeps its purple, its wordmark and its own Safety Net shield
   (cut from its page). The title is true to Probly's page: "up to $25 ... as a trading bonus". */
:root{--ink:#0B1F4D;--deep:#0A1A44;--blue:#1F5FDB;--sky:#7CC4FF;--mute:#5A6B8C;--pb:#7132F5;--green:#12A150}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:Man,sans-serif;font-weight:800;color:var(--ink);background:#EEF4FF}
.abs{position:absolute}
.bg{position:absolute;inset:0;background:radial-gradient(1200px 1200px at 30% 40%,#FFFFFF 0%,#EEF4FF 45%,#CFE0FA 100%)}
.h{font-family:Anton,sans-serif;font-weight:400;line-height:.92;white-space:nowrap}
.plate{display:flex;align-items:center;gap:22px;padding:18px 34px;border-radius:36px;background:#fff;box-shadow:0 16px 36px rgba(11,31,77,.16)}
.shield{width:150px;height:196px;border-radius:30px;overflow:hidden;position:relative;background:#fff;box-shadow:0 16px 36px rgba(11,31,77,.18)}
.shield img{position:absolute;width:450px;left:-150px;top:-91px}
.pill{display:inline-block;height:76px;padding:0 30px;border-radius:38px;background:var(--ink);color:#fff;font-size:36px;line-height:76px;white-space:nowrap}
</style></head>
<body>
<div id="v" style="display:none;position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden">
  <div class="bg"></div>
  <!-- Cut edges from the middle: 3:4 y 240/1680, 7:8 y 343/1577, 1:1 y 420/1500, 16:9 y 656/1263. The face, the title and
       the handle all sit between 680 and 1240 (whole in every cut); Probly's wordmark sits above them (470 to 610). -->
  <div class="abs" style="left:380px;top:0;width:700px;height:1920px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 170px);mask-image:linear-gradient(90deg,transparent 0,#000 170px)"><img src="img/still.png" style="position:absolute;left:-40px;top:-78px;width:864px;height:1536px"></div>
  <div class="abs" style="left:0;top:1440px;width:1080px;height:480px;background:linear-gradient(180deg,rgba(238,244,255,0),#E4EEFD 40%)"></div>
  <div class="abs" style="left:56px;top:476px"><div class="plate"><img src="img/probly_logo.svg" style="height:70px"><span style="font-size:34px;color:var(--mute)">Safety Net</span></div></div>
  <div class="abs h" style="left:58px;top:684px;font-size:104px">UP TO</div>
  <div class="abs h" style="left:50px;top:778px;font-size:290px;color:var(--pb)">$25</div>
  <div class="abs h" style="left:58px;top:1050px;font-size:76px">TRADING BONUS</div>
  <div class="abs" style="left:58px;top:1150px"><span class="pill">@i_am_vickyd</span></div>
</div>
<div id="t" style="display:none;position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden">
  <div class="bg"></div>
  <div class="abs" style="right:0;top:0;width:640px;height:720px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 22%);mask-image:linear-gradient(90deg,transparent 5%,#000 22%)"><img src="img/still.png" style="position:absolute;left:0;top:-330px;width:640px"></div>
  <div class="abs" style="left:60px;top:56px"><div class="plate" style="padding:12px 26px"><img src="img/probly_logo.svg" style="height:50px"><span style="font-size:26px;color:var(--mute)">Safety Net</span></div></div>
  <div class="abs h" style="left:62px;top:170px;font-size:88px">UP TO</div>
  <div class="abs h" style="left:56px;top:250px;font-size:250px;color:var(--pb)">$25</div>
  <div class="abs h" style="left:62px;top:488px;font-size:72px">TRADING BONUS</div>
  <div class="abs" style="left:62px;top:604px"><span class="pill" style="height:62px;line-height:62px;font-size:30px">@i_am_vickyd</span></div>
</div>
<script>
const m = location.hash.includes('t') ? 't' : 'v'
document.getElementById(m).style.display = 'block'
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => 0))]).then(() => document.fonts.load('116px Anton')).then(() => document.fonts.load('800 30px Man')).then(() => document.fonts.load('700 24px Mono'))
</script>
</body></html>
