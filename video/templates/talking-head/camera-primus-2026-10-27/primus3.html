<!doctype html>
<html><head><meta charset="utf-8"><title>Primus overlay v3 (real screens, zoomed to the named card)</title>
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:600;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-600-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* every screen here is a capture of the real Primus site; our layer is only the frame, the outlines and the notes */
:root{--ink:#161616;--mute:#525252;--or:#FD4C00;--or2:#FF7A33;--green:#24A148}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:Manrope,sans-serif;color:var(--ink)}
.abs{position:absolute}
.mono{font-family:Mono,monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
/* floating screens above the head: a window on the real page that zooms to the card being named */
.fl{position:absolute;opacity:0;transform-origin:50% 0;border-radius:26px;overflow:hidden;background:#fff;
  box-shadow:0 34px 80px rgba(18,24,48,.38),0 0 0 1.5px rgba(0,0,0,.06)}
.pg{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0}
.pg img{position:absolute;left:0;top:0;width:1440px;max-width:none;display:block}
/* outline and tag in page pixels, so they sit exactly on the real card at any zoom */
.glow{position:absolute;border:3.5px solid var(--or);border-radius:12px;opacity:0;box-shadow:0 0 0 3px rgba(253,76,0,.16),0 0 14px rgba(253,76,0,.45)}
.pill{position:absolute;height:26px;padding:0 11px;border-radius:13px;font-weight:800;font-size:14px;line-height:24px;white-space:nowrap;opacity:0;border:1px solid;box-shadow:0 3px 9px rgba(0,0,0,.12);transform-origin:100% 50%}
.p-ok{color:#fff;background:var(--green);border-color:var(--green)}
.p-no{color:#525252;background:#fff;border-color:#d4d4d4}
.note{position:absolute;height:64px;padding:0 28px;border-radius:32px;font-weight:800;font-size:30px;line-height:61px;white-space:nowrap;opacity:0;
  background:#fff;border:1.5px solid #e6e6e6;box-shadow:0 14px 34px rgba(18,24,48,.22)}
.note b{color:var(--or)}
/* full-screen walkthrough: the real page, tilted and drifting, the camera moving over it */
#full{position:absolute;inset:0;opacity:0;overflow:hidden;background:#E5EFFF}
.vp{position:absolute;left:-20px;top:0;width:1120px;height:1660px;perspective:2200px}
.tilt{position:absolute;inset:0;transform-style:preserve-3d}
.stage{position:absolute;left:0;top:0;width:1440px;height:1330px;transform-origin:0 0;border-radius:18px;overflow:hidden;box-shadow:0 40px 100px rgba(18,24,48,.35)}
.stage img{position:absolute;left:0;top:0;width:1440px;height:1330px;max-width:none}
/* a short fade under the captions only */
#ffade{position:absolute;left:0;right:0;top:1560px;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(229,239,255,0) 0%,#E5EFFF 90px,#E5EFFF 100%)}
#fhead{position:absolute;left:45px;top:96px;width:990px;height:236px;border-radius:30px;background:rgba(255,255,255,.97);z-index:3;opacity:0;
  box-shadow:0 26px 70px rgba(18,24,48,.30),0 0 0 1.5px rgba(0,0,0,.05)}
.fk{position:absolute;left:44px;top:40px;font-size:26px;color:var(--or)}
.ft{position:absolute;left:40px;top:82px;font-weight:800;font-size:92px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.ft span{color:var(--or)}
.fn{position:absolute;left:44px;top:194px;font-weight:800;font-size:32px;color:var(--mute);opacity:0;white-space:nowrap}
.fn:before{content:"";display:inline-block;width:14px;height:14px;border-radius:7px;background:var(--or);margin-right:14px;vertical-align:4px}
.big{font-family:Anton,sans-serif;font-weight:400;line-height:.9}
.lbl{font-weight:800;font-size:40px;color:var(--mute);margin-top:6px}
#endc{position:absolute;inset:0;opacity:0;overflow:hidden}
#cap{position:absolute;left:0;right:0;bottom:104px;text-align:center;opacity:0}
#cap span{display:inline-block;max-width:960px;padding:13px 28px 15px;border-radius:20px;background:rgba(12,16,28,.74);font-weight:800;font-size:44px;line-height:1.24;color:#fff}
#cap b{color:var(--or2);font-weight:800}
</style></head>
<body>
<div id="full">
  <div class="vp"><div class="tilt" id="tilt"><div class="stage" id="stage"><img id="stA"><div id="smarks"></div></div></div></div>
  <div id="ffade"></div>
  <div id="fhead"><div class="mono fk" id="fk"></div><div class="ft" id="ft"></div><div class="fn" id="fn"></div></div>
</div>
<div id="floats"></div>
<div id="kin"></div>
<div id="endc">
  <img id="end_bg" src="file:///home/user/cmv-alphascanner/video/out/brand/primus/site/points-home.png" style="position:absolute;height:1920px;left:-1620px;top:0">
  <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(255,96,0,.0) 0%,rgba(255,90,0,.15) 40%,rgba(214,62,0,.84) 66%,rgba(190,52,0,.94) 100%)"></div>
  <div class="abs mono" style="left:70px;top:150px;font-size:30px;color:#fff">Live now on Primus Points</div>
  <div class="abs" style="left:66px;top:194px;font-weight:800;font-size:104px;line-height:1;letter-spacing:-.02em;color:#fff">Proof of<br>Nomad Life</div>
  <div class="fl" id="end_store" style="left:45px;width:990px;top:430px;opacity:1"></div>
  <div class="abs" id="end_ext" style="left:70px;top:1350px;width:950px;font-weight:800;font-size:40px;line-height:1.3;color:#fff;text-shadow:0 2px 14px rgba(120,30,0,.35)">You need the Primus Chrome extension:<br>it makes the zkTLS proof right in your browser.</div>
  <div class="abs" id="end_tk" style="left:70px;top:1500px;font-weight:800;font-size:40px;color:#fff">Discord · LinkedIn · GitHub</div>
  <div class="abs" id="end_h" style="left:70px;top:1590px;font-family:Mono,monospace;font-weight:700;font-size:40px;color:#fff">@i_am_vickyd</div>
</div>
<div id="cap"><span id="capt"></span></div>
<div style="position:absolute;left:-9999px;top:0;width:10px;height:10px;overflow:hidden" id="pre"></div>

<script src="data.js"></script>
<script src="rects.js"></script>
<script>
const P = window.PLAN, END = P.end, EC = P.endcard, TOT = END + EC
// the panels stay up until the last thing named in them has been on screen for a second (Grok, GitHub, Luma)
const EV = { ...P.ev, a_out: 52.15, r_in: 52.3, f_out: 69.75, i_in: 69.85, i_out: 78.95 }
// "nine records" is on screen in the caption from its start, so the number lands with the caption, not 2 s later
const REC_AT = (P.caps.find(c => /nine records/.test(c.t)) || { o0: EV.p_rec - .4 }).o0 + .15
const ZIN = .9                                         // a whole panel is shown for about a second, then the camera zooms in
const SITE = 'file:///home/user/cmv-alphascanner/video/out/brand/primus/site/'
const SH = { nomad: 'dash-nomad.png', pnl: 'dash-pnl.png', ai: 'dash-ai.png', trade: 'dash-trade.png', identity: 'dash-identity.png', platform: 'dash-platform.png' }
const R = window.RECTS
const $ = id => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const eo = x => 1 - Math.pow(1 - clamp(x), 3)
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const eback = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
let SIG = []
function css(el, k, v) { if (typeof el === 'string') el = $(el); if (el.style[k] !== v) el.style[k] = v; SIG.push(v) }
function vis(t, a, b, fi = .32, fo = .22) { if (t < a || t > b) return 0; return Math.min(eo((t - a) / fi), eo((b - t) / fo)) }
const card = (shot, name) => R[shot].cards[name]
const verifyBtn = r => [r[0] + r[2] - 104, r[1] + r[3] - 40, 92, 28]
$('pre').innerHTML = Object.values(SH).map(f => `<img src="${SITE}${f}">`).join('') + `<img src="${SITE}points-home.png"><img src="${SITE}chrome-store.png">`

// ---- floating screens. A float is a window [x, y, w] on a real capture (page pixels; the height follows the float's
// shape). keys: [time, window] = the camera arrives there at that time, moving over the 0.6 s before it.
const FW = 1020, FH = 470, FTOP = 40, FLEFT = 30
const PANEL = [401, 562, 898, 480], OVER = [401, 590, 898]
function focus(r, w, fw = FW, fh = FH, b = PANEL) {           // a window of width w centred on a card, kept inside the panel
  const h = w * fh / fw
  return [clamp(r[0] + r[2] / 2 - w / 2, b[0], b[0] + b[2] - w), clamp(r[1] + r[3] / 2 - h / 2, b[1], Math.max(b[1], b[1] + b[3] - h)), w]
}
const F1 = (shot, n) => focus(card(shot, n), 480)                       // one card, big
const COL = x => focus([x, 669, 419, 252], 600, FW, FH, [380, 562, 1060, 480])     // a column of two cards
const F2 = (shot, a, b) => { const r1 = card(shot, a), r2 = card(shot, b); const x0 = Math.min(r1[0], r2[0]), x1 = Math.max(r1[0] + r1[2], r2[0] + r2[2]); return focus([x0, r1[1], x1 - x0, r1[3]], 600) }
const FLOATS = [
  { id: 'f_land', src: 'points-home.png', ph: 900, a: .15, b: EV.h_new - .2, keys: [[.15, [40, 150, 1360]], [EV.h_new - .2, [110, 190, 1220]]], marks: [] },
  { id: 'f_new', shot: 'nomad', a: EV.h_new - .2, b: EV.t_in, keys: [[EV.h_new - .2, [125, 598, 471]]], marks: [
    { r: R.nomad.side['Agentic AraNEW14 tasks'], at: EV.h_new }, { r: R.nomad.weeks['Proof of Nomad Life'], at: EV.h_new + .35 }] },
  { id: 'f_nomad', shot: 'nomad', a: EV.n_in, b: EV.n_out, keys: [[EV.n_in, OVER], [EV.n_discord, F1('nomad', 'Discord')], [EV.n_github, F1('nomad', 'GitHub')], [EV.n_linkedin, F1('nomad', 'LinkedIn')], [EV.n_linkedin + 1.7, OVER]],
    marks: [{ r: card('nomad', 'Discord'), at: EV.n_discord }, { r: card('nomad', 'GitHub'), at: EV.n_github }, { r: card('nomad', 'LinkedIn'), at: EV.n_linkedin }] },
  { id: 'f_pts', shot: 'nomad', fw: 520, fh: 560, a: EV.p_in, b: EV.p_out, keys: [[EV.p_in, [133, 606, 274]]], marks: [] },
  { id: 'f_pnl', shot: 'pnl', a: EV.l_in, b: EV.l_out, keys: [[EV.l_in, OVER], [EV.l_in + ZIN + .6, F1('pnl', 'fomo')], [EV.l_fomo, F1('pnl', 'fomo')], [EV.l_hl, F1('pnl', 'Hyperliquid')], [EV.l_pm, F1('pnl', 'Polymarket')]],
    marks: [{ r: card('pnl', 'fomo'), at: EV.l_fomo, pill: ['p-ok', '✓ Verified'] }, { r: card('pnl', 'Hyperliquid'), at: EV.l_hl, pill: ['p-no', "Don't use it"] },
      { r: card('pnl', 'Polymarket'), at: EV.l_pm, pill: ['p-no', 'Skipped'] }] },
  { id: 'f_ai', shot: 'ai', a: EV.a_in, b: EV.a_out, keys: [[EV.a_in, OVER], [EV.a_in + ZIN + .6, F1('ai', 'OpenAI')], [EV.a_openai, F1('ai', 'OpenAI')], [EV.a_claude, COL(425)], [EV.a_grok - .6, COL(856)]],
    marks: [{ r: card('ai', 'OpenAI'), at: EV.a_openai, pill: ['p-ok', '✓ Verified'] }] },
  { id: 'f_trade', shot: 'trade', a: EV.r_in, b: EV.r_out, keys: [[EV.r_in, OVER], [EV.r_in + ZIN + .6, COL(425)], [57.4, COL(856)]], marks: [] },
  { id: 'f_plat', shot: 'platform', a: EV.f_in, b: EV.f_out, keys: [[EV.f_in, F2('platform', 'X', 'Luma')], [EV.f_gh + .35, F2('platform', 'Luma', 'GitHub')]],
    marks: [{ r: card('platform', 'X'), at: EV.f_x, pill: ['p-ok', '✓'] }, { r: card('platform', 'GitHub'), at: EV.f_gh, pill: ['p-ok', '✓'] }] },
  { id: 'f_id', shot: 'identity', a: EV.i_in, b: EV.i_out,
    keys: [[EV.i_in, F2('identity', 'X', 'TikTok')], [EV.i_sp, F2('identity', 'TikTok', 'Spotify')], [EV.i_nv, F2('identity', 'Google', 'Naver')], [EV.i_lu, F2('identity', 'Luma', 'Google')]],
    marks: [{ r: card('identity', 'X'), at: EV.i_x, pill: ['p-ok', '✓'] }, { r: card('identity', 'TikTok'), at: EV.i_tt, pill: ['p-no', 'Not yet'] },
      { r: card('identity', 'Spotify'), at: EV.i_sp, pill: ['p-no', 'Not yet'] }, { r: card('identity', 'Naver'), at: EV.i_nv, pill: ['p-no', "Don't use"] },
      { r: card('identity', 'Google'), at: EV.i_g, pill: ['p-ok', '✓'] }, { r: card('identity', 'Luma'), at: EV.i_lu, pill: ['p-no', "Don't use"] }] },
]
let fh = ''
for (const f of FLOATS) {
  f.fw = f.fw || FW; f.fh = f.fh || FH; f.left = f.left ?? FLEFT; f.ph = f.ph || 1330
  const src = SITE + (f.src || SH[f.shot])
  fh += `<div class="fl" id="${f.id}" style="left:${f.left}px;top:${FTOP}px;width:${f.fw}px;height:${f.fh}px"><div class="pg" id="${f.id}_pg" style="height:${f.ph}px"><img src="${src}" style="height:${f.ph}px">`
  f.marks.forEach((m, i) => {
    const [x, y, w, h] = m.r
    fh += `<div class="glow" id="${f.id}_g${i}" style="left:${x - 3}px;top:${y - 3}px;width:${w + 6}px;height:${h + 6}px"></div>`
    if (m.pill) fh += `<div class="pill ${m.pill[0]}" id="${f.id}_p${i}" style="right:${1440 - x - w + 12}px;top:${y + 12}px">${m.pill[1]}</div>`
  })
  fh += '</div></div>'
}
$('floats').innerHTML = fh
function camF(f, t) {
  const k = f.keys
  if (t <= k[0][0]) return k[0][1]
  for (let i = 1; i < k.length; i++) {
    const [ti, ri] = k[i], [tp, rp] = k[i - 1]
    if (t < ti) { const D = Math.min(.6, ti - tp), u = eio((t - (ti - D)) / D); return rp.map((v, j) => v + (ri[j] - v) * u) }
  }
  return k[k.length - 1][1]
}
// the owner's words as notes under the screens, and the numbers
const NOTE_TOP = FTOP + FH + 22
$('kin').innerHTML = `
  <div class="abs" id="k_pts" style="left:590px;top:58px;opacity:0"><div class="big" id="k_pn" style="font-size:200px">0</div><div class="lbl">points</div></div>
  <div class="abs" id="k_rec" style="left:590px;top:330px;opacity:0"><div class="big" id="k_rn" style="font-size:200px;color:var(--green)">0</div><div class="lbl">records verified</div></div>
  <div class="note" id="n_ai" style="left:30px;top:${NOTE_TOP}px">Not on the list yet: <b>Claude</b><span id="n_gk" style="opacity:0"> · <b>Grok</b></span></div>
  <div class="note" id="n_tr1" style="left:30px;top:${NOTE_TOP}px">No exchange account on this laptop</div>
  <div class="note" id="n_tr2" style="left:30px;top:${NOTE_TOP}px">I use <b>OKX Wallet</b><span id="n_rb" style="opacity:0"> or <b>Rabby</b></span></div>
  <div class="abs" id="k_gas" style="left:70px;top:110px;opacity:0"><div class="mono" style="font-size:40px;color:var(--or)">Gas per task</div>
    <div style="position:relative;height:200px;margin-top:20px">
      <div class="big abs" id="k_vc" style="left:0;top:0;font-size:180px;opacity:0;white-space:nowrap">Very cheap</div>
      <div class="abs" id="k_num" style="left:0;top:0;white-space:nowrap"><span class="big" id="k_g1" style="font-size:200px;display:inline-block;opacity:0">$0.10</span><span class="big" id="k_or" style="font-size:90px;color:#8d8d8d;margin:0 26px;opacity:0">or</span><span class="big" id="k_g2" style="font-size:200px;display:inline-block;opacity:0">$0.20</span></div></div>
    <div class="mono" id="k_gn" style="font-size:30px;color:var(--mute);margin-top:18px;opacity:0">My estimate</div></div>`
$('end_store').innerHTML = `<img src="${SITE}chrome-store.png" style="position:absolute;max-width:none;width:${1440 * 990 / 740}px;left:${-110 * 990 / 740}px;top:${-215 * 990 / 740}px">`
$('end_store').style.height = (640 * 990 / 740).toFixed(0) + 'px'

// ---- full-screen walkthroughs: camera keys are [time, rect] in page pixels; marks live on the page
const VW = 1120, VH = 1660, FY = 1017                 // the focus sits below the title panel
const WALKS = [
  { a: P.spans[0].o0, b: P.spans[0].o1, shot: 'nomad', kick: 'New on Primus Points', title: 'Proof of <span>Nomad Life</span>', tAt: EV.t_proof,
    keys: [[P.spans[0].o0, [300, 380, 900, 600]], [EV.t_proof - .3, [400, 600, 640, 300]], [P.spans[0].o1, [130, 600, 560, 300]]],
    marks: [{ r: R.nomad.weeks['Proof of Nomad Life'], at: EV.t_proof }, { r: R.nomad.side['Agentic AraNEW14 tasks'], at: EV.t_ara }] },
  // one steady view of the four exchanges: each lights up as it is named, no camera jumps
  { a: EV.g_in, b: EV.w_in, shot: 'trade', kick: 'Agentic Ara', title: 'Proof of Trade', tAt: EV.g_in + .2,
    keys: [[EV.g_in, [400, 560, 900, 460]], [EV.g_bn - .3, [410, 640, 880, 320]], [EV.g_out, [418, 646, 864, 312]]],
    marks: ['Binance', 'OKX', 'Bybit', 'Bitget'].map((n, i) => ({ r: card('trade', n), at: [EV.g_bn, EV.g_okx, EV.g_by, EV.g_bg][i] })),
    note: ['0 of 4 verified', EV.g_none] },
  { a: EV.w_in, b: EV.gas_in, shot: 'nomad', kick: 'Just showed up on Primus', title: 'Check it out <span>and verify</span>', tAt: EV.w_in + .4,
    keys: [[EV.w_in, [250, 300, 900, 700]], [EV.w_in + 1.4, [130, 590, 560, 320]], [EV.w_check - .5, [440, 660, 520, 260]], [EV.gas_in, [500, 670, 420, 210]]],
    marks: [{ r: R.nomad.side['Agentic AraNEW14 tasks'], at: EV.w_in + 1.0 }, { r: verifyBtn(card('nomad', 'Discord')), at: EV.w_check, rad: 8 }],
    note: ['The older tasks are still open too', EV.w_in + 1.9] },
]
function camAt(w, t) {
  const k = w.keys; let i = 0
  while (i < k.length - 2 && t > k[i + 1][0]) i++
  const [t0, r0] = k[i], [t1, r1] = k[Math.min(i + 1, k.length - 1)]
  const u = eio((t - t0) / Math.max(.01, t1 - t0))
  const r = r0.map((v, j) => v + (r1[j] - v) * u)
  const s = VW / r[2]                                   // fit the width: the page fills the frame above and below the focus
  let x = VW / 2 - (r[0] + r[2] / 2) * s, y = FY - (r[1] + r[3] / 2) * s
  const pw = 1440 * s, ph = 1330 * s
  x = pw > VW ? clamp(x, VW - pw, 0) : (VW - pw) / 2      // no empty strip at the page's edges
  y = Math.min(-100 * s, Math.max(VH - ph, y))              // the page fills the frame; its dark top bar (52 px) stays out, tilt included
  return { s, x, y }
}
let curWalk = null
function setWalk(w) {
  if (curWalk === w) return; curWalk = w
  $('stA').src = SITE + SH[w.shot]
  $('fk').textContent = w.kick; $('ft').innerHTML = w.title; $('fn').textContent = w.note ? w.note[0] : ''
  $('ft').style.fontSize = w.title.replace(/<[^>]+>/g, '').length > 20 ? '84px' : '92px'   // long titles stay inside the panel
  $('fhead').style.height = w.note ? '262px' : '236px'
  $('smarks').innerHTML = w.marks.map((m, i) => `<div class="glow" id="sm${i}" style="left:${m.r[0] - 4}px;top:${m.r[1] - 4}px;width:${m.r[2] + 8}px;height:${m.r[3] + 8}px;border-radius:${m.rad || 14}px"></div>`).join('')
}
const glowAt = (el, t, at, s = 1) => {
  if (t < at) { css(el, 'opacity', '0'); return }
  const p = eo((t - at) / .22), k = 1 - .55 * eo((t - at - .9) / .7)
  css(el, 'opacity', (p * k).toFixed(3)); css(el, 'transform', `scale(${(1.06 - .06 * p).toFixed(3)})`)
  css(el, 'borderWidth', (3.5 / s).toFixed(2) + 'px')
}
const stamp = (el, t, at) => { const p = clamp((t - at) / .28); css(el, 'opacity', eo(p).toFixed(3)); css(el, 'transform', `scale(${(.6 + .4 * eback(p)).toFixed(3)})`) }
const pop = (el, t, at, d = .3, dy = 14) => { const p = eo((t - at) / d); css(el, 'opacity', p.toFixed(3)); css(el, 'transform', `translateY(${((1 - p) * dy).toFixed(1)}px)`) }
function capAt(t) { for (const c of P.caps) if (t >= c.o0 && t < c.o1) return c; return null }

window.render = function (t) {
  SIG = []
  // full-screen walkthroughs
  let w = WALKS.find(x => t >= x.a - .2 && t < x.b + .2)
  let fv = 0; for (const x of WALKS) fv = Math.max(fv, vis(t, x.a, x.b, .2, .2))
  css('full', 'opacity', fv.toFixed(3))
  if (w) {
    setWalk(w)
    const c = camAt(w, clamp(t, w.a, w.b))
    css('stage', 'transform', `translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px) scale(${c.s.toFixed(4)})`)
    const dr = Math.sin((t - w.a) * .9)
    css('tilt', 'transform', `rotateX(${(4 + 1 * dr).toFixed(2)}deg) rotateY(${(-3 + 1.2 * Math.cos((t - w.a) * .7)).toFixed(2)}deg)`)
    w.marks.forEach((m, i) => glowAt($('sm' + i), t, m.at, c.s))
    pop($('fhead'), t, w.tAt - .3, .3, -16); pop($('ft'), t, w.tAt - .2, .3, 18)      // the panel and its title arrive together
    if (w.note) pop($('fn'), t, w.note[1], .3, 10); else css('fn', 'opacity', '0')
    SIG.push(w.a)
  }
  // floating screens
  for (const f of FLOATS) {
    const el = $(f.id), v = vis(t, f.a, f.b, .18, .14)
    if (v <= 0) { css(el, 'opacity', '0'); continue }
    const p = eo((t - f.a) / .42), out = 1 - vis(t, -1e9, f.b, 0, .14)
    const dr = Math.sin((t - f.a) * .8)
    css(el, 'opacity', v.toFixed(3))
    css(el, 'transform', `perspective(1800px) translateY(${((1 - p) * -40 - out * 30).toFixed(1)}px) rotateX(${(5 + (1 - p) * 10 + .6 * dr).toFixed(2)}deg) rotateY(${(-3 + 1 * Math.cos((t - f.a) * .6)).toFixed(2)}deg) scale(${(.95 + .05 * p - .03 * out).toFixed(3)})`)
    const [x, y, ww] = camF(f, t), s = f.fw / ww
    css(f.id + '_pg', 'transform', `translate(${(-x * s).toFixed(1)}px,${(-y * s).toFixed(1)}px) scale(${s.toFixed(4)})`)
    f.marks.forEach((m, i) => { glowAt($(`${f.id}_g${i}`), t, m.at, s); if (m.pill) stamp($(`${f.id}_p${i}`), t, m.at + .15) })
  }
  // the numbers and notes
  const ptsV = vis(t, EV.p_in + .2, EV.p_out, .3, .14)
  css('k_pts', 'opacity', ptsV.toFixed(3)); css('k_rec', 'opacity', (ptsV * eo((t - REC_AT) / .3)).toFixed(3))
  const n90 = Math.round(90 * eo((t - EV.p_in - .4) / (EV.p_90 + .3 - EV.p_in - .4))); $('k_pn').textContent = n90; SIG.push(n90)
  const n9 = Math.round(9 * eo((t - REC_AT - .1) / .7)); $('k_rn').textContent = n9; SIG.push(n9)
  const nv = (id, a, b) => { const v = vis(t, a, b, .25, .14); const p = eo((t - a) / .3); css(id, 'opacity', v.toFixed(3)); css(id, 'transform', `translateY(${((1 - p) * 14).toFixed(1)}px)`) }
  nv('n_ai', EV.a_claude - .1, EV.a_out); css('n_gk', 'opacity', eo((t - EV.a_grok) / .3).toFixed(3))
  nv('n_tr1', EV.r_none, EV.r_okx - .15); nv('n_tr2', EV.r_okx, EV.r_out); css('n_rb', 'opacity', eo((t - EV.r_rabby) / .3).toFixed(3))
  // gas: the label, then "Very cheap" as he says it, then his two numbers
  css('k_gas', 'opacity', vis(t, EV.gas_in, END + .1, .3, .2).toFixed(3))
  const vc = vis(t, 91.2, EV.gas_1 + .1, .25, .12); css('k_vc', 'opacity', vc.toFixed(3)); css('k_vc', 'transform', `translateY(${((1 - eo((t - 91.2) / .3)) * 20).toFixed(1)}px)`)
  stamp($('k_g1'), t, EV.gas_1); pop($('k_or'), t, EV.gas_2 - .3, .25, 8); stamp($('k_g2'), t, EV.gas_2); pop($('k_gn'), t, EV.gas_meh - .4, .3, 8)
  // end card on the real landing page and the real extension listing
  const ev = t >= END ? eo((t - END) / .35) : 0
  css('endc', 'opacity', ev.toFixed(3))
  if (t >= END - .05) {
    css('end_bg', 'transform', `scale(${(1.0 + .03 * clamp((t - END) / EC)).toFixed(4)})`)
    const sp = eo((t - END - .25) / .5)
    css('end_store', 'transform', `perspective(1800px) translateY(${((1 - sp) * 60).toFixed(1)}px) rotateX(${(5 + (1 - sp) * 4).toFixed(2)}deg) rotateY(-2deg) scale(${(.96 + .04 * sp).toFixed(3)})`)
    pop($('end_ext'), t, END + .6, .35, 14); pop($('end_tk'), t, END + .8, .35, 14); pop($('end_h'), t, END + 1.0, .35, 14)
  }
  // captions
  const c = t < END ? capAt(t) : null
  css('cap', 'opacity', c ? Math.min(eo((t - c.o0) / .12), eo((c.o1 - t) / .08)).toFixed(3) : '0')
  if (c) { const h = c.t.replace(/\*([^*]+)\*/g, '<b>$1</b>'); if ($('capt').innerHTML !== h) $('capt').innerHTML = h; SIG.push(c.t) }
  return SIG.join('|')
}
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r }))])
</script>
