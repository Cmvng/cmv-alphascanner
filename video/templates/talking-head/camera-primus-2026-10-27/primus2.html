:root{--ink:#161616;--mute:#525252;--or:#FD4C00;--or2:#FF7A33;--green:#24A148;--gbg:#E8F5EC}

  background:#fff;border:1.5px solid #e6e6e6;box-shadow:0 14px 34px rgba(18,24,48,.22)}

/* end card on the real landing page */

/* captions */
#cap{position:absolute;left:0;right:0;bottom:104px;text-align:center;opacity:0}

<script>
const P = window.PLAN, EV = P.ev, END = P.end, EC = P.endcard, TOT = END + EC
const SITE = 'file:///home/user/cmv-alphascanner/video/out/brand/primus/site/'
const SH = { nomad: 'dash-nomad.png', pnl: 'dash-pnl.png', ai: 'dash-ai.png', trade: 'dash-trade.png', identity: 'dash-identity.png', platform: 'dash-platform.png' }
const R = window.RECTS
const $ = id => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const eo = x => 1 - Math.pow(1 - clamp(x), 3)
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const eback = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
let SIG = []
function css(el, k, v) { if (typeof el === 'string') el = $(el); if (el.style[k] !== v) el.style[k] = v; SIG.push(v) }
function vis(t, a, b, fi = .32, fo = .22) { if (t < a || t > b) return 0; return Math.min(eo((t - a) / fi), eo((b - t) / fo)) }
const PANEL = [401, 562, 898, 440], PANEL_S = [401, 562, 898, 378]
const card = (shot, name) => R[shot].cards[name]
const verifyBtn = r => [r[0] + r[2] - 104, r[1] + r[3] - 40, 92, 28]

// ---- floating cards: a crop of a real capture, 990 px wide, tilted, above the head
const FLOATS = [
  { id: 'f_land', src: SITE + 'points-home.png', iw: 1440, crop: [0, 70, 1440, 760], a: .15, b: EV.t_in, top: 58, marks: [] },
  { id: 'f_new', src: SITE + SH.nomad, iw: 1440, crop: [120, 600, 920, 128], a: EV.h_new - .2, b: EV.t_in, top: 440, marks: [
    { k: 'glow', r: [141, 621, 259, 92], at: EV.h_new }, { k: 'glow', r: R.nomad.weeks['Proof of Nomad Life'], at: EV.h_new + .35 }] },
  { id: 'f_nomad', shot: 'nomad', crop: PANEL_S, a: EV.n_in, b: EV.n_out, marks: [
    { k: 'glow', r: card('nomad', 'Discord'), at: EV.n_discord }, { k: 'glow', r: card('nomad', 'GitHub'), at: EV.n_github }, { k: 'glow', r: card('nomad', 'LinkedIn'), at: EV.n_linkedin }] },
  { id: 'f_pts', src: SITE + SH.nomad, iw: 1440, crop: [140, 155, 1160, 244], a: EV.p_in, b: EV.p_out, top: 58, marks: [] },
  { id: 'f_pnl', shot: 'pnl', crop: PANEL_S, a: EV.l_in, b: EV.l_out, marks: [
    { k: 'glow', r: card('pnl', 'fomo'), at: EV.l_fomo, pill: ['p-ok', '✓ Verified'] }, { k: 'glow', r: card('pnl', 'Hyperliquid'), at: EV.l_hl, pill: ['p-no', "Don't use it"] },
    { k: 'glow', r: card('pnl', 'Polymarket'), at: EV.l_pm, pill: ['p-no', 'Skipped'] }] },
  { id: 'f_ai', shot: 'ai', crop: PANEL_S, a: EV.a_in, b: EV.a_out, marks: [{ k: 'glow', r: card('ai', 'OpenAI'), at: EV.a_openai, pill: ['p-ok', '✓ Verified'] }] },
  { id: 'f_trade', shot: 'trade', crop: PANEL_S, a: EV.r_in, b: EV.r_out, marks: [] },
  { id: 'f_plat', shot: 'platform', crop: [401, 562, 898, 230], a: EV.f_in, b: EV.f_out, marks: [
    { k: 'glow', r: card('platform', 'X'), at: EV.f_x, pill: ['p-ok', '✓'] }, { k: 'glow', r: card('platform', 'GitHub'), at: EV.f_gh, pill: ['p-ok', '✓'] }] },
  { id: 'f_id', shot: 'identity', crop: [401, 562, 898, 340], a: EV.i_in, b: EV.i_out, marks: [
    { k: 'glow', r: card('identity', 'X'), at: EV.i_x, pill: ['p-ok', '✓'] }, { k: 'glow', r: card('identity', 'TikTok'), at: EV.i_tt, pill: ['p-no', 'Not yet'] },
    { k: 'glow', r: card('identity', 'Spotify'), at: EV.i_sp, pill: ['p-no', 'Not yet'] }, { k: 'glow', r: card('identity', 'Naver'), at: EV.i_nv, pill: ['p-no', "Don't use"] },
    { k: 'glow', r: card('identity', 'Google'), at: EV.i_g, pill: ['p-ok', '✓'] }, { k: 'glow', r: card('identity', 'Luma'), at: EV.i_lu, pill: ['p-no', "Don't use"] }] },
]
let fh = ''
for (const f of FLOATS) {
  const src = f.src || SITE + SH[f.shot], [cx, cy, cw, ch] = f.crop, s = 990 / cw
  f.s = s; f.h = ch * s; f.top = f.top ?? 58
  fh += `<div class="fl" id="${f.id}" style="top:${f.top}px;height:${f.h.toFixed(0)}px"><img class="sh" src="${src}" style="width:${(1440 * s).toFixed(1)}px;left:${(-cx * s).toFixed(1)}px;top:${(-cy * s).toFixed(1)}px">`
  f.marks.forEach((m, i) => {
    const [x, y, w, h] = m.r
    fh += `<div class="glow" id="${f.id}_g${i}" style="left:${((x - cx) * s - 3).toFixed(1)}px;top:${((y - cy) * s - 3).toFixed(1)}px;width:${(w * s + 6).toFixed(1)}px;height:${(h * s + 6).toFixed(1)}px;border-radius:${(12 * s).toFixed(0)}px"></div>`
    if (m.pill) fh += `<div class="pill ${m.pill[0]}" id="${f.id}_p${i}" style="right:${((cx + cw - x - w) * s + 14).toFixed(1)}px;top:${((y - cy) * s + 12).toFixed(1)}px">${m.pill[1]}</div>`
  })
  fh += '</div>'
}
$('floats').innerHTML = fh
// notes under the cards (the owner's own words), and the kinetic numbers
$('kin').innerHTML = `
  <div class="abs" id="k_pts" style="left:70px;top:300px;opacity:0"><div class="big" id="k_pn" style="font-size:190px">0</div><div class="mono" style="font-size:24px;color:var(--mute)">Points</div></div>
  <div class="abs" id="k_rec" style="left:470px;top:300px;opacity:0"><div class="big" id="k_rn" style="font-size:190px;color:var(--green)">0</div><div class="mono" style="font-size:24px;color:var(--mute)">Records verified</div></div>
  <div class="note" id="n_ai" style="left:45px;top:500px">Not on the list yet: <b id="n_cl">Claude</b><span id="n_gk" style="opacity:0"> · <b>Grok</b></span></div>
  <div class="note" id="n_tr1" style="left:45px;top:500px">No exchange account on this laptop</div>
  <div class="note" id="n_tr2" style="left:45px;top:500px">I use <b>OKX Wallet</b><span id="n_rb" style="opacity:0"> and <b>Rabby</b></span></div>
  <div class="abs" id="k_gas" style="left:70px;top:150px;opacity:0"><div class="mono" style="font-size:28px;color:var(--or)">Gas per task</div>
    <div style="margin-top:14px;white-space:nowrap"><span class="big" id="k_g1" style="font-size:200px;display:inline-block;opacity:0">$0.10</span><span class="big" id="k_or" style="font-size:90px;color:#8d8d8d;margin:0 26px;opacity:0">or</span><span class="big" id="k_g2" style="font-size:200px;display:inline-block;opacity:0">$0.20</span></div>
    <div class="mono" id="k_gn" style="font-size:22px;color:var(--mute);margin-top:12px;opacity:0">My estimate · very cheap</div></div>`
// end card: the real Chrome Web Store listing, cropped
$('end_store').innerHTML = `<img class="sh" src="${SITE}chrome-store.png" style="width:${1440 * 990 / 740}px;left:${-110 * 990 / 740}px;top:${-215 * 990 / 740}px">`
$('end_store').style.height = (640 * 990 / 740).toFixed(0) + 'px'

// ---- full-screen walkthroughs: camera keys are [time, rect] in page pixels; marks live on the page
const VW = 1000, VH = 1240
const WALKS = [
  { a: P.spans[0].o0, b: P.spans[0].o1, shot: 'nomad', kick: 'New on Primus Points', title: 'Proof of <span>Nomad Life</span>', tAt: EV.t_proof,
    keys: [[P.spans[0].o0, [300, 380, 900, 600]], [EV.t_proof - .3, [400, 600, 640, 300]], [P.spans[0].o1, [130, 600, 560, 300]]],
    marks: [{ r: R.nomad.weeks['Proof of Nomad Life'], at: EV.t_proof }, { r: [141, 621, 259, 92], at: EV.t_ara }] },
  { a: EV.g_in, b: EV.w_in, shot: 'trade', kick: 'Agentic Ara', title: 'Proof of Trade', tAt: EV.g_in + .2,
    keys: [[EV.g_in, [400, 560, 900, 460]], [EV.g_bn - .2, [415, 660, 440, 280]], [EV.g_okx - .15, [846, 660, 440, 280]], [EV.g_by - .1, [415, 660, 440, 280]], [EV.g_bg - .1, [846, 660, 440, 280]], [EV.g_out, [410, 640, 880, 320]]],
    marks: ['Binance', 'OKX', 'Bybit', 'Bitget'].map((n, i) => ({ r: card('trade', n), at: [EV.g_bn, EV.g_okx, EV.g_by, EV.g_bg][i] })),
    note: ['0 of 4 verified', EV.g_none] },
  { a: EV.w_in, b: EV.gas_in, shot: 'nomad', kick: 'Just showed up on Primus', title: 'Check it out <span>and verify</span>', tAt: EV.w_in + .4,
    keys: [[EV.w_in, [100, 130, 1240, 900]], [EV.w_in + 1.4, [130, 590, 560, 320]], [EV.w_check - .5, [440, 660, 520, 260]], [EV.gas_in, [500, 670, 420, 210]]],
    marks: [{ r: [141, 621, 259, 92], at: EV.w_in + 1.0 }, { r: verifyBtn(card('nomad', 'Discord')), at: EV.w_check, rad: 8 }],
    note: ['The older tasks are still open too', EV.w_in + 1.9] },
]
function camAt(w, t) {
  const k = w.keys; let i = 0
  while (i < k.length - 2 && t > k[i + 1][0]) i++
  const [t0, r0] = k[i], [t1, r1] = k[Math.min(i + 1, k.length - 1)]
  const u = eio((t - t0) / Math.max(.01, t1 - t0))
  const r = r0.map((v, j) => v + (r1[j] - v) * u)
  const s = VW / r[2]                                   // fit the width: the page fills the frame above and below the focus
  let x = VW / 2 - (r[0] + r[2] / 2) * s, y = VH / 2 - (r[1] + r[3] / 2) * s
  const pw = 1440 * s, ph = 1330 * s
  x = pw > VW ? clamp(x, VW - pw, 0) : (VW - pw) / 2      // no empty strip at the page's edges
  y = ph > VH ? clamp(y, VH - ph, 0) : (VH - ph) / 2
  return { s, x, y }
}
let curWalk = null
function setWalk(w) {
  if (curWalk === w) return; curWalk = w
  $('stA').src = SITE + SH[w.shot]
  $('fk').textContent = w.kick; $('ft').innerHTML = w.title
  $('smarks').innerHTML = w.marks.map((m, i) => `<div class="glow" id="sm${i}" style="left:${m.r[0] - 4}px;top:${m.r[1] - 4}px;width:${m.r[2] + 8}px;height:${m.r[3] + 8}px;border-radius:${m.rad || 14}px"></div>`).join('')
  if (w.note) $('f_note').textContent = w.note[0]
}
const glowAt = (el, t, at, s = 1) => {
  if (t < at) { css(el, 'opacity', '0'); return }
  const p = eo((t - at) / .22), k = 1 - .55 * eo((t - at - .9) / .7)
  css(el, 'opacity', (p * k + (1 - k) * .0).toFixed(3)); css(el, 'transform', `scale(${(1.06 - .06 * p).toFixed(3)})`)
  css(el, 'borderWidth', (3.5 / s).toFixed(2) + 'px')
}
const stamp = (el, t, at) => { const p = clamp((t - at) / .28); css(el, 'opacity', eo(p).toFixed(3)); css(el, 'transform', `scale(${(.6 + .4 * eback(p)).toFixed(3)})`) }
const pop = (el, t, at, d = .3, dy = 14) => { const p = eo((t - at) / d); css(el, 'opacity', p.toFixed(3)); css(el, 'transform', `translateY(${((1 - p) * dy).toFixed(1)}px)`) }
function capAt(t) { for (const c of P.caps) if (t >= c.o0 && t < c.o1) return c; return null }

window.render = function (t) {
  SIG = []
  // full-screen walkthroughs
  let w = WALKS.find(x => t >= x.a - .2 && t < x.b + .2)
  let fv = 0; for (const x of WALKS) fv = Math.max(fv, vis(t, x.a, x.b, .2, .2))
  css('full', 'opacity', fv.toFixed(3))
  if (w) {
    setWalk(w)
    const c = camAt(w, clamp(t, w.a, w.b))
    css('stage', 'transform', `translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px) scale(${c.s.toFixed(4)})`)
    const dr = Math.sin((t - w.a) * .9)
    css('tilt', 'transform', `rotateX(${(5 + 1.2 * dr).toFixed(2)}deg) rotateY(${(-4 + 1.6 * Math.cos((t - w.a) * .7)).toFixed(2)}deg)`)
    w.marks.forEach((m, i) => glowAt($('sm' + i), t, m.at, c.s))
    pop($('fhead'), t, w.tAt - .3, .3, -16); pop($('ft'), t, w.tAt, .35, 22)
    if (w.note) { stamp($('f_note'), t, w.note[1]); css('f_note', 'left', ((1080 - $('f_note').offsetWidth) / 2).toFixed(0) + 'px') } else css('f_note', 'opacity', '0')
    SIG.push(w.a)
  }
  // floating cards
  for (const f of FLOATS) {
    const el = $(f.id), v = vis(t, f.a, f.b, .36, .26)
    if (v <= 0) { css(el, 'opacity', '0'); continue }
    const p = eo((t - f.a) / .5), out = 1 - vis(t, -1e9, f.b, 0, .26)
    const dr = Math.sin((t - f.a) * .8)
    css(el, 'opacity', v.toFixed(3))
    css(el, 'transform', `perspective(1800px) translateY(${((1 - p) * -50 - out * 40).toFixed(1)}px) rotateX(${(7 + (1 - p) * 14 + .8 * dr).toFixed(2)}deg) rotateY(${(-4 + 1.2 * Math.cos((t - f.a) * .6)).toFixed(2)}deg) scale(${(.94 + .06 * p).toFixed(3)})`)
    f.marks.forEach((m, i) => { glowAt($(`${f.id}_g${i}`), t, m.at); if (m.pill) stamp($(`${f.id}_p${i}`), t, m.at + .15) })
  }
  // kinetic numbers and notes
  const ptsV = vis(t, EV.p_in + .3, EV.p_out, .3, .24)
  css('k_pts', 'opacity', ptsV.toFixed(3)); css('k_rec', 'opacity', (ptsV * eo((t - EV.p_rec + .5) / .3)).toFixed(3))
