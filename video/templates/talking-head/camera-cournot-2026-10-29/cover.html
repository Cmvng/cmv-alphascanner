<!doctype html>
<html><head><meta charset="utf-8"><title>Primus × Cournot: cover and thumbnail</title>
<style>
@font-face{font-family:Anton;src:url(../../../assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(../../../assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(../../../assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* the announcement's own cover (Cournot × Primus logos, from Cournot's 29 Oct Medium post), and the owner's Wait, What? sticker */
:root{--or:#FD4C00;--navy:#0B1F4D}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:Manrope,sans-serif}
.pg{position:relative;overflow:hidden;display:none;background:linear-gradient(180deg,#F4F8FF 0%,#E6F0FF 60%,#DCE9FF 100%)}
.pg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,95,219,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,95,219,.07) 1px,transparent 1px);background-size:60px 60px}
.abs{position:absolute}
.k{font-family:Mono,monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
.t{font-family:Anton,sans-serif;line-height:.92;text-transform:uppercase;color:var(--navy)}
.t span{color:var(--or)}
.card{position:absolute;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 34px 80px rgba(18,40,96,.34),0 0 0 1.5px rgba(0,0,0,.05)}
.card div{position:absolute;inset:0;background-repeat:no-repeat}
.stk{position:absolute;filter:drop-shadow(0 18px 30px rgba(10,30,80,.36)) drop-shadow(0 3px 6px rgba(10,30,80,.2))}
</style></head>
<body>
<div class="pg" id="v" style="width:1080px;height:1920px">
  <div class="abs k" style="left:74px;top:110px;font-size:34px">Primus Labs × Cournot</div>
  <div class="abs t" style="left:68px;top:170px;font-size:178px">Who decides<br><span>who won?</span></div>
  <div class="card" style="left:60px;top:590px;width:960px;height:540px;transform:rotate(-2deg)"><div style="background-image:url(../../../out/cournot-2026-10-29/site/medium-cover.png);background-size:960px 540px"></div></div>
  <img class="stk" src="../../../out/reactions/waitwhat/f_0060.png" style="left:270px;top:1170px;width:560px;transform:rotate(4deg)">
</div>
<div class="pg" id="h" style="width:1280px;height:720px">
  <img class="stk" src="../../../out/reactions/waitwhat/f_0060.png" style="left:40px;top:60px;width:430px;transform:rotate(-4deg)">
  <div class="abs k" style="left:520px;top:58px;font-size:28px">Primus Labs × Cournot</div>
  <div class="abs t" style="left:516px;top:104px;font-size:118px">Who decides<br><span>who won?</span></div>
  <div class="card" style="left:520px;top:368px;width:600px;height:338px;transform:rotate(-2deg)"><div style="background-image:url(../../../out/cournot-2026-10-29/site/medium-cover.png);background-size:600px 338px"></div></div>
</div>
<script>
document.getElementById(location.hash.slice(1) || 'v').style.display = 'block'
window.READY = document.fonts.ready.then(() => Promise.all(['400 100px Anton', '800 40px Manrope', '700 20px Mono'].map(f => document.fonts.load(f)))).then(() => new Promise(r => setTimeout(r, 400)))
</script>
</body></html>
