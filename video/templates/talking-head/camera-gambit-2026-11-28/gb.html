<script>
const P = window.PLAN, $ = id => document.getElementById(id), BX = window.BOXES
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, d) => cl((t - a) / d)
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, ei = x => x * x * x
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
let SIG = []
const st = (el, o) => { if (!el) return; for (const k in o) { const v = typeof o[k] === 'number' ? +o[k].toFixed(3) : o[k]; el.style[k] = v; SIG.push(v) } }
const NOTEXT = location.hash.includes('notext')
const LAYER = ['behind', 'front'].find(h => location.hash.includes(h)) || 'all'
document.body.classList.add('L-' + LAYER)
const I = n => `img/e/${n}.png`
const wt = i => P.wt[i], we = i => P.we[i]
const SCR = P.screen                                                   // [[a, b], ...]: the owner looks at their screen
// ---- captions (tokens.py gives every caption word its time)
const CAPS = P.caps.map((c, ci) => {
  const toks = []; let em = false
  for (const raw of c.t.split(' ')) {
    let w = raw; const open = w.startsWith('*'); if (open) { em = true; w = w.slice(1) }
    const close = w.replace(/[.,?!:…]+$/, '').endsWith('*'); const k = em; if (close) { em = false; w = w.replace('*', '') }
    toks.push({ w, k })
  }
  toks.forEach((k, i) => k.t = window.TOK[ci][i])
  return { ...c, ci, toks }
})
const BIG = { 3: '$250', 5: 'top of the leaderboard', 8: 'P&L,', 9: '$250.', 12: 'one winner.', 13: 'manually.', 22: 'combo picks', 25: '$250', 26: 'Gambit points.' }
const len = a => a.reduce((n, x) => n + x.w.length + 1, -1)
for (const c of CAPS) {
  const b = BIG[c.ci]; c.small = c.toks; c.chunks = []; let groups = [c.toks]
  const clean = s => s.replace(/[.,?!:…]+$/, '')
  if (b) { const bw = b.split(' '), n = bw.length, i0 = c.toks.findIndex((k, i) => bw.every((w, j) => c.toks[i + j] && clean(c.toks[i + j].w) === clean(w)))
    if (i0 >= 0) { c.big = { text: b, t: c.toks[i0].t }; groups = [c.toks.slice(0, i0), c.toks.slice(i0 + n)]; c.small = groups.flat() } else console.log('BIG PHRASE NOT FOUND', c.ci, b) }
  for (const g of groups) {
    const out = []; let cur = []
    const flush = () => { if (cur.length) out.push(cur); cur = [] }
    for (const k of g) {
      if (cur.length && (cur.length >= 3 || len(cur) + 1 + k.w.length > 17)) flush()
      cur.push(k); if (/[.,?!:…]$/.test(k.w) && cur.length >= 2) flush()
    }
    flush()
    const n = out.length
    if (n > 1 && out[n - 1].length === 1 && len(out[n - 2]) + 1 + out[n - 1][0].w.length <= 19 && !/[.,?!:…]$/.test(out[n - 2][out[n - 2].length - 1].w)) out.splice(n - 2, 2, [...out[n - 2], ...out[n - 1]])
    c.chunks.push(...out)
  }
}
let CHUNKS = []
CAPS.forEach(c => c.chunks.forEach((ch, i) => CHUNKS.push({ c, ch, t0: i === 0 ? Math.min(ch[0].t, c.o0) : ch[0].t - .04 })))
CHUNKS.forEach((x, i) => { const nx = CHUNKS[i + 1]; x.t1 = Math.min(nx ? nx.t0 : 1e9, (x.c.chunks[x.c.chunks.length - 1] === x.ch ? x.c.o1 + .3 : 1e9)) })
const capHtml = ch => ch.map(k => `<span${k.k ? ' class="k"' : ''}>${k.w}</span>`).join('')

// ---- the screen: how far the frame is covered (0 = the owner, 1 = Entropy full frame)
const TIN = .32, TOUT = .3
const scrK = t => { let k = 0; for (const [a, b] of SCR) { if (t >= a - TIN && t < b + TOUT) k = Math.max(k, t < a ? eo(seg(t, a - TIN, TIN)) : 1 - ei(seg(t, b, TOUT))) } return k }
const inScr = t => SCR.some(([a, b]) => t >= a - TIN && t < b + TOUT)

// ---- items
const TOP = $('top'), SIT = $('sit'), ITEMS = []
function item(a, b, html, o = {}) {
  const el = document.createElement('div'); el.className = 'it'; el.style.top = (o.y ?? 150) + 'px'; el.innerHTML = html
  ;(o.bk ? $('bk') : o.scr ? SIT : o.hd ? $('shd') : TOP).appendChild(el)
  if (o.hd) { el.style.position = 'absolute'; el.style.top = '0px' }
  const it = { a, b, el, bk: !!o.bk, scr: !!o.scr, rot: o.rot || 0, push: o.push }; ITEMS.push(it); return it
}
const ic = n => `<div class="ic"><img src="${I(n)}"></div>`
const lb = s => `<div class="lb">${s}</div>`
const tile = `<img src="img/crown-logo.png">`
// a real capture <file> (cw px wide) from y0 to y1, at scale s; rings {id: [[x0,y0,x1,y1], ...]} in capture px
const WIN = {}
function win(id, file, cw, y0, y1, s, rings, label, dark) {
  const w = cw * s, h = (y1 - y0) * s
  WIN[id] = { y0, s, w, h }
  const rs = Object.entries(rings).map(([rid, bs]) => bs.map((b, j) => `<div class="ring" id="${rid}${j}" data-r="${rid}" style="left:${(b[0] * s - 10).toFixed(1)}px;top:${((b[1] - y0) * s - 7).toFixed(1)}px;width:${((b[2] - b[0]) * s + 20).toFixed(1)}px;height:${((b[3] - b[1]) * s + 14).toFixed(1)}px"></div>`).join('')).join('')
  return `<div class="win${dark ? ' dk' : ''}" id="${id}" style="width:${w.toFixed(1)}px;height:${h.toFixed(1)}px"><img src="img/${file}" style="width:${w.toFixed(1)}px;top:${(-y0 * s).toFixed(1)}px">${rs}</div>` + (label ? `<div class="lab">${label}</div>` : '')
}
const RINGS = []
const ring = (rid, a, b) => RINGS.push([rid, a, b])
const B = (cap, k) => BX[cap][k]
const hd = (a, b, s) => item(a, b, `<div class="sl"><img src="img/crown-logo.png" style="width:54px;height:38px;object-fit:contain;border-radius:0">${s}</div>`, { hd: 1 })          // the label at the top of the screen

const s0 = SCR.map(x => x[0]), s1 = SCR.map(x => x[1])
// On camera (0 to 21.2 s) their head reaches from about y 600 down past the chin: the cards live above it (y 36 to 520),
// the giant type sits behind the top of the head, the captions low on the frame (y 1704).
const PH = { x: 184, y: 120, w: 711, h: 1540 }                         // the phone's screen in the frame (a 1075x2330 capture at 0.661)
