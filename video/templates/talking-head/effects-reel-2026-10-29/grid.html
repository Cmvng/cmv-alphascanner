<!doctype html>
<html><head><meta charset="utf-8"><title>Effects grid</title>
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif;background:linear-gradient(180deg,#0B1F4D,#123A99)}
body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(79,179,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(79,179,255,.08) 1px,transparent 1px);background-size:60px 60px}
.k{position:absolute;left:60px;top:110px;font-family:Mono,monospace;font-weight:700;font-size:28px;letter-spacing:.16em;color:#4FB3FF;text-transform:uppercase}
h1{position:absolute;left:56px;top:150px;margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:150px;line-height:.9;color:#fff;text-transform:uppercase}
.g{position:absolute;left:60px;top:340px;display:grid;grid-template-columns:repeat(3,300px);gap:30px}
.t{position:relative;width:300px;height:470px;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);background:#081634}
.t img{position:absolute;left:0;top:-30px;width:300px;height:533px}
.n{position:absolute;left:14px;top:14px;width:52px;height:52px;border-radius:26px;background:#FD4C00;color:#fff;font-weight:800;font-size:30px;line-height:52px;text-align:center}
.l{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(180deg,rgba(8,22,52,0),rgba(8,22,52,.92) 40%);font-weight:800;font-size:28px;color:#fff}
.ask{display:flex;flex-direction:column;justify-content:center;padding:30px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.ask b{font-family:Anton,sans-serif;font-weight:400;font-size:64px;line-height:.95;color:#fff;text-transform:uppercase}
.ask span{margin-top:18px;font-size:30px;line-height:1.25;color:#CFE3FF}
</style></head>
<body>
<div class="k">Your recordings · 29 Oct</div>
<h1>7 effects</h1>
<div class="g" id="g"></div>
<script>
const T = [['Words behind you', 't1'], ['Glass cards', 't2'], ['Orbit', 't3'], ['Documentary', 't4'], ['Checklist', 't5'], ['Numbers split', 't6'], ['Timeline', 't7']]
document.getElementById('g').innerHTML = T.map(([l, f], i) => `<div class="t"><img src="${f}.png"><div class="l"><span style="color:#FF7A33">${i + 1}</span> · ${l}</div></div>`).join('') +
  '<div class="t ask" style="grid-column:2 / span 2;width:auto"><b>Tell me the numbers</b><span>you want in your next video. One or two a video, on the strongest lines.</span></div>'
window.READY = Promise.all([document.fonts.load('400 100px Anton'), document.fonts.load('800 30px Manrope'), document.fonts.load('700 28px Mono'),
  ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r }))])
</script>
</body></html>
