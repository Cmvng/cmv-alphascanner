<script>
const P = window.PLAN, E = P.ev, D = window.DOCS, $ = id => document.getElementById(id)
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, d) => cl((t - a) / d)
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
let SIG = []
const st = (el, o) => { for (const k in o) { const v = typeof o[k] === 'number' ? +o[k].toFixed(3) : o[k]; el.style[k] = v; SIG.push(v) } }
const NOTEXT = location.hash.includes('notext')
const LAYER = ['behind', 'front', 'shade'].find(h => location.hash.includes(h)) || 'all'   // render_depth.mjs draws each layer on its own
document.body.classList.add('L-' + LAYER)
const TR = window.TRACK
const I = n => `img/e/${n}.png`

// ---- every caption word's time in the finished video comes from tokens.py (tok.js)
const CAPS = P.caps.map((c, ci) => {
  const toks = []; let em = false
  for (const raw of c.t.split(' ')) {
    let w = raw; const open = w.startsWith('*'); if (open) { em = true; w = w.slice(1) }
    const close = w.replace(/[.,?!:]+$/, '').endsWith('*'); const k = em; if (close) { em = false; w = w.replace('*', '') }
    toks.push({ w, k })
  }
  toks.forEach((k, i) => k.t = window.TOK[ci][i])              // tokens.py: the time of the spoken word each caption word stands for
  return { ...c, ci, toks }
})
const capT = (ci, word) => { const k = CAPS[ci].toks.find(x => x.w.toLowerCase().replace(/[^a-z0-9à]/g, '') === word); return k ? k.t : CAPS[ci].o0 }
// key phrases that go big (only where nothing is held up in front of the chest): caption index -> the phrase
const BIG = { 16: 'what do I do?', 18: 'Primus Labs zkTLS', 22: 'log in', 41: "Everybody's happy.", 42: 'Voilà.', 45: 'zkTLS', 52: 'Peace.' }
const len = a => a.reduce((n, x) => n + x.w.length + 1, -1)
for (const c of CAPS) {
  const b = BIG[c.ci]; c.small = c.toks; c.chunks = []; let groups = [c.toks]
  if (b) { const bw = b.split(' '), n = bw.length, i0 = c.toks.findIndex((k, i) => bw.every((w, j) => c.toks[i + j] && c.toks[i + j].w.replace(/[.,?!:]+$/, '') === w.replace(/[.,?!:]+$/, '')))
    if (i0 >= 0) { c.big = { text: b, t: c.toks[i0].t }; groups = [c.toks.slice(0, i0), c.toks.slice(i0 + n)]; c.small = groups.flat() } }
  for (const g of groups) {                                // a line never runs across the big phrase ("I simply" | log in | "on my Binance app")
    const out = []; let cur = []
    const flush = () => { if (cur.length) out.push(cur); cur = [] }
    for (const k of g) {                                   // up to three words and about 17 letters a line; break after punctuation
      if (cur.length && (cur.length >= 3 || len(cur) + 1 + k.w.length > 17)) flush()
      cur.push(k); if (/[.,?!:]$/.test(k.w) && cur.length >= 2) flush()
    }
    flush()
    const n = out.length                                   // no single word left alone at the end of a sentence when it fits the line before
    if (n > 1 && out[n - 1].length === 1 && len(out[n - 2]) + 1 + out[n - 1][0].w.length <= 19 && !/[.,?!:]$/.test(out[n - 2][out[n - 2].length - 1].w)) out.splice(n - 2, 2, [...out[n - 2], ...out[n - 1]])
    c.chunks.push(...out)
  }
}
let CHUNKS = []
function timing() {                                        // each line is up from its first word to the next line's first word
  CHUNKS = []
  CAPS.forEach(c => c.chunks.forEach((ch, i) => CHUNKS.push({ c, ch, t0: i === 0 ? Math.min(ch[0].t, c.o0) : ch[0].t - .04 })))
  CHUNKS.forEach((x, i) => { const nx = CHUNKS[i + 1]; x.t1 = Math.min(nx ? nx.t0 : 1e9, (x.c.chunks[x.c.chunks.length - 1] === x.ch ? x.c.o1 + .3 : 1e9)) })
}
timing()

// ---- the things that pop over the head. One at a time, on the centre line.
const TOP = $('top'), ITEMS = []

  if (o.x != null) { el.style.width = 'auto'; el.style.left = o.x + 'px' }
  if (o.r != null) { el.style.width = 'auto'; el.style.left = 'auto'; el.style.right = o.r + 'px' }
  const it = { a, b, el, bk: !!o.bk, bd: [...el.querySelectorAll('.bdg')].map(x => ({ el: x, at: a + (+x.dataset.at || .32) })), rot: o.rot || 0 }
  ITEMS.push(it); return it
}
const ic = (n, o = {}) => `<div class="ic${o.s ? ' s' : ''}"${o.id ? ` id="${o.id}"` : ''}><img src="${I(n)}">${o.x ? `<div class="bdg" data-at="${o.at ?? .32}"><img src="${I(o.x)}"></div>` : ''}</div>`

const goodT = CAPS[36].toks.filter(k => /^good/.test(k.w)).map(k => k.t)
const c = i => CAPS[i]

item(0, 4.62, `<div class="bt" style="font-size:140px">THE GROUNDNUT</div><div class="bt" style="font-size:300px;letter-spacing:.07em;margin-top:-4px"><b>TEST</b></div>`, { y: 178, bk: 1 })
item(0, 4.62, `<div class="pill" style="height:96px;padding:0 30px"><img src="img/primus-logo.svg" style="height:50px"><span style="height:54px;line-height:52px;font-size:32px">zkTLS</span></div>`, { y: 60 })

item(c(4).o0, c(5).o1 + .05, one('shopping_cart_3d', 'a supermarket'))

  WAYS.push({ it, xat, chip: it.el.firstChild, x: it.el.querySelector('.x'), line: it.el.querySelector('.t i') }) }
way('dollar_banknote_3d', 'Cash', '', E.r_cash - .15, E.r_cash + .22, { x: 28, y: 316 })

const ctr = item(c(9).o0 - .05, waysOut, `<div class="ctr"><div class="n" id="cn">4</div><div class="l">ways to pay</div></div>`, { y: 96 })
item(c(17).o0 + .1, c(18).o0 - .04, one('convenience_store_3d', 'the shop already uses…'))
item(c(18).o0, c(19).o0 - .04, `<div class="plate"><img src="img/primus-logo.svg"></div>`, { y: 300, bk: 1 })   // clear of the hair, for the same reason
item(c(19).o0, c(19).o1 + .5, one('locked_with_key_3d', 'proofs, on an <b>encrypted</b> node', { x: OK, at: .9 }))
