<!doctype html>
<html><head><meta charset="utf-8"><title>Meme coins have served its purpose: cover (#v, 1080x1920) and thumbnail (#t, 1280x720)</title>
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
/* img/still.png is one frame of the owner's recording, untouched (1080x1920). The card sits above the head; nothing is
   on the face. The numbers come from data.js (fetch_data.py): the same ones the video shows. The logos are the tokens' own. */
:root{--ink:#0B1F4D;--blue:#1F5FDB;--red:#E5484D}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;font-family:Manrope,sans-serif;font-weight:800;color:var(--ink);background:#C9D6EA}
.abs{position:absolute}
.mono{font-family:Mono,monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.card{position:absolute;border-radius:40px;background:rgba(255,255,255,.96);box-shadow:0 34px 80px rgba(10,24,64,.34),0 0 0 1.5px rgba(11,31,77,.06)}
.h{font-family:Anton,sans-serif;font-weight:400;line-height:.98;text-transform:uppercase;white-space:nowrap}
.chips{display:flex;gap:12px}
.chips div{height:60px;padding:0 22px;border-radius:30px;font-size:29px;line-height:58px;background:#fff;border:2px solid #F3C9CB;color:var(--red);white-space:nowrap}
.logos{position:absolute;display:flex;gap:14px;height:108px;padding:12px 16px;border-radius:54px;background:#fff;box-shadow:0 16px 36px rgba(10,24,64,.28)}
.logos img{width:84px;height:84px;border-radius:42px;display:block}
</style></head>
<body>
<div id="v" style="display:none;position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden">
  <img src="img/still.png" class="abs" style="left:0;top:0;width:1080px;height:1920px">
  <div class="card" style="left:50px;top:104px;width:980px;height:420px">
    <div class="abs mono" style="left:46px;top:38px;font-size:26px;color:var(--blue)">My take · 12 Nov 2026</div>
    <div class="abs" style="right:46px;top:30px;font-size:34px">@i_am_vickyd</div>
    <div class="abs h" style="left:42px;top:84px;font-size:132px">Meme coins</div>
    <div class="abs h" style="left:42px;top:214px;font-size:92px;color:var(--blue)">served its purpose.</div>
    <div class="abs chips" style="left:42px;top:330px"><div id="c0"></div><div id="c1"></div></div>
  </div>
  <div class="logos" id="lg" style="left:50px;top:1700px"></div>
</div>
<div id="t" style="display:none;position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:linear-gradient(100deg,#DDE7F5 0%,#C2D0E6 46%,#A3B5D3 100%)">
  <div class="abs" style="right:0;top:0;width:640px;height:720px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 20%);mask-image:linear-gradient(90deg,transparent 5%,#000 20%)"><img src="img/still.png" style="position:absolute;left:0;top:-250px;width:640px"></div>
  <div class="abs mono" style="left:64px;top:84px;font-size:27px;color:var(--blue)">My take · 12 Nov 2026</div>
  <div class="abs h" style="left:60px;top:132px;font-size:118px">Meme coins</div>
  <div class="abs h" style="left:60px;top:250px;font-size:78px;color:var(--blue)">served its purpose.</div>
  <div class="abs chips" style="left:60px;top:366px"><div id="d0"></div></div>
  <div class="abs chips" style="left:60px;top:440px"><div id="d1"></div></div>
  <div class="logos" id="lg2" style="left:60px;top:548px;height:92px;padding:10px 14px"></div>
  <div class="abs" style="left:60px;top:654px;font-size:34px">@i_am_vickyd</div>
</div>
<script src="data.js"></script>
<script>
const D = window.DATA, m = location.hash.includes('t') ? 't' : 'v', $ = id => document.getElementById(id)
const fees = '$' + (D.pump_fees.total / 1e9).toFixed(2) + 'B in launchpad fees', fall = 'Down ' + Math.round((1 - D.meme_cap.now / 150.6e9) * 100) + '% from the peak'
$('c0').textContent = $('d0').textContent = fees; $('c1').textContent = $('d1').textContent = fall
const ids = ['pepe', 'bonk', 'dogwifcoin', 'peanut-the-squirrel', 'popcat', 'dogecoin']
$('lg').innerHTML = ids.map(i => `<img src="${D.coins.find(c => c.id === i).logo}">`).join('')
$('lg2').innerHTML = ids.map(i => `<img style="width:72px;height:72px" src="${D.coins.find(c => c.id === i).logo}">`).join('')
$(m).style.display = 'block'
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => 0))]).then(() => document.fonts.load('116px Anton')).then(() => document.fonts.load('800 30px Manrope')).then(() => document.fonts.load('700 24px Mono'))
</script>
</body></html>
