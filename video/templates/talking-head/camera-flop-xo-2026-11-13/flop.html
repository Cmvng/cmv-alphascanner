   on Kaito that did not make the top 50 of 851 creators; the Limitless ambassador badge they lost over the first of

   Moves, and the sample each comes from (video/templates/STYLE-LIBRARY.md):
     - giant type BEHIND the head: FLOPS, BREAKTHROUGH, 365 DAYS (S1, S3, S4);
     - their own posts, whole, stacking in on a 24 Sep to 19 Oct timeline (S2 their post cards, S3 screenshots on a

     - objects acting the words: the posts drop into a dustbin and come back out; the Limitless badge falls (S1);
     - stamps: DID NOT COUNT, NEVER AGAIN (S2);
     - 851 dots in rows of 50, the top row lit for "top 50" (S3, a data card that builds with the voice);
     - a checklist that never ticks: what getting the badge back would take (S1);
     - an icon over the head on the word: shrug, swearing face, see-no-evil monkey, heart (S2);
     - a giant number: $50 (S4); word-by-word captions with big key phrases, the follow click (S2).
   This recording frames the owner high: the top of the head sits about y 580, so every card lives in the ceiling

<body>
<div id="bk"></div>
<div id="top"></div>
<div id="cap"></div>
<div id="big"></div>

<div id="end">
  <div class="c" style="top:470px"><div class="eh" id="eh" style="opacity:0">@i_am_vickyd</div></div>
  <div class="c" id="etag" style="top:668px;font-size:44px;letter-spacing:-.01em;opacity:0;white-space:nowrap">One of my flops, and what it taught me</div>
  <div class="c" style="top:820px;padding:0 50px"><span class="ec" id="e0"></span><span class="ec" id="e1"></span><span class="ec" id="e2"></span><span class="ec" id="e3"></span></div>
  <div class="c mono" id="eget" style="top:1170px;font-size:27px;color:var(--blue);opacity:0">My own posts on X · 24 Sep to 5 Nov 2026</div>
  <div class="c" id="eby" style="top:1270px;font-size:46px;opacity:0">Follow <span style="color:var(--blue)">@i_am_vickyd</span> on X</div>
  <div class="c" id="erisk" style="top:1460px;font-size:34px;font-weight:600;color:var(--mute);opacity:0;padding:0 90px">Chin up: you cannot be unlucky for 365 days.</div>
</div>

<script src="plan.js"></script>
<script src="tok.js"></script>
<script>
const P = window.PLAN, $ = id => document.getElementById(id)
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, d) => cl((t - a) / d)
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
let SIG = []
const st = (el, o) => { for (const k in o) { const v = typeof o[k] === 'number' ? +o[k].toFixed(3) : o[k]; el.style[k] = v; SIG.push(v) } }
const NOTEXT = location.hash.includes('notext')
const LAYER = ['behind', 'front'].find(h => location.hash.includes(h)) || 'all'      // the renderer draws each layer on its own
document.body.classList.add('L-' + LAYER)
const I = n => `img/e/${n}.png`, PO = n => `img/posts/p${n}.png`
const wt = i => P.wt[i], we = i => P.we[i]                                             // a spoken word's start and end in the finished video
// ---- every caption word's time in the finished video comes from tokens.py (tok.js)
const CAPS = P.caps.map((c, ci) => {
  const toks = []; let em = false
  for (const raw of c.t.split(' ')) {
    let w = raw; const open = w.startsWith('*'); if (open) { em = true; w = w.slice(1) }
    const close = w.replace(/[.,?!:]+$/, '').endsWith('*'); const k = em; if (close) { em = false; w = w.replace('*', '') }
    toks.push({ w, k })
  }
  toks.forEach((k, i) => k.t = window.TOK[ci][i])
  return { ...c, ci, toks }
})
// key phrases that go big: caption index -> the phrase (the owner's words)
const BIG = { 3: 'big flops.', 8: 'top 50,', 16: '8 videos or 7,', 19: 'dustbin.', 23: '851 creators', 39: 'Limitless badge.', 60: 'too far invested', 68: '$50', 72: 'the hard way.' }
const len = a => a.reduce((n, x) => n + x.w.length + 1, -1)
for (const c of CAPS) {
  const b = BIG[c.ci]; c.small = c.toks; c.chunks = []; let groups = [c.toks]
  if (b) { const bw = b.split(' '), n = bw.length, i0 = c.toks.findIndex((k, i) => bw.every((w, j) => c.toks[i + j] && c.toks[i + j].w.replace(/[.,?!:]+$/, '') === w.replace(/[.,?!:]+$/, '')))
    if (i0 >= 0) { c.big = { text: b, t: c.toks[i0].t }; groups = [c.toks.slice(0, i0), c.toks.slice(i0 + n)]; c.small = groups.flat() } else console.log('BIG PHRASE NOT FOUND', c.ci, b) }
  for (const g of groups) {
    const out = []; let cur = []
    const flush = () => { if (cur.length) out.push(cur); cur = [] }
    for (const k of g) {                                   // up to three words and about 17 letters a line; break after punctuation
      if (cur.length && (cur.length >= 3 || len(cur) + 1 + k.w.length > 17)) flush()
      cur.push(k); if (/[.,?!:]$/.test(k.w) && cur.length >= 2) flush()
    }
    flush()
    const n = out.length
    if (n > 1 && out[n - 1].length === 1 && len(out[n - 2]) + 1 + out[n - 1][0].w.length <= 19 && !/[.,?!:]$/.test(out[n - 2][out[n - 2].length - 1].w)) out.splice(n - 2, 2, [...out[n - 2], ...out[n - 1]])
    c.chunks.push(...out)
  }
}
let CHUNKS = []
CAPS.forEach(c => c.chunks.forEach((ch, i) => CHUNKS.push({ c, ch, t0: i === 0 ? Math.min(ch[0].t, c.o0) : ch[0].t - .04 })))
CHUNKS.forEach((x, i) => { const nx = CHUNKS[i + 1]; x.t1 = Math.min(nx ? nx.t0 : 1e9, (x.c.chunks[x.c.chunks.length - 1] === x.ch ? x.c.o1 + .3 : 1e9)) })
const capHtml = ch => ch.map(k => `<span${k.k ? ' class="k"' : ''}>${k.w}</span>`).join('')

// ---- things over and beside the head (in front), and behind it (bk)
const TOP = $('top'), ITEMS = []
function item(a, b, html, o = {}) {
  const el = document.createElement('div'); el.className = 'it'; el.style.top = (o.y ?? 150) + 'px'; el.innerHTML = html; (o.bk ? $('bk') : TOP).appendChild(el)
  if (o.x != null) { el.style.width = 'auto'; el.style.left = o.x + 'px' }
  const it = { a, b, el, bk: !!o.bk, rot: o.rot || 0 }; ITEMS.push(it); return it
}
const ic = n => `<div class="ic"><img src="${I(n)}"></div>`
const lb = s => `<div class="lb">${s}</div>`
const one = (n, label) => `<div class="icw">${ic(n)}</div>${lb(label)}`
const pop = (el, t, at, d = .3) => st(el, { opacity: seg(t, at, .1), transform: `scale(${(.6 + .4 * back(seg(t, at, d))).toFixed(4)})` })

// 0. the hook: FLOPS behind the head, the handle above
const S1 = wt(20) - .3
item(0, S1, `<div class="bt" style="font-size:112px">ONE OF MY</div><div class="bt" style="font-size:330px;margin-top:2px"><b>FLOPS</b></div>`, { y: 200, bk: 1 })
item(0, S1, `<div class="pill">@i_am_vickyd<span>a flop story · 13 Nov 2026</span></div>`, { y: 50 })

// 1. a month ago: XO Market's campaign on Kaito, for the top 50
const S2 = wt(54) - .3
item(wt(24) - .15, S2, `<div class="chip"><img src="${I('spiral_calendar_3d')}">about <b>a month ago</b></div>`, { y: 60 })
item(wt(35) - .12, S2, `<div class="plate"><img src="img/logo/xo_logo.svg"></div>`, { y: 190 })
const K1 = item(wt(42) - .12, S2, `<div class="chips"><div class="chip" id="kai">on <b>Kaito</b></div><div class="chip" id="t50" style="opacity:0"><img src="${I('trophy_3d')}">for the <b>top 50</b></div></div>`, { y: 380 })

// 2. "my first ever approach": their first XO post, whole, then pushed in on its first line
const S3 = wt(87) - .35, PI1 = wt(60) - .25
const P1W = 1196, P1H = 3108, CW = 940, CH = Math.round(400 * CW / P1W)
item(S2, S3, `<div class="shot" id="p1s"><img src="${PO(1)}" id="p1i"><div class="hl" id="p1h"></div></div><div class="lab" id="p1l">my first XO post · <b>24 Sep 2026</b></div>`, { y: 46 })

// 3-4, 7. the posts: they stack in on a timeline, drop into the dustbin, and come back out
const POSTS = [[1, 3108, '24 Sep'], [2, 4396, '29 Sep'], [3, 4060, '1 Oct'], [4, 2724, '4 Oct'], [5, 2580, '12 Oct'], [6, 7200, '15 Oct'], [7, 5220, '17 Oct'], [8, 3548, '19 Oct']]
const PH = 380, GAP = 8, PWS = POSTS.map(([, h]) => 1196 / h * PH), X0 = (1080 - PWS.reduce((a, b) => a + b, 0) - GAP * 7) / 2
const PX = PWS.map((w, i) => X0 + PWS.slice(0, i).reduce((a, b) => a + b, 0) + GAP * i)
const S7 = wt(208) - .25
item(wt(87) - .3, S7, `<div id="prow">${POSTS.map(([n], i) => `<div class="pst" id="ps${i}" style="left:${PX[i].toFixed(1)}px;width:${PWS[i].toFixed(1)}px"><img src="${PO(n)}"></div>`).join('')}
  <div id="tline"></div>${PX.map((x, i) => `<i class="tdot" id="td${i}" style="left:${(x + PWS[i] / 2).toFixed(1)}px"></i>`).join('')}
  <div class="tdate" id="dA" style="left:40px">24 SEP 2026</div><div class="tdate" id="dB" style="right:40px">19 OCT</div></div>`, { y: 60 })
const BIN_Y = 250, BIN_C = [540, BIN_Y + 115 - 60]                                        // the bin's centre, in the row's own coordinates
const TA = i => wt(96) - .15 + i * .26, TB = i => wt(113) - .05 + i * .1, TC = i => wt(195) - .3 + i * .09
