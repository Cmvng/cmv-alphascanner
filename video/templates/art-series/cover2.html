<!doctype html>
<html>
<!-- CUT 01 cover (1080x1920) and thumbnail (1280x720, ?thumb): the artist at the paper, in the cut's warm grade. -->
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:IS;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/instrument-serif-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:GV;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/great-vibes-latin-400-normal.woff2) format('woff2')}
html,body{margin:0;background:#000;overflow:hidden}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.lay{position:absolute;inset:0}
#im{position:absolute}
#vig{background:radial-gradient(ellipse 80% 60% at 50% 38%,rgba(0,0,0,0) 40%,rgba(0,0,0,.4) 74%,rgba(0,0,0,.8) 100%)}
#shade{background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 46%,rgba(0,0,0,.82) 70%,rgba(0,0,0,.95) 100%)}
#grain{background:url(grain/g3.png);background-size:100% 100%;mix-blend-mode:overlay;opacity:.07}
.em{position:absolute;border-radius:50%;mix-blend-mode:screen;background:radial-gradient(circle,#fff6d8 0%,#ffc56a 22%,rgba(255,120,30,.75) 45%,rgba(255,80,0,0) 72%)}
#txt{position:absolute;left:0;right:0;bottom:250px;text-align:center;color:#fff}
.k{font:400 28px/1 IS,serif;letter-spacing:10px;color:rgba(255,255,255,.82);margin-bottom:40px}
.t{font:400 124px/1.02 IS,serif;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.s{font:400 190px/1 GV,cursive;margin-top:-10px;text-shadow:0 0 34px rgba(255,140,50,.6),0 2px 20px rgba(0,0,0,.5)}
.h{font:400 32px/1 IS,serif;letter-spacing:5px;color:rgba(255,255,255,.86);margin-top:40px}
.thumb #st{width:1280px;height:720px}
.thumb #vig{background:radial-gradient(ellipse 60% 85% at 28% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 74%,rgba(0,0,0,.92) 100%)}
.thumb #shade{background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 36%,rgba(0,0,0,.85) 58%,#000 100%)}
.thumb #txt{left:660px;right:40px;bottom:auto;top:0;height:720px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.thumb .k{font-size:20px;margin-bottom:22px}.thumb .t{font-size:84px}.thumb .s{font-size:128px;margin-top:-6px}.thumb .h{font-size:22px;margin-top:22px}
</style>
</head>
<body>
<div id="st">
  <img id="im" src="fg/0198.jpg">
  <div id="vig" class="lay"></div>
  <div id="shade" class="lay"></div>
  <div id="em" class="lay"></div>
  <div id="grain" class="lay"></div>
  <div id="txt"><div class="k">SESSION 01 · 62 × 94 CM</div><div class="t">Drawing the<br>Gamdom castle</div><div class="s">by hand.</div><div class="h">#Gamdom100kRound2</div></div>
</div>
<script>
const thumb = location.search.includes('thumb'), im = document.getElementById('im')
if (thumb) { document.body.classList.add('thumb'); Object.assign(im.style, { width: '1000px', height: '1000px', left: '-120px', top: '-140px' }) }
else Object.assign(im.style, { width: '1920px', height: '1920px', left: '-260px', top: '-40px' })
// a few embers, fixed positions
let rs = 5; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647
const W = thumb ? 1280 : 1080, H = thumb ? 720 : 1920
document.getElementById('em').innerHTML = Array.from({ length: thumb ? 22 : 40 }, () => { const s = 10 + rnd() * 30; return `<i class="em" style="left:${(rnd() * W).toFixed(0)}px;top:${(H * (0.35 + rnd() * 0.65)).toFixed(0)}px;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;opacity:${(.35 + rnd() * .6).toFixed(2)}"></i>` }).join('')
window.ready = document.fonts.load('124px IS').then(() => document.fonts.load('124px GV')).then(() => im.decode())
</script>
</body>
</html>
