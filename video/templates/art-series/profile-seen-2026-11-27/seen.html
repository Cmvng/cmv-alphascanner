   as X draws them, his app's real screens, his bio words and the line he quoted. Nothing is drawn over his art or over a real screen except our
   rings, chips and type, which are labelled. Light sky and deep navy grounds, never black. */
:root{--ink:#0B1F4D;--brand:#1F5FDB;--sky:#7CC4FF}
*{box-sizing:border-box}

<script>
const $ = id => document.getElementById(id), FPS = 30, { E, cl, lerp } = M, CM = window.CM
const V = location.hash.includes('v') || innerHeight > innerWidth, W = V ? 1080 : 1920, H = V ? 1920 : 1080, CX = W / 2, CY = H / 2
for (const el of [document.documentElement, document.body, $('stage')]) { el.style.width = W + 'px'; el.style.height = H + 'px' }
$('ringsvg').setAttribute('width', W); $('ringsvg').setAttribute('height', H)
const BEAT = .375, DROP = 12
let SIG = []
const css = (el, k, v) => { if (el.style[k] !== v) el.style[k] = v; SIG.push(v) }
const seg = (t, a, d) => cl((t - a) / d)
const r1 = x => Math.round(x * 10) / 10, r3 = x => Math.round(x * 1000) / 1000, r5 = x => x.toFixed(5)
const mk = (tag, cls, parent, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const expoOut = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)
const quint = u => u < .5 ? 16 * u ** 5 : 1 - Math.pow(-2 * u + 2, 5) / 2
const plog = (a, b, u) => a * Math.pow(b / a, u)            // perceptual zoom
const key = (t, keys) => {                                    // [t, value..., ease] keyframes; {z:} values zoom perceptually
  if (t <= keys[0][0]) return keys[0].slice(1, -1).map(v => typeof v === 'object' ? v.z : v)
  for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t <= b[0]) { const e = b[b.length - 1], u = (typeof e === 'function' ? e : E[e] || E.standard)(seg(t, a[0], b[0] - a[0]))
    return a.slice(1, -1).map((v, j) => typeof v === 'object' ? plog(v.z, b[j + 1].z, u) : lerp(v, b[j + 1], u)) } }
  return keys[keys.length - 1].slice(1, -1).map(v => typeof v === 'object' ? v.z : v)
}
// placing an element so that its own point (ix, iy) lands on screen (sx, sy) at scale s
const place = (el, ix, iy, sx, sy, s, rot = 0) => css(el, 'transform', `translate(${r1(sx)}px,${r1(sy)}px) rotate(${r3(rot)}deg) scale(${r5(s)}) translate(${-ix}px,${-iy}px)`)

// ======================= 1. THE ARTIST: five of his eyes, the iris locked to one circle =======================
const EYES = { e1: { w: 1440, h: 1174, cx: 676, cy: 627, r: 265 }, e2: { w: 1438, h: 1130, cx: 625, cy: 421, r: 298 },
  e3: { w: 3072, h: 2315, cx: 1528, cy: 1190, r: 502 }, e5: { w: 1440, h: 1672, cx: 678, cy: 830, r: 214 }, e6: { w: 1440, h: 1020, cx: 920, cy: 496, r: 264, lx: 969.6, ly: 552 } }
const RI = 210                                    // the iris lock (e5's iris is 214 at its own pixels)
// [time, eye, rotation, his own word or '', kind]: one drawing a bar on a growing pile, then hard cuts in steps
const SEQ = [[-9, 'e3', 0, '', 'hook'], [1.5, 'e6', -2.6, 'Charcoal', 'pile'], [3.0, 'e5', 2.2, 'pencil', 'pile'], [4.5, 'e2', 2.8, 'artist', 'pile'], [6.0, 'e1', -1.6, '& trader', 'pile'],
  [7.5, 'e3', -3.0, '', 'cut'], [8.25, 'e1', 2.0, '', 'cut'], [9.0, 'e5', -2.4, '', 'cut'], [9.375, 'e2', 3.0, '', 'cut'], [9.75, 'e3', -1.5, '', 'cut'], [10.125, 'e1', 1.5, '', 'cut']]
const SH = {}
for (const k in EYES) { const e = EYES[k], d = mk('div', 'sheet', $('pile')); d.style.width = e.w + 'px'; d.style.height = e.h + 'px'; mk('img', '', d).src = `img/${k}.jpg`; SH[k] = d }
const LOCK = mk('div', 'sheet', $('pile')); LOCK.style.width = '1440px'; LOCK.style.height = '1020px'; mk('img', '', LOCK).src = 'img/e6.jpg'
const PL = V ? { x: 700, y: 1000 } : { x: 1356, y: 540 }        // where the light sits across the drop
const ICX = CX, ICY = V ? 900 : CY                             // the iris lock point
function rhyme(t) {
  const hookS = V ? 500 : 402, sHook = t < 1.47 ? plog(hookS, RI, expoOut(seg(t, 0, 1.47))) : RI
  for (const k in SH) {
    let last = -1; SEQ.forEach((s, i) => { if (s[1] === k && s[0] <= t + 1e-6) last = i })
    const el = SH[k], e = EYES[k]
    if (last < 0 || t >= 10.5) { css(el, 'opacity', '0'); css(el, 'zIndex', '0'); continue }
    const [ta, , rot, , kind] = SEQ[last]
    const R = kind === 'hook' ? sHook : RI
    const land = kind === 'pile' ? E.standard(seg(t, ta, 4 / 30)) : 1, k2 = 1.02 - .02 * land
    const sh = kind === 'pile' ? lerp(24, 6, land) : 10
    css(el, 'zIndex', String(10 + last)); css(el, 'opacity', '1')
    css(el, 'boxShadow', `0 ${r1(sh)}px ${r1(sh * 2)}px rgba(11,31,77,${kind === 'pile' ? r3(.32 - .2 * land) : .14})`)
    place(el, e.cx, e.cy, ICX, ICY, R / e.r * k2, rot)
  }
  // the still bar: e6 alone, anchored on its catchlight; a slow push, a snap at the pre-hit, then stillness
  const on = t >= 10.5 && t < DROP
  css(LOCK, 'opacity', on ? '1' : '0'); css(LOCK, 'zIndex', '40')
  const s = t < 11.633 ? plog(.90, .95, E.gentle(seg(t, 10.5, 1.133))) : plog(.95, .994, expoOut(seg(t, 11.633, 4 / 30)))
  place(LOCK, EYES.e6.lx, EYES.e6.ly, PL.x, PL.y, s)
  css(LOCK, 'boxShadow', '0 10px 30px rgba(11,31,77,.18)')
  // his bio words, one a bar, readable
  const w = SEQ.filter(x => x[3] && t >= x[0] && t < x[0] + 1.42).pop(), wh = $('whisper')
  if (w) { if (wh.textContent !== w[3]) { wh.textContent = w[3]; wh.style.fontSize = (V ? 60 : 50) + 'px'; wh.style.lineHeight = (V ? 104 : 88) + 'px' }
    const a = seg(t, w[0] + .04, .25), b = seg(t, w[0] + 1.22, .2)
    css(wh, 'opacity', r3(E.enter(a) * (1 - b)) + ''); css(wh, 'transform', `translate(${Math.round(CX - wh.offsetWidth / 2)}px,${Math.round((V ? 1540 : H - 140) + 18 * (1 - E.enter(a)) - 12 * b)}px)`) }
  else css(wh, 'opacity', '0')
  SIG.push(w ? w[3] : '-')
}

// ======================= 2. THE LIGHT: the drop cuts to the lure of his avatar, which pulls back to its circle ==========
const LURE = { x: 1428.6, y: 648.8 }, AC = { x: 1042, y: 1042, r: 914.5 }       // the avatar drawing (2048): lure, X's circle
const WHO_C = V ? { x: 540, y: 700, r: 440 } : { x: 560, y: 540, r: 380 }
const IRIS = { x: ICX, y: ICY, r: RI }
// where the dots gather (#c: the cover art, the disc at the left of the cover's safe band, or at the right of the thumbnail)
const CVR = location.hash.includes('c')
const DISC = CVR ? (V ? { x: 300, y: 963, r: 235 } : { x: 1290, y: 540, r: 380 }) : V ? { x: 540, y: 1100, r: 400 } : { x: 1180, y: 540, r: 450 }
const ENDC = V ? { x: 540, y: 640, r: 330 } : { x: 560, y: 520, r: 330 }
const angLure = Math.atan2(LURE.x - AC.x, -(LURE.y - AC.y))                     // 44.5 degrees clockwise from 12
function avState(t) {
  // returns {show, s, cx, cy (screen point of the circle centre), mask (radius in image px), ring (0..1 drawn)}
  if (t < DROP) return { show: 0 }
  if (t < 12.733) { const u = expoOut(seg(t, DROP, .733)), s = plog(.979, WHO_C.r / AC.r, u)
    const c0 = { x: PL.x + .979 * (AC.x - LURE.x), y: PL.y + .979 * (AC.y - LURE.y) }
    const [x, y] = M.arc(u, [c0.x, c0.y], [WHO_C.x, WHO_C.y], 80)
    const mask = lerp(1500, AC.r, E.standard(seg(t, DROP, 8 / 30)))
    return { show: 1, s, cx: x, cy: y, mask, ring: seg(t, 12.367, .366) }
  }
  if (t < 19.5) { const b = 1 + .01 * Math.sin((t - 12.733) * Math.PI * 2 / 4)
    return { show: 1, s: WHO_C.r / AC.r * b, cx: WHO_C.x, cy: WHO_C.y, mask: AC.r, ring: 1 } }
  if (t < 19.75) { const u = E.enter(seg(t, 19.5, .25)), r = lerp(WHO_C.r, IRIS.r, u)
    return { show: 1, s: r / AC.r, cx: lerp(WHO_C.x, IRIS.x, u), cy: lerp(WHO_C.y, IRIS.y, u), mask: AC.r, ring: 1 - u } }
  if (t < 46.5) return { show: 0 }
  if (t < 47.25) return { show: 1, op: cl((t - 46.5) / .5), s: DISC.r / AC.r, cx: DISC.x, cy: DISC.y, mask: AC.r, ring: seg(t, 46.875, .375) }
  const u = E.standard(seg(t, 47.25, .75)), r = plog(DISC.r, ENDC.r, u), b = t > 48 ? 1 + .008 * Math.sin((t - 48) * Math.PI * 2 / 4) : 1
  return { show: 1, s: r / AC.r * b, cx: lerp(DISC.x, ENDC.x, u), cy: lerp(DISC.y, ENDC.y, u), mask: AC.r, ring: 1 }
}
function avatar(t) {
  const a = avState(t), el = $('av'), rc = $('ringc')
  css(el, 'opacity', a.show ? r3(a.op === undefined ? 1 : a.op) + '' : '0')
  if (!a.show) { css(rc, 'opacity', '0'); SIG.push('av0'); return }
  place(el, AC.x, AC.y, a.cx, a.cy, a.s)
  css(el, 'clipPath', `circle(${r1(a.mask)}px at ${AC.x}px ${AC.y}px)`)
  // the white ring draws on clockwise from the lure's angle
  const R = AC.r * a.s + 5, L = 2 * Math.PI * R, k = cl(a.ring || 0)
  rc.setAttribute('cx', r1(a.cx)); rc.setAttribute('cy', r1(a.cy)); rc.setAttribute('r', r1(R))
  rc.setAttribute('transform', `rotate(${r3(angLure * 180 / Math.PI - 90)} ${r1(a.cx)} ${r1(a.cy)})`)
  css(rc, 'strokeDasharray', `${r1(L * k)} ${r1(L)}`); css(rc, 'opacity', k > 0 ? '1' : '0')
  SIG.push(r1(R) + '|' + r3(k) + '|' + r1(a.cx) + ',' + r1(a.cy))
}

// ======================= 3. WHO: the wordmark is his name, then his handle, then his followers ======================
let WM, HAN, SINCE, FOL, FOLL, SRC
const WL = V ? { wx: 540, wy: 1210, u: 5.6, hy: 1420, sy: 1530, fy: 1615, srcY: 1830, align: 'center' } : { wx: 1040, wy: 250, u: 7, hy: 520, sy: 638, fy: 722, srcY: 960, align: 'left' }
function buildWho() {
  // the site's own logo: three bars leaning 11 degrees, and "cmvng" in Manrope 800 (dark-theme colours on navy)
  const u = WL.u, box = mk('div', 'w', $('who')); box.style.height = 28 * u + 'px'
  const bars = [[13, 15, 10], [20, 9, 16], [27, 3, 22]].map(([x, y, h]) => { const b = mk('div', '', box); b.style.cssText = `position:absolute;left:${x * u}px;top:${y * u}px;width:${5 * u}px;height:${h * u}px;border-radius:${1.6 * u}px;background:#4C84F0;transform-origin:50% 100%;opacity:0`; return b })
  const word = mk('div', '', box); word.style.cssText = `position:absolute;left:${38 * u}px;top:${-2.6 * u}px;font:800 ${29 * u}px/1 Man,sans-serif;color:#fff;white-space:pre`
  const lets = [...'cmvng'].map(c => { const s = mk('span', '', word); s.textContent = c; s.style.cssText = 'display:inline-block;opacity:0'; return s })
  const tw = Math.round(38 * u + word.getBoundingClientRect().width)
  box.style.width = tw + 'px'; box.style.left = Math.round(WL.align === 'center' ? WL.wx - tw / 2 : WL.wx - 13 * u) + 'px'; box.style.top = WL.wy + 'px'
  WM = { box, bars, lets }
  HAN = mk('div', 'w mono', $('who')); HAN.textContent = '@i_am_vickyd'; HAN.style.cssText += `font-size:${V ? 76 : 84}px;color:var(--sky);opacity:0`
  SINCE = mk('div', 'chip', $('who')); SINCE.textContent = 'on X since Aug 2011 · Nigeria'; SINCE.style.cssText += `font-size:${V ? 34 : 38}px;line-height:${V ? 74 : 80}px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.88);border:1.5px solid rgba(255,255,255,.26);opacity:0`
  FOL = mk('div', 'w', $('who')); FOL.style.cssText += `font:800 ${V ? 120 : 132}px/1 Man,sans-serif;color:#fff;opacity:0`; FOL.textContent = '12,719'
  FOLL = mk('div', 'w', $('who')); FOLL.style.cssText += `font:600 ${V ? 50 : 54}px/1 Man,sans-serif;color:rgba(255,255,255,.82);opacity:0`; FOLL.textContent = 'followers'
  SRC = mk('div', 'w mono', $('who')); SRC.style.cssText += `font-size:${V ? 26 : 22}px;letter-spacing:.16em;color:rgba(255,255,255,.55);opacity:0`; SRC.textContent = 'X · 27 NOV 2026'
}
const ax = (el, x) => WL.align === 'center' ? Math.round(x - el.offsetWidth / 2) : Math.round(x)
function who(t) {
  const won = t >= 13.2 && t < 19.4; css($('who'), 'display', won ? 'block' : 'none'); if (!won) { SIG.push('who0'); return }
  const fr = Math.round(t * FPS) / FPS, out = i => E.exit(seg(t, 19.0 + i * .04, .26))
  WM.bars.forEach((b, i) => { const land = 13.5 + i * BEAT, u = E.standard(seg(t, land - .22, .22)), x = out(0)
    css(b, 'opacity', r3(cl(u * 3) * (1 - x)) + ''); css(b, 'transform', `skewX(-11deg) scaleY(${r3(.08 + .92 * u)}) translateY(${r1(-x * 40)}px)`) })
  WM.lets.forEach((s, i) => { const a = 14.625 - .3 + i * .03, u = E.enter(seg(t, a, .3)), x = out(1)
    css(s, 'opacity', r3(u * (1 - x)) + ''); css(s, 'transform', `translateY(${Math.round((1 - u) * 60 - x * 40)}px)`) })
  const hu = E.enter(seg(t, 15.0 - .3, .3)), hx = out(2)
  css(HAN, 'opacity', r3(hu * (1 - hx)) + ''); css(HAN, 'transform', `translate(${ax(HAN, WL.wx)}px,${Math.round(WL.hy + 40 * (1 - hu) - 40 * hx)}px)`)
  const su = E.standard(seg(t, 15.0 - .05, .25)), sx = out(3)
  css(SINCE, 'opacity', r3(su * (1 - sx)) + ''); css(SINCE, 'transform', `translate(${ax(SINCE, WL.wx)}px,${Math.round(WL.sy - 40 * sx)}px) scale(${r3(.9 + .1 * su)})`)
  // the followers: a fast odometer that slows on its last digits and lands on the bar (16.5), no bounce
  const v = Math.round(12719 * expoOut(seg(fr, 15.9, .6))), str = v.toLocaleString('en-US'); if (FOL.textContent !== str) FOL.textContent = str
  const fu = cl((t - 15.9) / .15), fx = out(4)
  css(FOL, 'opacity', r3(fu * (1 - fx)) + ''); css(FOL, 'transform', `translate(${V ? Math.round(WL.wx - 140 - FOL.offsetWidth / 2) : Math.round(WL.wx)}px,${Math.round(WL.fy - 40 * fx)}px)`)
  css(FOLL, 'opacity', r3(fu * (1 - fx)) + ''); css(FOLL, 'transform', `translate(${V ? Math.round(WL.wx + 70) : Math.round(WL.wx + 4)}px,${Math.round(WL.fy + (V ? 50 : 150) - 40 * fx)}px)`)
  css(SRC, 'opacity', r3(cl((t - 15.0) / .3) * (1 - out(5))) + ''); css(SRC, 'transform', `translate(${ax(SRC, WL.wx)}px,${WL.srcY}px)`)
  SIG.push(str)
}

// ======================= 4. THE TRADER: from the vein chart in his drawing to his own Bitcoin chart (one camera) ========
const TW = { e1: mk('div', 'abs', $('tw')), ch: mk('div', 'abs', $('tw')) }
TW.e1.style.cssText += 'width:1440px;height:1174px'; mk('img', '', TW.e1).src = 'img/e1.jpg'
TW.ch.style.cssText += 'width:3064px;height:1884px;border-radius:10px;overflow:hidden;box-shadow:0 30px 70px rgba(11,31,77,.22)'; mk('img', '', TW.ch).src = 'img/btc.jpg'
$('tw').style.transformOrigin = '0 0'
const CH0 = { x: 1540, y: 650 - 968 }                                       // the chart in the e1 world, his last candle level with the veins
const ZIGC = { x: CH0.x + 2366, y: CH0.y + 1194 }
const CHW = V ? 1080 / 3064 : 1756 / 3064                                   // the chart whole
const TCAM = [[19.75, 676, 627, { z: RI / 265 }, 'linear'], [20.0, 676, 627, { z: RI / 265 }, 'linear'], [21.0, 1100, 650, { z: 1.0 }, 'gentle'],
  [24.0, CH0.x + 1532, CH0.y + 942, { z: CHW }, quint], [25.5, ZIGC.x, ZIGC.y, { z: 1.0 }, 'gentle']]
function trader(t) {
  const on = t >= 19.75 && t < 25.5
  css($('tw'), 'opacity', on ? '1' : '0'); if (!on) { SIG.push('tw0'); return }
  const [x, y, s] = key(t, TCAM)
  css($('tw'), 'transform', `translate(${r1(CX - x * s)}px,${r1(ICY - y * s)}px) scale(${r5(s)})`)
  css(TW.ch, 'transform', `translate(${CH0.x}px,${CH0.y}px)`)
  SIG.push('tw' + r1(x) + r5(s))
}

// ======================= 5. HIS POSTS AND HIS APP: each X card arrives from, and leaves into, its own avatar circle ===
const AVK = { x: 120 / 1644, y: 110 / 1644, r: 72 / 1644 }          // X draws the avatar at (120,110) r 72 on a 1644-wide card
function card(src, w, h, cls = 'card') { const d = mk('div', 'abs ' + cls, $('cards')); d.style.width = w + 'px'; d.style.height = h + 'px'; mk('img', '', d).src = src; return d }
const CHM = mk('div', 'abs', $('cards')); CHM.style.cssText += 'width:3064px;height:1884px'; mk('img', '', CHM).src = 'img/btc.jpg'
