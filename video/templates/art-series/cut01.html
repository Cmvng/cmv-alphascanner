<!doctype html>
<html>
<!-- Gamdom art series, CUT 01 ("The dark comes first"): the first session's time-lapse as a dark teaser.
     Black story cards between black-and-white shots of the drawing, ash drifting, film grain, then a beat-cut montage
     on the music's drop and an end card. Rendered frame by frame: window.seek(t) draws the frame at t seconds. -->
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/anton-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:PF;font-style:italic;font-weight:700;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/playfair-display-latin-700-italic.woff2) format('woff2')}
@font-face{font-family:JBM;font-weight:500;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.lay{position:absolute;inset:0;overflow:hidden}
#win{position:absolute;overflow:hidden}
#win img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#rgbA,#rgbB{mix-blend-mode:screen;opacity:0}
#vig{background:radial-gradient(ellipse 72% 58% at 50% 48%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 68%,rgba(0,0,0,.96) 100%)}
#tint{background:linear-gradient(180deg,rgba(40,44,52,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(20,18,16,.4));mix-blend-mode:multiply}
#grain{background-size:1080px 1920px;mix-blend-mode:overlay;opacity:.22}
#flash{background:#fff;opacity:0}
#black{background:#000;opacity:0}
.p{position:absolute;border-radius:50%;background:#d9d9d9}
.card{position:absolute;left:90px;right:90px;top:0;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.line{font:400 68px/1.18 'Liberation Serif',serif;color:#ECECEC;letter-spacing:.3px;text-shadow:0 0 14px #000,0 0 28px #000,0 0 44px #000,0 0 24px rgba(255,255,255,.1)}
.line em{font:italic 700 70px PF,serif;color:#fff}
.lab{font:500 22px JBM,monospace;letter-spacing:9px;color:#8C8C8C;text-shadow:0 0 12px #000,0 0 24px #000;text-transform:uppercase;margin-bottom:46px}
#hud{position:absolute;inset:0;font:500 22px JBM,monospace;letter-spacing:6px;color:rgba(255,255,255,.72)}
#hud .tl{position:absolute;left:54px;top:70px}
#hud .tr{position:absolute;right:54px;top:70px;display:flex;align-items:center;gap:14px}
#hud .tr i{width:16px;height:16px;border-radius:50%;background:#E0242E;display:inline-block}
#hud .bl{position:absolute;left:54px;bottom:78px;color:rgba(255,255,255,.55)}
#hud .br{position:absolute;right:54px;bottom:78px;color:rgba(255,255,255,.55)}
#word{position:absolute;left:0;right:0;top:0;height:1920px;display:flex;align-items:center;justify-content:center;font:400 250px/1 Anton;letter-spacing:6px;color:#fff;text-transform:uppercase;text-shadow:0 10px 60px rgba(0,0,0,.6)}
#end .big{font:italic 700 84px/1.12 PF,serif;color:#fff}
#end .tag{font:500 24px JBM,monospace;letter-spacing:6px;color:#9A9A9A;margin-top:56px}
</style>
</head>
<body>
<div id="st">
  <div id="foot" class="lay"><div id="win"><img id="im"><img id="rgbA"><img id="rgbB"></div></div>
  <div id="tint" class="lay"></div>
  <div id="vig" class="lay"></div>
  <div id="pts" class="lay"></div>
  <div id="hud" class="lay"><div class="tl">CUT 01</div><div class="tr"><i></i>REC</div><div class="bl">SESSION 01</div><div class="br">01 / ??</div></div>
<svg id="crk" class="lay" viewBox="0 0 1080 1920" style="opacity:0"><path d="M610 910 L646 850" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M822 705 L819 635" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M923 660 L989 683" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M1150 642 L1204 686" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M1228 599 L1298 605" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M1311 527 L1327 459" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M540 960 L610 910 L676 868 L733 784 L822 705 L923 660 L1041 659 L1150 642 L1228 599 L1311 527" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M581 1024 L647 1048" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M714 1243 L777 1274" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M797 1532 L864 1551" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M938 1719 L1007 1728" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M540 960 L581 1024 L659 1138 L714 1243 L733 1361 L772 1453 L797 1532 L847 1630 L938 1719 L1014 1824" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M501 1010 L513 1079" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M364 1173 L294 1166" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M299 1258 L296 1328" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M73 1466 L47 1531" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M16 1567 L32 1636" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M-31 1641 L-101 1636" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M540 960 L501 1010 L426 1121 L364 1173 L299 1258 L247 1332 L163 1377 L73 1466 L16 1567 L-31 1641" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M454 967 L402 920" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M310 1032 L275 1092" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M254 1081 L184 1083" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M-26 1348 L-55 1412" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M540 960 L454 967 L374 1000 L310 1032 L254 1081 L194 1204 L126 1259 L29 1315 L-26 1348 L-128 1388" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M-172 1079 L-242 1087" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M540 960 L463 885 L360 822 L242 811 L186 795 L68 812 L11 852 L-83 908 L-125 952 L-172 1079" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M547 623 L490 582" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M513 517 L458 474" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M373 358 L358 290" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M325 285 L348 219" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M540 960 L550 876 L549 735 L547 623 L513 517 L436 415 L373 358 L325 285 L284 231 L246 145" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M895 693 L895 623" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/><path d="M540 960 L601 888 L691 845 L749 816 L807 777 L895 693 L929 609 L975 496 L980 407 L975 276" pathLength="1" fill="none" stroke="#d8d8d8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg>
  <div id="ghost" class="lay" style="opacity:0"><img id="gim" src="fr/0256.jpg" style="position:absolute;left:0;top:0;transform-origin:0 0;filter:grayscale(1) contrast(1.6) brightness(.9)"></div>
  <div id="cards" class="lay"></div>
  <div id="word"></div>
  <div id="end" class="card"><div class="lab">Cut 01 / ??</div><div class="big">The dark<br>comes first.</div><div class="tag">#Gamdom100kRound2</div></div>
  <div id="black" class="lay"></div>
  <div id="flash" class="lay"></div>
  <div id="grain" class="lay"></div>
</div>
<script>
const FPS = 30, FR = 'fr/', NFR = 813, SW = 1080, SH = 1080
// story cards on black: [start, end, label, html]
const CARDS = [
  [0.00, 2.40, 'Cut 01', 'They knocked me down.'],
  [5.80, 7.30, '', 'Thought I&rsquo;d stay there.'],
  [10.30, 11.80, '', 'Everything went <em>dark.</em>'],
  [15.80, 17.20, '', 'So that&rsquo;s where<br>I <em>started.</em>'],
]
// footage shots: t0, t1, source start, speed, rect start {cx, cy, h}, rect end, window ('full' 1080x1920 or 'tall' 1080x1350)
const SHOTS = [
  { t0: 2.40, t1: 5.80, s0: 0.20, sp: 1.0, a: { cx: 320, cy: 540, h: 1080 }, b: { cx: 330, cy: 560, h: 900 } },
  { t0: 7.30, t1: 10.30, s0: 4.00, sp: 1.0, a: { cx: 520, cy: 560, h: 1000 }, b: { cx: 560, cy: 520, h: 860 } },
  { t0: 11.80, t1: 15.80, s0: 10.40, sp: 1.7, a: { cx: 230, cy: 300, h: 560 }, b: { cx: 330, cy: 420, h: 820 }, glitch: true },
  { t0: 17.20, t1: 20.00, s0: 18.20, sp: 3.0, a: { cx: 230, cy: 470, h: 700 }, b: { cx: 760, cy: 480, h: 760 }, glitch: true },
  // the drop: one shot per beat (94.9 bpm), a white flash and a punch-in on each
  { t0: 20.20, t1: 20.83, s0: 8.50, sp: 0, a: { cx: 780, cy: 280, h: 520 }, b: { cx: 780, cy: 290, h: 500 }, punch: 1, word: 'KICKED' },
  { t0: 20.83, t1: 21.47, s0: 15.00, sp: 1.6, a: { cx: 300, cy: 330, h: 600 }, b: { cx: 300, cy: 330, h: 580 }, punch: 1, word: 'DOWN.' },
  { t0: 21.47, t1: 22.10, s0: 1.00, sp: 0, a: { cx: 260, cy: 470, h: 560 }, b: { cx: 270, cy: 470, h: 540 }, punch: 1, glitch: true, word: 'NOT' },
  { t0: 22.10, t1: 22.73, s0: 5.00, sp: 1.0, a: { cx: 640, cy: 470, h: 720 }, b: { cx: 640, cy: 470, h: 700 }, punch: 1, word: 'OUT.' },
  { t0: 22.73, t1: 23.36, s0: 22.00, sp: 1.0, a: { cx: 200, cy: 520, h: 640 }, b: { cx: 210, cy: 520, h: 620 }, punch: 1, glitch: true },
  { t0: 23.36, t1: 24.00, s0: 26.80, sp: 0, a: { cx: 520, cy: 560, h: 1000 }, b: { cx: 520, cy: 560, h: 940 }, punch: 1, win: 'tall' },
]
const END0 = 24.00, TOTAL = 27.60

const $ = id => document.getElementById(id)
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const ramp = (t, a, b) => cl((t - a) / (b - a))
let rs = 1; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647

// cards
$('cards').innerHTML = CARDS.map((c, i) => `<div class="card" id="c${i}">${c[2] ? `<div class="lab">${c[2]}</div>` : ''}<div class="line">${c[3]}</div></div>`).join('')
// ash particles (fixed seeds, positions are a function of t)
rs = 11
const PTS = Array.from({ length: 80 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, vy: 18 + rnd() * 55, vx: -10 + rnd() * 20, w: 1.2 + rnd() * 4.5, o: .12 + rnd() * .5, ph: rnd() * 6.28, bl: rnd() < .3 ? 2 + rnd() * 3 : 0 }))
$('pts').innerHTML = PTS.map((p, i) => `<i class="p" id="p${i}" style="width:${p.w}px;height:${p.w}px;filter:blur(${p.bl}px)"></i>`).join('')

function frameAt(s) { return Math.max(1, Math.min(NFR, Math.round(s * FPS) + 1)) }
function load(img, src) { return new Promise(r => { if (img.dataset.src === src) return r(); img.dataset.src = src; img.onload = () => r(); img.onerror = () => r(); img.src = src }) }

window.seek = async function (t) {
  const sh = SHOTS.find(s => t >= s.t0 && t < s.t1)
  const inCard = CARDS.findIndex(c => t >= c[0] && t < c[1])
  const end = t >= END0
  // footage
  const foot = $('foot'), win = $('win'), im = $('im')
  const jobs = []
  if (sh) {
    foot.style.opacity = 1
    const tall = sh.win === 'tall', vw = 1080, vh = tall ? 1350 : 1920, vy = tall ? 285 : 0
    win.style.cssText = `left:0;top:${vy}px;width:${vw}px;height:${vh}px`
    const k = ease(ramp(t, sh.t0, sh.t1))
    let cx = sh.a.cx + (sh.b.cx - sh.a.cx) * k, cy = sh.a.cy + (sh.b.cy - sh.a.cy) * k, h = sh.a.h + (sh.b.h - sh.a.h) * k
    if (sh.punch) h *= 1 - 0.14 * Math.pow(1 - ramp(t, sh.t0, sh.t0 + 0.18), 2)
    const w = h * vw / vh
    cx = cl(cx, w / 2, SW - w / 2); cy = cl(cy, h / 2, SH - h / 2)
    const sc = vh / h, s = sh.s0 + (t - sh.t0) * sh.sp
    const src = `${FR}${String(frameAt(s)).padStart(4, '0')}.jpg`
    const tf = `translate(${(vw / 2 - cx * sc).toFixed(2)}px,${(vh / 2 - cy * sc).toFixed(2)}px) scale(${sc.toFixed(4)})`
    // grade: black and white, crushed, a slow candle flicker
    const fl = 1 + 0.035 * Math.sin(t * 11.3) * Math.sin(t * 3.7)
    const con = sh.t0 >= 20 ? 1.75 : 1.55, bri = (sh.word ? 0.6 : sh.t0 >= 20 ? 0.86 : 0.8) * fl
    im.style.transform = tf; im.style.filter = `grayscale(1) contrast(${con}) brightness(${bri.toFixed(3)})`
    jobs.push(load(im, src))
    // glitch: three frames of colour split and slice jitter at the start of the shot
    const gl = sh.glitch && t - sh.t0 < 0.1
    for (const [id, dx, f] of [['rgbA', 14, 'grayscale(1) sepia(1) saturate(9) hue-rotate(-50deg) brightness(.9)'], ['rgbB', -14, 'grayscale(1) sepia(1) saturate(9) hue-rotate(150deg) brightness(.9)']]) {
      const e = $(id); e.style.opacity = gl ? .55 : 0
      if (gl) { e.style.transform = `translate(${dx}px,0) ` + tf; e.style.filter = f; jobs.push(load(e, src)) }
    }
    win.style.transform = gl ? `translate(${(rnd() - .5) * 40}px,0)` : 'none'
    $('flash').style.opacity = sh.punch ? (0.75 * Math.pow(1 - ramp(t, sh.t0, sh.t0 + 0.1), 1.5)).toFixed(3) : 0
    $('hud').style.opacity = sh.t0 < 20 ? 1 : 0
    $('hud').querySelector('.tr i').style.opacity = Math.floor(t * 1.6) % 2 ? .25 : 1
  } else { foot.style.opacity = 0; $('flash').style.opacity = 0; $('hud').style.opacity = 0 }
  // montage words: slam in on the beat
  const wd = $('word')
  if (sh && sh.word) { const q = ramp(t, sh.t0, sh.t0 + 0.12); wd.textContent = sh.word; wd.style.opacity = 1; wd.style.transform = `scale(${(1.35 - 0.35 * q).toFixed(3)})` } else wd.style.opacity = 0
  // cards: blur in, hold, fade out
  CARDS.forEach((c, i) => {
    const e = $('c' + i), a = c[0] + 0.35, b = c[1] - 0.2
    const v = t < c[0] || t >= c[1] ? 0 : Math.min(ramp(t, a, a + 0.45), 1 - ramp(t, b, c[1]))
    e.style.opacity = v.toFixed(3); e.style.filter = `blur(${((1 - Math.min(1, ramp(t, a, a + 0.45))) * 10).toFixed(2)}px)`
    e.style.transform = `translateY(${((1 - ramp(t, a, a + 0.6)) * 14).toFixed(1)}px)`
  })
  // end card
  const en = $('end'); const ev = end ? ramp(t, END0 + 0.15, END0 + 0.8) : 0
  en.style.opacity = (ev * (1 - ramp(t, TOTAL - 0.5, TOTAL))).toFixed(3); en.style.filter = `blur(${((1 - ev) * 12).toFixed(2)}px)`
  // cracks under the first line, on its bass hit
  const ck = $('crk'), cq = ramp(t, 0.55, 0.8)
  ck.style.opacity = t < 2.4 ? (0.38 * Math.min(1, cq * 4) * (1 - ramp(t, 2.0, 2.4))).toFixed(3) : 0
  ck.querySelectorAll('path').forEach((e, i) => e.setAttribute('stroke-dashoffset', (1 - cl(cq * 1.3 - (i % 4) * 0.08)).toFixed(3)))
  // a ghost of the castle tower behind the end card, slowly closing in
  const gh = $('ghost'); gh.style.opacity = end ? (0.16 * ramp(t, END0 + 0.2, END0 + 1.4) * (1 - ramp(t, TOTAL - 0.5, TOTAL))).toFixed(3) : 0
  if (end) { const gq = ramp(t, END0, TOTAL), gh_ = 560 - 90 * gq, gs = 1920 / gh_; $('gim').style.transform = `translate(${(540 - 780 * gs).toFixed(1)}px,${(960 - 300 * gs).toFixed(1)}px) scale(${gs.toFixed(4)})` }
  // the beat of silence before the drop
  $('black').style.opacity = t >= 20.0 && t < 20.2 ? 1 : 0
  // ash: drifts up; denser on the drop
  const dens = end ? .8 : sh && sh.t0 >= 20 ? 1 : sh ? .65 : .45
  PTS.forEach((p, i) => {
    const e = $('p' + i), y = ((p.y - p.vy * t * (sh && sh.t0 >= 20 ? 2.2 : 1)) % 1920 + 1920) % 1920, x = (p.x + p.vx * t + 18 * Math.sin(t * .9 + p.ph) + 1080) % 1080
    e.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; e.style.opacity = (i / PTS.length < dens ? p.o : 0).toFixed(2)
  })
  // grain: a new texture every frame
  $('grain').style.backgroundImage = `url(grain/g${Math.floor(t * FPS) % 8}.png)`
  await Promise.all(jobs)
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))
}
window.TOTAL = TOTAL
window.ready = document.fonts.ready
</script>
</body>
</html>
