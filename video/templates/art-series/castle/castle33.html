<body>
<div id="stage">
  <div class="lay" id="photos" style="z-index:1"></div>
  <div id="dim"></div>
  <div class="lay" id="orb"><div id="ocam"><div id="ofr"><img id="ofimg"><div id="ofgl"></div></div></div><div id="oflash"></div></div>
  <div class="lay" id="cine"><div id="cpl"><img id="icpl"><div id="csw"></div></div></div>
  <div id="tw"><img id="itw"></div>
  <div id="tgrad"></div><div id="lgrad"></div>
  <div id="texts"></div>
  <div id="end"><img id="elogo" src="img/glogo.png"><div class="tag" id="etag"></div><div class="code" id="ecode"></div><div class="rg" id="esub"></div><div class="hd" id="ehd"></div></div>
</div>
<script src="plan_data.js"></script>
<script>
const P = window.PLAN, FPS = P.fps, $ = id => document.getElementById(id)
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = x => 1 - Math.pow(1 - cl(x), 3), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const lerp = (a, b, u) => a + (b - a) * u, hash = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s) }
let SIG = []
const css = (el, k, v) => { if (typeof el === 'string') el = $(el); if (el.style[k] !== v) el.style[k] = v; SIG.push(v) }
async function setImg(el, src) { if (el.getAttribute('src') !== src) { el.src = src; try { await el.decode() } catch (e) {} } SIG.push(src) }
// ---- static parts
const PH = {}
for (const s of P.segs) if (s.slot === 'photo' && !PH[s.img]) { const im = document.createElement('img'); im.className = 'ph'; im.src = `img/${s.img}.jpg`; $('photos').appendChild(im); PH[s.img] = im }
$('ofimg').src = P.art
const OB = P.orbit, PAN = [], PIM = []
for (let i = 0; i < OB.n; i++) { const d = document.createElement('div'); d.className = 'opan'; const im = document.createElement('img'); d.appendChild(im); $('ocam').appendChild(d); PAN.push(d); PIM.push(im) }
const TX = P.text
$('texts').innerHTML = TX.map((x, i) => {
  if (x.k === 'chip') return `<div class="it chip" id="x${i}"><span><i></i>${x.text}</span></div>`
  if (x.k === 'cap') return `<div class="it cap" id="x${i}"><span><i></i>${x.text}</span></div>`
  if (x.k === 'title') return `<div class="it title" id="x${i}"><div class="stack" id="xs${i}"><div class="t ghost r" id="xr${i}">${x.text}</div><div class="t ghost c" id="xc${i}">${x.text}</div><div class="t face" id="xf${i}">${x.text}</div></div></div>`
  if (x.k === 'end') return `<div class="it" id="x${i}"></div>`
  return `<div class="it ${x.k}" id="x${i}"><span>${x.text}</span></div>`
}).join('')
const E = TX.find(x => x.k === 'end')
$('etag').innerHTML = '#GAMDOM100K<b>ROUND2</b>'; $('ecode').innerHTML = 'Code <b>STEVE</b>'; $('esub').textContent = '18+ | Gamble responsibly'
$('ehd').textContent = 'Charcoal on paper · drawn by hand · @i_am_vickyd'
const segAt = (slot, t) => P.segs.find(s => s.slot === slot && t >= s.t0 && t < s.t1)
const frameOf = (s, t) => `${s.dir}/${String(Math.min(s.n, Math.max(1, Math.floor((t - s.t0) * FPS + 1e-6) + 1))).padStart(4, '0')}.jpg`
function photoXf(s, u, iw, ih) {
  let c
  if (s.keys) { const K = s.keys; let i = 0; while (i < K.length - 2 && u > K[i + 1][0]) i++
    const a = K[i], b = K[i + 1], k = eio((u - a[0]) / (b[0] - a[0])); c = [1, 2, 3].map(j => lerp(a[j], b[j], k))
  } else { const k = s.ease === 'out' ? eo(u) : s.ease === 'lin' ? u : eio(u); c = s.crop0.map((v, j) => lerp(v, s.crop1[j], k)) }
  if (s.contain) { const sc = Math.min(1920 / iw, 1080 / ih) / c[2], vw = 1920 / sc, vh = 1080 / sc
    let cx = c[0] * iw, cy = c[1] * ih
    if (vw < iw) cx = cl(cx, vw / 2, iw - vw / 2); if (vh < ih) cy = cl(cy, vh / 2, ih - vh / 2)
    return `translate(${(960 - cx * sc).toFixed(2)}px,${(540 - cy * sc).toFixed(2)}px) scale(${sc.toFixed(5)})` }
  const vw = c[2] * iw, vh = vw * 1080 / 1920, sc = 1920 / vw
  const x0 = cl(c[0] * iw - vw / 2, 0, iw - vw), y0 = cl(c[1] * ih - vh / 2, 0, ih - vh)
  return `scale(${sc.toFixed(5)}) translate(${(-x0).toFixed(2)}px,${(-y0).toFixed(2)}px)`
}
// the push ends with the drawing at the title's first view (share 0.84 of the whole-sheet view): 3.21x the 600 px picture
const PERSP = 1700, PUSH_S = (Math.min(1920 / P.art_wh[0], 1080 / P.art_wh[1]) / 0.84) * P.art_wh[0] / 600, PUSH_Z = PERSP * (1 - 1 / PUSH_S)
window.render = async t => {
  SIG = []
  // ---- photos (the drawing, the frame images)
  const ps = segAt('photo', t)
  css('photos', 'opacity', ps ? '1' : '0')
  for (const [k, im] of Object.entries(PH)) css(im, 'opacity', ps && ps.img === k ? '1' : '0')
  if (ps) { const im = PH[ps.img], u = (t - ps.t0) / (ps.t1 - ps.t0)
    css(im, 'transform', photoXf(ps, u, im.naturalWidth, im.naturalHeight))
    const fi = ps.fade ? cl((t - ps.t0) / ps.fade) : 1; css('photos', 'opacity', fi.toFixed(3)) }
  let dv = 0
  if (ps && ps.dim) for (const [d0, lv] of ps.dim) if (t >= d0) dv = lerp(dv, lv, eo((t - d0) / .4))
  css('dim', 'opacity', dv.toFixed(3))
  let lineV = 0
  for (const x of TX) if (x.k === 'line' || x.k === 'date' || x.k === 'big' || x.k === 'dateb') lineV = Math.max(lineV, Math.min(cl((t - x.t0 + .2) / .25), cl((x.t1 + .2 - t) / .25)))
  css('lgrad', 'opacity', (ps ? lineV : 0).toFixed(3))
  // ---- the orbit
  const [p1, p2] = OB.passes, [f0, f1] = OB.fly, [q0, q1] = OB.push
  const inOrb = (t >= p1[0] && t < p1[1]) || (t >= p2[0] && t < q1)
  css('orb', 'opacity', inOrb ? '1' : '0')
  if (inOrb) {
    let tilt, yaw, dz
    if (t < p1[1]) { const u = (t - p1[0]) / (p1[1] - p1[0]); tilt = lerp(-15, -11, u); yaw = lerp(-11, 5, u); dz = lerp(-220, -40, eio(u)) }
    else if (t < q0) { const u = (t - p2[0]) / (q0 - p2[0]); tilt = lerp(-11, -8, u); yaw = lerp(9, -2, u); dz = lerp(-10, 140, eio(u)) }
    else { const u = eio((t - q0) / (q1 - q0)); tilt = lerp(-8, 0, u); yaw = lerp(-2, 0, u); dz = lerp(140, PUSH_Z, u) }
    css('ocam', 'transform', `translateZ(${dz.toFixed(1)}px) rotateX(${tilt.toFixed(3)}deg) rotateY(${yaw.toFixed(3)}deg)`)
    css('ofimg', 'filter', `brightness(${(t < f1 ? lerp(.8, .92, cl((t - p1[0]) / (f1 - p1[0]))) : 1).toFixed(3)})`)
    css('oflash', 'opacity', (t >= f1 ? Math.max(0, 1 - (t - f1) / .35) * .8 : 0).toFixed(3))
    const W = 2 * Math.PI / 7
    for (let i = 0; i < OB.n; i++) {
      const el = PAN[i]
      if (t >= f1) { css(el, 'opacity', '0'); continue }
      const th = 2 * Math.PI * i / OB.n + W * (t - p1[0]), fu = t >= f0 ? eio((t - f0) / (f1 - f0)) : 0
      const Rr = 880 * (1 - fu), x = Rr * Math.sin(th), z = Rr * Math.cos(th), y = (40 + 26 * Math.sin(th * 2 + i)) * (1 - fu), f = (Math.cos(th) + 1) / 2
      css(el, 'transform', `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${z.toFixed(1)}px) rotateY(${(-yaw).toFixed(3)}deg) rotateX(${(-tilt).toFixed(3)}deg) scale(${(1 - .82 * fu).toFixed(3)})`)
      css(el, 'filter', `brightness(${(.4 + .6 * f).toFixed(3)}) blur(${((1 - f) * 2.6).toFixed(2)}px)`)
      css(el, 'opacity', (1 - cl((fu - .55) / .45)).toFixed(3))
      const s = P.segs.find(x => x.slot === 'orb' && x.pi === i && t >= x.t0 && t < x.t1) || P.segs.filter(x => x.slot === 'orb' && x.pi === i && x.t0 <= t).slice(-1)[0]
      if (s) await setImg(PIM[i], frameOf(s, Math.min(t, s.t1 - .001)))
    }
  }
  $('stage').classList.toggle('neg', t >= P.drop && t < P.drop + 1 / FPS); SIG.push(t >= P.drop && t < P.drop + 1 / FPS)
  // ---- gamdom.com, a still screen under a moving camera
  const cn = (P.cine || []).find(x => t >= x.t0 && t < x.t1)
  css('cine', 'opacity', cn ? '1' : '0')
  if (cn) { await setImg($('icpl'), cn.img); const u = (t - cn.t0) / (cn.t1 - cn.t0), k = eio(u), K = cn.keys, v = [1, 2, 3, 4, 5].map(j => lerp(K[0][j], K[1][j], k))
    css('cpl', 'transform', `translate3d(${v[0].toFixed(1)}px,${v[1].toFixed(1)}px,${v[2].toFixed(1)}px) rotateY(${v[3].toFixed(3)}deg) rotateX(${v[4].toFixed(3)}deg)`)
    css('cpl', 'opacity', eo((t - cn.t0) / .1).toFixed(3)); css('csw', 'transform', `translateX(${lerp(-38, 38, u).toFixed(2)}%)`) }
  // ---- Gamdom's own post: slams in on the accent, tilted, settling as it holds
  const tw = (P.tweets || []).find(x => t >= x.t0 && t < x.t1)
  css('tw', 'opacity', tw ? eo((t - tw.t0) / .12).toFixed(3) : '0')
  if (tw) { await setImg($('itw'), tw.img); const p = eo((t - tw.t0) / .16), u = cl((t - tw.t0) / (tw.t1 - tw.t0))
    css('tw', 'transform', `perspective(1400px) rotateX(${lerp(9, 3, u).toFixed(3)}deg) rotateY(${lerp(-13, -4, u).toFixed(3)}deg) scale(${(1.16 - .16 * p + .03 * u).toFixed(4)})`)
    css('tw', 'filter', `blur(${(9 * (1 - p)).toFixed(1)}px)`) }
  // ---- type
  for (let i = 0; i < TX.length; i++) {
    const x = TX[i], el = $('x' + i)
    if (!el || x.k === 'end') continue
    const on = t >= x.t0 && t < x.t1, hard = x.k === 'title' || x.k === 'cap'
    const fi = hard ? 0 : .22, fo = hard ? 0 : .18
    const op = on ? Math.min(fi ? cl((t - x.t0) / fi) : 1, fo ? cl((x.t1 - t) / fo) : 1) : 0
    css(el, 'opacity', op.toFixed(3))
    if (!on) continue
    if (x.k === 'title') {
      const p = eo((t - x.t0) / .18), s = 1 + .5 * (1 - p), stck = $('xs' + i)
      css(stck, 'transform', `scale(${s.toFixed(3)})`); css(stck, 'filter', `blur(${(14 * (1 - p)).toFixed(1)}px)`)
      let g = 0; for (const b of (x.glitch || [])) { const d = t - b; if (d >= 0 && d < .2) g = Math.max(g, 1 - d / .2) }
      const j = Math.round(t * FPS), dx = 4 + 24 * g * (hash(j) - .2)
      css('xr' + i, 'transform', `translate(${(-dx).toFixed(1)}px,${(g * 6 * (hash(j + 3) - .5)).toFixed(1)}px)`)
      css('xc' + i, 'transform', `translate(${dx.toFixed(1)}px,${(g * 6 * (hash(j + 7) - .5)).toFixed(1)}px)`)
      css('xf' + i, 'transform', g > 0 ? `translateX(${(g * 16 * (hash(j + 5) - .5)).toFixed(1)}px)` : 'none')
    }
    if (x.k === 'cap') css(el.firstChild, 'transform', `translateY(${(14 * (1 - eo((t - x.t0) / .2))).toFixed(1)}px)`)
    if (x.k === 'big') css(el.firstChild, 'transform', `scale(${(1 + .16 * (1 - eo((t - x.t0) / .16))).toFixed(3)})`)
  }
  const ti = TX.find(x => x.k === 'title'); css('tgrad', 'opacity', ti && t >= ti.t0 && t < ti.t1 ? '1' : '0')
  // ---- the end card
  const ep = t >= E.t0 ? 1 : 0, es = 1 + .14 * (1 - eo((t - E.t0) / .22))
  css('end', 'opacity', ep ? '1' : '0'); css('etag', 'transform', `scale(${es.toFixed(3)})`)
  css('elogo', 'opacity', eo((t - E.t0) / .25).toFixed(3)); css('elogo', 'transform', `translateY(${(18 * (1 - eo((t - E.t0) / .3))).toFixed(1)}px)`)
  const pop = (id, at) => { css(id, 'opacity', eo((t - at) / .18).toFixed(3)); css(id, 'transform', `scale(${(1 + .12 * (1 - eo((t - at) / .2))).toFixed(3)})`) }
  pop('ecode', E.e2); pop('esub', E.e3); css('ehd', 'opacity', eo((t - E.e3 - .35) / .3).toFixed(3))
  return SIG.join('|')
}
