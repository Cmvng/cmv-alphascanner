<!doctype html>
<html>
<!-- EASY MODE (8 Nov 2026, v2): a music-led concept film for @bagel_win, built on Bagel's tagline "Predict on easy mode 🎮".
     SELECT DIFFICULTY (the Bagel character is the cursor: HARD → NORMAL → EASY) → the drop on "PREDICT ON EASY MODE" (2.0 s)
     → a level map of phones (Bagel's own screens) that the character hops across, one level a bar, each phone unlocking as he
     lands → ALL LEVELS CLEAR (the camera pulls back over the map) → EASY MODE: ON. No narrator.
     One page, two formats: 1920x1080 (default) and 1080x1350 (#45, for the mobile feed: the phone is twice as large).
     Times are video seconds; the beat is 0.5 s (120 bpm). -->
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Pix;src:url(img/ps2p.woff2)}
@font-face{font-family:Man;font-weight:600;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-600-normal.woff2)}
@font-face{font-family:Man;font-weight:800;src:url(file:///home/user/cmv-alphascanner/video/assets/fonts/manrope-latin-800-normal.woff2)}
:root{--sky:#4FB3FF;--ice:#9FD3FF;--blue:#1F5FDB;--navy:#0B1F44;--bagel:#F6E051}
html,body{margin:0;overflow:hidden;background:#0A2A78}

  color:#fff;font:800 100px/150px Man,sans-serif;text-align:center;opacity:0}

.dev{position:absolute;left:4px;top:4px;width:492px;height:895px;border-radius:84px 84px 0 0;background:linear-gradient(90deg,#5d5d5d,#bdbdbd 6%,#7a7a7a 50%,#c4c4c4 94%,#5d5d5d);box-shadow:0 30px 50px rgba(0,0,0,.45)}

<body>
<div id="stage"><div id="grid"></div><div id="world"></div><div id="ui"></div><div id="me"><img src="img/Bagel_Icon_round.svg"></div><div id="scan"></div><div class="flash" id="flash"></div></div>
<script>
// ---------------------------------------------------------------- formats
const F45 = location.hash === '#45'
const LY = F45 ? { W: 1080, H: 1350, k: 1.12, SX: 540, SP: 900, tops: [565, 545, 560, 540, 555],
    blk: { left: 64, top: 110, width: 950, kf: 24, tf: 84, tfF: 66, uf: 32, gap: 18 }, cnt: { x: 520, y: 168, f: 42, fb: 64 },
    hud: { y: 40, f: 20 }, menu: { y0: 420, dy: 150, f: 70, x: 340 }, slam: { y: 470, f1: 64, f2: 104 }, end: { y: 210 } }
  : { W: 1920, H: 1080, k: 1, SX: 1250, SP: 820, tops: [250, 190, 230, 170, 180],
    blk: { left: 110, top: 300, width: 800, kf: 30, tf: 124, tfF: 92, uf: 38, gap: 28 }, cnt: { x: 110, y: 690, f: 64, fb: 96 },
    hud: { y: 46, f: 26 }, menu: { y0: 410, dy: 140, f: 76, x: 820 }, slam: { y: 330, f1: 76, f2: 150 }, end: { y: 120 } }
const { W, H } = LY
document.documentElement.style.width = document.body.style.width = W + 'px'; document.documentElement.style.height = document.body.style.height = H + 'px'
const $ = id => document.getElementById(id)
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = x => 1 - Math.pow(1 - cl(x), 3), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const eback = x => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
const lerp = (a, b, u) => a + (b - a) * u
let SIG = []
const css = (el, k, v) => { if (el.style[k] !== v) el.style[k] = v; SIG.push(v) }
const win = (t, a, b, fi = .2, fo = .2) => t < a - fi || t > b + fo ? 0 : Math.min(cl((t - a + fi) / fi), cl((b + fo - t) / fo))
const pop = (t, a, d = .3) => t < a ? 0 : eback((t - a) / d)
const ui = (h, st) => { const d = document.createElement('div'); d.innerHTML = h; const e = d.firstChild; if (st) Object.assign(e.style, st); $('ui').appendChild(e); return e }

// ---------------------------------------------------------------- timeline
const DROP = 2.0, L = [3, 5, 9, 11, 13], ALL = 17, END = 19   // the drop, level starts (the character lands), all clear, end card
const S = 500 / 1368                                           // crop px -> phone px
// rings: [start after landing, end, x, y, w, h] in crop px (Bagel's 1368 x 2460 store crops)
const D2C = v => v / S                                          // phone px -> crop px (for the drawn phone)
const LV = [
  { img: 'phone1.png', k: 'LEVEL 1', t: 'START IN<br><b>SECONDS</b>', u: 'Sign in with Google, Apple or email',
    rings: [[.5, 2, 135, 675, 600, 129], [1.0, 2, 135, 1836, 1095, 156]] },
  { img: 'phone2.png', k: 'LEVEL 2', t: '<b>COMBO</b>', u: 'Combine multiple markets into one prediction',
    rings: [[0, 4, 120, 420, 246, 114], [.5, 4, 978, 888, 207, 93], [1.0, 4, 978, 1647, 207, 99]] },
  { img: 'phone4.png', k: 'LEVEL 3', t: 'NEVER MISS<br><b>A MARKET</b>', u: 'Instant notifications for every opportunity', rings: [] },
  { img: 'phone5.png', k: 'LEVEL 4', t: 'SQUAD<br><b>CHAT</b>', u: 'Discuss markets in real time', rings: [] },
  { img: null, k: 'FINAL LEVEL', t: 'SAME MARKETS.<br><b>SAME LIQUIDITY.</b>', u: "Built on Polymarket's markets and liquidity", final: 1,
    // the market list from the owner's own recording (market.png, 470 x 825), drawn in a phone: x_d = 20 + 0.9766 x, y_d = 70 + 0.9766 y
    rings: [[.5, 4, 358, 485, 77, 39], [1.0, 4, 358, 534, 77, 39], [1.5, 4, 358, 583, 77, 39], [2.0, 4, 49, 634, 73, 28], [2.5, 4, 358, 809, 77, 39]]
      .map(r => [r[0], r[1], D2C(r[2]), D2C(r[3]), D2C(r[4]), D2C(r[5])]) }]
const K = LY.k, PW = 500 * K
const CX = LV.map((_, i) => i * LY.SP), TOP = LY.tops
const ringSvg = (i, r, j) => { const rx = Math.min(70, (r[5] + 28) / 2), g = (sw, f) => `<rect x="${r[2] - 14}" y="${r[3] - 14}" width="${r[4] + 28}" height="${r[5] + 28}" rx="${rx}" fill="none" stroke="#4FB3FF" stroke-width="${sw}"${f}/>`
  return `<g id="r${i}_${j}" style="transform-origin:${r[2] + r[4] / 2}px ${r[3] + r[5] / 2}px;opacity:0">${g(22, ` filter="url(#gl${i})"`)}${g(14, '')}</g>` }
const CARD = k => ({ x: 124, y: 1061 + 271 * k, w: 1119, h: 228 })   // notification cards on phone4 (k = 0..3)
const phones = LV.map((lv, i) => {
  const d = document.createElement('div'); d.className = 'ph'; d.style.left = (CX[i] - 250) + 'px'; d.style.top = TOP[i] + 'px'
  let veil = '', screen = lv.img ? `<img class="s" src="img/${lv.img}">` :
    `<div class="dev"><div class="bz"></div><div class="sc"><img src="img/market.png" style="position:absolute;left:-1px;top:49px;width:459px;height:806px"><div class="isl"></div><div class="tm">9:41</div></div></div>`
  if (i === 2) {   // the first card (a test username, an unclear photo) stays hidden; the three real cards below move up one slot each
    veil = `<image href="img/notif_veil.png" x="100" y="1040" width="1170" height="1090" preserveAspectRatio="none"/>` + [1, 2, 3].map(k => { const c = CARD(k), s = CARD(k - 1)
      return `<clipPath id="cc${k}"><rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="36"/></clipPath>
        <g id="nc${k}" style="transform-origin:${s.x + s.w / 2}px ${s.y + s.h / 2}px;opacity:0"><g transform="translate(0,${-271})"><image href="img/phone4.png" width="1368" height="2460" clip-path="url(#cc${k})"/></g></g>` }).join('')
  }
  if (i === 3) veil = `<rect x="50" y="440" width="1270" height="2020" fill="#fff" clip-path="url(#vc${i})"/>`
  d.innerHTML = `${screen}<svg viewBox="0 0 1368 2460"><defs><clipPath id="vc${i}"><rect id="vr${i}" x="0" y="0" width="1368" height="2460"/></clipPath>
    <filter id="gl${i}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter></defs>${veil}${lv.rings.map((r, j) => ringSvg(i, r, j)).join('')}</svg>
    <div class="fl"></div><div class="lk">🔒</div><div class="ok">✓</div>`
  $('world').appendChild(d); return d })

// ---------------------------------------------------------------- UI built for the format
const cx = W / 2, M = LY.menu
const menu = ui(`<div class="abs" style="inset:0"></div>`)
menu.innerHTML = `<img class="abs" src="img/Bagel_Logo_White.svg" style="left:${cx - 150}px;top:${F45 ? 120 : 90}px;width:300px;height:100px">
  <div class="abs pix" style="left:0;width:${W}px;top:${M.y0 - 150}px;text-align:center;font-size:${F45 ? 34 : 40}px;color:#9FD3FF">SELECT DIFFICULTY</div>
  ${['HARD', 'NORMAL', 'EASY'].map((s, k) => `<div id="o${k}" class="abs pix" style="left:${M.x}px;top:${M.y0 + k * M.dy}px;font-size:${M.f}px;transform-origin:0 50%">${s}</div>`).join('')}
  <div id="s0" class="abs" style="left:${M.x - 10}px;top:${M.y0 + M.f * .45}px;width:0;height:10px;background:#fff"></div>
  <div id="s1" class="abs" style="left:${M.x - 10}px;top:${M.y0 + M.dy + M.f * .45}px;width:0;height:10px;background:#fff"></div>
  <div id="load" class="abs pix" style="left:0;width:${W}px;top:${M.y0 + 3 * M.dy + 30}px;text-align:center;font-size:26px;color:#9FD3FF;opacity:0">LOADING <span id="bar"></span></div>`
const slam = ui(`<div class="abs" style="inset:0;opacity:0"></div>`)
slam.innerHTML = `<div id="sl1" class="abs man" style="left:0;width:${W}px;top:${LY.slam.y}px;text-align:center;font-weight:800;font-size:${LY.slam.f1}px;letter-spacing:.02em">PREDICT ON</div>
  <div id="sl2" class="abs pix" style="left:0;width:${W}px;top:${LY.slam.y + LY.slam.f1 * 1.6}px;text-align:center;font-size:${LY.slam.f2}px;line-height:1;text-shadow:10px 10px 0 #1F5FDB,0 0 60px rgba(79,179,255,.6)">EASY MODE</div>
  <div id="pad" class="abs" style="left:${F45 ? 830 : 1590}px;top:${LY.slam.y - (F45 ? 170 : 80)}px;font:${F45 ? 120 : 150}px/1 'Noto Color Emoji';opacity:0">🎮</div>`
const B = LY.blk
LV.forEach((lv, i) => ui(`<div class="blk" id="b${i}" style="left:${B.left}px;top:${B.top}px;width:${B.width}px"><div class="k" style="font-size:${B.kf}px">${lv.k}</div>
  <div class="t" style="margin-top:${B.gap}px;font-size:${lv.final ? B.tfF : B.tf}px">${lv.t}</div><div class="u" style="margin-top:${B.gap}px;font-size:${B.uf}px;max-width:${F45 ? 900 : 700}px">${lv.u}</div></div>`))
const hudL = ui(`<div class="hud pix" style="left:${F45 ? 40 : 60}px;top:${LY.hud.y}px;font-size:${LY.hud.f}px;color:#9FD3FF">LEVEL 1/5</div>`)
const hudC = ui(`<div class="hud" style="left:${cx - 140}px;top:${LY.hud.y - 6}px;width:280px;height:40px;display:flex;gap:${F45 ? 12 : 16}px;justify-content:center"></div>`)
for (let j = 0; j < 5; j++) { const q = document.createElement('i'); q.style.cssText = `display:block;width:${F45 ? 28 : 36}px;height:${F45 ? 28 : 36}px;box-shadow:inset 0 0 0 4px #fff`; q.id = 'q' + j; hudC.appendChild(q) }
const hudR = ui(`<div class="hud" style="right:${F45 ? 36 : 56}px;top:${LY.hud.y - 16}px;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;border-radius:40px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)">
  <img src="img/Bagel_Icon_round.svg" style="width:${F45 ? 36 : 44}px;height:${F45 ? 36 : 44}px"><span class="pix" style="font-size:${F45 ? 16 : 20}px">EASY MODE</span></div>`)
const clear = ui(`<div class="abs pix" style="left:0;width:${W}px;top:${F45 ? 130 : 86}px;text-align:center;font-size:${F45 ? 50 : 66}px;line-height:1.25;opacity:0;text-shadow:8px 8px 0 #1F5FDB">ALL LEVELS${F45 ? '<br>' : ' '}CLEAR!</div>`)
const CB = [['1 HIT', L[1] + .5], ['2 HITS', L[1] + 1.0], ['COMBO!', L[1] + 1.5]].map(([s, t], j) => ({ e: ui(`<div class="combo" style="font-size:${j === 2 ? LY.cnt.fb : LY.cnt.f}px">${s}</div>`), t }))
const EM = [...[0, 1, 2].map(k => ['🔔', L[2] + .25 + .5 * k, 2, k]), ...['❤️', '🔥', '😂', '🚀'].map((s, k) => [s, L[3] + .25 + .5 * k, 3, k])]
  .map(([s, t, i, k]) => ({ e: ui(`<div class="emo">${s}</div>`), t, i, k }))
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
const CF = Array.from({ length: 70 }, () => ({ e: ui(`<div class="cf" style="background:${['#F6E051', '#4FB3FF', '#FFFFFF', '#9FD3FF'][Math.floor(rnd() * 4)]}"></div>`),
  x: rnd() * W, d: rnd() * .6, v: 380 + rnd() * 300, r: rnd() * 720 - 360, w: (rnd() - .5) * 160 }))
const ey = LY.end.y
const end = ui(`<div class="abs" style="inset:0;opacity:0"></div>`)
end.innerHTML = `<img id="eme" class="abs" src="img/Bagel_Icon_round.svg" style="left:${cx - 110}px;top:${ey}px;width:220px;height:220px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.4))">
  <img class="abs" src="img/Bagel_Logo_White.svg" style="left:${cx - 270}px;top:${ey + 250}px;width:540px;height:180px">
  <div class="abs" style="left:0;width:${W}px;top:${ey + 490}px;display:flex;justify-content:center;align-items:center;gap:${F45 ? 22 : 30}px">
    <span class="pix" style="font-size:${F45 ? 40 : 46}px">EASY MODE:</span><span id="on" class="pix" style="font-size:${F45 ? 40 : 46}px;color:#9FD3FF">OFF</span><div id="tog" class="tog"><i></i></div></div>
  <div class="abs man" style="left:0;width:${W}px;top:${ey + 600}px;text-align:center;font-weight:600;font-size:42px">Predict on easy mode <span style="font-family:'Noto Color Emoji'">🎮</span></div>
  <div id="dl" class="abs man" style="left:0;width:${W}px;top:${ey + 700}px;text-align:center;font-weight:800;font-size:44px;line-height:1.3">Download Bagel${F45 ? '<br>' : ' '}<span style="color:#9FD3FF">${F45 ? '' : '· '}@bagel_win</span></div>
  <div id="by" class="abs man" style="left:0;width:${W}px;top:${ey + (F45 ? 850 : 780)}px;text-align:center;font-weight:600;font-size:32px;color:rgba(255,255,255,.8)">Video by @Cmv_ng</div>
  <div class="abs man" style="left:0;width:${W}px;top:${H - (F45 ? 110 : 92)}px;text-align:center;font-weight:800;font-size:${F45 ? 36 : 38}px;color:rgba(255,255,255,.92)">18+ · All trading involves risk</div>`

// ---------------------------------------------------------------- camera: world focus (fx, fy) and zoom z
const SHIFT = LY.SX - W / 2
function cam(t) {
  const f = i => [CX[i] - SHIFT, H / 2, 1]
  let v = [CX[0] - SHIFT - 900, H / 2, 1]
  if (t >= 2.45) v = v.map((x, q) => lerp(x, f(0)[q], eio((t - 2.45) / .5)))
  for (let i = 1; i < 5; i++) if (t >= L[i] - .45) { const a = v.slice(), b = f(i); v = a.map((x, q) => lerp(x, b[q], eio((t - L[i] + .45) / .5))) }
  if (t >= L[1] + 2 && !F45) { const u = eio((t - L[1] - 2) / .5) * (1 - eio((t - L[2] + .45) / .5)); v = [v[0] + 140 * K * u, v[1] + 80 * K * u, v[2] + .16 * u] }   // 4:5: the phone is already large
  if (t >= L[4] + 2) { const u = eio((t - L[4] - 2) / 1.6) * (1 - eio((t - ALL) / .3)); v[2] += .07 * u; v[1] += 40 * u }
  if (t >= ALL) { const u = eio((t - ALL) / .7), z = Math.min(.45, (W - 120) / (CX[4] - CX[0] + PW))
    v = [lerp(v[0], (CX[0] + CX[4]) / 2, u), lerp(v[1], H / 2 + (F45 ? 330 : 110), u), lerp(v[2], z, u)] }
  return v
}
const toScreen = (c, x, y) => [(x - c[0]) * c[2] + W / 2, (y - c[1]) * c[2] + H / 2]
// the character: menu cursor → the slam → hops along the phone tops (world space)
const PT = i => [CX[i], TOP[i] - 58]
function me(t, c) {
  const bob = Math.sin(t * Math.PI * 2) * 6
  if (t < 1.95) { const k = t < .5 ? 0 : t < 1 ? 1 : 2, kt = [0, .5, 1.0][k], prev = [0, 0, 1][k], u = cl((t - kt) / .28)
    const y0 = M.y0 + M.f * .55 + prev * M.dy, y1 = M.y0 + M.f * .55 + k * M.dy
    const y = lerp(y0, y1, eio(u)) - 70 * Math.sin(u * Math.PI) - (t > 1.5 ? Math.abs(Math.sin((t - 1.5) * Math.PI * 2)) * 30 : 0)
    return { x: M.x - 100, y, s: F45 ? .7 : .75, sx: 1, sy: 1, o: 1 } }
  if (t < 2.5) { const u = cl((t - 1.95) / .35), sy = LY.slam.y - 105
    return { x: lerp(M.x - 100, cx, eio(u)), y: lerp(M.y0 + M.f * .55 + 2 * M.dy, sy, eio(u)) - 120 * Math.sin(u * Math.PI) + (t > 2.3 ? bob : 0), s: 1.4, sx: 1, sy: 1, o: 1 } }
  let i = 0; for (let j = 0; j < 5; j++) if (t >= L[j] - .5) i = j
  const u = cl((t - L[i] + .5) / .5), to = PT(i)
  let from; if (i === 0) { const c0 = cam(2.5); from = [(cx - W / 2) / c0[2] + c0[0], (LY.slam.y - 105 - H / 2) / c0[2] + c0[1]] } else from = PT(i - 1)
  let x = lerp(from[0], to[0], eio(u)), y = lerp(from[1], to[1], u) - 300 * Math.sin(u * Math.PI)
  const land = t - L[i], sq = land > 0 && land < .2 ? 1 - .28 * Math.sin(land / .2 * Math.PI) : 1
  if (t >= ALL + .3) y -= 90 * Math.sin(cl(((t - ALL - .3) % .5) / .5) * Math.PI)
  const [sx, sy] = toScreen(c, x, y)
  return { x: sx, y: sy, s: c[2] * K * (i === 0 && u < 1 ? lerp(1.4 / K, 1, eio(u)) : 1), sx: 2 - sq, sy: sq, o: 1 - cl((t - END + .1) / .15) }
}

window.render = async t => {
  SIG = []
  const c = cam(t)
  css($('world'), 'transform', `translate(${(W / 2 - c[0] * c[2]).toFixed(1)}px,${(H / 2 - c[1] * c[2]).toFixed(1)}px) scale(${c[2].toFixed(4)})`)
  css($('world'), 'opacity', win(t, 2.6, END - .05, .3, .25).toFixed(3))
  css($('grid'), 'transform', `translate(${(-(c[0] * .25) % 48).toFixed(1)}px,${(-(c[1] * .25) % 48).toFixed(1)}px)`)
  css($('scan'), 'opacity', (1 - cl((t - 1.95) / .3) + cl((t - END) / .4) * .6).toFixed(3))
  // ---- SELECT DIFFICULTY (from the first frame)
  css(menu, 'opacity', win(t, 0, 1.95, .01, .12).toFixed(3))
  const sel = t >= 1.5, cur = t < .5 ? 0 : t < 1 ? 1 : 2
  for (let k = 0; k < 3; k++) { const o = $('o' + k), act = k === cur
    css(o, 'color', sel ? (k === 2 ? '#4FB3FF' : 'rgba(255,255,255,.3)') : (act ? '#FFFFFF' : 'rgba(255,255,255,.55)'))
    css(o, 'textShadow', sel && k === 2 ? '6px 6px 0 #0B1F44,0 0 40px rgba(79,179,255,.8)' : act ? '6px 6px 0 #1F5FDB' : 'none')
    if (k === 2) css(o, 'transform', `scale(${(1 + .15 * pop(t, 1.5, .3)).toFixed(3)})`) }
  css($('s0'), 'width', (sel ? M.f * 4.35 * eo((t - 1.55) / .15) : 0).toFixed(0) + 'px'); css($('s1'), 'width', (sel ? M.f * 6.2 * eo((t - 1.62) / .15) : 0).toFixed(0) + 'px')
  css($('load'), 'opacity', win(t, 1.65, 1.95, .05, .1).toFixed(3)); const nb = Math.floor(cl((t - 1.65) / .3) * 10)
  if ($('bar').textContent !== '▮'.repeat(nb)) $('bar').textContent = '▮'.repeat(nb); SIG.push(nb)
  // ---- the drop
  css(slam, 'opacity', win(t, DROP, 2.6, .02, .3).toFixed(3))
  css($('sl2'), 'transform', `scale(${(1.6 - .6 * eback((t - DROP) / .35)).toFixed(3)}) translateX(${(-W * .55 * eio((t - 2.55) / .4)).toFixed(0)}px)`)
  css($('sl1'), 'transform', `translateY(${(-60 * (1 - eo((t - DROP - .05) / .3))).toFixed(0)}px) translateX(${(-W * .55 * eio((t - 2.5) / .4)).toFixed(0)}px)`)
  css($('pad'), 'opacity', win(t, 2.25, 2.5, .05, .2).toFixed(3)); css($('pad'), 'transform', `rotate(${(-14 + 10 * Math.sin(t * 6)).toFixed(1)}deg) scale(${pop(t, 2.25, .3).toFixed(3)})`)
  // ---- phones: locked until the character lands, then a flash and a pop; a cleared level leaves, all come back for ALL CLEAR
  phones.forEach((d, i) => { const lt = t - L[i], un = lt >= 0, sc = d.querySelector('img.s, .dev')
    css(sc, 'filter', un ? (i === 4 ? 'none' : 'drop-shadow(0 30px 50px rgba(0,0,0,.45))') : 'grayscale(1) brightness(.5)' + (i === 4 ? '' : ' drop-shadow(0 30px 50px rgba(0,0,0,.45))'))
    css(d.querySelector('.lk'), 'opacity', un ? (1 - cl(lt / .15)).toFixed(3) : '1')
    css(d.querySelector('.fl'), 'opacity', un ? (.9 * (1 - cl(lt / .35))).toFixed(3) : '0')
    css(d, 'transform', `scale(${(K * (un ? 1 + .05 * Math.sin(cl(lt / .3) * Math.PI) : 1)).toFixed(4)})`)
    const gone = i < 4 ? cl((t - L[i + 1] + .35) / .3) : 0; css(d, 'opacity', (1 - gone * (1 - cl((t - ALL) / .4))).toFixed(3))
    css(d.querySelector('.ok'), 'opacity', cl((t - ALL - .3 - .2 * i) / .1).toFixed(3)); css(d.querySelector('.ok'), 'transform', `scale(${pop(t, ALL + .3 + .2 * i, .3).toFixed(3)})`)
    LV[i].rings.forEach((r, j) => { const g = $(`r${i}_${j}`), a = L[i] + r[0], b = L[i] + r[1]
      css(g, 'opacity', win(t, a, b, .05, .15).toFixed(3)); css(g, 'transform', `scale(${(1.25 - .25 * eback((t - a) / .3)).toFixed(3)})`) }) })
  // notification cards pop in one per beat; chat messages are revealed one per beat
  ;[1, 2, 3].forEach((k, n) => { const g = $('nc' + k), a = L[2] + .25 + .5 * n; css(g, 'opacity', cl((t - a) / .08).toFixed(3)); css(g, 'transform', `scale(${(.8 + .2 * eback((t - a) / .3)).toFixed(3)})`) })
  const step = (t0, ys) => { let y = ys[0]; for (let k = 1; k < ys.length; k++) y = lerp(y, ys[k], eo((t - t0 - (k - 1) * .5) / .18)); return y }
  const vr3 = step(L[3] + .25, [440, 1020, 1380, 1845, 2460]); $('vr3').setAttribute('y', vr3.toFixed(0)); SIG.push(vr3)
  // title blocks
  LV.forEach((lv, i) => { const b = $('b' + i), a = L[i], e = i < 4 ? L[i + 1] - .3 : ALL - .15
    css(b, 'opacity', win(t, a, e, .02, .2).toFixed(3))
    css(b.children[0], 'transform', `translateX(${(-80 * (1 - eo((t - a) / .25))).toFixed(0)}px)`)
    css(b.children[1], 'transform', `scale(${(1.35 - .35 * eback((t - a) / .3)).toFixed(3)})`); css(b.children[1], 'transformOrigin', '0 50%')
    css(b.children[2], 'opacity', cl((t - a - .25) / .25).toFixed(3))
    css(b, 'transform', `translateX(${(-120 * cl((t - e) / .2)).toFixed(0)}px)`) })
  // the combo counter: in its own space, off the phone
  CB.forEach(({ e, t: a }, j) => { const n = j < 2 ? CB[j + 1].t : L[2] - .3
    css(e, 'opacity', win(t, a, n - .02, .01, .05).toFixed(3)); css(e, 'left', LY.cnt.x + 'px'); css(e, 'top', LY.cnt.y + 'px')
    css(e, 'transform', `rotate(-6deg) scale(${(1.5 - .5 * eback((t - a) / .25)).toFixed(3)})`) })
  // emojis: bells for the notifications, reactions in the chat (each ends with its level)
  EM.forEach(({ e, t: a, i, k }) => { const [px, py] = toScreen(c, CX[i] + 220, TOP[i] + (380 + k * 95) * K), u = (t - a) / 1.1, cut = cl((L[i + 1] - .4 - t) / .1)
    css(e, 'opacity', (u < 0 || u > 1 ? 0 : Math.min(1, u * 8, (1 - u) * 3) * cut).toFixed(3)); css(e, 'left', (px + 10).toFixed(0) + 'px'); css(e, 'top', (py - 220 * eo(u)).toFixed(0) + 'px')
    css(e, 'transform', `scale(${(.6 + .5 * eback(u * 3)).toFixed(3)}) rotate(${(k % 2 ? 12 : -12) * u}deg)`) })
  // HUD
  const hq = win(t, L[0], END - .1, .3, .2); [hudL, hudC, hudR].forEach(h => css(h, 'opacity', hq.toFixed(3)))
  let li = 0; for (let j = 0; j < 5; j++) if (t >= L[j]) li = j
  const ht = t >= ALL ? 'CLEAR!' : li === 4 ? 'FINAL LEVEL' : `LEVEL ${li + 1}/5`; if (hudL.textContent !== ht) hudL.textContent = ht; SIG.push(ht)
  for (let j = 0; j < 5; j++) css($('q' + j), 'background', t >= L[j] ? '#4FB3FF' : 'transparent')
  // all clear + confetti
  css(clear, 'opacity', win(t, ALL + .05, END - .1, .05, .15).toFixed(3)); css(clear, 'transform', `scale(${(1.4 - .4 * eback((t - ALL - .05) / .3)).toFixed(3)})`)
  CF.forEach(f => { const u = t - ALL - .2 - f.d; css(f.e, 'opacity', u < 0 || t > END ? '0' : '1')
    css(f.e, 'transform', `translate(${(f.x + f.w * Math.sin(u * 3)).toFixed(0)}px,${(-40 + f.v * u + 120 * u * u).toFixed(0)}px) rotate(${(f.r * u).toFixed(0)}deg)`) })
  // end card
  css(end, 'opacity', cl((t - END) / .2).toFixed(3))
  css($('eme'), 'transform', `translateY(${(-Math.abs(Math.sin((t - END) * Math.PI * 2)) * 34 * (t > END + .4 ? 1 : 0)).toFixed(1)}px) scale(${pop(t, END, .4).toFixed(3)})`)
  const on = t >= END + .6, tu = eio((t - END - .6) / .2)
  css($('tog'), 'background', on ? '#4FB3FF' : 'rgba(255,255,255,.25)'); css($('tog').firstChild, 'transform', `translateX(${(64 * tu).toFixed(1)}px)`)
  if ($('on').textContent !== (on ? 'ON' : 'OFF')) $('on').textContent = on ? 'ON' : 'OFF'; SIG.push(on)
  css($('dl'), 'opacity', cl((t - END - .9) / .3).toFixed(3)); css($('by'), 'opacity', cl((t - END - 1.2) / .3).toFixed(3))
  // character
  const m = me(t, c); css($('me'), 'opacity', m.o.toFixed(3))
  css($('me'), 'transform', `translate(${(m.x - 58).toFixed(1)}px,${(m.y - 58).toFixed(1)}px) scale(${(m.s * m.sx).toFixed(3)},${(m.s * m.sy).toFixed(3)})`)
  css($('flash'), 'opacity', (Math.max(t >= DROP ? .85 * (1 - cl((t - DROP) / .25)) : 0, t >= END ? .8 * (1 - cl((t - END) / .3)) : 0)).toFixed(3))
  return SIG.join('|')
}
window.READY = new Promise(r => setTimeout(r, 500)).then(() => Promise.all([document.fonts.load('40px Pix'), document.fonts.load('800 40px Man'), document.fonts.load('600 40px Man'),
  document.fonts.load("80px 'Noto Color Emoji'"), ...[...document.images].map(i => i.decode ? i.decode().catch(() => 0) : 1)]))
</script>
