<!doctype html>
<html><head><meta charset="utf-8">
<!-- Motion-graphics explainer (mode "explainer"): every screen is a beat in cfg.explainer.beats, drawn here with
     animated cards, a phone mockup and counters, timed to the voice. Same contract as scene.html / review.html:
     window.DATA in, window.ready, window.renderAt(t), window.fxEvents(). -->
<style>
@font-face{font-family:Manrope;font-weight:400;src:url(assets/fonts/manrope-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:Manrope;font-weight:400;src:url(assets/fonts/manrope-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:Manrope;font-weight:600;src:url(assets/fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:800;src:url(assets/fonts/manrope-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:JBM;font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:JBM;font-weight:700;src:url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Anton;font-weight:400;src:url(assets/fonts/anton-latin-400-normal.woff2) format('woff2')}
:root{--acc:#4FB3FF;--acc2:#8FD3FF;--deep:#0A2A4F;--yes:#0FC591;--no:#FF3756;--ink:#0B1220;--muted:#64748B}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#0B2140 0%,#05101F 55%,#02050B 100%);font-family:Manrope;color:#fff}
#grid{position:absolute;left:-240px;top:-240px;width:1560px;height:2400px;background-image:linear-gradient(rgba(79,179,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(79,179,255,.07) 2px,transparent 2px);background-size:120px 120px;transform-origin:50% 50%}
.blob{position:absolute;width:880px;height:880px;border-radius:50%;filter:blur(140px);opacity:.22;background:var(--acc)}
#b2{background:#1F5FDB;opacity:.2}
#vig{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.65) 100%)}
#hdr{position:absolute;left:56px;right:56px;top:58px;display:flex;justify-content:space-between;align-items:center;z-index:40}
.logo{display:flex;align-items:center;gap:12px;font:800 38px Manrope;letter-spacing:-1px}
.logo .bars{display:flex;align-items:flex-end;gap:5px;transform:skewX(-11deg)}
.logo .bars i{display:block;width:10px;border-radius:3px;background:linear-gradient(180deg,#6E9BFF,#1F5FDB)}
.logo span.x{font:700 20px JBM;letter-spacing:3px;color:var(--acc);text-transform:uppercase;margin-left:6px}
#chap{font:700 20px JBM;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.7)}
#chap b{color:var(--acc);margin-right:10px}
#prog{position:absolute;left:56px;right:56px;top:128px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);z-index:40;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;box-shadow:0 0 18px var(--acc)}
.scene{position:absolute;inset:0;display:none;z-index:20}
.A{font-family:Anton;font-weight:400;text-transform:uppercase;letter-spacing:1px;line-height:.95}
.acc{color:var(--acc)}
.t1{position:absolute;left:60px;right:60px;top:190px;font-size:104px;text-shadow:0 14px 40px rgba(0,0,0,.6)}
.t2{position:absolute;left:62px;right:60px;top:300px;font:600 32px Manrope;color:rgba(255,255,255,.75)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:rgba(79,179,255,.12);border:2px solid rgba(79,179,255,.45);color:var(--acc);font:700 24px JBM;letter-spacing:2px;text-transform:uppercase}
.card{background:#fff;color:var(--ink);border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.x{font-family:Anton;letter-spacing:1px}

/* cold open (before the drop): dark, one number, one ticket */
.ex_cold .dim{position:absolute;inset:0;background:#000;opacity:.55}
.ex_cold .amt2{position:absolute;left:0;right:0;top:420px;text-align:center}
.ex_cold .amt2 .v{display:inline-block;font:400 300px Anton;line-height:1;color:#fff;text-shadow:0 20px 60px rgba(0,0,0,.7)}
.ex_cold .amt2 .v.up{color:var(--acc);text-shadow:0 0 70px rgba(79,179,255,.45),0 20px 60px rgba(0,0,0,.7)}
.ex_cold .amt2 .v.zero{color:var(--no);text-shadow:0 0 60px rgba(255,55,86,.4)}
.ex_cold .amt2 .lb{font:700 34px JBM;letter-spacing:6px;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:18px;min-height:44px}
.ex_cold .ct{position:absolute;left:190px;right:190px;top:900px;padding:26px 30px 18px}
.ex_cold .ct .hd{font:700 19px JBM;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
.ex_cold .ct .rw{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:2px solid #EEF0F3;font:800 30px Manrope}
.ex_cold .ct .rw .f{font-size:38px}
.ex_cold .ct .rw .ck{margin-left:auto;width:50px;height:50px;border-radius:50%;border:4px solid #CBD5E1;display:flex;align-items:center;justify-content:center;font:800 28px Manrope;color:#fff}
.ex_cold .ct .rw .ck.ok{background:var(--yes);border-color:var(--yes)}
.ex_cold .ct .rw .ck.no{background:var(--no);border-color:var(--no)}

/* hook */
.ex_hook .stack{position:absolute;left:0;right:0;top:470px;height:560px}
.ex_hook .tix{position:absolute;left:50%;top:0;width:470px;margin-left:-235px;border-radius:30px;background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6);padding:26px 30px}
.ex_hook .tix .r{display:flex;justify-content:space-between;align-items:center;gap:12px;font:800 26px Manrope;margin:8px 0;white-space:nowrap}
.ex_hook .tix .r em{font-style:normal;font-family:Anton;font-size:36px;color:var(--yes)}
.ex_hook .tix[data-j="1"]{z-index:3}
.ex_hook .tix .hd{font:700 17px JBM;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.ex_hook .big{position:absolute;left:0;right:0;top:960px;text-align:center}
.ex_hook .big .p{font-size:300px;color:var(--acc);text-shadow:0 0 60px rgba(79,179,255,.35),0 20px 50px rgba(0,0,0,.6);line-height:.85}
.ex_hook .big .o{font-size:96px;margin-top:6px}
.ex_hook .big .c{margin-top:26px}

/* ticket build */
.tkt{position:absolute;left:110px;right:110px;top:430px;padding:30px 34px 34px}
.tkt .hd{display:flex;justify-content:space-between;align-items:center;font:700 19px JBM;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.tkt .ttl{font:800 34px Manrope;margin:10px 0 14px}
.lg{display:flex;align-items:center;gap:18px;padding:18px 0;border-top:2px solid #EEF0F3}
.lg .fl{width:64px;height:64px;border-radius:50%;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:42px;flex-shrink:0;overflow:hidden}
.lg .w{flex:1}
.lg .w b{display:block;font:800 32px Manrope}
.lg .w span{display:block;font:600 22px Manrope;color:var(--muted)}
.lg .w b i{font-style:normal;color:var(--yes)}
.lg .m{font-family:Anton;font-size:52px;color:var(--ink)}
.lg .st{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 32px Manrope;color:#fff;opacity:0}
.lg .st.ok{background:var(--yes)}.lg .st.no{background:var(--no)}
.mult{position:absolute;left:60px;right:60px;top:1100px;text-align:center}
.mult .eq{font:700 40px JBM;color:rgba(255,255,255,.8)}
.mult .res{font-size:230px;color:var(--acc);text-shadow:0 0 60px rgba(79,179,255,.4)}
.mult .note{font:600 26px Manrope;color:rgba(255,255,255,.65)}

/* rule */
.rule{position:absolute;left:80px;right:80px;padding:22px 30px}
.rule .row{display:flex;align-items:center;gap:16px}
.rule .row .ic{width:86px;height:86px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:48px;background:#F1F5F9}
.rule .row .ic.ok{background:#DCFCE7}.rule .row .ic.no{background:#FFE4E6}
.rule .row .stp{margin-left:auto;font-size:84px;padding:0 22px;border-radius:18px;border:7px solid currentColor;transform:rotate(-6deg)}
.rule .row .stp.won{color:#16A34A}.rule .row .stp.lost{color:#E11D48}
.ex_rule .sub{position:absolute;left:60px;right:60px;top:1130px;text-align:center}
.ex_rule .sub .chip{font-size:28px;white-space:normal;line-height:1.35;text-align:center}

/* phone */
.phone{position:absolute;left:210px;top:330px;width:660px;height:1220px;border-radius:86px;background:#0A0A0A;box-shadow:0 0 0 4px #2B2F2B,0 50px 120px rgba(0,0,0,.7),0 0 140px rgba(79,179,255,.12)}
.phone .scr{position:absolute;inset:16px;border-radius:72px;background:#F5F6F2;overflow:hidden;color:var(--ink)}
.phone .isl{position:absolute;left:50%;top:30px;width:170px;height:44px;margin-left:-85px;border-radius:24px;background:#000;z-index:5}
.app{position:absolute;inset:0;opacity:0}
.bar{position:absolute;left:0;right:0;top:0;height:150px;padding:86px 34px 0;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:2px solid #ECEEE8}
.bar .nm{display:flex;align-items:center;gap:12px;font:800 30px Manrope}
.bar .nm i{width:40px;height:40px;border-radius:11px;background:var(--acc)}
.bar .btn{padding:10px 18px;border-radius:12px;background:var(--acc);font:800 20px Manrope}
.pad{position:absolute;left:30px;right:30px;top:180px}
.ttlp{font:400 54px Anton;text-transform:uppercase;margin-bottom:18px}
.bt{display:flex;align-items:center;justify-content:center;gap:12px;height:96px;border-radius:22px;background:#fff;border:2px solid #E2E5DE;font:800 28px Manrope;margin-bottom:18px}
.bt.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt.l{background:var(--acc);border-color:var(--acc)}
.okc{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:#ECFDF5;color:#047857;font:700 22px Manrope;margin-top:6px}
.bal{padding:28px;border-radius:26px;background:#fff;border:2px solid #E2E5DE;text-align:center}
.bal span{display:block;font:700 18px JBM;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.bal b{display:block;font:400 110px Anton;margin:8px 0}
.bal .net{display:inline-flex;margin-top:12px;letter-spacing:0;text-transform:none;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:#EEF2FF;color:#1D4ED8;font:800 22px Manrope}
.net i{width:22px;height:22px;border-radius:50%;background:#2563EB}
.pk{padding:22px 24px;border-radius:26px;background:#fff;border:2px solid #E2E5DE}
.pk .lg{padding:12px 0}.pk .lg .fl{width:50px;height:50px;font-size:32px}.pk .lg .w b{font-size:24px}.pk .lg .w span{font-size:17px}.pk .lg .m{font-size:36px}
.pk .hd{font:700 15px JBM;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.pk .ttl{font:800 24px Manrope;margin:6px 0 6px}
.pk .buy{margin-top:12px;height:76px;border-radius:18px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:800 26px Manrope}
.pk .buy em{font-style:normal;color:var(--yes);margin-left:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:760px;border-radius:44px 44px 0 0;background:#fff;box-shadow:0 -20px 60px rgba(0,0,0,.18);padding:36px 34px;transform:translateY(100%)}
.sheet .lb{font:700 18px JBM;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.amt{margin:12px 0 14px;height:100px;border-radius:20px;border:3px solid var(--ink);display:flex;align-items:center;padding:0 24px;font:400 64px Anton}
.amt .cur{width:4px;height:58px;background:var(--ink);margin-left:6px}
.qk{display:flex;gap:12px;margin-bottom:22px}.qk div{flex:1;height:64px;border-radius:14px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font:800 22px Manrope}
.tw{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.tw b{font:400 96px Anton;color:#16A34A;line-height:1}
.tw span{font:700 22px Manrope;color:var(--muted)}
.tap{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 0 0 6px rgba(11,18,32,.25);z-index:9;opacity:0;pointer-events:none}

/* track */
.trk{position:absolute;left:80px;right:80px;top:430px;padding:34px}
.steps{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.steps div{flex:1;text-align:center;font:800 26px Manrope;color:#94A3B8;position:relative}
.steps div i{display:block;width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:#E2E8F0;border:5px solid #E2E8F0}
.steps div.on{color:var(--ink)}.steps div.on i{background:var(--acc);border-color:var(--ink)}
.legsw{display:flex;gap:14px;justify-content:center;margin:12px 0 20px}
.legsw div{width:150px;height:150px;border-radius:30px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font:400 72px Anton;color:#CBD5E1}
.legsw div.ok{background:#DCFCE7;color:#16A34A}
.cnt{text-align:center;font:800 34px Manrope}
.claim{position:absolute;left:50%;top:1060px;width:560px;margin-left:-280px;height:130px;border-radius:30px;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;font:400 72px Anton;text-transform:uppercase;box-shadow:0 0 60px rgba(79,179,255,.45)}
.coin{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E6F4FF,#4FB3FF 55%,#1F5FDB);box-shadow:0 6px 16px rgba(0,0,0,.4);font:400 34px Anton;color:#0A2A4F;display:flex;align-items:center;justify-content:center;opacity:0}

/* custom builder */
.mc{padding:16px 18px;border-radius:22px;background:#fff;border:2px solid #E2E5DE;margin-bottom:14px}
.mc .tm{display:flex;justify-content:space-between;font:800 22px Manrope;margin-bottom:12px}
.mc .tm span{font-size:28px;margin-right:6px}
.mc .op{display:flex;gap:10px}.mc .op div{flex:1;height:58px;border-radius:12px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font:800 20px Manrope}
.mc .op div.sel{background:var(--ink);color:#fff}
.side{position:absolute;left:0;right:0;bottom:0;height:420px;border-radius:40px 40px 0 0;background:#fff;box-shadow:0 -18px 50px rgba(0,0,0,.16);padding:28px 30px;transform:translateY(100%)}
.side .hdx{display:flex;justify-content:space-between;font:800 26px Manrope}
.side .hdx span{font:700 18px JBM;letter-spacing:2px;color:var(--muted)}
.side .ln{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid #F1F5F9;font:800 22px Manrope}
.side .ln em{font-style:normal;color:var(--yes)}
.share{position:absolute;left:150px;right:150px;top:1440px;display:flex;justify-content:center;opacity:0;z-index:30}
.share .chip{font-size:28px;background:var(--acc);color:var(--ink);border-color:var(--acc)}

/* pvp */
.vs{position:absolute;left:70px;right:70px;top:430px;padding:40px 34px;background:linear-gradient(160deg,#0F2A4F,#050E1C);border:2px solid rgba(79,179,255,.35);color:#fff}
.vs .pl{display:flex;justify-content:space-between;align-items:center}
.vs .av{width:280px;text-align:center}
.vs .av i{display:flex;width:170px;height:170px;margin:0 auto 14px;border-radius:50%;align-items:center;justify-content:center;font-size:90px;background:rgba(255,255,255,.08);border:4px solid var(--acc)}
.vs .av b{font:400 42px Anton;text-transform:uppercase;white-space:nowrap}
.vs .av span{display:block;font:800 30px Manrope;color:var(--acc);margin-top:6px}
.vs .mid{font:400 110px Anton;color:var(--acc)}
.vs .mom{display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.vs .mom div{padding:14px 22px;border-radius:999px;background:rgba(255,255,255,.08);font:800 26px Manrope;border:2px solid rgba(255,255,255,.18)}
.vs .mom div.sel{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.vs .pot{text-align:center;margin-top:34px;font:800 34px Manrope}
.vs .pot b{font-family:Anton;font-weight:400;font-size:64px;color:var(--acc)}
.match{position:absolute;left:0;right:0;top:1150px;text-align:center}
.match div{display:inline-block;font:400 128px Anton;text-transform:uppercase;color:var(--ink);background:var(--acc);padding:10px 40px;border-radius:26px;transform:rotate(-4deg);box-shadow:0 0 80px rgba(79,179,255,.5)}

/* numbers */
.nums{position:absolute;left:60px;right:60px;top:420px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.nums .n{padding:34px 30px;border-radius:34px;background:rgba(255,255,255,.06);border:2px solid rgba(79,179,255,.28)}
.nums .n b{display:block;font:400 112px Anton;color:var(--acc);line-height:1}
.nums .n span{display:block;font:800 28px Manrope;margin-top:10px}
.nums .n small{display:block;font:600 21px Manrope;color:rgba(255,255,255,.6);margin-top:6px}
.ex_numbers .fine{position:absolute;left:60px;right:60px;top:1180px;text-align:center}
.ex_numbers .fine .chip{font-size:22px}

/* smart */
.list{position:absolute;left:70px;right:70px;top:420px}
.list .it{display:flex;align-items:center;gap:22px;padding:28px 30px;border-radius:30px;background:#fff;color:var(--ink);margin-bottom:22px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.list .it i{flex-shrink:0;width:72px;height:72px;border-radius:20px;background:var(--acc);display:flex;align-items:center;justify-content:center;font:400 40px Anton;font-style:normal}
.list .it b{display:block;font:800 34px Manrope;line-height:1.15}
.list .it span{display:block;font:600 23px Manrope;color:var(--muted);margin-top:4px}

/* outro */
.ex_outro .big{position:absolute;left:60px;right:60px;top:430px;text-align:center}
.ex_outro .big .a{font-size:150px}
.ex_outro .big .a em{font-style:normal;color:var(--acc)}
.ex_outro .ws{position:absolute;left:80px;right:80px;top:820px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ex_outro .ws .chip{font-size:24px;white-space:normal;text-align:center;line-height:1.35}
.ex_outro .ws .chip.f{background:var(--acc);color:var(--ink);border-color:var(--acc);font-size:30px}

/* ---------------------------------------------------------------- the keyhole (kh_*), 6 Oct: an encrypted-NFT story in
   the owner's light style ("my style is light or shades of blue"): sky-blue air, white frosted glass, navy type, blue
   accents. The cold open sits in deep royal blue (still blue, never black); the drop floods the screen with light. */
#hexf{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;pointer-events:none;background-repeat:repeat}
#stage.sky{background:linear-gradient(180deg,#F5FAFF 0%,#E2EFFF 48%,#C9E0FF 100%);color:#0A2A4F}
#stage.sky #grid{display:none}
#stage.sky #hexf{opacity:1}
#stage.sky .blob{opacity:.35;background:#8EC5FF}
#stage.sky #b2{background:#B7D6FF;opacity:.45}
#stage.sky #vig{background:radial-gradient(95% 75% at 50% 45%,transparent 60%,rgba(31,95,219,.14) 100%)}
#stage.sky #grain{opacity:.025}
#stage.sky #chap{color:rgba(10,42,79,.6)}
#stage.sky #chap b{color:#1F5FDB}
#stage.sky .logo span.x{color:#1F5FDB}
#stage.sky #prog{background:rgba(31,95,219,.12)}
#stage.sky #prog i{background:#1F5FDB;box-shadow:0 0 14px rgba(31,95,219,.5)}
#stage.sky #foot{color:rgba(10,42,79,.5)}
#stage.sky #flash{background:#FFFFFF;mix-blend-mode:normal}
#stage.sky #cap .c{font:800 50px/1.2 Manrope;text-transform:none;letter-spacing:-.5px;-webkit-text-stroke:0;text-shadow:none;color:#0A2A4F;padding:16px 30px 18px;border-radius:28px;background:rgba(255,255,255,.88);border:2px solid #FFFFFF;box-shadow:0 18px 50px rgba(31,95,219,.22)}
#stage.sky #cap .w{margin:0 .1em}
#stage.sky #cap .w.now{color:#1F5FDB}

<body>
<div id="stage">
  <div id="grid"></div><div id="hexf"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div id="vig"></div>
  <div id="hdr"><div class="logo"><span class="bars"><i style="height:20px"></i><i style="height:30px"></i><i style="height:40px"></i></span>cmvng<span class="x">explains</span></div><div id="chap"></div></div>
  <div id="prog"><i></i></div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="foot"></div>
  <div id="flash"></div><div id="grain"></div>
</div>
<script>
const D = window.DATA
const $ = (s, el = document) => el.querySelector(s)
const $$ = (s, el = document) => [...el.querySelectorAll(s)]
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), outCubic: x => 1 - Math.pow(1 - x, 3),
  outBack: x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2), inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const P = (t, a, b, e = E.outExpo) => e(clamp((t - a) / (b - a)))
const html = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const S = (sc, j) => sc.lines[j] || sc.lines.at(-1) || [0.4, 2]          // scene-relative [start, dur] of spoken line j
const L = (sc, j, frac = 0) => { const s = S(sc, j); return s[0] + s[1] * frac }   // a moment inside line j
const EX = D.cfg.explainer || {}
$('#foot').textContent = EX.foot || ''
if (EX.theme) $('#stage').classList.add(EX.theme)

// pieces
const leg = (l, extra = '') => `<div class="lg">${extra}<div class="fl">${l.flag || ''}</div><div class="w"><b>${html(l.team)} <i>${html(l.side || 'YES')} ${l.pct ?? ''}${l.pct != null ? '%' : ''}</i></b><span>${html(l.match || '')}</span></div><div class="m">${html(l.x)}x</div><div class="st"></div></div>`
const tap = (x, y) => `<div class="tap" data-x="${x}" data-y="${y}" style="left:${x}px;top:${y}px"></div>`
const appBar = (btn = 'Sign up') => `<div class="bar"><div class="nm"><i></i>Limitless</div><div class="btn">${html(btn)}</div></div>`
function rise(nodes, lt, start, step = 0.08, dist = 60, dur = 0.55) {
  nodes.forEach((n, j) => { if (!n) return; const q = P(lt, start + j * step, start + j * step + dur, E.outCubic); n.style.opacity = q; n.style.transform = `translate3d(0,${(1 - q) * dist}px,0)` })
}
function pop(n, lt, at, from = 0.6, dur = 0.35, extra = '') {
  if (!n) return; const q = P(lt, at, at + dur, E.outBack); n.style.opacity = clamp((lt - at) / 0.12); n.style.transform = `${extra} scale(${from + (1 - from) * q})`
}
function slam(n, lt, at, from = 1.8, dur = 0.3, extra = '') {
  if (!n) return; const q = P(lt, at, at + dur, E.outCubic); n.style.opacity = clamp((lt - at) / 0.1); n.style.transform = `${extra} scale(${from + (1 - from) * q})`
}
const shake = (lt, at, amp = 14) => { const d = lt - at; if (d < 0 || d > 0.3) return ''; const a = amp * (1 - d / 0.3); return `translate3d(${a * Math.sin(d * 95)}px,${a * Math.cos(d * 77)}px,0)` }
function tapAt(n, lt, at) {     // a finger tap: a ring that appears, presses and fades
  if (!n) return; const d = lt - at
  if (d < -0.25 || d > 0.5) { n.style.opacity = 0; return }
  n.style.opacity = d < 0 ? (d + 0.25) / 0.25 : 1 - d / 0.5
  n.style.transform = `scale(${d < 0 ? 1.15 : 0.82 + 0.5 * clamp(d / 0.5)})`
}
const money = v => '$' + Math.round(v).toLocaleString('en-US')
const has = (sc, j) => sc.lines.length > j                                  // the beat has a spoken line j
function glitch(n, lt, at, dur = 0.38) {     // a digital break: jitter + colour split for a moment
  if (!n) return; const d = lt - at
  if (d < 0 || d > dur) { n.style.textShadow = ''; return '' }
  const r = Math.sin(lt * 997) * Math.cos(lt * 331), a = 18 * (1 - d / dur)
  n.style.textShadow = `${-7 * (1 - d / dur)}px 0 #ff2a55, ${7 * (1 - d / dur)}px 0 #00e5ff`
  return `translate3d(${r * a}px,${Math.sin(lt * 613) * a * 0.3}px,0) skewX(${r * 8}deg)`
}

// ---------------------------------------------------------------- the keyhole (kh_*), 6 Oct: an encrypted-NFT story
// (first used for Fungo Labs). Pixel eyes, our own keyhole mark and pixel creatures, ciphertext that never resolves.
// Every moment is cued to the spoken word (measured word timings), so the screen moves exactly with the voice.
const hsh = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x) }
const HEXC = '0123456789abcdef'
const hexs = (n, seed, t = 0, rate = 14) => Array.from({ length: n }, (_, i) => HEXC[Math.floor(hsh(i + seed * 101, Math.floor(t * rate) + seed) * 16)]).join('')
function WT(sc, j, re, frac = 0) {        // when a word is spoken in line j (scene time), else a fraction of the line
  if (!has(sc, j)) return L(sc, j, frac)
  const s = S(sc, j), a = sc.start + s[0] - 0.05, b = sc.start + s[0] + s[1] + 0.05
  for (const c of D.captions) for (const w of c.words) if (w.t0 >= a && w.t0 <= b && re.test(w.w)) return w.t0 - sc.start
  return L(sc, j, frac)
}
function keyholeD(cx, cy, s) {           // a keyhole: a round head and a flared foot
  const r = 60 * s, nx = 25 * s, ty = cy + Math.sqrt(r * r - nx * nx), bx = 52 * s, by = cy + 150 * s
  return `M ${cx - nx} ${ty} A ${r} ${r} 0 1 1 ${cx + nx} ${ty} L ${cx + bx} ${by} L ${cx - bx} ${by} Z`
}
const markSvg = () => `<svg class="mark" viewBox="0 0 200 200"><defs><radialGradient id="khg" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#8EC5FF"/><stop offset="1" stop-color="#3D7BFF"/></radialGradient></defs>
  <circle class="rg" cx="100" cy="100" r="88" fill="none" stroke="#4FB3FF" stroke-width="5" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="72" fill="rgba(31,95,219,.16)" stroke="rgba(142,197,255,.55)" stroke-width="2.5"/>
  <path d="${keyholeD(100, 80, 0.4)}" fill="url(#khg)"/></svg>`
const lockSvg = (c = '#EAF2FF') => `<svg viewBox="0 0 100 100" style="width:100%;height:100%"><path d="M30 46 V33 a20 20 0 0 1 40 0 V46" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/><rect x="17" y="44" width="66" height="48" rx="11" fill="${c}"/><circle cx="50" cy="63" r="7" fill="#03101F"/><rect x="47" y="64" width="6" height="15" rx="3" fill="#03101F"/></svg>`
const eyeSlashSvg = () => `<svg viewBox="0 0 160 160"><path d="M14 80 Q80 18 146 80 Q80 142 14 80 Z" fill="none" stroke="#8EC5FF" stroke-width="7"/><circle cx="80" cy="80" r="22" fill="#4FB3FF"/><circle cx="80" cy="80" r="9" fill="#02060D"/><line x1="30" y1="134" x2="130" y2="26" stroke="#EAF2FF" stroke-width="9" stroke-linecap="round"/></svg>`
const EYE = ['..xxxxx..', '.xxxxxxx.', 'xxxxxxxxx', '.xxxxxxx.', '..xxxxx..']
const eyeSvg = (cls = 'eye') => `<svg class="${cls}" viewBox="0 0 9 5" shape-rendering="crispEdges">${EYE.flatMap((r, y) => [...r].map((ch, x) => ch === 'x' ? `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#EAF2FF"/>` : '')).join('')}<rect x="3" y="1" width="3" height="3" fill="#3D7BFF"/><rect x="4" y="2" width="1" height="1" fill="#02060D"/><rect x="3.25" y="1.2" width=".55" height=".55" fill="#fff"/></svg>`
function creatureSvg(seed) {            // a mirrored 10×10 pixel creature in our blues
  const N = 10, px = [], pal = ['#EAF2FF', '#8EC5FF', '#4FB3FF', '#1F5FDB']
  const eY = 3 + Math.floor(hsh(seed, 4) * 2), eX = 2 + Math.floor(hsh(seed, 6) * 2)
  for (let y = 0; y < N; y++) for (let x = 0; x < 5; x++) {
    const ex = (4.5 - x) / 4.5, ey = (y - 5) / 4.4, r = hsh(seed * 7 + x * 3 + 1, y * 5 + 2)
    let c = -1
    if (ex * ex * 0.65 + ey * ey < 0.72) c = r < 0.12 ? -1 : r < 0.32 ? 1 : r < 0.78 ? 2 : 3
    else if (y >= 7 && r > 0.66) c = 3
    else if (y <= 2 && r > 0.78) c = 1
    if (y === eY && x === eX) c = -1
    if (c >= 0) px.push([x, y, pal[c]], [N - 1 - x, y, pal[c]])
  }
  const eyes = [eX, N - 1 - eX].map(x => `<rect x="${x}" y="${eY}" width="1" height="1" fill="#FFFFFF"/><rect x="${x + 0.3}" y="${eY + 0.25}" width=".45" height=".6" fill="#02060D"/>`).join('')
  return `<svg class="cr" viewBox="-1 -1 12 12">${px.map(([x, y, f]) => `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${f}"/>`).join('')}${eyes}</svg>`
}
function eyeField(seed, avoid) {         // a crowd of pixel eyes, staggered rows, clear of the areas in `avoid`
  const out = []; let i = 0
  for (let row = 0; row < 12; row++) for (let col = 0; col < 8; col++) {
    i++
    const p = 6 + Math.round(hsh(i, seed + 2) * 6)
    const cx = 75 + col * 133 + (row % 2 ? 66 : 0) + (hsh(i, seed) - 0.5) * 50, cy = 228 + row * 113 + (hsh(i, seed + 1) - 0.5) * 40
    if (cx - 4.5 * p < 20 || cx + 4.5 * p > 1060) continue
    if (avoid.some(r => cx + 4.5 * p > r[0] && cx - 4.5 * p < r[2] && cy + 2.5 * p > r[1] && cy - 2.5 * p < r[3])) continue
    out.push({ cx, cy, p, d: hsh(i, seed + 3), e: hsh(i, seed + 4) })
  }
  return out
}
function drawEye(g, cx, cy, p, open, lx, ly, hot = 0, ol = null) {     // ol: an outline colour, for eyes on the light page
  if (open <= 0.05) { g.fillStyle = ol || 'rgba(191,223,255,.45)'; g.fillRect(cx - 3.5 * p, cy - 1.5, 7 * p, ol ? 4 : 3); return }
  g.save(); g.translate(cx, cy); g.scale(1, open)
  g.beginPath(); EYE.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'x') g.rect((x - 4.5) * p, (y - 2.5) * p, p + 0.6, p + 0.6) }))
  if (ol) { g.lineWidth = Math.max(3, p * 0.5); g.strokeStyle = ol; g.stroke() }
  g.fillStyle = ol ? '#FFFFFF' : '#EAF2FF'; g.fill(); g.clip()
  const ix = Math.round(lx * 4) / 2, iy = Math.round(ly * 1.6) / 2, pp = hot ? 1.5 : 1
  g.fillStyle = hot ? '#4FB3FF' : '#3D7BFF'; g.fillRect((ix - 1.5) * p, (iy - 1.5) * p, 3 * p, 3 * p)
  g.fillStyle = '#02060D'; g.fillRect((ix - pp / 2) * p, (iy - pp / 2) * p, pp * p, pp * p)
  g.fillStyle = '#FFFFFF'; g.fillRect((ix - 1.3) * p, (iy - 1.35) * p, 0.55 * p, 0.55 * p)
  g.restore()
}
const nftCard = (cls, seed, id, tag = '') => `<div class="glass nft ${cls}"><div class="art"><div class="ct"></div>${seed == null ? markSvg() : creatureSvg(seed)}<div class="lockic">${lockSvg()}</div></div>${id ? `<div class="nm">${html(id)}<span>${html(tag)}</span></div>` : ''}</div>`
const ring = (q, r = 84) => { const c = 2 * Math.PI * r; return `<svg viewBox="0 0 196 196"><circle cx="98" cy="98" r="${r}" fill="none" stroke="rgba(31,95,219,.12)" stroke-width="14"/><circle cx="98" cy="98" r="${r}" fill="none" stroke="#1F5FDB" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - q)}" transform="rotate(-90 98 98)"/></svg>` }

function buildKH(el, sc, b) {
  el.classList.add('kh')
  const T = (t, s) => `<div class="t1 A">${html(t || '')}</div><div class="t2">${html(s || '')}</div>`
  const ty = sc.type.slice(6)
  if (ty === 'cold') {
    // the push-in scales the canvas inside its own drawing and the cards in .zw: scaling the whole scene with a
    // full-screen canvas in it crashes Chromium's compositor (6 Oct)
    el.innerHTML = `<div class="deep"></div><canvas class="full" width="1080" height="1920"></canvas><div class="zw"><svg class="wires">${(b.tags || []).map(() => '<line/>').join('')}</svg>
      ${nftCard('', b.seed ?? 7, b.id || '#2048', b.tagline || 'On-chain')}<div class="scan"></div>
      ${(b.tags || []).map(x => `<div class="tag"><small>${html(x[0])}</small><span>${html(x[1])}</span></div>`).join('')}</div><div class="dark"></div>`
    el._eyes = eyeField(b.eyes ?? 3, [[270, 560, 810, 1240]])
  } else if (ty === 'seal') {
    el.innerHTML = `${nftCard('', null, b.id || '#2048', 'Sealed')}<div class="eyein">${eyeSvg('')}</div>
      <div class="big"><div class="a A">${html(b.title || 'Sealed.')}</div><div class="s">${html(b.sub || '')}</div><div class="c"><span class="chip">${html(b.chip || '')}</span></div></div>`
  } else if (ty === 'fhe') {
    el.innerHTML = `${T(b.title, b.sub)}<div class="box"><div class="ring"></div><div class="in">${eyeSlashSvg()}<div class="q"></div><div class="lbl">${html(b.box || 'Smart contract')}</div></div></div>
      <div class="tok ta">${html(b.a || 'enc(7)')}</div><div class="tok tb">${html(b.b || 'enc(5)')}</div><div class="tok o">${html(b.out || 'enc(12)')}</div>
      <div class="nev"><span class="chip">${html(b.never || '')}</span></div>`
  } else if (ty === 'draw') {
    el.innerHTML = `${T(b.title, b.sub)}${(b.reels || [['Look', '64-bit'], ['Essence', '64-bit']]).map((r, j) => `<div class="glass reel" style="top:${430 + j * 270}px"><div class="hd"><b>${html(r[0])}</b><span class="lbl">${html(r[1])}</span></div>
      <div class="slot"><i class="x">0</i><i class="x">x</i>${'<i></i>'.repeat(16)}</div><div class="lockic">${lockSvg('#1F5FDB')}</div></div>`).join('')}
      <div class="stamp2"><div class="a">${(b.stamp || ['Nobody', 'chooses.']).map(html).join('<br>')}</div><div class="s">${html(b.note || '')}</div></div>`
  } else if (ty === 'bytes') {
    const tiles = b.tiles || [], groups = b.groups || []
    el.innerHTML = `${T(b.title, b.sub)}<div class="tiles">${tiles.map((x, i) => `<div class="tl ${x[1] || ''}" style="left:${i * 124}px"><small>B${i}</small><b></b><span>${html(x[0])}</span></div>`).join('')}</div>
      ${groups.map(g => `<div class="grp" style="left:${50 + g[1] * 124}px;width:${(g[2] - g[1] + 1) * 124 - 12}px">${html(g[0])}</div>`).join('')}
      <div class="glass odds"><div class="lbl">${html(b.odds_title || 'Class chances')}</div>${(b.odds || []).map((o, j) => `<div class="r${j === b.odds.length - 1 ? ' leg' : ''}"><span>${html(o[0])}</span><div class="obar"><i></i></div><b>${o[1].toFixed(1)}%</b></div>`).join('')}</div>
      <div class="one"><span class="chip f">${html(b.one || '')}</span></div>`
  } else if (ty === 'peek') {
    const pub = b.pub_rows || [], hold = b.hold_rows || []
    const row = r => `<div class="rw"><span>${html(r[0])}</span>${typeof r[1] === 'number' ? `<div class="sb"><i style="width:${r[1]}%"></i></div>` : `<em>${html(r[1])}</em>`}</div>`
    el.innerHTML = `${T(b.title, '')}<div class="who"><div>◀ ${html((b.sides || [])[0] || 'The public')}</div><div>${html((b.sides || [])[1] || 'The holder')} ▶</div></div>
      <div class="pc glass"><div class="lay pub"><div class="art"><div class="ct"></div>${markSvg()}<div class="pubart">${creatureSvg(b.seed ?? 7)}</div><div class="badge">${html(b.sealed || 'Sealed')}</div></div><div class="rows">${pub.map(row).join('')}<div class="forever"><span>${html(b.forever || '')}</span></div></div></div>
        <div class="lay hold"><div class="art">${creatureSvg(b.seed ?? 7)}<div class="badge">${html(b.only || 'Only you')}</div></div><div class="rows">${hold.map(row).join('')}</div></div></div>
      <div class="knob"><i>${eyeSvg('')}</i></div><div class="ill">${html(b.note || '')}</div>`
  } else if (ty === 'sale') {
    el.innerHTML = `${T(b.title, b.sub)}${['seller', 'buyer'].map((w, j) => `<div class="glass wl ${w}" style="left:${60 + j * 520}px"><div class="lbl">${html((b.who || ['Seller', 'Buyer'])[j])}</div>${eyeSvg('eye')}<div class="st"></div></div>`).join('')}
      <div class="glass nft"><div class="art">${markSvg()}${creatureSvg(b.seed ?? 7)}</div></div>
      <div class="tx"><span class="chip">${html(b.same || 'Same transaction')}</span></div>
      <div class="glass blk"><div class="rg"></div><div><b>+0</b><span>${html(b.blocks_label || 'blocks')}</span></div></div>
      <div class="wake">${html(b.wake || 'Wake')}<small>${html(b.wake_sub || '')}</small></div>`
  } else if (ty === 'duel') {
    el.innerHTML = `${T(b.title, b.sub)}${nftCard('da', null, b.a || 'enc(#2048)')}${nftCard('db', null, b.b || 'enc(#0777)')}<div class="vsx">VS</div><div class="win">${html(b.win || 'Wins')}</div>
      <div class="cmp"><div class="lbl">computing</div><div class="cbar"><i></i></div></div><div class="poss"><span class="chip">${html(b.chip || '')}</span></div>
      <div class="glass road"><div class="ln"><i></i></div>${(b.road || []).map((r, j) => `<div class="st" style="left:${[150, 470, 790][j]}px"><i>${j + 1}</i><b>${html(r[0])}</b><span>${html(r[1])}</span></div>`).join('')}</div>`
  } else if (ty === 'genesis') {
    const parts = b.parts || []
    el.innerHTML = `<div class="cnt"><b>0</b><span>${html(b.label || '')}</span></div><canvas class="full" width="1080" height="1920"></canvas>
      <div class="leg">${parts.map(x => `<div class="r"><i style="background:${x.c}"></i><b>${x.n.toLocaleString('en-US')}</b><span>${html(x.k)}<em>${html(x.s || '')}</em></span></div>`).join('')}</div>`
    // the dots: a sunflower, the team at the heart, the free mints around it, the sale outside
    const N = b.total || 3232, R = 372, ga = Math.PI * (3 - Math.sqrt(5)), dots = []
    let i = 0
    parts.slice().reverse().forEach((x, gi) => { for (let n = 0; n < x.n; n++, i++) { const r = R * Math.sqrt((i + 0.5) / N), a = i * ga; dots.push({ x: 540 + r * Math.cos(a), y: 905 + r * Math.sin(a), g: parts.length - 1 - gi, q: i / N }) } })
    el._dots = dots
  } else if (ty === 'apply') {
    el.innerHTML = `${T(b.title, b.sub)}${(b.steps || []).map((s, j) => `<div class="glass stp" style="top:${410 + j * 146}px"><i>${j + 1}</i><div><b>${html(s[0])}</b><span>${html(s[1])}</span></div></div>`).join('')}
      <div class="glass me"><div class="av">𝕏</div><div><b>${html(b.handle || '')}</b><span>${html(b.status || '')}</span></div><div class="sl">${html(b.stamp || 'Sealed')}</div></div>
      <div class="warn">${(b.chips || []).map(c => `<span class="chip">${html(c)}</span>`).join('')}</div>`
  } else if (ty === 'end') {
    el.innerHTML = `<canvas class="full" width="1080" height="1920"></canvas><div class="big"><div class="a A">${html(b.l1 || '')}</div><div class="a A b">${html(b.l2 || '')}</div></div>
      <div class="ws">${(b.chips || []).map(c => `<span class="chip">${html(c)}</span>`).join('')}<span class="chip f">${html(b.follow || 'Follow for more')}</span></div>`
    el._eyes = eyeField(b.eyes ?? 21, [[300, 600, 780, 880], [40, 1000, 1040, 1560]])
  }
}

// the canvases are drawn in software (willReadFrequently): a full-screen GPU canvas crashes headless Chromium's compositor
function drawKH(el, lt, sc, b) {
  const ty = sc.type.slice(6)
  const txt = (n, s) => { if (n && n.textContent !== s) n.textContent = s }
  if (ty === 'cold') {

  const ty = sc.type.slice(6), b = sc.data || {}, w = (j, re, f) => T + WT(sc, j, re, f), at = (j, f = 0) => T + L(sc, j, f)
  if (ty === 'cold') {
    add(T, '497', -13, { align: 'start', max: Math.max(1, sc.dur - 0.2) }); add(T, '2297', -17, { align: 'start', max: Math.max(1, sc.dur - 0.4) })
    add(at(0) + 0.1, '3124', -15)
    add(at(1) - 0.1, '2847', -15, { max: 1.6 })
    ;[w(1, /trait/i, 0.05), w(1, /rarity/i, 0.4), w(1, /rank/i, 0.75)].forEach((t, j) => add(t - 0.06, '2573', -10, { pan: [-0.35, 0.35, -0.2][j] }))
    add(w(2, /look/i, 0.6), '1143', -9, { align: 'peak' })
    const tS = w(3, /now/i, 0.45); add(tS, '2951', -6); add(tS + 0.18, '2853', -8)
    if (next?.data?.drop) add(next.start, '2908', -6, { reverse: true, max: 2.6, align: 'end' })
  }
  if (ty === 'seal') add(w(1, /inside|holder/i, 0.6), '3124', -12)
  if (ty === 'fhe') {
    add(T + 0.3, '3124', -10); add(w(1, /seven|^7/i, 0.05), '3115', -11, { pan: -0.4 }); add(w(1, /five|^5/i, 0.2), '3115', -11, { pan: 0.4 })
    const tin = w(1, /comes/i, 0.4); add(tin, '2636', -12); add(tin + 0.15, '3117', -14, { max: 1.0 })
    add(w(1, /twelve|^12/i, 0.6), '2573', -8)
  }
  if (ty === 'draw') {
    add(w(0, /draws/i, 0.35) - 0.2, '2857', -15, { max: 2.2 })
    ;[w(0, /look/i, 0.75), w(0, /essence/i, 0.95)].forEach(t => add(t, '2573', -10))
    const tE = w(1, /encrypted/i, 0.2); add(tE + 0.2, '2853', -9); add(tE + 0.32, '2853', -12)
    const tN = w(1, /nobody/i, 0.5); add(tN - 0.04, '1365', -5); add(tN - 0.04, '2299', -7)
  }
  if (ty === 'bytes') {
    add(T + Math.min(WT(sc, 0, /eight|^8/i, 0.15), 1.2), '3115', -12)
    ;[w(0, /class/i, 0.3), w(0, /stats/i, 0.45), w(0, /element/i, 0.65), w(0, /reserve/i, 0.85)].forEach(t => add(t, '2573', -12))
    ;[w(1, /secrecy/i, 0.25), w(1, /intuition/i, 0.45), w(1, /will/i, 0.65), w(1, /energy/i, 0.85)].forEach((t, j) => add(t, '3124', -13, { pan: [-0.3, -0.1, 0.1, 0.3][j] }))
    add(at(2) - 0.15, '2636', -13); add(w(2, /legendary/i, 0.8), '1143', -9, { align: 'peak' })
  }
  if (ty === 'peek') {
    add(T, '2908', -12, { reverse: true, max: 1.1, align: 'end' })
    add(T + WT(sc, 1, /holder/i, 0.05) - 0.1, '2847', -13, { max: 1.2 })
    add(w(2, /publish/i, 0.4), '3124', -10); add(w(2, /never/i, 0.8) - 0.05, '2853', -8)
  }
  if (ty === 'sale') {
    add(w(0, /sell/i, 0.1), '3115', -10); add(w(0, /ends/i, 0.5), '2849', -10)
    add(w(1, /ninety|^96/i, 0.3), '2857', -15, { max: 1.6 })
    const tTx = w(1, /transaction/i, 0.85); add(tTx, '2573', -9); add(tTx + 0.15, '1143', -11, { align: 'peak' })
  }
  if (ty === 'duel') {
    const tD = w(0, /duel/i, 0.5) - 0.3; add(tD, '3115', -10, { pan: -0.4 }); add(tD + 0.05, '3115', -10, { pan: 0.4 }); add(tD + 0.4, '2909', -7)
    add(w(0, /settle/i, 0.55), '3117', -14, { max: 1.2 }); add(w(0, /stat/i, 0.95), '1143', -9, { align: 'peak' })
    ;[w(1, /genesis/i, 0.3), w(1, /launchpad/i, 0.55), w(1, /game/i, 0.8)].forEach(t => add(t - 0.1, '2573', -11))
  }
  if (ty === 'genesis') {
    add(T + Math.max(0.1, L(sc, 0, 0) - 0.2), '2636', -11); add(at(0, 0.9), '1143', -7, { align: 'peak' })
    ;[w(1, /2,500|sale/i, 0.1), w(1, /232|team/i, 0.8), w(2, /500|free/i, 0.2)].forEach(t => add(t - 0.05, '3124', -11))
  }
  if (ty === 'apply') {
    ;[w(0, /connect/i, 0.2), w(0, /four|^4/i, 0.45), w(0, /three|^3/i, 0.75), w(1, /sealed/i, 0.3)].forEach(t => add(t, '2573', -11))
    const tSt = w(1, /review/i, 0.6); add(tSt - 0.05, '1365', -6); add(tSt - 0.05, '2299', -9)
    ;[w(2, /wallet/i, 0.2), w(2, /never/i, 0.6)].forEach(t => add(t, '3124', -12))
  }
  if (ty === 'end') {
    add(w(0, /seen/i, 0.05) - 0.05, '1143', -7, { align: 'peak' })
    const tK = w(0, /known/i, 0.55) - 0.05; add(tK, '2908', -4); add(tK, '2299', -5)
    add(at(1, 0.05), '3124', -12)
  }
}

// ---------------------------------------------------------------- per-frame animation
function draw(k, lt, sc) {
  const el = built[k], b = sc.data || {}
  if (sc.type.startsWith('ex_kh_')) return drawKH(el, lt, sc, b)
  if (sc.type === 'ex_cold') {
    // lines: "Ten dollars." / "One ticket." / "$172 back, if every leg lands." / "Or nothing at all." → silence → the drop
    const v = $('.amt2 .v', el), lb = $('.amt2 .lb', el), ct = $('.ct', el), cks = $$('.ck', el)
    const tUp = L(sc, 2, 0), tNo = L(sc, 3, 0.25), checks = [0.45, 0.53, 0.61].map(f => L(sc, 2, f))
    slam(v, lt, L(sc, 0, 0) - 0.03, 1.9, 0.28)
    pop(ct, lt, L(sc, 1, 0) - 0.05, 0.7)
    const n = lt < tUp ? 10 : 10 + 162 * P(lt, tUp, tUp + 0.9, E.outCubic)
    v.textContent = lt >= tNo ? '$0' : money(n); v.className = 'v' + (lt >= tNo ? ' zero' : lt >= tUp ? ' up' : '')
    lb.textContent = lt >= tNo ? 'or nothing' : lt >= checks[0] - 0.4 ? 'if every leg lands' : lt >= tUp + 0.3 ? 'back' : ''
    cks.forEach((c, j) => { const lost = lt >= tNo && j === cks.length - 1
      c.className = 'ck' + (lost ? ' no' : lt >= checks[j] ? ' ok' : ''); c.textContent = lost ? '✕' : lt >= checks[j] ? '✓' : '' })
    ct.style.filter = lt >= tNo ? `grayscale(${0.85 * P(lt, tNo, tNo + 0.4)})` : ''
    const gl = glitch(v, lt, tNo) || ''
    v.style.transform = (v.style.transform || '') + ' ' + gl
    if (lt >= tNo) ct.style.transform = `rotate(${-4 * P(lt, tNo, tNo + 0.5, E.outCubic)}deg) translate3d(0,${30 * P(lt, tNo, tNo + 0.5, E.outCubic)}px,0)`
    // the silence before the drop: a slow push in, and the room gets darker
    const end = L(sc, 3, 1)
    el.style.transform = `scale(${1 + 0.05 * P(lt, end, sc.dur, E.inOutSine)})` + ' ' + shake(lt, L(sc, 0, 0), 12)
    $('.dim', el).style.opacity = 0.55 + 0.35 * P(lt, end, sc.dur, E.inOutSine)
  } else if (sc.type === 'ex_hook') {
    const d0 = b.drop ? 0 : 0.55       // on a drop the title lands on the cut
    $$('.tix', el).forEach((n, j) => { const at = b.drop ? j * 0.1 : 0.05 + j * 0.16, q = P(lt, at, at + 0.5, E.outBack), ang = (j - 1) * 11, dx = (j - 1) * 210
      n.style.opacity = clamp((lt - at) / 0.15); n.style.transform = `translate3d(${dx * q}px,${(1 - q) * 500 + Math.abs(j - 1) * 40}px,0) rotate(${ang * q}deg) scale(${0.9 + 0.02 * Math.sin(lt * 2 + j)})` })
    slam($('.big .p', el), lt, d0, 2.2, 0.32)
    if (b.drop) rise([$('.big .o', el)], lt, L(sc, 0, 0.5)), rise([$('.big .c', el)], lt, has(sc, 1) ? L(sc, 1, 0) : L(sc, 0, 0.75))
    else rise([$('.big .o', el), $('.big .c', el)], lt, 0.85, 0.15)
    el.style.transform = shake(lt, d0 + 0.03, b.drop ? 26 : 18)
  } else if (sc.type === 'ex_stack' && b.cue) {
    // one line per moment: cue.legs = the lines where each leg flies in, cue.eq = "the multipliers stack", cue.result
    const c = b.cue, legs = $$('.tkt .lg', el), xs = (b.legs || []).map(l => l.x)
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.1)
    pop($('.tkt', el), lt, 0.25, 0.85)
    legs.forEach((n, j) => { const at = L(sc, c.legs[j], 0) - 0.05, q = P(lt, at, at + 0.45, E.outBack); n.style.opacity = clamp((lt - at) / 0.1); n.style.transform = `translate3d(${(1 - q) * (j % 2 ? 600 : -600)}px,0,0)` })
    const got = c.legs.filter(j => lt >= L(sc, j, 0) - 0.05).length, eq = $('.mult .eq', el)
    eq.textContent = got ? xs.slice(0, got).join(' × ') : '×'
    rise([eq], lt, L(sc, c.eq, 0) - 0.1)
    const tr = L(sc, c.result, 0) - 0.08, r = $('.mult .res', el), q = P(lt, tr, tr + 0.6, E.outCubic)
    r.textContent = (+r.dataset.n * q).toFixed(2) + 'x'; r.style.opacity = clamp((lt - tr) / 0.12); r.style.transform = `scale(${1 + 0.16 * (1 - P(lt, tr + 0.6, tr + 0.95))})`
    rise([$('.mult .note', el)], lt, L(sc, c.result, 0.85))
  } else if (sc.type === 'ex_stack') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.1)
    pop($('.tkt', el), lt, 0.25, 0.85)
    const legs = $$('.tkt .lg', el), a0 = Math.max(0.6, L(sc, 0, 0.35))
    legs.forEach((n, j) => { const at = a0 + j * 0.45, q = P(lt, at, at + 0.45, E.outBack); n.style.opacity = clamp((lt - at) / 0.1); n.style.transform = `translate3d(${(1 - q) * (j % 2 ? 600 : -600)}px,0,0)` })
    const at = L(sc, 1, 0.15)
    rise([$('.mult .eq', el)], lt, at - 0.2)
    const r = $('.mult .res', el), q = P(lt, at + 0.2, L(sc, 1, 0.75), E.outCubic)
    r.textContent = (+r.dataset.n * q).toFixed(2) + 'x'; r.style.opacity = clamp((lt - at - 0.2) / 0.15); r.style.transform = `scale(${1 + 0.12 * (1 - P(lt, L(sc, 1, 0.75), L(sc, 1, 0.75) + 0.3))})`
    rise([$('.mult .note', el)], lt, L(sc, 1, 0.8))
  } else if (sc.type === 'ex_rule') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.1)
    const rows = $$('.rule', el), t0 = 0.4, t1 = Math.max(1.4, L(sc, 0, 0.45))
    rows.forEach((r, j) => { const at = j ? t1 : t0; rise([r], lt, at)
      $$('.ic', r).forEach((n, i) => pop(n, lt, at + 0.2 + i * 0.22, 0.3))
      slam($('.stp', r), lt, at + 1.0, 2.4, 0.26, 'rotate(-6deg)') })
    el.style.transform = shake(lt, t1 + 1.02, 16)
    rise([$('.sub', el)], lt, L(sc, 1, 0.05))
  } else if (sc.type === 'ex_start') {
    rise([$('.phone', el)], lt, 0, 0, 220, 0.6)
    const sw = L(sc, 1, 0), a1 = $('.a1', el), a2 = $('.a2', el)
    a1.style.opacity = lt < sw ? 1 : 1 - P(lt, sw, sw + 0.3); a1.style.transform = `translate3d(${-P(lt, sw, sw + 0.4, E.outCubic) * 200}px,0,0)`
    a2.style.opacity = P(lt, sw, sw + 0.3); a2.style.transform = `translate3d(${(1 - P(lt, sw, sw + 0.4, E.outCubic)) * 200}px,0,0)`
    rise($$('.a1 .bt', el), lt, 0.5, 0.18, 40); rise([$('.a1 .okc', el)], lt, L(sc, 0, 0.55))
    tapAt($('.tap', el), lt, L(sc, 0, 0.3))
    const bv = $('.a2 .bal b', el); bv.textContent = '$' + (+bv.dataset.n * P(lt, sw + 0.5, sw + 1.6, E.outCubic)).toFixed(2)
  } else if (sc.type === 'ex_buy') {
    rise([$('.phone', el)], lt, 0, 0, 220, 0.6)
    rise($$('.pk .lg', el), lt, 0.4, 0.15, 40)
    const taps = $$('.tap', el), tOpen = L(sc, 0, 0.7), tAmt = L(sc, 1, 0.1), tBuy = L(sc, 2, 0.1)
    tapAt(taps[0], lt, tOpen); tapAt(taps[1], lt, tAmt); tapAt(taps[2], lt, tBuy)
    $('.sheet', el).style.transform = `translate3d(0,${(1 - P(lt, tOpen + 0.1, tOpen + 0.55, E.outCubic)) * 100}%,0)`
    const amt = lt >= tAmt ? (b.amount || 10) : 0
    $('.amt .v', el).textContent = '$' + amt; $('.amt .cur', el).style.opacity = Math.floor(lt * 2.4) % 2 ? 0.2 : 1
    $('.q10', el).style.background = lt >= tAmt ? 'var(--acc)' : ''
    const tw = $('.tw b', el); tw.textContent = '$' + Math.round(+tw.dataset.n * P(lt, tAmt + 0.1, tAmt + 1.0, E.outCubic))
    const bb = $('.buybtn', el), pr = P(lt, tBuy, tBuy + 0.15) - P(lt, tBuy + 0.2, tBuy + 0.4)
    bb.style.transform = `scale(${1 - 0.06 * pr})`; bb.style.background = lt >= tBuy + 0.2 ? '#16A34A' : ''; bb.textContent = lt >= tBuy + 0.2 ? '✓ Pack bought' : 'Buy'
  } else if (sc.type === 'ex_track') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.1); pop($('.trk', el), lt, 0.25, 0.85)
    const tA = L(sc, 0, 0.35), tW = L(sc, 1, 0.05)
    $('.s0', el).classList.toggle('on', lt >= 0.4); $('.s1', el).classList.toggle('on', lt >= tA); $('.s2', el).classList.toggle('on', lt >= tW)
    const legs = $$('.legsw div', el), n = lt < tA ? 0 : lt < tA + 0.6 ? 1 : lt < tW - 0.3 ? 2 : 3
    legs.forEach((x, j) => { x.classList.toggle('ok', j < n); x.textContent = j < n ? '✓' : j + 1 })
    $('.cnt', el).textContent = n === 3 ? 'All 3 legs won' : `${n} of 3 legs won`
    pop($('.claim', el), lt, tW + 0.3, 0.6); const tc = L(sc, 1, 0.5)
    $('.claim', el).style.transform += ` scale(${1 - 0.05 * (P(lt, tc, tc + 0.12) - P(lt, tc + 0.15, tc + 0.3))})`
    $$('.coin', el).forEach((c, j) => { const at = tc + 0.1 + j * 0.05, q = clamp((lt - at) / 1.1); const ang = -Math.PI / 2 + (j - 4) * 0.28
      c.style.opacity = q > 0 && q < 1 ? 1 - q * q : 0; c.style.left = `${510 + Math.cos(ang) * 520 * q}px`; c.style.top = `${1090 + Math.sin(ang) * 520 * q + 700 * q * q}px` })
  } else if (sc.type === 'ex_custom') {
    rise([$('.phone', el)], lt, 0, 0, 220, 0.6)
    rise($$('.mc', el), lt, 0.35, 0.12, 40)
    const ms = (b.matches || []), taps = $$('.tap', el), t0 = L(sc, 0, 0.45), step = Math.min(0.55, (L(sc, 0, 1) - t0) / Math.max(1, ms.length))
    let picked = 0
    $$('.mc', el).forEach((m, j) => { const at = t0 + j * step; tapAt(taps[j], lt, at); const on = lt >= at; if (on) picked++
      $$('.op div', m).forEach((o, k) => o.classList.toggle('sel', on && k === ms[j].pick)) })
    $('.side', el).style.transform = `translate3d(0,${(1 - P(lt, t0 + 0.1, t0 + 0.5, E.outCubic)) * 100}%,0)`
    $('.side .n', el).textContent = `${picked} / 5 outcomes`
    $$('.side .ln', el).forEach((n, j) => { n.style.opacity = lt >= t0 + j * step ? 1 : 0 })
    pop($('.share', el), lt, L(sc, 1, 0.3), 0.6)
  } else if (sc.type === 'ex_pvp') {
    rise([$('.t1', el), $('.t2', el)], lt, 0.05, 0.1); pop($('.vs', el), lt, 0.25, 0.85)
    const a1 = $('.av.a1', el), a2 = $('.av.a2', el), q = P(lt, 0.4, 0.9, E.outBack)
    a1.style.transform = `translate3d(${(1 - q) * -400}px,0,0)`; a2.style.transform = `translate3d(${(1 - P(lt, L(sc, 1, 0.1), L(sc, 1, 0.1) + 0.5, E.outBack)) * 400}px,0,0)`
    a2.style.opacity = clamp((lt - L(sc, 1, 0.1)) / 0.15)

    $$('.mom div', el).forEach((n, j) => { pop(n, lt, L(sc, 0, 0.5) + j * 0.12, 0.5); n.classList.toggle('sel', j === 0 && lt >= L(sc, 0, 0.8)) })
    rise([$('.pot', el)], lt, L(sc, 1, 0.45))
    slam($('.match div', el), lt, L(sc, 1, 0.2), 2.6, 0.28, 'rotate(-4deg)'); el.style.transform = shake(lt, L(sc, 1, 0.2) + 0.03, 18)
  } else if (sc.type === 'ex_numbers') {

    const tiles = $$('.nums .n', el), marks = [L(sc, 0, 0.45), L(sc, 1, 0.12), L(sc, 1, 0.38), L(sc, 1, 0.62)]
    tiles.forEach((n, j) => { pop(n, lt, marks[j] ?? marks.at(-1), 0.6); const v = $('b', n), raw = v.dataset.v, m = raw.match(/^(\D*)([\d,]+)(.*)$/)
      if (m && !raw.includes('–')) { const target = +m[2].replace(/,/g, ''), q = P(lt, marks[j], marks[j] + 0.7, E.outCubic); v.textContent = m[1] + Math.round(target * q).toLocaleString('en-US') + m[3] } })
    rise([$('.fine', el)], lt, L(sc, 1, 0.85))
  } else if (sc.type === 'ex_smart') {

    const its = $$('.it', el), marks = [L(sc, 0, 0.3), L(sc, 1, 0.02), L(sc, 1, 0.3), L(sc, 1, 0.6)]
    its.forEach((n, j) => { const at = marks[j] ?? marks.at(-1), q = P(lt, at, at + 0.45, E.outBack); n.style.opacity = clamp((lt - at) / 0.12); n.style.transform = `translate3d(${(1 - q) * 700}px,0,0)` })
  } else if (sc.type === 'ex_outro') {
    slam($('.big .a', el), lt, 0.1, 1.8, 0.3); rise($$('.ws .chip', el), lt, 0.5, 0.25)
  }
}

// "cinematic" sound (cfg.sound): recorded Mixkit effects (lib/sfx.json), placed on the moments the screens move.
// db = level against the voice; align = which part of the effect lands on the moment.
function fxCinematic() {
  const ev = [], add = (t, sfx, db, o = {}) => ev.push({ t: +Math.max(0, t).toFixed(3), sfx, db, ...o })
  D.scenes.forEach((sc, k) => {
    const T = sc.start, b = sc.data || {}, at = (j, f = 0) => T + L(sc, j, f), next = D.scenes[k + 1]
    const drop = (sc.type === 'ex_hook' || sc.type.startsWith('ex_kh_')) && b.drop
    if (sc.type.startsWith('ex_kh_')) fxKH(add, sc, T, next)
    if (k > 0 && !drop) add(T, k % 2 ? '1492' : '2636', k % 2 ? -12 : -14, { align: 'peak' })
    if (sc.type === 'ex_cold') {
      add(T, '497', -13, { align: 'start', max: Math.max(1, sc.dur - 0.2) })                // heartbeat under the cold open
      add(at(0) - 0.03, '2909', -1); add(at(0) - 0.03, '2299', -4)                        // "Ten dollars."
      add(at(1) - 0.05, '3124', -9)                                                        // "One ticket."
      add(at(2), '2573', -11);                                                              // $10 → $172
      [0.45, 0.53, 0.61].forEach(f => add(at(2, f), '2577', -15))                           // the legs tick
      add(at(3, 0.25), '2951', -8)                                                          // "or nothing"
      if (next?.data?.drop) add(next.start, '2908', -6, { reverse: true, max: 2.6, align: 'end' })   // swell into the drop
    }
    if (drop) { add(T, '2908', 0); add(T, '2299', -2) }
    if (sc.type === 'ex_hook' && !drop) { add(T + 0.55, '2909', -2); add(T + 0.55, '2299', -5) }
    if (sc.type === 'ex_stack') {
      add(T + 0.25, '3124', -10)
      if (b.cue) {
        b.cue.legs.forEach((j, n) => add(at(j) - 0.05, '3115', -9, { pan: [-0.4, 0, 0.4][n % 3] }))
        add(at(b.cue.result) + 0.5, '1143', -3, { align: 'peak' }); add(at(b.cue.result) + 0.5, '2573', -10)
      } else {
        const a0 = Math.max(0.6, L(sc, 0, 0.35)); (b.legs || []).forEach((_, j) => add(T + a0 + j * 0.45, '3115', -9, { pan: [-0.4, 0, 0.4][j % 3] }))
        add(at(1, 0.75), '1143', -3, { align: 'peak' })
      }
    }
    if (sc.type === 'ex_rule') {
      const t1 = Math.max(1.4, L(sc, 0, 0.45))
      ;[0, 1, 2].forEach(i => add(T + 0.6 + i * 0.22, '2577', -15))
      add(T + 1.4, '2568', -11); add(T + 1.4, '2299', -10)                                   // WON
      ;[0, 1, 2].forEach(i => add(T + t1 + 0.2 + i * 0.22, '2577', -15))
      add(T + t1 + 1.0, '2951', -13); add(T + t1 + 1.0, '2299', -8)                          // LOST (under "One miss": low, so the words stay clear)
    }
    if (sc.type === 'ex_start') { add(at(0, 0.3), '2577', -12); add(at(1), '3120', -10); add(at(1) + 1.6, '2573', -12) }
    if (sc.type === 'ex_buy') { add(at(0, 0.7), '2577', -12); add(at(1, 0.1), '2577', -12); add(at(1, 0.1) + 1.0, '2573', -11); add(at(2, 0.1), '2577', -15); add(at(2, 0.1) + 0.45, '2568', -11) }
    if (sc.type === 'ex_track') {
      add(at(0, 0.35), '3124', -10); add(at(0, 0.35) + 0.6, '3124', -10); add(at(1, 0.05) - 0.3, '3124', -9)
      add(at(1, 0.05) + 0.3, '2568', -7); add(at(1, 0.5), '2577', -11); add(at(1, 0.5) + 0.1, '3005', -9)
    }
    if (sc.type === 'ex_custom') {
      const ms = b.matches || [], t0 = L(sc, 0, 0.45), step = Math.min(0.55, (L(sc, 0, 1) - t0) / Math.max(1, ms.length))
      ms.forEach((_, j) => add(T + t0 + j * step, '2577', -12)); add(at(1, 0.3), '3005', -9)
    }
    if (sc.type === 'ex_pvp') { add(T + 0.7, '2909', -5); add(at(1, 0.2), '2908', -4); add(at(1, 0.2), '2299', -4) }
    if (sc.type === 'ex_numbers') [L(sc, 0, 0.45), L(sc, 1, 0.12), L(sc, 1, 0.38), L(sc, 1, 0.62)].forEach((m, j) => add(T + m, j % 2 ? '3124' : '2573', -11))
    if (sc.type === 'ex_smart') [L(sc, 0, 0.3), L(sc, 1, 0.02), L(sc, 1, 0.3), L(sc, 1, 0.6)].forEach(m => add(T + m, '3115', -12))
    if (sc.type === 'ex_outro') { add(T + 0.1, '2908', -3); add(T + 0.1, '2299', -4) }
  })
  return ev
}

window.fxEvents = function () {
  if (D.cfg.sound === 'cinematic') return fxCinematic()
  const ev = [], add = (t, type, gain) => ev.push({ t: +t.toFixed(3), type, ...(gain ? { gain } : {}) })
  D.scenes.forEach((sc, k) => {
    const T = sc.start, b = sc.data || {}
    if (k > 0) add(T, 'whoosh', 0.9)
    if (sc.type === 'ex_hook') { add(T + 0.05, 'riser', 0.5); add(T + 0.55, 'boom'); add(T + 0.6, 'impact', 0.6) }
    if (sc.type === 'ex_stack') { const a0 = Math.max(0.6, L(sc, 0, 0.35)); (b.legs || []).forEach((_, j) => add(T + a0 + j * 0.45, 'pop')); add(T + L(sc, 1, 0.75), 'boom', 0.7); add(T + L(sc, 1, 0.78), 'cash', 0.7) }
    if (sc.type === 'ex_rule') { add(T + 1.4, 'boom', 0.6); add(T + 1.45, 'ding', 0.6); const t1 = Math.max(1.4, L(sc, 0, 0.45)); add(T + t1 + 1.0, 'boom', 0.8); add(T + t1 + 1.05, 'aww', 0.8) }
    if (sc.type === 'ex_start') { add(T + L(sc, 0, 0.3), 'tick'); add(T + L(sc, 1, 0), 'whoosh', 0.5); add(T + L(sc, 1, 0) + 1.6, 'cash', 0.6) }
    if (sc.type === 'ex_buy') { add(T + L(sc, 0, 0.7), 'tick'); add(T + L(sc, 1, 0.1), 'tick2'); add(T + L(sc, 1, 0.1) + 1.0, 'pop'); add(T + L(sc, 2, 0.1), 'tick3'); add(T + L(sc, 2, 0.1) + 0.2, 'ding', 0.8) }
    if (sc.type === 'ex_track') { add(T + L(sc, 0, 0.35), 'tick'); add(T + L(sc, 0, 0.35) + 0.6, 'tick2'); add(T + L(sc, 1, 0.05) - 0.3, 'tick3'); add(T + L(sc, 1, 0.05) + 0.3, 'boom', 0.7); add(T + L(sc, 1, 0.5) + 0.1, 'cash') }
    if (sc.type === 'ex_custom') { const ms = b.matches || [], t0 = L(sc, 0, 0.45), step = Math.min(0.55, (L(sc, 0, 1) - t0) / Math.max(1, ms.length)); ms.forEach((_, j) => add(T + t0 + j * step, 'tick' + (j ? Math.min(3, j + 1) : ''))); add(T + L(sc, 1, 0.3), 'pop') }
    if (sc.type === 'ex_pvp') { add(T + 0.7, 'impact', 0.6); add(T + L(sc, 1, 0.2), 'boom'); add(T + L(sc, 1, 0.22), 'crowd', 0.6) }
    if (sc.type === 'ex_numbers') [L(sc, 0, 0.45), L(sc, 1, 0.12), L(sc, 1, 0.38), L(sc, 1, 0.62)].forEach(m => add(T + m, 'pop'))
    if (sc.type === 'ex_smart') [L(sc, 0, 0.3), L(sc, 1, 0.02), L(sc, 1, 0.3), L(sc, 1, 0.6)].forEach(m => add(T + m, 'tick'))
    if (sc.type === 'ex_outro') add(T + 0.12, 'impact', 0.7)
  })
  return ev
}

// ---------------------------------------------------------------- frame
let capShown = -1
const capEl = $('#cap')
let seed = 99; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648
const gc = document.createElement('canvas'); gc.width = gc.height = 256
{ const x = gc.getContext('2d'), d = x.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255 } x.putImageData(d, 0, 0) }
$('#grain').style.backgroundImage = `url(${gc.toDataURL()})`
const CH = EX.chapters || {}

window.renderAt = async function (t) {
  let k = D.scenes.findIndex(s => t >= s.start && t < s.start + s.dur); if (k < 0) k = D.scenes.length - 1
  const sc = D.scenes[k], lt = t - sc.start
  built.forEach((el, j) => { el.style.display = j === k ? 'block' : 'none'; if (j !== k) el.style.transform = '' })
  // the living background: a slow drifting grid and two glows
  if (EX.theme === 'sky') $('#hexf').style.backgroundPosition = `0 ${-(t * 16) % 960}px`
  $('#grid').style.transform = `translate3d(0,${(t * 24) % 120}px,0) rotate(${-8 + 2 * Math.sin(t * 0.2)}deg)`
  $('#b1').style.transform = `translate3d(${-260 + 180 * Math.sin(t * 0.31)}px,${-200 + 220 * Math.cos(t * 0.23)}px,0)`
  $('#b2').style.transform = `translate3d(${520 + 160 * Math.cos(t * 0.27)}px,${1180 + 200 * Math.sin(t * 0.19)}px,0)`
  draw(k, lt, sc)
  // the sky theme opens in deep blue: no header until the drop, captions in a dark pill
  if (EX.theme === 'sky') { const cold = /_cold$/.test(sc.type), o = cold ? 0 : P(lt, 0, 0.5); $('#hdr').style.opacity = o; $('#prog').style.opacity = o; $('#stage').classList.toggle('coldcap', cold) }
  // chapter label and progress
  const ch = CH[sc.type] || ''
  $('#chap').innerHTML = ch ? `<b>${String(Object.keys(CH).indexOf(sc.type) + 1).padStart(2, '0')}</b>${html(ch)}` : ''
  $('#prog i').style.width = `${100 * clamp(t / D.duration)}%`
  $('#flash').style.opacity = k > 0 ? 0.5 * (1 - clamp(lt / 0.18)) : 0
  // captions (word by word, current word in blue)
  const ci = D.captions.findIndex(c => t >= c.start && t < c.end)
  if (ci !== capShown) { capShown = ci; capEl.innerHTML = ci < 0 ? '' : `<div class="c">${D.captions[ci].words.map(w => `<span class="w">${html(w.w)}</span>`).join(' ')}</div>` }
  if (ci >= 0) {
    const c = D.captions[ci], q = P(t, c.start, c.start + 0.16, E.outBack), box = $('.c', capEl)
    box.style.opacity = clamp(q * 2); box.style.transform = `scale(${0.85 + 0.15 * q})`
    $$('.w', capEl).forEach((s, j) => { const w = c.words[j]; s.className = 'w' + (t >= w.t0 && t < w.t1 ? ' now' : '') })
  }
  $('#grain').style.transform = `translate3d(${(Math.floor(t * 24) * 37) % 200 - 100}px,${(Math.floor(t * 24) * 53) % 200 - 100}px,0)`
}

window.ready = (async () => {
  await Promise.all([...document.fonts].map(f => f.load()))
  await document.fonts.ready
  if (EX.theme === 'sky') {     // the hex field: faint ciphertext drifting up behind everything (drawn once, tiled)
    const c = document.createElement('canvas'); c.width = 1080; c.height = 960; const x = c.getContext('2d')
    x.font = '500 22px JBM'; x.textBaseline = 'top'
    for (let r = 0; r < 30; r++) for (let k = 0; k < 6; k++) {
      x.fillStyle = `rgba(31,95,219,${0.03 + 0.045 * hsh(r, k + 40)})`
      x.fillText(hexs(13, r * 7 + k), k * 182 + (r % 2) * 40 - 30, r * 32)
    }
    $('#hexf').style.backgroundImage = `url(${c.toDataURL()})`
  }
  return true
})()
