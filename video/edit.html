<!doctype html>
<html><head><meta charset="utf-8">
<!-- Talking-head edit (edit-video.mjs): the owner's own recording (a chart screen recording with a face-cam) cut into a
     vertical video: a dark cold open of big numbers, the title on the music's drop, the chart zoomed to what is being
     pointed at, the face below, captions, callouts, a product segment and an end card. Same contract as the other pages:
     window.DATA in, window.ready, window.renderAt(t) (async: waits for the frame image), window.fxEvents(). -->
<style>

#prod .pts div i{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--ink);font:400 22px Anton;font-style:normal;display:flex;align-items:center;justify-content:center}

#end .f3{position:absolute;left:0;right:0;top:900px;text-align:center}
#end .f4{position:absolute;left:0;right:0;top:1000px;text-align:center}
#stage.isCold #cap{top:1300px}
/* widescreen (X, YouTube): chart nearly full frame, face card bottom right, captions bottom left */
#stage.wide{width:1920px;height:1080px}

#stage.wide #facebox{left:1460px;top:640px;width:400px;height:376px;border-radius:36px}
#stage.wide #call{left:70px;top:130px}
#stage.wide #cap{left:70px;right:520px;top:880px;height:140px;justify-content:flex-start;text-align:left}

#stage.wide #prod .brand{left:150px;right:auto;top:340px;text-align:left;font-size:120px}
#stage.wide #prod .line{left:150px;right:auto;top:480px;text-align:left}
#stage.wide #prod .pts{left:150px;right:auto;top:570px;align-items:flex-start}
#stage.wide #prod .phone{left:1220px;top:50px;width:480px;height:970px;border-radius:70px}
#stage.wide #prod .scr{border-radius:58px}
#stage.wide #end .f1{top:330px}#stage.wide #end .f2{top:400px}#stage.wide #end .f3{top:590px}#stage.wide #end .f4{top:670px}
#stage.wide #foot{bottom:14px}
#coin{position:absolute;inset:0;z-index:45;background:radial-gradient(110% 70% at 50% 15%,#13233F 0%,#070D1A 60%,#020409 100%);overflow:hidden;display:none}
#coin .kick{position:absolute;left:0;right:0;top:150px;text-align:center}
#coin .nm{position:absolute;left:0;right:0;top:225px;text-align:center;font-size:70px;color:#fff}
#coin .px{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:210px;color:var(--acc);text-shadow:0 0 70px rgba(79,179,255,.45)}
#coin .chg{position:absolute;left:0;right:0;top:530px;text-align:center}
#coin .chg span{display:inline-block;padding:10px 22px;border-radius:999px;font:800 30px Manrope}
#coin .chg .dn{background:rgba(255,77,106,.16);color:#FF6B82;border:2px solid rgba(255,77,106,.5)}
#coin .chg .up{background:rgba(61,220,151,.16);color:#3DDC97;border:2px solid rgba(61,220,151,.5)}
#coin .cc{position:absolute;left:40px;right:40px;top:620px;height:800px;border-radius:30px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);overflow:hidden}
#coin .cc svg{position:absolute;inset:0;width:100%;height:100%}
#coin .pts{position:absolute;left:60px;right:60px;top:1460px;display:flex;flex-direction:column;gap:18px;align-items:center}
#coin .pts div{font:800 36px Manrope;display:flex;align-items:center;gap:16px}
#coin .pts div i{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--ink);font:400 26px Anton;font-style:normal;display:flex;align-items:center;justify-content:center}
#coin .src{position:absolute;left:0;right:0;top:1680px;text-align:center;font:700 20px JBM;letter-spacing:1px;color:rgba(255,255,255,.45)}
#stage.wide #coin .kick{left:120px;right:auto;top:170px;text-align:left}
#stage.wide #coin .nm{left:120px;right:auto;top:245px;text-align:left;font-size:64px}
#stage.wide #coin .px{left:110px;right:auto;top:310px;text-align:left;font-size:180px}
#stage.wide #coin .chg{left:120px;right:auto;top:510px;text-align:left}
#stage.wide #coin .cc{left:860px;right:50px;top:120px;height:820px}
#stage.wide #coin .pts{left:120px;right:auto;top:610px;align-items:flex-start}
#stage.wide #coin .pts div{font-size:32px}
#stage.wide #coin .src{left:120px;right:auto;top:900px;text-align:left}
#foot{position:absolute;left:24px;right:24px;bottom:42px;text-align:center;font:700 19px JBM;letter-spacing:1px;color:rgba(255,255,255,.5);z-index:50}
#flash{position:absolute;inset:0;background:var(--acc);opacity:0;z-index:60;mix-blend-mode:overlay;pointer-events:none}
</style></head>
<body><div id="stage">
  <div id="grid"></div>
  <div id="prog"><i></i></div>
  <div id="hdr"><span class="chip w" id="pair"></span><span class="chip" id="hand"></span></div>
  <div class="box" id="chartbox"><div class="lay" id="chartlay"><img id="chart"><div class="mask"></div></div></div><div id="scrim"></div>
  <div id="call"></div>
  <div class="box" id="facebox"><img id="face"></div>
  <div id="cap"></div>
  <div id="title"><span class="chip top"></span><div class="big A"></div><div class="sub"><span class="chip w"></span></div></div>
  <div id="cold"><div class="lay" id="coldlay"><img id="coldimg"><div class="mask"></div></div><div class="floor"></div><div class="dark"></div><div class="bigc A"></div><div class="labc"></div></div>
  <div id="prod"><div class="kick"><span class="chip w"></span></div><div class="brand A"></div><div class="line"></div>
    <div class="phone"><div class="isl"></div><div class="scr"><div class="sb"><b>9:41</b><span>5G <i></i></span></div><img class="pg"><img class="hd"><img class="nav"></div></div><div class="pts"></div></div>
  <div id="coin"><div class="kick"><span class="chip w"></span></div><div class="nm A"></div><div class="px A"></div><div class="chg"><span></span></div><div class="cc"><svg></svg></div><div class="pts"></div><div class="src"></div></div>
  <div id="end"><div class="f1"></div><div class="f2 A"></div><div class="f3"><span class="chip"></span></div><div class="f4"><span class="chip w">Not financial advice</span></div></div>
  <div id="foot"></div>
  <div id="flash"></div>
</div>
<script>
const D = window.DATA
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)]
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const E = { outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), outCubic: x => 1 - Math.pow(1 - x, 3), inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2), inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const P = (t, a, b, e = E.outExpo) => e(clamp((t - a) / (b - a)))
const html = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const shake = (lt, at, amp = 14) => { const d = lt - at; if (d < 0 || d > 0.3) return ''; const a = amp * (1 - d / 0.3); return ` translate3d(${a * Math.sin(d * 95)}px,${a * Math.cos(d * 77)}px,0)` }
function slam(n, t, at, from = 1.9, dur = 0.28) { const q = P(t, at, at + dur, E.outCubic); n.style.opacity = clamp((t - at) / 0.08); return `scale(${from + (1 - from) * q})` }
function glitch(n, t, at, dur = 0.38) {
  const d = t - at
  if (d < 0 || d > dur) { n.style.textShadow = ''; return '' }
  const r = Math.sin(t * 997) * Math.cos(t * 331), a = 18 * (1 - d / dur)
  n.style.textShadow = `${-7 * (1 - d / dur)}px 0 #ff2a55, ${7 * (1 - d / dur)}px 0 #00e5ff`
  return ` translate3d(${r * a}px,${Math.sin(t * 613) * a * 0.3}px,0) skewX(${r * 8}deg)`
}
if (D.fmt === 'wide') { $('#stage').classList.add('wide'); document.documentElement.style.cssText = document.body.style.cssText = 'width:1920px;height:1080px' }
const FPS = D.fps, FW = D.frameW, FH = D.frameH, [cx0, cy0, cw0, ch0] = D.chart, FACE = D.face
const SEG = D.segments, speak = SEG.filter(s => s.pieces?.length)
for (const el of $$('.lay')) { el.style.width = FW + 'px'; el.style.height = FH + 'px' }
if (D.mask) for (const m of $$('.lay .mask')) Object.assign(m.style, { left: D.mask.rect[0] + 'px', top: D.mask.rect[1] + 'px', width: D.mask.rect[2] + 'px', height: D.mask.rect[3] + 'px', background: D.mask.color })
const COIN = SEG.find(s => s.kind === 'product' && s.kind2 === 'coin')
function coinChart(c) {          // 4-hour candles with the owner's zone and levels, drawn once; revealed in renderAt
  const cn = $('#coin'); cn.style.visibility = 'hidden'; cn.style.display = 'block'      // measure while laid out
  const svg = $('#coin svg'), box = $('#coin .cc'), W = box.clientWidth, H = box.clientHeight, pad = [96, 200, 40, 30]   // top right bottom left
  cn.style.display = 'none'; cn.style.visibility = ''
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`)
  // the scale fits the candles and the zone; a level outside it (the target) becomes an arrow at the edge with its distance
  const cs = c.candles, lo = Math.min(...cs.map(k => k.l), c.zone[0]), hi = Math.max(...cs.map(k => k.h), c.zone[1])
  const span = hi - lo, y = v => pad[0] + (hi + span * 0.06 - v) / (span * 1.12) * (H - pad[0] - pad[2]), cw = (W - pad[1] - pad[3]) / cs.length
  const f = v => '$' + Math.round(v).toLocaleString('en-US'), R = W - pad[1]
  let g = `<g class="zone" opacity="0"><rect x="${pad[3]}" y="${y(c.zone[1])}" width="${R - pad[3]}" height="${y(c.zone[0]) - y(c.zone[1])}" fill="rgba(79,179,255,.12)" stroke="rgba(79,179,255,.55)" stroke-dasharray="6 6"/></g>`
  const zlab = `<g class="zone" opacity="0"><rect x="${pad[3]}" y="${y(c.zone[1]) - 44}" width="${30 + 13.2 * (`${f(c.zone[0])}–${f(c.zone[1])} · ${c.zone_label || ''}`).length}" height="36" rx="8" fill="rgba(79,179,255,.9)"/>
    <text x="${pad[3] + 14}" y="${y(c.zone[1]) - 19}" fill="#0B1220" font-family="JBM" font-weight="700" font-size="20" letter-spacing="1">${f(c.zone[0])}–${f(c.zone[1])} · ${(c.zone_label || '').toUpperCase()}</text></g>`
  c.levels.forEach((l, j) => {
    const pct = ((l.p / c.price - 1) * 100), lab = (l.label || '').toUpperCase()
    if (l.p > hi || l.p < lo) {                        // off the chart: an arrow at the top or bottom edge
      const up = l.p > hi, yy = up ? 44 : H - 20
      g += `<g class="lvl" data-j="${j}" opacity="0"><text x="${W / 2}" y="${yy}" text-anchor="middle" fill="${up ? '#4FB3FF' : '#FF6B82'}" font-family="Anton" font-size="38">${up ? '▲' : '▼'} ${f(l.p)} ${lab} · ${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</text></g>`
    } else g += `<g class="lvl" data-j="${j}" opacity="0"><line x1="${pad[3]}" x2="${R}" y1="${y(l.p)}" y2="${y(l.p)}" stroke="${l.p > c.price ? '#4FB3FF' : '#FF6B82'}" stroke-width="3" stroke-dasharray="14 10"/>
      <text x="${R + 14}" y="${y(l.p) + 10}" fill="#fff" font-family="Anton" font-size="30">${f(l.p)}</text><text x="${R + 14}" y="${y(l.p) + 34}" fill="rgba(255,255,255,.65)" font-family="JBM" font-weight="700" font-size="14">${lab}</text></g>`
  })
  g += '<g class="cdl">' + cs.map((k, i) => { const x = pad[3] + i * cw + cw / 2, up = k.c >= k.o, col = up ? '#3DDC97' : '#FF5470'
    return `<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${col}" stroke-width="2"/><rect x="${x - cw * 0.34}" y="${y(Math.max(k.o, k.c))}" width="${cw * 0.68}" height="${Math.max(2, Math.abs(y(k.o) - y(k.c)))}" fill="${col}" rx="2"/>` }).join('') + '</g>' + zlab       // the zone's label sits above the candles' wicks
  g += `<g class="now" opacity="0"><line x1="${pad[3]}" x2="${R}" y1="${y(c.price)}" y2="${y(c.price)}" stroke="#fff" stroke-width="2" stroke-dasharray="3 6"/><rect x="${R + 6}" y="${y(c.price) - 22}" width="136" height="44" rx="10" fill="#fff"/><text x="${R + 74}" y="${y(c.price) + 10}" text-anchor="middle" fill="#0B1220" font-family="Anton" font-size="28">${f(c.price)}</text></g>`
  g += `<defs><clipPath id="rev"><rect x="0" y="0" width="0" height="${H}"/></clipPath></defs>`
  svg.innerHTML = g; $('.cdl', svg).setAttribute('clip-path', 'url(#rev)')
  $('#coin .kick .chip').textContent = c.kicker || 'Right now'; $('#coin .nm').textContent = c.name || ''
  const ch = (c.price / c.open24 - 1) * 100; $('#coin .chg span').className = ch < 0 ? 'dn' : 'up'; $('#coin .chg span').textContent = `${ch < 0 ? '▼' : '▲'} ${Math.abs(ch).toFixed(1)}% · 24h`
  $('#coin .pts').innerHTML = (c.points || []).map((x, j) => `<div><i>${j + 1}</i>${html(x)}</div>`).join('')
  $('#coin .src').textContent = `${c.coin} · Coinbase · ${c.asof}`
}
if (COIN) coinChart(COIN)
$('#pair').textContent = D.pair || ''; $('#hand').textContent = D.handle || ''; $('#foot').textContent = `Not financial advice · ${D.handle || ''}`
{ const t = SEG.find(s => s.kind === 'title') || {}; $('#title .top').textContent = t.top || ''; $('#title .big').textContent = t.big || ''; $('#title .sub .chip').textContent = t.sub || '' }
{ const p = SEG.find(s => s.kind === 'product'); if (p) { $('#prod .kick .chip').textContent = p.kicker || ''; $('#prod .brand').innerHTML = html(p.brand || '').replace(/^(\w+)/, '<b>$1</b>'); $('#prod .line').textContent = p.line || ''

{ const e = SEG.find(s => s.kind === 'end'); if (e) { $('#end .f1').textContent = e.line || ''; $('#end .f2').textContent = e.follow || ''; $('#end .f3 .chip').textContent = e.site || '' } }

// ---- captions: each line's text in chunks of up to five words, spread over its spoken pieces by length
const caps = []
for (const s of SEG) {
  if (!s.cap || !s.pieces?.length) continue
  const words = s.cap.split(/\s+/), chunks = []; let cur = []
  words.forEach((w, i) => { cur.push(w); if (cur.length >= 5 || (/[,.;:?!]$/.test(w) && cur.length >= 2) || i === words.length - 1) { chunks.push(cur); cur = [] } })
  const total = s.pieces.reduce((a, p) => a + p.dur, 0), wt = w => w.length + 2, all = chunks.flat().reduce((a, w) => a + wt(w), 0)

  const at = x => { for (const p of s.pieces) { if (x <= p.dur) return p.out + x; x -= p.dur } const l = s.pieces.at(-1); return l.out + l.dur }

}
caps.forEach((c, i) => { const n = caps[i + 1]; c.end = n && n.start - c.end < 0.6 ? n.start : c.end + 0.25 })

// ---- which source frame shows at time t (holds the nearest piece's frame between pieces)
function frameAt(t) {
  let best = null
  for (const s of speak) for (const [j, p] of s.pieces.entries()) {
    if (t >= p.out && t < p.out + p.dur) return { p, j, s, f: Math.min(p.n, Math.max(1, Math.floor((t - p.out) * FPS) + 1)) }

  if (!best) { const s = speak[0], p = s.pieces[0]; return { p, j: 0, s, f: 1 } }

  if (nx && best.s.kind === 'cold' && nx.kind === 'clip') return { p: nx.pieces[0], j: 0, s: nx, f: 1 }

const zoomOf = s => s?.z || [0.6, 0.35, 0.6]
function cropFor(z, push, aspect) {          // z = [centre x, centre y, width] as fractions of the frame → crop rect in px

}

let lastSrc = ''
window.renderAt = async function (t) {

  let wait = null
  if (src !== lastSrc) { lastSrc = src; for (const im of [$('#chart'), $('#face'), $('#coldimg')]) im.src = src; wait = Promise.all(['#chart', '#face', '#coldimg'].map(q => $(q).decode().catch(() => {}))) }
  const drop = D.drop, cold = t < drop, lt = t - seg.start

    const r = cropFor(zoomOf(st), 0.08 * clamp((t - st.start) / 4), co.clientWidth / co.clientHeight)

    big.style.transform = (changed ? slam(big, t, at) : (big.style.opacity = on ? 1 : 0, '')) + (st.glitch ? glitch(big, t, at + (st.glitch_at || 0)) : (big.style.textShadow = '', ''))

  const r = lerp(rA, rB, q), rc = [r[0] + r[2] * (1 - 1 / punch) / 2, r[1] + r[3] * (1 - 1 / punch) / 2, r[2] / punch, r[3] / punch]
  place($('#chartlay'), cb, rc)
  const fz = fr.j % 2 ? 1.08 : 1, fw = FACE[2] / fz, fh = FACE[3] / fz
  place($('#face'), fb, [FACE[0] + (FACE[2] - fw) / 2, FACE[1] + (FACE[3] - fh) * 0.35, fw, fh])
  // ---- title on the drop
  const ti = $('#title'), tS = SEG.find(s => s.kind === 'title')
  ti.style.display = t >= drop && t < tS.end + 0.35 ? 'block' : 'none'
  if (ti.style.display === 'block') {
    const b = $('.big', ti); b.style.transform = slam(b, t, drop, 2.3, 0.3) + shake(t, drop + 0.03, 24)
    $('.top', ti).style.opacity = P(t, drop + 0.1, drop + 0.3); $('.sub', ti).style.opacity = P(t, drop + 0.35, drop + 0.6)
    ti.style.opacity = 1 - P(t, tS.end, tS.end + 0.3)

  $('#scrim').style.opacity = t >= drop ? 0.62 * (1 - P(t, tS.end - 0.1, tS.end + 0.35)) : 0
  $('#scrim').style.transform = cb.style.transform
  // ---- callout chip for the clip
  const call = $('#call'), cl = seg.kind === 'clip' && seg.call ? seg : null
  if (cl) { if (call.dataset.id !== cl.id) { call.dataset.id = cl.id; call.innerHTML = `<div class="k"><i></i>${html(cl.call)}</div>` }
    const k = $('.k', call); k.style.transform = slam(k, t, cl.start + 0.25, 1.6, 0.25); k.style.transformOrigin = '0 50%'; call.style.display = 'block' }
  else call.style.display = 'none'
  // ---- captions
  const ci = caps.findIndex(c => t >= c.start && t < c.end), capEl = $('#cap')
  if (capEl.dataset.i !== String(ci)) { capEl.dataset.i = ci; capEl.innerHTML = ci < 0 ? '' : `<div class="c">${caps[ci].words.map(w => `<span class="w">${html(w.w)}</span>`).join(' ')}</div>` }
  if (ci >= 0) { const c = caps[ci], qq = P(t, c.start, c.start + 0.16, E.outBack), bx = $('.c', capEl); bx.style.opacity = clamp(qq * 2); bx.style.transform = `scale(${0.85 + 0.15 * qq})`
    $$('.w', capEl).forEach((s, j) => { const w = c.words[j]; s.className = 'w' + (t >= w.t0 && t < w.t1 ? ' now' : '') }) }
  $('#stage').classList.toggle('isCold', cold)
  // ---- product segment
  const pr = $('#prod'), ps = SEG.find(s => s.kind === 'product')
  pr.style.display = ps && !COIN && t >= ps.start - 0.2 && t < ps.end + 0.2 ? 'block' : 'none'
  if (pr.style.display === 'block') {
    const l = t - ps.start
    pr.style.opacity = P(l, -0.2, 0.05) * (1 - P(l, ps.end - ps.start, ps.end - ps.start + 0.2))
    const kk = $('.kick', pr); kk.style.opacity = P(l, 0.1, 0.4)
    const br = $('.brand', pr); br.style.transform = slam(br, l, 0.5, 1.8, 0.3) + shake(l, 0.55, 14)
    $('.line', pr).style.opacity = P(l, 0.9, 1.2)
    const ph = $('.phone', pr); ph.style.transform = `translate3d(0,${(1 - P(l, 0.7, 1.4, E.outCubic)) * 900}px,0)`
    const pg = $('.pg', pr), scrH = $('.scr', pr).clientHeight, maxS = Math.max(0, Math.min(pg.clientHeight - scrH, scrH * 0.95))
    pg.style.transform = `translate3d(0,${-maxS * P(l, 1.8, 1.8 + 0.6 * (ps.end - ps.start - 1.8), E.inOutSine)}px,0)`
    $$('.pts div', pr).forEach((d, j) => { const a = 2.0 + j * 1.3; d.style.opacity = P(l, a, a + 0.25); d.style.transform = `translate3d(${(1 - P(l, a, a + 0.4, E.outBack)) * 300}px,0,0)` })
  }

    cn.style.opacity = P(l, -0.2, 0.05) * (1 - P(l, L, L + 0.2))
    $('.kick', cn).style.opacity = P(l, 0.1, 0.35); $('.nm', cn).style.opacity = P(l, 0.25, 0.5)
    const px = $('.px', cn); px.textContent = f(COIN.zone[0] + (COIN.price - COIN.zone[0]) * P(l, 0.5, 1.3, E.outCubic)); px.style.transform = slam(px, l, 0.5, 1.6, 0.3) + shake(l, 0.55, 12)
    $('.chg', cn).style.opacity = P(l, 1.2, 1.45)
    const cc = $('.cc', cn); cc.style.opacity = P(l, 0.9, 1.2); cc.style.transform = `translate3d(0,${(1 - P(l, 0.9, 1.5, E.outCubic)) * 120}px,0)`
    const rv = $('#rev rect', cn); rv.setAttribute('width', cc.clientWidth * P(l, 1.0, 2.4, E.inOutSine))
    $$('.zone', cn).forEach(z => z.setAttribute('opacity', P(l, 2.4, 2.8))); $$('.lvl', cn).forEach((g, j) => g.setAttribute('opacity', P(l, 2.8 + j * 0.4, 3.1 + j * 0.4)))
    $('.now', cn).setAttribute('opacity', P(l, 2.2, 2.5) * (0.75 + 0.25 * Math.sin(l * 6)))

    $('.src', cn).style.opacity = 0.9 * P(l, 3.0, 3.4)

  // ---- header, progress, flash on the drop and at each new clip
  $('#hdr').style.opacity = cold ? 0 : 1; $('#prog').style.opacity = cold ? 0 : 1
  $('#prog i').style.width = `${100 * clamp(t / D.duration)}%`
  let fl = t >= drop && t < drop + 0.3 ? 0.6 * (1 - (t - drop) / 0.3) : 0

  $('#flash').style.opacity = fl
  $('#grid').style.transform = `translate3d(0,${(t * 20) % 110}px,0)`
  if (wait) await wait
}

window.fxEvents = function () {
  const ev = [], add = (t, sfx, db, o = {}) => ev.push({ t: +Math.max(0, t).toFixed(3), sfx, db, ...o })
  const cs = SEG.filter(s => s.kind === 'cold')
  if (cs.length) {
    add(0, '497', -18, { align: 'start', max: Math.max(1, D.drop - 0.2) })
    cs.forEach((s, j) => {
      // a real voice (not a studio one): hits stay under it so every word stays clear
      if (j === 0) { add(s.start - 0.12, '2909', -10); add(s.start - 0.12, '2299', -11) }
      else if (s.big !== cs[j - 1].big) { add(s.start - 0.1, '2299', -9); add(s.start - 0.1, '3124', -12) }
      if (s.glitch) add(s.start - 0.08 + (s.glitch_at || 0), '2951', -9)
    })
    add(D.drop, '2908', -6, { reverse: true, max: 2.6, align: 'end' })
  }
  add(D.drop, '2908', 0); add(D.drop, '2299', -2)
  SEG.filter(s => s.kind === 'clip').forEach((s, j) => {
    if (j > 0) add(s.start, j % 2 ? '1492' : '2636', j % 2 ? -14 : -16, { align: 'peak' })
    if (s.call) { add(s.start + 0.25, '3124', -11); add(s.start + 0.25, '2299', -10) }
  })
  if (COIN) { const c = COIN.start; add(c, '1492', -10, { align: 'peak' }); add(c + 0.5, '2909', -5); add(c + 0.5, '2299', -7); add(c + 1.0, '3120', -11); add(c + 2.4, '3124', -11)
    COIN.levels.forEach((_, j) => add(c + 2.8 + j * 0.4, '2577', -14)); (COIN.points || []).forEach((_, j) => add(c + 4.0 + j * 1.2, '2573', -11)) }
  const p = SEG.find(s => s.kind === 'product' && !COIN)
  if (p) { add(p.start, '1492', -10, { align: 'peak' }); add(p.start + 0.5, '2909', -4); add(p.start + 0.7, '3120', -10); (p.points || []).forEach((_, j) => add(p.start + 2.0 + j * 1.3, '2573', -11)) }
  const e = SEG.find(s => s.kind === 'end')
  if (e) { add(e.start + 0.15, '2908', -4); add(e.start + 0.15, '2299', -5) }
  return ev
}
