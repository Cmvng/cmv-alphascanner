<script>
const D = window.DATA
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)]
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const E = { outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), outCubic: x => 1 - Math.pow(1 - x, 3), inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,

const shake = (lt, at, amp = 14) => { const d = lt - at; if (d < 0 || d > 0.3) return ''; const a = amp * (1 - d / 0.3); return ` translate3d(${a * Math.sin(d * 95)}px,${a * Math.cos(d * 77)}px,0)` }

  const d = t - at

  const r = Math.sin(t * 997) * Math.cos(t * 331), a = 18 * (1 - d / dur)
  n.style.textShadow = `${-7 * (1 - d / dur)}px 0 #ff2a55, ${7 * (1 - d / dur)}px 0 #00e5ff`

}
if (D.fmt === 'wide') { $('#stage').classList.add('wide'); document.documentElement.style.cssText = document.body.style.cssText = 'width:1920px;height:1080px' }
if (D.layout === 'phone') $('#stage').classList.add('phone')
if (D.layout === 'screen') $('#stage').classList.add('screen')
if (D.layout === 'duo') $('#stage').classList.add('duo')
const DUO = D.layout === 'duo'
const FULL = D.layout === 'phone' || D.layout === 'screen' || DUO     // the recording's whole width always: no push, no punch-in
if (D.caption_style === 'clean') $('#stage').classList.add('clean')
const FPS = D.fps, FW = D.frameW, FH = D.frameH, [cx0, cy0, cw0, ch0] = D.chart, FACE = D.face
if (DUO) $('#coldimg').style.clipPath = `inset(${cy0}px ${FW - cx0 - cw0}px ${FH - cy0 - ch0}px ${cx0}px)`   // duo: the cold open shows the phone alone, never a slice of the owner
const SEG = D.segments, speak = SEG.filter(s => s.pieces?.length)
for (const el of $$('.lay')) { el.style.width = FW + 'px'; el.style.height = FH + 'px' }
if (D.mask) for (const m of $$('.lay .mask')) Object.assign(m.style, { left: D.mask.rect[0] + 'px', top: D.mask.rect[1] + 'px', width: D.mask.rect[2] + 'px', height: D.mask.rect[3] + 'px', background: D.mask.color })
const CHAP = SEG.filter(s => s.kind === 'clip' && s.chapter), chapDur = s => s.chapter_dur || 1.8
{ const cb = DUO ? $('#focus') : $('#chartbox'), c = $('#chap'); Object.assign(c.style, { left: cb.offsetLeft + 'px', top: cb.offsetTop + 'px', width: cb.offsetWidth + 'px', height: cb.offsetHeight + 'px' }) }
const COIN = SEG.find(s => s.kind === 'product' && s.kind2 === 'coin')
function coinChart(c) {          // 4-hour candles with the owner's zone and levels, drawn once; revealed in renderAt
  const cn = $('#coin'); cn.style.visibility = 'hidden'; cn.style.display = 'block'      // measure while laid out
  const svg = $('#coin svg'), box = $('#coin .cc'), W = box.clientWidth, H = box.clientHeight, pad = [96, 200, 40, 30]   // top right bottom left
  cn.style.display = 'none'; cn.style.visibility = ''

  const cs = c.candles, lo = Math.min(...cs.map(k => k.l), c.zone[0]), hi = Math.max(...cs.map(k => k.h), c.zone[1])
  const span = hi - lo, y = v => pad[0] + (hi + span * 0.06 - v) / (span * 1.12) * (H - pad[0] - pad[2]), cw = (W - pad[1] - pad[3]) / cs.length

  let g = `<g class="zone" opacity="0"><rect x="${pad[3]}" y="${y(c.zone[1])}" width="${R - pad[3]}" height="${y(c.zone[0]) - y(c.zone[1])}" fill="rgba(79,179,255,.12)" stroke="rgba(79,179,255,.55)" stroke-dasharray="6 6"/></g>`
  const zlab = `<g class="zone" opacity="0"><rect x="${pad[3]}" y="${y(c.zone[1]) - 44}" width="${30 + 13.2 * (`${f(c.zone[0])}–${f(c.zone[1])} · ${c.zone_label || ''}`).length}" height="36" rx="8" fill="rgba(79,179,255,.9)"/>
    <text x="${pad[3] + 14}" y="${y(c.zone[1]) - 19}" fill="#0B1220" font-family="JBM" font-weight="700" font-size="20" letter-spacing="1">${f(c.zone[0])}–${f(c.zone[1])} · ${(c.zone_label || '').toUpperCase()}</text></g>`
  c.levels.forEach((l, j) => {
    const pct = ((l.p / c.price - 1) * 100), lab = (l.label || '').toUpperCase()
    if (l.p > hi || l.p < lo) {                        // off the chart: an arrow at the top or bottom edge
      const up = l.p > hi, yy = up ? 44 : H - 20
      g += `<g class="lvl" data-j="${j}" opacity="0"><text x="${W / 2}" y="${yy}" text-anchor="middle" fill="${up ? '#4FB3FF' : '#FF6B82'}" font-family="Anton" font-size="38">${up ? '▲' : '▼'} ${f(l.p)} ${lab} · ${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</text></g>`
    } else g += `<g class="lvl" data-j="${j}" opacity="0"><line x1="${pad[3]}" x2="${R}" y1="${y(l.p)}" y2="${y(l.p)}" stroke="${l.p > c.price ? '#4FB3FF' : '#FF6B82'}" stroke-width="3" stroke-dasharray="14 10"/>
      <text x="${R + 14}" y="${y(l.p) + 10}" fill="#fff" font-family="Anton" font-size="30">${f(l.p)}</text><text x="${R + 14}" y="${y(l.p) + 34}" fill="rgba(255,255,255,.65)" font-family="JBM" font-weight="700" font-size="14">${lab}</text></g>`
  })
  g += '<g class="cdl">' + cs.map((k, i) => { const x = pad[3] + i * cw + cw / 2, up = k.c >= k.o, col = up ? '#3DDC97' : '#FF5470'
    return `<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${col}" stroke-width="2"/><rect x="${x - cw * 0.34}" y="${y(Math.max(k.o, k.c))}" width="${cw * 0.68}" height="${Math.max(2, Math.abs(y(k.o) - y(k.c)))}" fill="${col}" rx="2"/>` }).join('') + '</g>' + zlab       // the zone's label sits above the candles' wicks
  g += `<g class="now" opacity="0"><line x1="${pad[3]}" x2="${R}" y1="${y(c.price)}" y2="${y(c.price)}" stroke="#fff" stroke-width="2" stroke-dasharray="3 6"/><rect x="${R + 6}" y="${y(c.price) - 22}" width="136" height="44" rx="10" fill="#fff"/><text x="${R + 74}" y="${y(c.price) + 10}" text-anchor="middle" fill="#0B1220" font-family="Anton" font-size="28">${f(c.price)}</text></g>`
  g += `<defs><clipPath id="rev"><rect x="0" y="0" width="0" height="${H}"/></clipPath></defs>`
  svg.innerHTML = g; $('.cdl', svg).setAttribute('clip-path', 'url(#rev)')
  $('#coin .kick .chip').textContent = c.kicker || 'Right now'; $('#coin .nm').textContent = c.name || ''
  const ch = (c.price / c.open24 - 1) * 100; $('#coin .chg span').className = ch < 0 ? 'dn' : 'up'; $('#coin .chg span').textContent = `${ch < 0 ? '▼' : '▲'} ${Math.abs(ch).toFixed(1)}% · 24h`
  $('#coin .pts').innerHTML = (c.points || []).map((x, j) => `<div><i>${j + 1}</i>${html(x)}</div>`).join('')

}
if (COIN) coinChart(COIN)
const INS = SEG.filter(s => s.kind === 'insert')
const pct = r => Math.round((r.b / r.a - 1) * 100)
function insBuild(s) {
  const el = $('#ins'); el.dataset.id = s.start; el.classList.toggle('cmpm', s.kind2 === 'compare' && D.fmt !== 'wide')
  $('.kick .chip', el).textContent = s.kicker || ''; $('.ttl', el).textContent = s.title || ''; $('.foot2', el).textContent = s.foot || ''; $('.src', el).textContent = s.source || ''

  else if (s.kind2 === 'board') $('.body', el).innerHTML = s.rows.map(r => `<div class="row"><div><div class="nm">${html(r.name)}</div><div class="wh">${html(r.what || '')}</div></div>
    <div class="vals"><div class="ft">${html(r.from)} → <b>${html(r.to)}</b></div><div class="pc${pct(r) > 0 ? ' up' : ''}">${pct(r) > 0 ? '+' : ''}${pct(r)}%</div></div></div>`).join('')
  else $('.body', el).innerHTML = `<div class="cmp">${s.cols.map((c, j) => `<div class="col ${j ? 'b' : 'a'}"><h3>${html(c.name)}</h3><span class="tg">${html(c.tag || '')}</span>
    ${c.rows.map(x => `<div class="li"><i></i>${html(x)}</div>`).join('')}</div>`).join('')}</div>`
  const b = $('.body', el); el.style.display = 'block'; $('.foot2', el).style.top = Math.min(D.fmt === 'wide' ? 930 : 1420, b.offsetTop + b.offsetHeight + (D.fmt === 'wide' ? 80 : 120)) + 'px'    // the tagline sits under the graphic
}
// when each piece of an insert lands (seconds into it): shared by the picture and the sound
function insTimes(s) {
  if (s.kind2 === 'list') { const items = s.items.map((_, j) => 0.9 + j * (s.step || 0.75)); return { items, foot: items.at(-1) + 0.9 } }
  if (s.kind2 === 'board') { const rows = s.rows.map((_, j) => 1.1 + j * 0.75); return { rows, foot: rows.at(-1) + 0.9 } }
  const a = s.cols[0].rows.map((_, j) => 1.7 + j * 0.45), b = s.cols[1].rows.map((_, j) => a.at(-1) + 0.7 + j * 0.45)

}
$('#pair').textContent = D.pair || ''; $('#hand').textContent = D.handle || ''; $('#foot').textContent = `Not financial advice · ${D.handle || ''}`
{ const t = SEG.find(s => s.kind === 'title') || {}; $('#title .top').textContent = t.top || ''; $('#title .big').innerHTML = html(t.big || '').replace(/\n/g, '<br>'); $('#title .big').style.fontSize = t.size ? t.size + 'px' : ''; $('#title .sub .chip').textContent = t.sub || '' }
{ const p = SEG.find(s => s.kind === 'product'); if (p) { $('#prod .kick .chip').textContent = p.kicker || ''; $('#prod .brand').innerHTML = html(p.brand || '').replace(/^(\w+)/, '<b>$1</b>'); $('#prod .line').textContent = p.line || ''
  $('#prod .pg').src = p.shot; $('#prod .nav').src = p.bar; if (p.head) $('#prod .hd').src = p.head; else $('#prod .hd').remove(); $('#prod .pts').innerHTML = (p.points || []).map((x, j) => `<div><i>${j + 1}</i>${html(x)}</div>`).join('') } }
{ const e = SEG.find(s => s.kind === 'end'); if (e) { $('#end .f1').textContent = e.line || ''; $('#end .f2').textContent = e.follow || ''; $('#end .f3 .chip').textContent = e.site || '' } }

// ---- captions: each line's text in chunks of up to five words, spread over its spoken pieces by length
const caps = []
for (const s of SEG) {
  if (s.words?.length) {            // word-timed: chunks of up to four words, split at punctuation and at pauses
    let cur = []
    const flush = () => { if (cur.length) caps.push({ start: cur[0].t0, end: cur.at(-1).t1, words: cur }); cur = [] }
    s.words.forEach((w, i) => { const pv = s.words[i - 1]; if (cur.length && (cur.length >= 4 || w.t0 - pv.t1 > 0.35)) flush(); cur.push(w); if (/[,.;:?!]$/.test(w.w) && cur.length >= 2) flush() })
    flush(); continue
  }
  if (!s.cap || !s.pieces?.length) continue
  const words = s.cap.split(/\s+/), chunks = []; let cur = []
  words.forEach((w, i) => { cur.push(w); if (cur.length >= 5 || (/[,.;:?!]$/.test(w) && cur.length >= 2) || i === words.length - 1) { chunks.push(cur); cur = [] } })
  const total = s.pieces.reduce((a, p) => a + p.dur, 0), wt = w => w.length + 2, all = chunks.flat().reduce((a, w) => a + wt(w), 0)
  // spoken time → timeline time (pieces are back to back, so this is a straight line per piece)
  const at = x => { for (const p of s.pieces) { if (x <= p.dur) return p.out + x; x -= p.dur } const l = s.pieces.at(-1); return l.out + l.dur }

}
caps.forEach((c, i) => { const n = caps[i + 1]; c.end = n && n.start - c.end < 0.6 ? n.start : c.end + 0.25 })

// ---- which source frame shows at time t (holds the nearest piece's frame between pieces)
function frameAt(t) {
  let best = null
  for (const s of speak) for (const [j, p] of s.pieces.entries()) {
    if (t >= p.out && t < p.out + p.dur) return { p, j, s, f: Math.min(p.n, Math.max(1, Math.floor((t - p.out) * FPS) + 1)) }
    if (p.out <= t) best = { p, j, s, f: p.n }
  }
  if (!best) { const s = speak[0], p = s.pieces[0]; return { p, j: 0, s, f: 1 } }
  // after the cold open, the title holds the first frame of the first clip
  const nx = speak.find(s => s.start > t)
  if (nx && best.s.kind === 'cold' && nx.kind === 'clip') return { p: nx.pieces[0], j: 0, s: nx, f: 1 }
  return best
}
const zoomOf = s => s?.z || (D.layout === 'phone' ? [0.5, 0.35, 1] : D.layout === 'screen' ? [0.5, 0.5, 1] : [0.6, 0.35, 0.6])
// zoom keyframes { "zk": [[source seconds, x, y, width], …] }: the framing follows what is on screen as the owner scrolls
function zoomAt(s, src) {
  const k = s?.zk; if (!k?.length) return zoomOf(s)
  if (src <= k[0][0]) return k[0].slice(1); if (src >= k.at(-1)[0]) return k.at(-1).slice(1)
  const j = k.findIndex(r => r[0] > src), a = k[j - 1], b = k[j], q = E.inOutSine(clamp((src - a[0]) / Math.max(0.01, b[0] - a[0])))
  return a.slice(1).map((v, i) => v + (b[i + 1] - v) * q)
}
const lastZoom = s => s?.zk?.length ? s.zk.at(-1).slice(1) : zoomOf(s)
function cropFor(z, push, aspect) {          // z = [centre x, centre y, width] as fractions of the frame → crop rect in px
  let w = Math.min(1, z[2] * (D.fmt === 'wide' ? 1.55 : 1)) * FW * (1 - push), h = w / aspect      // widescreen shows more of the chart
  if (h > ch0) { h = ch0; w = h * aspect }
  let x = z[0] * FW - w / 2, y = z[1] * FH - h / 2
  x = Math.max(cx0, Math.min(cx0 + cw0 - w, x)); y = Math.max(cy0, Math.min(cy0 + ch0 - h, y))
  return [x, y, w, h]
}
const srcToOut = (s, src) => { for (const p of s.pieces || []) if (src >= p.src - 0.05 && src < p.src + p.dur) return p.out + Math.max(0, src - p.src); return null }
// a clip's callout lands when the owner says it ("call_t", source seconds), else after its chapter card
const callAt = s => Math.max(s.start + (s.chapter ? chapDur(s) + 0.15 : 0.25), (s.call_t != null && srcToOut(s, s.call_t)) || 0)
const lerp = (a, b, q) => a.map((v, i) => v + (b[i] - v) * q)
function place(img, box, rect, extra = '') {
  const [x, y, w] = rect, s = box.clientWidth / w
  img.style.transform = `scale(${s}) translate(${-x}px,${-y}px)` + extra
}

// where a 16:9 close-up goes: under the highlighted box, over it, left or right of it; never on the box, the face-cam card,
// or the strip at the bottom that holds the callout and the captions
function lensSpot(bx, w, h) {
  const face = [1556, 665, 1896, 1076], hit = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3]
  const box = [bx[0] - 12, bx[1] - 12, bx[0] + bx[2] + 12, bx[1] + bx[3] + 12], mx = bx[0] + bx[2] / 2 - w / 2, my = bx[1] + bx[3] / 2 - h / 2
  for (let [x, y] of [[mx, box[3] + 12], [mx, box[1] - h - 12], [box[0] - w - 12, my], [box[2] + 12, my]]) {
    x = Math.max(40, Math.min(1880 - w, x)); y = Math.max(110, Math.min(744 - h, y))
    if (hit([x, y, x + w, y + h], face)) x = Math.max(40, face[0] - 16 - w)
    const r = [x, y, x + w, y + h]
    if (!hit(r, box) && !hit(r, face)) return [x, y]
  }

    ie.style.opacity = P(l, -0.2, 0.05) * (1 - P(l, L, L + 0.2))
    $('.kick', ie).style.opacity = P(l, 0.1, 0.35)
    const tt = $('.ttl', ie); tt.style.transform = slam(tt, l, 0.35, 1.7, 0.3) + shake(l, 0.4, 14)
    if (is.kind2 === 'list') $$('.lst div', ie).forEach((d, j) => { const a = T.items[j], nx = T.items[j + 1] ?? 99
      d.style.opacity = P(l, a, a + 0.12) * (l >= nx ? 0.32 : 1); d.style.transform = slam(d, l, a, 1.5, 0.22) + (l >= a && l < a + 0.3 ? shake(l, a + 0.02, 8) : '') })
    else if (is.kind2 === 'board') $$('.row', ie).forEach((r, j) => { const a = T.rows[j]; r.style.opacity = P(l, a, a + 0.2); r.style.transform = `translate3d(${(1 - P(l, a, a + 0.4, E.outBack)) * 260}px,0,0)`
      const pc = $('.pc', r), v = Math.round(pct(is.rows[j]) * P(l, a + 0.15, a + 0.65, E.outCubic)); pc.textContent = `${v > 0 ? '+' : ''}${v}%`; pc.style.transform = shake(l, a + 0.66, 8) })
    else {
      $$('.col', ie).forEach((c, j) => { const a = T.cols[j]; c.style.opacity = P(l, a, a + 0.2); c.style.transform = `translate3d(${(1 - P(l, a, a + 0.5, E.outBack)) * (j ? 500 : -500)}px,0,0)`
        $$('.li', c).forEach((d, k) => { const b = T.li[j][k]; d.style.opacity = P(l, b, b + 0.2); d.style.transform = `translate3d(0,${(1 - P(l, b, b + 0.35, E.outCubic)) * 24}px,0)` }) })
    }
    const fo = $('.foot2', ie); fo.style.transform = slam(fo, l, T.foot, 1.8, 0.3) + shake(l, T.foot + 0.05, 12)
    $('.src', ie).style.opacity = 0.9 * P(l, 1.5, 1.9)
  }
  // ---- end card
  const en = $('#end'), es = SEG.find(s => s.kind === 'end')
  en.style.display = es && t >= es.start - 0.15 ? 'block' : 'none'
  if (en.style.display === 'block') { const l = t - es.start; en.style.opacity = P(l, -0.15, 0.1); const f2 = $('.f2', en); f2.style.transform = slam(f2, l, 0.15, 1.8, 0.3); $('.f1', en).style.opacity = P(l, 0.4, 0.7); $('.f3', en).style.opacity = P(l, 0.7, 1.0); $('.f4', en).style.opacity = P(l, 1.0, 1.3) }
  // ---- header, progress, flash on the drop and at each new clip
  $('#hdr').style.opacity = cold ? 0 : 1; $('#prog').style.opacity = cold ? 0 : 1
  $('#prog i').style.width = `${100 * clamp(t / D.duration)}%`
  let fl = t >= drop && t < drop + 0.3 ? 0.6 * (1 - (t - drop) / 0.3) : 0
  for (const s of SEG) if (s.kind === 'clip' && t >= s.start && t < s.start + 0.2) fl = Math.max(fl, 0.25 * (1 - (t - s.start) / 0.2))
  $('#flash').style.opacity = fl
  $('#grid').style.transform = `translate3d(0,${(t * 20) % 110}px,0)`
  if (wait) await wait
}

window.fxEvents = function () {
  const ev = [], add = (t, sfx, db, o = {}) => ev.push({ t: +Math.max(0, t).toFixed(3), sfx, db, ...o })
  const cs = SEG.filter(s => s.kind === 'cold')
  if (cs.length) {
    add(0, '497', -18, { align: 'start', max: Math.max(1, D.drop - 0.2) })
    cs.forEach((s, j) => {
      // a real voice (not a studio one): hits stay under it so every word stays clear
      if (j === 0) { add(s.start - 0.12, '2909', -10); add(s.start - 0.12, '2299', -11) }
      else if (s.big !== cs[j - 1].big) { add(s.start - 0.1, '2299', -9); add(s.start - 0.1, '3124', -12) }
      if (s.glitch) add(s.start - 0.08 + (s.glitch_at || 0), '2951', -9)
    })
    add(D.drop, '2908', -6, { reverse: true, max: 2.6, align: 'end' })
  }
  add(D.drop, '2908', 0); add(D.drop, '2299', -2)
  SEG.filter(s => s.kind === 'clip').forEach((s, j) => {
    if (j > 0) add(s.start, j % 2 ? '1492' : '2636', j % 2 ? -14 : -16, { align: 'peak' })
    if (s.chapter) { add(s.start, '2908', -8); add(s.start + 0.02, '2299', -8); add(s.start + 0.12, '2951', -14) }
    if (s.call) { add(callAt(s), '3124', -11); add(callAt(s), '2299', -10) }
  })
  if (COIN) { const c = COIN.start; add(c, '1492', -10, { align: 'peak' }); add(c + 0.5, '2909', -5); add(c + 0.5, '2299', -7); add(c + 1.0, '3120', -11); add(c + 2.4, '3124', -11)
    COIN.levels.forEach((_, j) => add(c + 2.8 + j * 0.4, '2577', -14)); (COIN.points || []).forEach((_, j) => add(c + 4.0 + j * 1.2, '2573', -11)) }
  const p = SEG.find(s => s.kind === 'product' && !COIN)
  if (p) { add(p.start, '1492', -10, { align: 'peak' }); add(p.start + 0.5, '2909', -4); add(p.start + 0.7, '3120', -10); (p.points || []).forEach((_, j) => add(p.start + 2.0 + j * 1.3, '2573', -11)) }
  for (const s of INS) { const T = insTimes(s), a = s.start; add(a, '1492', -10, { align: 'peak' }); add(a + 0.35, '2909', -6); add(a + 0.35, '2299', -8)
    if (T.items) T.items.forEach(x => { add(a + x, '2573', -11); add(a + x, '2299', -14) })
    else if (T.rows) T.rows.forEach(x => { add(a + x, '2577', -12); add(a + x + 0.66, '3124', -15) })
    else { T.cols.forEach(x => add(a + x, '3120', -12)); T.li.flat().forEach(x => add(a + x, '2573', -13)) }
    add(a + T.foot, '2299', -7); add(a + T.foot, '3124', -10) }
  const e = SEG.find(s => s.kind === 'end')
  if (e) { add(e.start + 0.15, '2908', -4); add(e.start + 0.15, '2299', -5) }
  return ev
}

window.ready = (async () => {
  await Promise.all([...document.fonts].map(f => f.load())); await document.fonts.ready
  await Promise.all([...document.images].filter(i => i.src).map(i => i.decode().catch(() => {})))
  return true
})()
</script>
