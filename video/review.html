     window.fxEvents() lists the sound effects. Every screen is a "beat" written per match in cfg.review.beats. -->

:root{--brand:#1F5FDB;--brand2:#3D7BFF;--brand3:#9DB8FF;--win:#22C55E;--win2:#4ADE80;--loss:#EF4444;--loss2:#F87171;--amb:#F5A524;
  --muted:rgba(255,255,255,.66);--glass:rgba(8,14,32,.66);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#03060F}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,'Noto Color Emoji',sans-serif;color:#fff;background:#050A18}
.A{font-family:Anton,Manrope,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.5px}
.lbl{font:700 22px JBM;letter-spacing:5px;text-transform:uppercase;color:var(--brand3)}
.emo{font-family:'Noto Color Emoji',sans-serif;font-style:normal}

/* backgrounds: a moving clip (image sequence) or a still photo, graded dark */
#bgs{position:absolute;inset:-2px;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0;will-change:transform,opacity;filter:brightness(.78) saturate(1.15) contrast(1.06)}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.bg.photo{background-size:cover;background-position:50% 50%}
.bg.none{background:radial-gradient(120% 70% at 50% 0%,#12307A 0%,#08142E 50%,#050A15 100%)}
#tint{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,8,24,.8) 0%,rgba(4,8,24,.2) 16%,rgba(6,14,40,.1) 38%,rgba(5,10,28,.45) 60%,rgba(3,6,16,.9) 79%,#03060F 100%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 50% 42%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:60;mix-blend-mode:overlay}
#credit{position:absolute;left:60px;right:60px;top:1838px;font:500 15px JBM;color:rgba(255,255,255,.42);letter-spacing:.5px;z-index:45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#foot{position:absolute;left:60px;right:60px;top:1866px;font:700 16px JBM;letter-spacing:3px;color:rgba(255,255,255,.55);z-index:45;text-transform:uppercase}

#hdr{position:absolute;left:60px;right:60px;top:150px;height:64px;display:flex;align-items:center;justify-content:space-between;z-index:50}
.logo{display:flex;align-items:flex-end;gap:12px;font:800 42px/1 Manrope;letter-spacing:-1.5px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.bars{display:flex;align-items:flex-end;gap:6px;transform:skewX(-11deg);padding-bottom:4px}
.bars i{display:block;width:10px;border-radius:3px;background:linear-gradient(180deg,#6E9BFF,#1F5FDB)}
#hlabel{font:700 21px JBM;letter-spacing:5px;color:#fff;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.6)}

#scenes{position:absolute;inset:0;z-index:20;transform-origin:50% 45%}
.scene{position:absolute;inset:0;display:none}
.chip{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:rgba(5,10,24,.72);
  box-shadow:inset 0 0 0 1.5px var(--line);font:700 22px JBM;letter-spacing:4px;text-transform:uppercase;color:#fff;backdrop-filter:blur(6px)}
.card{position:absolute;border-radius:34px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
.badge{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.badge img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
.badge.flag{background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.95),0 20px 50px rgba(0,0,0,.5)}
.badge.flag img{object-fit:cover}
.badge.shield svg{width:100%;height:100%}
.t1{position:absolute;left:60px;top:290px;font-size:140px;line-height:1;white-space:nowrap;text-shadow:0 14px 40px rgba(0,0,0,.6)}
.t2{position:absolute;left:66px;top:446px;font:800 34px Manrope;color:var(--muted)}
.pt{display:flex;gap:18px;align-items:flex-start;font:800 40px/1.2 Manrope}
.pt i{flex-shrink:0;width:14px;height:14px;margin-top:17px;border-radius:50%;background:var(--brand2);box-shadow:0 0 14px rgba(61,123,255,.8)}

/* full time: the score slam */
.rv_hook .meta{position:absolute;left:0;right:0;top:300px;text-align:center}
.rv_hook .mu{position:absolute;left:0;right:0;top:380px;height:330px}
.rv_hook .side{position:absolute;top:0;width:420px;display:flex;flex-direction:column;align-items:center}
.rv_hook .side.h{left:50px}.rv_hook .side.a{right:50px}
.rv_hook .side .badge{width:190px;height:190px}
.rv_hook .side .nm{margin-top:20px;font-size:56px;line-height:1.02;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.rv_hook .score{position:absolute;left:0;right:0;top:700px;text-align:center;font-size:330px;line-height:1;text-shadow:0 24px 80px rgba(0,0,0,.7)}
.rv_hook .score span{color:rgba(255,255,255,.75);margin:0 .08em}
.rv_hook .hl{position:absolute;left:40px;right:40px;top:1080px;text-align:center;line-height:.98;text-shadow:0 18px 50px rgba(0,0,0,.7)}
.rv_hook .hl span{color:var(--brand2)}

/* a moment: minute, what happened, who */
.rv_moment .min{position:absolute;left:60px;top:290px;display:flex;align-items:center;gap:26px}
.rv_moment .min b{font-size:230px;line-height:.9;text-shadow:0 18px 50px rgba(0,0,0,.6)}
.rv_moment .min .emo{font-size:130px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.rv_moment .tm{position:absolute;right:60px;top:320px;width:130px;height:130px}
.rv_moment .tm .badge{width:100%;height:100%}
.rv_moment .ph{position:absolute;left:60px;top:600px;width:330px;height:330px;border-radius:50%;background-size:cover;background-position:50% 22%;
  box-shadow:0 0 0 7px #fff,0 0 0 13px var(--brand2),0 30px 70px rgba(0,0,0,.6)}
.rv_moment .ttl{position:absolute;left:60px;right:60px;top:980px;line-height:.95;text-shadow:0 16px 50px rgba(0,0,0,.75)}
.rv_moment .txt{left:60px;right:60px;top:1200px;padding:30px 40px;font:800 42px/1.25 Manrope}

/* memes: white caption block over a clip, or POV text over a full-screen clip */
.rv_meme .mm{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column}
.rv_meme .top{background:#fff;color:#000;padding:44px 60px 40px;font:800 62px/1.16 Manrope;letter-spacing:-1px;white-space:pre-line}
.rv_meme .panel{position:relative;height:640px;overflow:hidden;background:#000}
.rv_meme .panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rv_meme .bottom{position:absolute;left:30px;right:30px;bottom:26px;text-align:center;font-size:92px;line-height:1;color:#fff;
  -webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 6px 0 #000}
.rv_meme .pov{white-space:pre-line;position:absolute;left:60px;right:60px;top:330px;font:800 74px/1.14 Manrope;letter-spacing:-1.5px;color:#fff;
  -webkit-text-stroke:3px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.rv_meme.dark #tint{opacity:.4}

/* the numbers */
.rv_stats .box{left:60px;right:60px;top:530px;padding:26px 40px}
.rv_stats .heads{display:flex;justify-content:space-between;align-items:center;padding:6px 0 16px}
.rv_stats .heads .badge{width:96px;height:96px}
.rv_stats .row{padding:20px 0;border-top:1.5px solid rgba(255,255,255,.1)}
.rv_stats .row .k{text-align:center;font:700 22px JBM;letter-spacing:4px;text-transform:uppercase;color:var(--muted)}
.rv_stats .row .vals{display:flex;align-items:center;gap:20px;margin-top:10px}
.rv_stats .row .v{width:150px;font-size:70px;line-height:1}
.rv_stats .row .v.r{text-align:right}
.rv_stats .row .cmp{flex:1;display:flex;gap:8px;height:22px}
.rv_stats .row .cmp span{flex:1;position:relative;border-radius:11px;background:rgba(255,255,255,.08);overflow:hidden}
.rv_stats .row .cmp b{position:absolute;top:0;bottom:0;border-radius:11px}
.rv_stats .row .cmp span:first-child b{right:0}.rv_stats .row .cmp span:last-child b{left:0}
.rv_stats .hurt{position:absolute;left:60px;right:60px;top:1330px;text-align:center}
.rv_stats .hurt .chip{font-size:26px;background:linear-gradient(90deg,rgba(239,68,68,.85),rgba(248,113,113,.6))}

/* our read before the game vs what happened */
.rv_read .box{left:60px;right:60px;top:530px;padding:36px 44px}
.rv_read .ours{font-size:70px;line-height:1.02;margin-top:14px}
.rv_read .tri{display:flex;height:40px;margin-top:26px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.06)}
.rv_read .tri i{display:block;height:100%}
.rv_read .lab{display:flex;justify-content:space-between;margin-top:10px;font:700 22px JBM;letter-spacing:2px;color:var(--muted)}
.rv_read .sep{height:1.5px;background:rgba(255,255,255,.12);margin:34px 0 28px}
.rv_read .ft{display:flex;align-items:center;justify-content:space-between}
.rv_read .ft .badge{width:110px;height:110px}
.rv_read .ft b{font-size:150px;line-height:1}
.rv_read .stamp{position:absolute;left:0;right:0;top:1180px;text-align:center}
.rv_read .stamp div{display:inline-block;padding:18px 40px;border-radius:24px;font-size:96px;line-height:1;transform:rotate(-6deg);
  border:8px solid currentColor;background:rgba(3,6,15,.6)}
.rv_read .stamp .called{color:var(--win2)}.rv_read .stamp .missed{color:var(--loss2)}.rv_read .stamp .half{color:var(--amb)}

/* what it means */
.rv_table .box{left:60px;right:60px;top:530px;padding:30px 40px}
.rv_table .tbl{width:100%;border-collapse:collapse}
.rv_table .tbl td{padding:16px 6px;border-bottom:1.5px solid rgba(255,255,255,.1);font:800 36px Manrope;color:rgba(255,255,255,.55)}
.rv_table .tbl tr.me td{color:#fff}
.rv_table .tbl td.n{width:70px;font:400 42px Anton;color:var(--brand3)}
.rv_table .tbl td.r{text-align:right;width:120px;font:400 42px Anton}
.rv_table .tbl th{padding:0 6px 10px;text-align:right;font:700 18px JBM;letter-spacing:3px;color:var(--muted)}
.rv_table .box .pt{margin-top:24px;font-size:34px}

/* quick ratings: one player a beat */
.rv_ratings .list{position:absolute;left:60px;right:60px;top:520px;display:flex;flex-direction:column;gap:18px}
.rv_ratings .r{display:flex;align-items:center;gap:22px;padding:18px 26px;border-radius:26px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line)}
.rv_ratings .r .badge{width:72px;height:72px;flex-shrink:0}
.rv_ratings .r .who{flex:1;min-width:0}
.rv_ratings .r .who b{display:block;font-size:50px;line-height:1}
.rv_ratings .r .who span{display:block;margin-top:6px;font:800 26px Manrope;color:var(--muted)}
.rv_ratings .r .sc{font-size:84px;line-height:1;min-width:120px;text-align:right}
.rv_ratings .r .emo{font-size:64px}

.rv_quote .q{position:absolute;left:60px;right:60px;top:430px;padding:60px 56px 50px}
.rv_quote .q .mk{position:absolute;left:40px;top:-70px;font:400 260px/1 Anton;color:var(--brand2);opacity:.9}
.rv_quote .q p{font:800 58px/1.22 Manrope;letter-spacing:-1px}
.rv_quote .q .by{display:flex;align-items:center;gap:22px;margin-top:40px}
.rv_quote .q .by .badge{width:84px;height:84px}
.rv_quote .q .by .ph{width:110px;height:110px;border-radius:50%;background-size:cover;background-position:50% 20%;box-shadow:0 0 0 4px #fff}
.rv_quote .q .by b{display:block;font-size:48px;line-height:1}
.rv_quote .q .by span{display:block;margin-top:6px;font:700 22px JBM;letter-spacing:3px;text-transform:uppercase;color:var(--brand3)}
.rv_cta .wrap{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column;align-items:center;text-align:center}
.rv_cta .logo{font-size:170px;letter-spacing:-7px;gap:30px}
.rv_cta .logo .bars{gap:16px;padding-bottom:22px}
.rv_cta .logo .bars i{width:34px;border-radius:9px}
.rv_cta .big{margin-top:70px;font-size:112px;line-height:1.02}
.rv_cta .next{margin-top:44px}

/* reaction to our analysis: fixture card, our take, the result and the running tally */
#pres{position:absolute;left:0;bottom:0;width:1080px;height:1166px;z-index:19;display:none;pointer-events:none;filter:drop-shadow(0 -10px 40px rgba(0,0,0,.35))}
#pres.box{left:60px;top:870px;bottom:auto;width:960px;height:540px;border-radius:30px;border:5px solid rgba(255,255,255,.92);object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.6);filter:none}
#ptag{position:absolute;left:92px;top:898px;z-index:20;display:none;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(3,6,15,.78);font:700 20px JBM;letter-spacing:3px;color:#fff;text-transform:uppercase}
#pres.still{left:60px;width:960px;height:1036px}
#ptag i{width:14px;height:14px;border-radius:50%;background:#EF4444;box-shadow:0 0 12px #EF4444}
.fx{position:absolute;left:60px;right:60px;top:120px;height:126px;border-radius:26px;background:rgba(14,18,30,.92);box-shadow:0 18px 50px rgba(0,0,0,.45);

/* the newspaper post-match (np_*, first used 5 Oct 2026): tomorrow's paper, tonight. A sheet of newsprint over the
   stadium at night: a masthead, serif headlines, halftone photo clippings with torn edges, tape, rubber stamps, handwritten
   notes in our blue. Black ink and one spot colour (blue); red only for a miss */
.bg.desk{filter:brightness(.32) saturate(.7) blur(7px)}
.np{--ink:#141414;--paper:#F1ECE1;--spot:#1F5FDB}
.np .sheet{position:absolute;left:46px;top:118px;width:988px;height:1332px;color:var(--ink);overflow:hidden;transform-origin:50% 50%;
  background:radial-gradient(ellipse 80% 50% at 25% 8%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),radial-gradient(ellipse 70% 60% at 90% 100%,rgba(110,90,50,.16),rgba(0,0,0,0) 60%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.014) 0 2px,rgba(0,0,0,0) 2px 5px),var(--paper);
  box-shadow:0 50px 110px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.1);padding:0 46px}
.np .fk{font-family:Fraktur,serif;font-weight:400;letter-spacing:0;text-transform:none}
.np .mast{text-align:center;padding-top:26px}
.np .mast .nm{font-size:108px;line-height:1}
.np .mast .rule{height:9px;margin-top:14px;border-top:4px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.np .mast .dl{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1.5px solid var(--ink);font:700 18px JBM;letter-spacing:3px;text-transform:uppercase}
.np .run{display:flex;justify-content:space-between;align-items:flex-end;padding:30px 0 12px;border-bottom:4px solid var(--ink);font:700 18px JBM;letter-spacing:3px;text-transform:uppercase}
.np .run .fk{font-size:46px;line-height:.9}
.np .kick{font:700 22px JBM;letter-spacing:5px;text-transform:uppercase;color:var(--spot)}
.np .hl{font:900 116px/.98 Playfair;letter-spacing:-2px}
.np .deck{font:italic 700 38px/1.28 PlayfairI;color:#2B2B2B}
.np .badge{width:74px;height:74px}.np .badge.flag{box-shadow:0 0 0 3px var(--ink)}
.np .badge img{filter:none}
.np .clip{position:absolute;background:#FBF8F1;padding:14px;transform:rotate(var(--r,0deg));filter:drop-shadow(0 14px 22px rgba(0,0,0,.28))}
.np .clip .ph{position:absolute;inset:14px;background-size:cover;background-position:50% 22%;filter:grayscale(1) contrast(1.35) brightness(1.06)}
.np .clip .ht{position:absolute;inset:14px;background-image:radial-gradient(rgba(10,10,10,.5) 1.1px,rgba(0,0,0,0) 1.8px);background-size:6px 6px;mix-blend-mode:multiply}
.np .clip .tn{position:absolute;inset:14px;background:var(--spot);mix-blend-mode:screen;opacity:.3}
.np .clip .cr{position:absolute;left:0;right:0;bottom:-46px;font:italic 700 24px PlayfairI;color:#333}
.np .clip.crest{display:flex;align-items:center;justify-content:center}.np .clip.crest .badge{width:60%;height:auto;aspect-ratio:1}
.np .tape{position:absolute;width:160px;height:46px;background:rgba(232,224,196,.82);box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:3}
.np .stamp{position:absolute;z-index:5;padding:8px 30px 4px;border:9px solid currentColor;border-radius:16px;font:400 112px/1.02 Anton;letter-spacing:2px;text-transform:uppercase;color:var(--spot);
  mix-blend-mode:multiply;opacity:.93;white-space:nowrap;-webkit-mask-image:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.75) 70%,#000 85%)}
.np .stamp.missed{color:#C8102E}.np .stamp.half{color:#2A2A2A}
.np .hand{position:absolute;font:700 66px/1 Hand;color:var(--spot);z-index:6}
.np svg.arw{position:absolute;overflow:visible;z-index:6}
.np svg.arw path{fill:none;stroke:var(--spot);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
/* the printing press (np_cold): type set in the dark, one line at a time */

.np_called .ftl .sc{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:10px;font:900 120px/1 Playfair}
.np_called .ftl .badge{width:96px;height:96px}
.np_called .ftl .scr{margin-top:12px;font:italic 700 32px/1.3 PlayfairI;color:#2B2B2B}
/* the quote */
.np_quote .mk{position:absolute;left:30px;top:150px;font:900 420px/1 Playfair;color:var(--spot)}
.np_quote .q{position:absolute;left:46px;right:46px;top:430px;font:italic 700 66px/1.24 PlayfairI}
.np_quote .by{position:absolute;left:46px;right:46px;top:1040px;display:flex;align-items:center;gap:26px;padding-top:24px;border-top:2px solid var(--ink)}
.np_quote .by b{display:block;font:400 54px/1 Anton;text-transform:uppercase}
.np_quote .by span{display:block;margin-top:8px;font:700 20px JBM;letter-spacing:3px;text-transform:uppercase;color:var(--spot)}
.np_quote .by .clip{position:relative}
/* briefs */
.np_briefs .hl{font-size:100px;margin-top:22px}
.np_briefs .br{position:relative;padding:30px 0 34px;border-top:2.5px solid var(--ink)}
.np_briefs .br:first-of-type{margin-top:22px}
.np_briefs .br .sl{display:flex;align-items:center;gap:16px;font:900 58px/1 Playfair;letter-spacing:-1px}
.np_briefs .br .sl .badge{width:62px;height:62px}
.np_briefs .br .wh{margin-top:10px;font:700 18px JBM;letter-spacing:3px;text-transform:uppercase;color:var(--spot)}
.np_briefs .br .tx{margin-top:10px;max-width:660px;font:600 32px/1.36 Manrope;color:#1D1D1D}
.np_briefs .br .stamp{right:6px;top:70px;font-size:56px;border-width:6px;border-radius:10px;padding:4px 16px 2px}
/* standings */
.np_table .hl{font-size:96px;margin-top:22px}
.np_table .sub{margin:14px 0 18px;font:italic 700 34px/1.3 PlayfairI;color:#2B2B2B}
.np_table table{width:100%;border-collapse:collapse;font:700 40px Manrope}
.np_table th{padding:0 8px 10px;text-align:right;font:700 18px JBM;letter-spacing:3px;text-transform:uppercase;border-bottom:3px solid var(--ink)}
.np_table td{padding:16px 8px;border-bottom:1.5px dotted rgba(20,20,20,.55)}
.np_table td.n{width:56px;font:900 44px Playfair;color:var(--spot)}
.np_table td.t{display:flex;align-items:center;gap:16px}.np_table td.t .badge{width:52px;height:52px}
.np_table td.r{text-align:right;width:110px;font:900 46px Playfair}
.np_table tr.me td{background:rgba(31,95,219,.09)}
.np_table .pts{margin-top:24px}
.np_table .pts div{display:flex;gap:14px;margin-top:12px;font:600 30px/1.35 Manrope}
.np_table .pts div i{flex-shrink:0;width:12px;height:12px;margin-top:14px;background:var(--spot)}
/* back page */
.np_back .nx{position:absolute;left:46px;right:46px;top:420px;text-align:center}
.np_back .nx .big{margin-top:22px;font:900 104px/1 Playfair;letter-spacing:-2px}
.np_back .nx .chip2{display:inline-block;margin-top:44px;padding:16px 28px;border:3px solid var(--ink);font:700 24px JBM;letter-spacing:4px;text-transform:uppercase}
.np_back .nx .fol{margin-top:60px;font:400 64px/1 Anton;text-transform:uppercase;color:var(--spot)}
.np_back .nx .tag{margin-top:16px;font:italic 700 36px PlayfairI;color:#2B2B2B}

/* stickers and emoji bursts */
#fxl{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.stk{position:absolute;font-size:240px;line-height:1;filter:drop-shadow(0 20px 40px rgba(0,0,0,.55))}
.pcl{position:absolute;font-size:90px;line-height:1}

#cap{position:absolute;left:70px;right:150px;top:1474px;height:200px;z-index:55;display:flex;align-items:flex-start;justify-content:center;text-align:center}
#cap .c{font:800 50px/1.22 Manrope;letter-spacing:-1px;text-shadow:0 4px 24px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
#cap .w{display:inline-block;margin:0 .13em}
#cap .w.now{color:#fff;background:var(--brand2);border-radius:12px;padding:0 .14em;margin:0 -.01em;box-shadow:0 8px 30px rgba(61,123,255,.6)}
#cap .w.next{opacity:.6}
#grain{position:absolute;inset:0;opacity:.05;pointer-events:none;background-size:256px 256px;z-index:70}
</style>
</head>
<body>
<div id="stage">
  <div id="bgs"></div><div id="tint"></div><div id="vig"></div>
  <div id="hdr">
    <div class="logo"><span class="bars"><i style="height:20px"></i><i style="height:30px"></i><i style="height:40px"></i></span>cmvng</div>
    <div id="hlabel"></div>
  </div>
  <img id="pres"><div id="ptag"><i></i>cmvng studio · live</div>
  <div id="scenes"></div>
  <div id="fxl"></div>
  <div id="cap"></div>
  <div id="credit"></div>
  <div id="foot">cmvng · football, by the numbers</div>
  <div id="flash"></div><div id="grain"></div>
</div>
<script>
const D = window.DATA
const $ = (s, el = document) => el.querySelector(s)
const $$ = (s, el = document) => [...el.querySelectorAll(s)]
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), outCubic: x => 1 - Math.pow(1 - x, 3),
  outBack: x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2), inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const P = (t, a, b, e = E.outExpo) => e(clamp((t - a) / (b - a)))
const html = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const M = D.picks[0], BEAT = D.beat || 0.62
const S = (sc, j) => sc.lines[j] || sc.lines.at(-1) || [0.4, 2]          // scene-relative [start, dur] of spoken line j

let uid = 0
function badge(b) {
  if (!b) return ''
  if (b.svg) { const u = `b${uid++}`; return `<div class="badge shield">${b.svg.replace(/id="(\w+)"/g, `id="$1${u}"`).replace(/url\(#(\w+)\)/g, `url(#$1${u})`)}</div>` }
  return `<div class="badge ${b.kind}"><img src="${b.src}"></div>`
}
const teamBadge = side => side === 'away' ? M.ba : M.bh
const PRES = !!D.cfg.presenter
const emph = s => html(s).replace(/\*\*(.+?)\*\*/g, '<em>$1</em>')   // **word** → green
// two balanced lines, the second in brand blue, sized to fit the width (Anton ≈ 0.46 em per capital)
function twoLines(h, max = 150, width = 1000) {
  const w = String(h || '').trim().split(/\s+/)
  let best = [w.join(' '), ''], diff = 1e9
  for (let i = 1; i < w.length; i++) { const a = w.slice(0, i).join(' '), b = w.slice(i).join(' '); if (Math.abs(a.length - b.length) < diff) { diff = Math.abs(a.length - b.length); best = [a, b] } }
  const size = Math.max(70, Math.min(max, Math.floor(width / (0.46 * Math.max(best[0].length, best[1].length || 1)))))
  return { size, html: `${html(best[0])}${best[1] ? `<br><span>${html(best[1])}</span>` : ''}` }
}
const oneLine = (s, max, width = 960) => Math.max(60, Math.min(max, Math.floor(width / (0.46 * Math.max(1, String(s).length)))))
// win-chance bar colours, away side light when both teams wear the same colour
function rgb(c) { const m = /^#([0-9a-f]{6})$/i.exec(c || ''); return m ? [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16)) : null }
function clash(a, b) { const x = rgb(a), y = rgb(b); return !!(x && y) && Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) < 110 }
function barCols() { const h = M.bh.colour || '#3D7BFF', a = M.ba.colour || '#6E9BFF'; return [h, '#64748B', clash(h, a) ? '#E2E8F0' : a] }

// ---------------------------------------------------------------- backgrounds: one per scene
// ---- the newspaper (np_*): a torn-paper edge, a halftone photo clipping, the masthead and running heads
const NPT = 'The Final Whistle'
function torn(seed, amp = 1.1) {
  let z = (seed * 7919) % 233280; const r = () => (z = (z * 9301 + 49297) % 233280) / 233280, p = []
  for (let x = 0; x <= 100; x += 3.1) p.push([x, r() * amp]); for (let y = 0; y <= 100; y += 3.1) p.push([100 - r() * amp, y])
  for (let x = 100; x >= 0; x -= 3.1) p.push([x, 100 - r() * amp]); for (let y = 100; y >= 0; y -= 3.1) p.push([r() * amp, y])
  return `polygon(${p.map(([x, y]) => `${x.toFixed(2)}% ${y.toFixed(2)}%`).join(',')})`
}
function npClip(photo, o) {         // o: {x, y, w, h, r, seed, crest, cap}
  const box = `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;--r:${o.r || 0}deg;clip-path:${torn(o.seed || 3)}`
  if (!photo) return `<div class="clip crest" style="${box}">${o.crest ? badge(o.crest) : ''}</div>`
  return `<div class="clip" style="${box}"><div class="ph" style="background-image:url('${photo.src}')"></div><div class="ht"></div><div class="tn"></div></div>`
}
const npTape = (x, y, r) => `<div class="tape" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"></div>`
const npRun = label => `<div class="run"><span class="fk">${NPT}</span><span>${html(label)}</span></div>`
const npMast = () => `<div class="mast"><div class="nm fk">${NPT}</div><div class="rule"></div><div class="dl"><span>cmvng</span><span>${html(D.cfg.review?.edition || '')}</span><span>Late edition</span></div></div>`
const npStamp = (v, txt, style = '') => `<div class="stamp ${v === 'missed' ? 'missed' : v === 'half' ? 'half' : ''}" style="${style}">${html(txt || (v === 'called' ? 'Called it' : v === 'missed' ? 'Wrong' : 'Half right'))}</div>`
const scoreOf = q => [+q.score_home, +q.score_away]

function mkBg(sc, k) {
  if (/^np_/.test(sc.type)) {        // the desk: tonight's stadium, dark and soft, under the sheet of newsprint
    const d = document.createElement('div'), src = sc.type === 'np_cold' ? null : (D.picks[sc.data?.match ?? 0] || M).stadium?.src
    d.className = 'bg photo desk' + (src ? '' : ' none'); if (src) d.style.backgroundImage = `url('${src}')`; if (!src) d.style.background = '#050608'
    $('#bgs').appendChild(d); return d
  }
  if (sc.type === 'rx_cold' && sc.data?.photos?.length) {   // cold open: a photo per line, black and white
    sc.bgs = sc.data.photos.map(ph => { const d = document.createElement('div'); d.className = 'bg photo cold'; d.style.backgroundImage = `url('${ph.src}')`; d.style.backgroundPosition = '50% 25%'; $('#bgs').appendChild(d); return d })
    sc.perLine = true; return sc.bgs[0]
  }
  if (sc.data?.photos?.length) {          // a montage: real photos of the team(s), cut on the beat
    sc.bgs = sc.data.photos.map(ph => { const d = document.createElement('div'); d.className = 'bg photo'; d.style.backgroundImage = `url('${ph.src}')`; d.style.backgroundPosition = '50% 30%'; $('#bgs').appendChild(d); return d })
    return sc.bgs[0]
  }
  const d = document.createElement('div')
  if (sc.clip && sc.clip.fit === 'cover') { d.className = 'bg clip'; d.innerHTML = '<img>'; sc.img = $('img', d) }
  else { const src = sc.data.photo_bg || D.picks[sc.i]?.stadium?.src || M.stadium?.src; d.className = 'bg photo' + (src ? '' : ' none'); if (src) d.style.backgroundImage = `url('${src}')` }
  $('#bgs').appendChild(d); return d
}
D.scenes.forEach((sc, k) => { sc.bg = mkBg(sc, k) })

// ---------------------------------------------------------------- build each screen
const built = D.scenes.map((sc, k) => {
  const el = document.createElement('div'), b = sc.data || {}
  el.className = `scene ${sc.type}`
  if (sc.type === 'rv_hook') {
    const hl = twoLines(b.headline || D.cfg.review?.headline || '', 150)
    el.innerHTML = `<div class="meta"><span class="chip">Full time · ${html(M.competition || '')}</span></div>
      <div class="mu"><div class="side h">${badge(M.bh)}<div class="nm A">${html(M.home)}</div></div><div class="side a">${badge(M.ba)}<div class="nm A">${html(M.away)}</div></div></div>
      <div class="score A">${M.score_home}<span>–</span>${M.score_away}</div>
      <div class="hl A" style="font-size:${hl.size}px">${hl.html}</div>`
  } else if (sc.type === 'rv_moment') {
    const tt = String(b.title || '')
    el.innerHTML = `<div class="min"><b class="A">${html(b.min)}'</b>${b.icon ? `<span class="emo">${b.icon}</span>` : ''}</div>
      <div class="tm">${badge(teamBadge(b.team))}</div>
      ${b.photo ? `<div class="ph" style="background-image:url('${b.photo.src}')"></div>` : ''}
      <div class="ttl A" style="font-size:${oneLine(tt, 150)}px;top:${b.photo ? 980 : 760}px">${html(tt)}</div>
      ${b.text ? `<div class="card txt" style="top:${b.photo ? 1170 : 950}px">${html(b.text)}</div>` : ''}`
  } else if (sc.type === 'rv_meme') {
    if (b.style === 'pov') el.innerHTML = `<div class="pov">${html(b.top)}</div>`
    else {
      el.innerHTML = `<div class="mm"><div class="top">${html(b.top)}</div><div class="panel">${sc.clip ? '<img>' : ''}${b.bottom ? `<div class="bottom A">${html(b.bottom)}</div>` : ''}</div></div>`
      if (sc.clip) sc.img = $('.panel img', el)
    }
  } else if (sc.type === 'rv_stats') {
    const rows = b.rows || []
    el.innerHTML = `<div class="t1 A">${html(b.title || 'The numbers')}</div><div class="t2">${html(b.sub || 'Full-time stats')}</div>
      <div class="card box"><div class="heads">${badge(M.bh)}${badge(M.ba)}</div>${rows.map(([k, h, a]) => {
        const hv = parseFloat(h), av = parseFloat(a), mx = Math.max(hv, av, 1e-9)
        return `<div class="row"><div class="k">${html(k)}</div><div class="vals"><div class="v A">${html(h)}</div>
          <div class="cmp"><span><b data-w="${hv / mx}" style="background:${hv >= av ? 'var(--brand2)' : 'rgba(255,255,255,.45)'}"></b></span><span><b data-w="${av / mx}" style="background:${av > hv ? 'var(--brand2)' : 'rgba(255,255,255,.45)'}"></b></span></div>
          <div class="v r A">${html(a)}</div></div></div>` }).join('')}</div>
      ${b.hurt ? `<div class="hurt"><span class="chip">${html(b.hurt)}</span></div>` : ''}`
  } else if (sc.type === 'rv_read') {
    const m = b.model || [M.home_win, M.draw, M.away_win], cols = barCols(), v = b.verdict || 'half'
    el.innerHTML = `<div class="t1 A">${html(b.title || 'Our read')}</div><div class="t2">Before the game vs what happened</div>
      <div class="card box"><div class="lbl">Before kick-off</div><div class="ours A">${html(b.ours || '')}</div>
        ${m.every(x => x !== undefined) ? `<div class="tri">${m.map((x, j) => `<i style="width:${x}%;background:${cols[j]}"></i>`).join('')}</div>
        <div class="lab"><span>${html(M.home)} ${Math.round(m[0])}%</span><span>Draw ${Math.round(m[1])}%</span><span>${html(M.away)} ${Math.round(m[2])}%</span></div>` : ''}
        <div class="sep"></div><div class="lbl">Full time</div>
        <div class="ft">${badge(M.bh)}<b class="A">${M.score_home} – ${M.score_away}</b>${badge(M.ba)}</div></div>
      <div class="stamp"><div class="A ${v}">${html(b.stamp || (v === 'called' ? 'Called it' : v === 'missed' ? 'Missed it' : 'Half right'))} <span class="emo">${v === 'called' ? '✅' : v === 'missed' ? '❌' : '🤏'}</span></div></div>`
  } else if (sc.type === 'rv_table') {
    const t = b.table || []
    el.innerHTML = `<div class="t1 A">${html(b.title || 'What it means')}</div><div class="t2">${html(b.sub || '')}</div>
      <div class="card box">${t.length ? `<table class="tbl"><tr><th></th><th style="text-align:left">Team</th><th>P</th><th>Pts</th></tr>${t.map((r, j) => `<tr class="${[M.home, M.away].includes(r[0]) ? 'me' : ''}"><td class="n">${j + 1}</td><td>${html(r[0])}</td><td class="r">${r[1]}</td><td class="r">${r[2]}</td></tr>`).join('')}</table>` : ''}
        ${(b.points || []).map(x => `<div class="pt"><i></i><div>${html(x)}</div></div>`).join('')}</div>`
  } else if (sc.type === 'rv_ratings') {
    el.innerHTML = `<div class="t1 A">${html(b.title || 'Our ratings')}</div><div class="t2">${html(b.sub || 'Hero to zero')}</div>
      <div class="list">${(b.rows || []).map(r => `<div class="r">${badge(teamBadge(r.team))}<div class="who"><b class="A">${html(r.name)}</b><span>${html(r.note || '')}</span></div><span class="emo">${r.emoji || ''}</span><div class="sc A">${html(r.score)}</div></div>`).join('')}</div>`
  } else if (sc.type === 'rv_quote') {
    el.innerHTML = `<div class="card q"><div class="mk">“</div><p>${html(b.quote)}</p>
      <div class="by">${b.photo ? `<div class="ph" style="background-image:url('${b.photo.src}')"></div>` : badge(teamBadge(b.team))}<div><b class="A">${html(b.who)}</b><span>${html(b.role || 'After the game')}</span></div></div></div>`
  } else if (sc.type === 'rx_cold') {
    el.innerHTML = `<div class="dark"></div><div class="bigc A"></div><div class="labc"></div>`
  } else if (sc.type === 'rx_intro') {
    el.innerHTML = `<div class="crw">${D.picks.map(q => badge(q.bh) + badge(q.ba)).join('')}</div><div class="big A">${html(b.title || 'Our takes')}<br><span>${html(b.title2 || 'vs the results')}</span></div>`
  } else if (sc.type === 'rx_take' || sc.type === 'rx_reveal') {
    const q = D.picks[sc.i]
    const fx = `<div class="fx"><div class="t">${badge(q.bh)}<b>${html(q.home)}</b></div><div class="mid">${sc.type === 'rx_take' ? html(q.kickoff || '') : 'FT'}<span>${html(q.stage || q.competition || '')}</span></div><div class="t a">${badge(q.ba)}<b>${html(q.away)}</b></div></div>`
    if (sc.type === 'rx_take') el.innerHTML = fx + `<div class="tk"><div class="hd"><span class="lg"><i style="height:16px"></i><i style="height:24px"></i><i style="height:32px"></i></span><b>cmvng</b><span>${html(b.tag || 'Match analysis · before kick-off')}</span></div>
      <div class="crs">${(b.crests || ['home', 'away']).map(x => badge(x === 'away' ? q.ba : q.bh)).join('')}</div><div class="tx"><small>${html(b.label || 'Our take')}</small>${emph(b.take || '')}</div></div>`
    else el.innerHTML = `<div class="rs"><div class="row">${badge(q.bh)}<div class="sc A">${q.score_home}<span>–</span>${q.score_away}</div>${badge(q.ba)}</div>
      <div class="nm"><span>${html(q.home)}</span><span>${html(q.away)}</span></div><div class="ft">Full time${b.scorers ? ' · ' + html(b.scorers) : ''}</div></div>
      <div class="tal"><b class="${b.ok === false ? 'no' : ''}">${b.n != null ? `${b.n}/${b.of}` : html(b.stamp || '')}</b><span class="emo">${b.ok === false ? '❌' : b.ok === 'half' ? '🤏' : '✅'}</span></div>`
    if (!PRES) el.classList.add('nop')
  } else if (sc.type === 'pm_hook') {
    el.innerHTML = `<div class="crw">${D.picks.map(q => badge(q.bh) + badge(q.ba)).join('')}</div><div class="on"><span class="chip">${html(b.chip || '')}</span></div>
      <div class="big A">${html(b.title || 'Prediction')}<br><span>${html(b.title2 || 'market plays')}</span></div>`
  } else if (sc.type === 'pm_tip') {
    const q = D.picks[sc.i], t = b.tip
    el.innerHTML = `<div class="fx"><div class="t">${badge(q.bh)}<b>${html(q.home)}</b></div><div class="mid">${html(q.kickoff || '')}<span>${html(q.stage || q.competition || '')}</span></div><div class="t a">${badge(q.ba)}<b>${html(q.away)}</b></div></div>
      <div class="mk simple tip"><div class="hd"><span class="lg"><i style="height:14px"></i><i style="height:21px"></i><i style="height:28px"></i></span>cmvng · ${html(b.venue || "today's singles")}</div>
        <div class="app"><span>The app's pick</span>${html(t.pick)}</div>
        <div class="yn"><div class="y on"><span>Odds</span>${(+t.odds).toFixed(2)}</div><div class="n"><span>$100 returns</span>$${Math.round(100 * t.odds)}</div></div>
        ${t.backup ? `<div class="bk"><span>Backup</span>${html(t.backup)}</div>` : ''}
        <div class="ft2"><div class="edge conf">${Math.round(t.conf)}% confidence</div><div class="pay">if it wins<br>${html(q.kickoff || '')} Lagos</div></div></div>`
    if (!PRES) el.classList.add('nop')
  } else if (sc.type === 'pm_pick' && b.market?.app) {
    const q = D.picks[sc.i], mk = b.market, L = mk.labels || ['YES', 'NO'], tb = mk.team === 'away' ? q.ba : mk.team === 'home' ? q.bh : null
    el.innerHTML = `<div class="fx"><div class="t">${badge(q.bh)}<b>${html(q.home)}</b></div><div class="mid">${html(q.kickoff || '')}<span>${html(q.stage || q.competition || '')}</span></div><div class="t a">${badge(q.ba)}<b>${html(q.away)}</b></div></div>
      <div class="mk simple"><div class="hd"><span class="lg"><i style="height:14px"></i><i style="height:21px"></i><i style="height:28px"></i></span>cmvng · prediction market · ${html(b.venue || 'Polymarket')}</div>
        <div class="app"><span>The app's pick</span>${html(mk.app)}</div>

function rise(nodes, lt, start, step = 0.07, dist = 50, dur = 0.6) {
  nodes.forEach((n, j) => { if (!n) return; const q = P(lt, start + j * step, start + j * step + dur); n.style.opacity = q; n.style.transform = `translate3d(0,${(1 - q) * dist}px,0)` })
}
function slam(n, lt, at, from = 1.7, dur = 0.32, extra = '') {
  if (!n) return; const q = P(lt, at, at + dur, E.outCubic)
  n.style.opacity = P(lt, at, at + 0.08); n.style.transform = `${extra} scale(${from - (from - 1) * q})`; n.style.filter = `blur(${(1 - q) * 10}px)`

const shake = (lt, at, amp = 14) => { const d = lt - at; if (d < 0 || d > 0.3) return ''; const a = amp * (1 - d / 0.3); return `translate3d(${a * Math.sin(d * 95)}px,${a * Math.cos(d * 77)}px,0)` }
function glitch(n, lt, at, dur = 0.38) {     // a digital break on a number: jitter and a colour split

  const r = Math.sin(lt * 997) * Math.cos(lt * 331), a = 18 * (1 - d / dur)
  n.style.textShadow = `${-7 * (1 - d / dur)}px 0 #ff2a55, ${7 * (1 - d / dur)}px 0 #00e5ff`
  return ` translate3d(${r * a}px,${Math.sin(lt * 613) * a * 0.3}px,0) skewX(${r * 8}deg)`
}

  D.scenes.forEach((sc, k) => {

    if (sc.type === 'rv_table') add(T + 0.4, 'impact', 0.4)

    if (sc.type === 'rv_ratings') { const n = (b.rows || []).length, step = Math.max(0.45, (sc.dur - 1.2) / Math.max(1, n)); for (let j = 0; j < n; j++) add(T + 0.4 + j * step, 'pop') }
    if (sc.type === 'rv_cta') add(T + 0.6, 'impact', 0.7)

    if (sc.type === 'pm_pick' || sc.type === 'pm_tip') { add(T + 0.22, 'pop'); add(T + edgeAt(sc), 'boom', 0.7); add(T + edgeAt(sc) + 0.1, 'cash', 0.8) }
    if (sc.type === 'pm_pass') { add(T + 0.22, 'pop'); add(T + edgeAt(sc) + 0.2, 'boom', 0.8); add(T + edgeAt(sc) + 0.3, 'scratch', 0.8) }
    if (sc.type === 'pm_slate') (sc.data.rows || []).forEach((r, j) => add(T + 0.3 + j * 0.35, 'tick' + (j ? j + 1 : '')))
    if (sc.type === 'pm_outro') add(T + 0.15, 'impact', 0.6)

  const sc = D.scenes[k], lt = t - sc.start, b = sc.data || {}
  built.forEach((el, j) => { el.style.display = j === k ? 'block' : 'none' })
  D.scenes.forEach((s2, j) => { if (j !== k) { s2.bg.style.opacity = 0; (s2.bgs || []).forEach(x => { x.style.opacity = 0 }); if (s2.stk) s2.stk.style.opacity = 0; s2.parts.forEach(n => { n.style.opacity = 0 }) } })

  // the clip: show the frame for this moment (frames were cut for exactly this scene, at the video's frame rate)
  let wait = null
  if (sc.clip && sc.img) {
    const f = Math.min(sc.clip.n, Math.max(1, Math.floor(lt * 30) + 1)), src = `${sc.clip.dir}/${String(f).padStart(4, '0')}.jpg`
    if (sc.img.getAttribute('src') !== src) { sc.img.setAttribute('src', src); wait = sc.img.decode().catch(() => {}) }
  }
  const memeLike = sc.type === 'rv_meme' && b.style !== 'pov'
  let bgNow = sc.bg, cutAt = 0
  if (sc.bgs) {                            // montage: a new photo every two beats, each with its own push-in
    const per = BEAT * 2, nl = sc.lines.filter(l => lt >= l[0] - 0.08).length
    const j = sc.perLine ? Math.max(0, Math.min(sc.bgs.length - 1, nl - 1)) : Math.floor(lt / per) % sc.bgs.length
    sc.bgs.forEach((x, i) => { x.style.opacity = i === j ? 1 : 0 }); bgNow = sc.bgs[j]; cutAt = sc.perLine ? (nl ? sc.lines[j][0] - 0.08 : 0) : Math.floor(lt / per) * per
    if (sc.type === 'rx_reveal') bgNow.style.filter = 'brightness(.5) saturate(1.1) blur(6px)'
  } else sc.bg.style.opacity = memeLike ? 0 : 1
  const punch = 1 - P(lt - cutAt, 0, 0.4, E.outCubic)
  bgNow.style.transform = `scale(${1.06 + 0.06 * clamp((lt - cutAt) / (BEAT * 2)) + 0.1 * punch}) translate3d(${((Math.floor(lt / (BEAT * 2)) % 2) ? -1 : 1) * 18 * clamp((lt - cutAt) / (BEAT * 2))}px,0,0)`
  // presenter (keyed green-screen frames, one per video frame)
  const pr = $('#pres')
  if (sc.pres?.still) {
    pr.style.display = 'block'
    if (pr.getAttribute('src') !== sc.pres.still) { pr.setAttribute('src', sc.pres.still); const w2 = pr.decode().catch(() => {}); wait = wait ? Promise.all([wait, w2]) : w2 }
    // a photo presenter: slow breathing and sway, a small lift on each spoken word, a punch on every result
    const cw = (D.captions.find(c => t >= c.start && t < c.end)?.words || []).find(w => t >= w.t0 && t < w.t1)
    const talk = cw ? Math.sin(Math.PI * clamp((t - cw.t0) / Math.max(0.08, cw.t1 - cw.t0))) : 0
    const hit = sc.type === 'rx_reveal' ? 1 - P(lt, 0, 0.45, E.outCubic) : 0
    pr.style.transformOrigin = '50% 100%'
    pr.style.transform = `translateY(${(-7 * talk).toFixed(2)}px) scale(${(1 + 0.007 * Math.sin(t * 1.7) + 0.006 * talk + 0.05 * hit).toFixed(4)}) rotate(${(0.5 * Math.sin(t * 0.8)).toFixed(3)}deg)`
  } else if (sc.pres) { pr.style.transform = ''; const f = Math.min(sc.pres.n, Math.max(1, Math.floor(lt * 30) + 1)), src = `${sc.pres.dir}/${String(f).padStart(4, '0')}.webp`; pr.style.display = 'block'; if (pr.getAttribute('src') !== src) { pr.setAttribute('src', src); const w2 = pr.decode().catch(() => {}); wait = wait ? Promise.all([wait, w2]) : w2 } }
  else pr.style.display = 'none'
  const BOX = !!D.cfg.presenter?.box
  pr.classList.toggle('box', BOX); pr.classList.toggle('still', !!sc.pres?.still); $('#ptag').style.display = sc.pres && BOX ? 'flex' : 'none'
  const NPg = /^np_/.test(sc.type)
  $('#tint').style.opacity = memeLike || NPg ? 0 : b.style === 'pov' ? 0.55 : 1
  $('#vig').style.opacity = memeLike ? 0 : 1
  $('#credit').textContent = sc.bgs ? (b.photos[sc.bgs.indexOf(bgNow)]?.credit || '') : memeLike || sc.clip ? (b.credit || '') : (b.photo?.credit || (sc.bg.classList.contains('photo') ? (D.picks[sc.i] || M).stadium?.credit || '' : ''))

  draw(k, lt, sc)
  $('#scenes').style.transform = memeLike ? '' : `scale(${1 + 0.018 * clamp(lt / sc.dur)})`
  const bp = Math.exp(-((t % BEAT) / BEAT) * 5)
  $$('#hdr .bars i').forEach((x, j) => { x.style.transform = `scaleY(${1 + 0.22 * bp * (j + 1) / 3})`; x.style.transformOrigin = '50% 100%' })
  $('#hlabel').textContent = b.label ?? LABEL[sc.type] ?? ''
  $('#hdr').style.opacity = sc.type === 'rv_cta' ? 1 - P(lt, 0, 0.3) : 1
  $('#foot').style.opacity = sc.type === 'rv_cta' || memeLike ? 0 : 1

  // cut flash, in time with the whoosh (memes cut hard: no flash)
  let fl = 0
  for (let j = 1; j < D.scenes.length; j++) { const d = t - D.scenes[j].start; if (d >= 0 && d < 0.3 && D.scenes[j].type !== 'rv_meme') fl = Math.max(fl, 0.5 * (1 - d / 0.3)) }
  const hk = D.scenes.find(s => s.type === 'rv_hook'); if (hk && t - hk.start > 0.38 && t - hk.start < 0.7) fl = Math.max(fl, 0.7 * (1 - (t - hk.start - 0.38) / 0.32))
  $('#flash').style.opacity = fl

  // captions (word by word)
  const ci = D.captions.findIndex(c => t >= c.start && t < c.end)
  if (ci !== capShown) {
    capShown = ci
    capEl.innerHTML = ci < 0 ? '' : `<div class="c">${D.captions[ci].words.map(w => `<span class="w">${html(w.w)}</span>`).join(' ')}</div>`
  }
  if (ci >= 0) {
    const c = D.captions[ci], q = P(t, c.start, c.start + 0.16, E.outBack)
    const box = $('.c', capEl); box.style.opacity = clamp(q * 2); box.style.transform = `scale(${0.85 + 0.15 * q})`
    $$('.w', capEl).forEach((s, j) => { const w = c.words[j]; s.className = 'w' + (t >= w.t0 && t < w.t1 ? ' now' : t < w.t0 ? ' next' : '') })
  }
  capEl.className = D.cfg.caption_style === 'bold' ? 'bold' : ''
  capEl.style.top = memeLike ? '1500px' : sc.pres ? (D.cfg.presenter?.box ? '1450px' : '1330px') : '1474px'
  $('#hdr').style.display = /^(rx|pm|np)_/.test(sc.type) ? 'none' : ''
  if (NPg) capEl.style.top = '1478px'
  if (wait) await wait
}

window.ready = (async () => {
  await Promise.all([...document.fonts].map(f => f.load().catch(() => {})))
  await document.fonts.ready
  await Promise.all($$('img').filter(i => i.getAttribute('src')).map(i => i.decode().catch(() => {})))
})()
</script>
</body>
</html>
